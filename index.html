alität","q":"Card & Krueger (1994) — Design, Ergebnis, Bedeutung?","a":"New Jersey erhöhte 1992 den Mindestlohn, Pennsylvania nicht; verglichen wurde die Beschäftigung in Fast-Food-Restaurants beiderseits der Grenze (DiD). Ergebnis: Die Beschäftigung <b>stieg</b> in NJ relativ zu PA (+2,76 FTE) — <b>kein negativer Beschäftigungseffekt</b>. Vereinbar mit einem <b>Monopson</b>-Modell, nicht mit dem einfachen Wettbewerbsmodell.","s":"Wipo VL 02 — Instrumente & Kausalität","sec":"Lernfrage 7","e":"w_cardkrueger","f":"llms-full.txt"},{"i":333,"d":"w03","t":"Wohlfahrtstheorie","q":"Pareto-Effizienz vs. Pareto-Superiorität?","a":"<b>Superiorität</b> ist eine <b>Relation zwischen zwei Zuständen</b>: U_i(x) ≥ U_i(x′) für alle i und > für mindestens ein j. <b>Effizienz</b> ist eine <b>Eigenschaft eines Zustands</b>: Es gibt keinen anderen Zustand, der ihm pareto-superior ist — gemessen an <i>allen</i> erreichbaren Alternativen.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 1","e":"w_pareto","f":"llms-full.txt"},{"i":334,"d":"w03","t":"Wohlfahrtstheorie","q":"Beispiel: x = (5,5,5) und x′ = (3,4,6). Ist x pareto-superior zu x′? Ist x effizient?","a":"<b>Nicht superior</b>: Person C ist in x′ besser gestellt (6 > 5). <b>Aber effizient</b>: Niemand kann bessergestellt werden, ohne einen anderen schlechterzustellen. x′ dagegen ist <b>nicht</b> effizient, denn (5,4,6) wäre pareto-superior dazu.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfragen 8 und 2 (VL02)","e":"w_pareto","f":"llms-full.txt"},{"i":335,"d":"w03","t":"Wohlfahrtstheorie","q":"Kaldor-Hicks-Kriterium — Formulierung, Vorteil, Schwäche?","a":"Ein Übergang ist gerechtfertigt, wenn mindestens eine Person gewinnt, die Gewinner die Verlierer <b>theoretisch</b> kompensieren könnten und ein Nettogewinn verbleibt (potentielle Pareto-Verbesserung). <b>Vorteil</b>: vergleichbar auch dort, wo Pareto schweigt. <b>Schwäche</b>: Die Kompensation muss nicht stattfinden; zudem kann das Kriterium zyklisch werden (<b>Scitovsky-Paradox</b>).","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 2","e":"w_kaldorhicks","f":"llms-full.txt"},{"i":336,"d":"w03","t":"SWF","q":"Die beiden SWF-Axiome und ihre Konsequenz?","a":"<b>Axiom 1 (Pareto-Konsistenz)</b>: Ist x pareto-superior zu x′, dann V*(x) > V*(x′). <b>Axiom 2 (Anonymität)</b>: Nur die individuellen Nutzenniveaus zählen. <b>Konsequenz</b>: Es existiert ein streng monotones W mit V*(x) = W(U₁, …, U_n) — und jeder Maximierer von W ist <b>pareto-effizient</b>.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 3","e":"w_swfaxiome","f":"llms-full.txt"},{"i":337,"d":"w03","t":"SWF","q":"Die vier SWF-Typen der Vorlesung?","a":"<b>Utilitarismus</b>: W = Σ U_i — Verteilung egal, reine Effizienzperspektive. <b>Bergson/Samuelson</b>: W = Σ α_i U_i mit α_i > 0 — Verteilung steckt in den Gewichten. <b>Nash/Bernoulli</b>: W = Π U_i — implizit ungleichheitsavers. <b>Rawls</b>: W = min U_i — Maximin, maximale Ungleichheitsaversion.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 4","e":"w_swftypen","f":"llms-full.txt"},{"i":338,"d":"w03","t":"SWF","q":"Bentham vs. Rawls — welche normativen Annahmen und Verteilungsimplikationen?","a":"<b>Bentham</b>: Nutzen interpersonell vergleichbar und aufaddierbar; jede Nutzeneinheit zählt gleich, unabhängig vom Empfänger. Ungleichheit ist akzeptabel, wenn die Summe steigt. <b>Rawls</b>: Gerechtigkeit misst sich am Los der Schwächsten — nur das <b>Minimum</b> zählt.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfragen 9 und 10 (VL02)","e":"w_benthamrawls","f":"llms-full.txt"},{"i":339,"d":"w03","t":"SWF","q":"Was muss passiert sein, wenn W^B steigt, aber W^R sinkt?","a":"Die <b>Nutzensumme</b> ist gestiegen, das <b>Minimum</b> gefallen: Es liegt eine <b>Umverteilung nach oben</b> vor, deren absolute Gewinne die absoluten Verluste übersteigen. Beispiel: eine Steuersenkung, die Besserverdienende stark begünstigt und die ärmste Gruppe schlechter stellt.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 10","e":"w_benthamrawls","f":"llms-full.txt"},{"i":340,"d":"w03","t":"SWF","q":"Arrows Unmöglichkeitstheorem — die Anforderungen und die Aussage?","a":"Gefordert sind <b>(U)</b> universeller Definitionsbereich, <b>(P)</b> Pareto-Konsistenz, <b>(IIA)</b> Unabhängigkeit von irrelevanten Alternativen, <b>Transitivität</b> der sozialen Ordnung und <b>Nicht-Diktatur</b>. Aussage: Bei mindestens drei Alternativen erfüllt <b>keine</b> Aggregationsregel alle Anforderungen gleichzeitig.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 5","e":"w_arrow","f":"llms-full.txt"},{"i":341,"d":"w03","t":"Hauptsätze","q":"1. Hauptsatz der Wohlfahrtstheorie — Aussage, Voraussetzungen, Implikation?","a":"<b>Jedes Marktgleichgewicht ist pareto-effizient.</b> Voraussetzungen: vollständiger Wettbewerb, keine externen Effekte, vollständige Information, vollständige Märkte. Implikation: Wo diese erfüllt sind, kann sich der Staat <b>zurückhalten</b> — Eingriffe brauchen eine Verletzung als Begründung.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 6","e":"w_hauptsatz1","f":"llms-full.txt"},{"i":342,"d":"w03","t":"Hauptsätze","q":"2. Hauptsatz — Aussage und warum die Trennung in der Praxis scheitert?","a":"<b>Jedes Pareto-Optimum lässt sich als Marktgleichgewicht darstellen</b> — gegebenenfalls nach Umverteilung der Anfangsausstattung. Effizienz und Verteilung wären damit trennbar. Praktisch scheitert das an <b>pauschalen Transfers</b> (lump-sum): Sie setzen Beobachtbarkeit der Fähigkeiten voraus; reale Steuern sind <b>verzerrend</b>.","s":"Wipo VL 03 — Allokationstheorie","sec":"Lernfrage 7","e":"w_hauptsatz2","f":"llms-full.txt"},{"i":343,"d":"w04","t":"Marktversagen","q":"Die vier Typen von Marktversagen — je mit Beispiel?","a":"<b>Marktmacht</b> (Monopol/Oligopol, Preis > Grenzkosten, Harberger-Dreieck). <b>Externe Effekte</b> (Umweltverschmutzung negativ, Forschungs-Spillover positiv). <b>Öffentliche Güter</b> (Nicht-Rivalität und Nicht-Ausschließbarkeit). <b>Informationsasymmetrien</b> (Moral Hazard, Adverse Selection). Jeder Typ verletzt eine Voraussetzung des 1. Hauptsatzes.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfragen 1 und 2","e":"w_marktversagentypen","f":"llms-full.txt"},{"i":344,"d":"w04","t":"Marktversagen","q":"Beseitigen vs. Kompensieren — Unterschied am Versicherungsmarkt?","a":"<b>Beseitigen</b> setzt an der <b>Ursache</b> an: Pflicht zu Gesundheits-Checks oder Offenlegung von Risikomerkmalen verkleinert die Informationsasymmetrie selbst. <b>Kompensieren</b> akzeptiert die Verzerrung und mildert ihre <b>Folgen</b> — etwa durch Versicherungspflicht oder Subventionierung.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 3","e":"w_beseitigenkompensieren","f":"llms-full.txt"},{"i":345,"d":"w04","t":"Marktversagen","q":"Theorie des Second Best — Aussage und Intuition?","a":"Kann <b>eine</b> First-Best-Bedingung nicht erfüllt werden, ist es <b>nicht</b> notwendigerweise optimal, alle anderen so gut wie möglich zu erfüllen. Das zweitbeste Ergebnis erfordert meist, <b>mehrere</b> Bedingungen gleichzeitig zu lockern — weil Verzerrungen miteinander interagieren und sich teilweise ausgleichen können.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 4","e":"w_secondbest","f":"llms-full.txt"},{"i":346,"d":"w04","t":"Information","q":"Moral Hazard — Definition und Beispiel?","a":"<b>Verborgene Handlung</b> in einer Prinzipal-Agenten-Beziehung: Die Handlung des Agenten ist nicht beobachtbar oder nicht gerichtlich verifizierbar. Verträge können nur auf <b>beobachtbare Ergebnisse</b> konditionieren. Beispiel Arbeitsvertrag: Der Besitzer sieht den Erfolg, nicht die Anstrengung.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 5","e":"w_moralhazard","f":"llms-full.txt"},{"i":347,"d":"w04","t":"Information","q":"Adverse Selection — Definition und Marktzusammenbruch?","a":"<b>Verborgene Eigenschaften</b> vor Vertragsabschluss. Beispiel: p_L = 0,1 (faire Prämie 1.000 €), p_H = 0,5 (5.000 €), 60 % Niedrigrisiken. Bei einer <b>Einheitsprämie</b> steigen die guten Risiken aus, das Kollektiv verschlechtert sich, die Prämie steigt weiter — bis der Markt zusammenbricht.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 6","e":"w_adverseselection","f":"llms-full.txt"},{"i":348,"d":"w04","t":"Information","q":"Separierendes Gleichgewicht — Mechanismus und Effizienzkosten?","a":"Statt einer Pooling-Prämie bietet der Versicherer ein <b>Vertragsmenü</b>: Vertrag A mit Vollversicherung zur fairen Hochrisiko-Prämie, Vertrag B mit <b>Selbstbehalt</b> zur niedrigen Prämie. Der Selbstbehalt muss groß genug sein, damit Hochrisiken A wählen (<b>Anreizkompatibilität</b>). Effizienzkosten: Die Niedrigrisiken sind <b>unterversichert</b>.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 7","e":"w_screening","f":"llms-full.txt"},{"i":349,"d":"w04","t":"Mechanism Design","q":"Was ist ein Mechanismus im Sinne des Mechanism Design?","a":"Ein <b>Regelwerk</b> (S₁, …, S_I, g), das jedem Agenten eine Strategiemenge vorgibt und über die Ergebnisfunktion g aus den Strategien das Ergebnis erzeugt. Grundproblem: Relevante Information ist <b>dezentral und privat</b> (Hayek 1945) — der Planer kennt die Typen θ_i nicht.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 8","e":"w_mechanismdesign","f":"llms-full.txt"},{"i":350,"d":"w04","t":"Mechanism Design","q":"Drei praktische Anwendungen von Mechanism Design?","a":"<b>Frequenzauktionen</b> (5G-Auktion 2019, ca. 6,5 Mrd. €; Design Milgrom & Wilson, Nobelpreis 2020), <b>Schulplatz- und Studienplatzvergabe</b> (Matching-Verfahren) und <b>Organspende-Tauschketten</b> (Roth, Nobelpreis 2012). Gemeinsam ist die private Information über Zahlungsbereitschaft bzw. Präferenzen.","s":"Wipo VL 04 — Marktversagen & Information","sec":"Lernfrage 9","e":"w_mechanismdesign","f":"llms-full.txt"},{"i":351,"d":"w05","t":"Politische Ökonomie","q":"Medianwählermodell — Aussage und Annahmen?","a":"Bei <b>eindimensionalem</b> Politikraum, <b>eingipfligen</b> Präferenzen und <b>zwei</b> Parteien konvergieren beide zur Position des <b>Medianwählers</b> — sie ist zugleich der Condorcet-Sieger. Wer davon abweicht, verliert.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 1","e":"w_medianwaehler","f":"llms-full.txt"},{"i":352,"d":"w05","t":"Politische Ökonomie","q":"Drei Bedingungen, unter denen das Medianwählermodell versagt?","a":"1) <b>Mehrdimensionaler Politikraum</b> — schon bei zwei Dimensionen gibt es i. d. R. keinen Condorcet-Sieger. 2) <b>Mehr als zwei Parteien</b> — Differenzierung wird profitabel, ein reines Nash-Gleichgewicht existiert meist nicht. 3) Verletzung der <b>Eingipfligkeit</b> oder unvollständige Wahlbeteiligung.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 2","e":"w_mwmgrenzen","f":"llms-full.txt"},{"i":353,"d":"w05","t":"Politische Ökonomie","q":"Condorcet-Paradox — Beispiel und Implikation?","a":"Drei Wählerinnen mit den Ordnungen A≻B≻C, B≻C≻A, C≻A≻B. Paarweise: A schlägt B, B schlägt C, C schlägt A — die Mehrheitsregel wird <b>intransitiv</b>. Implikation: Individuelle Transitivität überträgt sich <b>nicht</b> auf die kollektive Ordnung; das Ergebnis hängt von der Agenda ab.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 3","e":"w_condorcet","f":"llms-full.txt"},{"i":354,"d":"w05","t":"Politische Ökonomie","q":"Was besagt die Plott-Bedingung?","a":"Im mehrdimensionalen Raum existiert ein Mehrheitsgleichgewicht nur unter der sehr restriktiven Bedingung <b>radialer Symmetrie</b> der Wählerpräferenzen um einen Punkt — die Idealpunkte müssen sich paarweise genau gegenüberliegen. Praktisch ist das eine Ausnahme, kein Regelfall.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 4","e":"w_plott","f":"llms-full.txt"},{"i":355,"d":"w05","t":"Rent-Seeking","q":"Rent-Seeking — Definition und Abgrenzung zu Profit-Seeking?","a":"<b>Rent-Seeking</b> (Tullock 1967, Krueger 1974) ist der Einsatz von Ressourcen, um eine <b>politisch erzeugte Rente</b> zu erlangen — Lizenz, Zoll, Subvention —, <b>ohne</b> dass neue Werte entstehen. <b>Profit-Seeking</b> dagegen schafft Wert für andere und erwirtschaftet die Rente durch Marktleistung.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 6","e":"w_rentseeking","f":"llms-full.txt"},{"i":356,"d":"w05","t":"Rent-Seeking","q":"Rent Dissipation und die Tullock-Intuition?","a":"Im Rent-Seeking-Contest investiert jeder x_i, um seine Erfolgswahrscheinlichkeit p_i = x_i/Σx_j zu erhöhen. Solange der erwartete Grenznutzen die Grenzkosten übersteigt, wird weiter investiert — im Gleichgewicht wird ein <b>erheblicher Teil der Rente im Wettbewerb verbrannt</b>. Der gesellschaftliche Verlust kann an die Höhe der Rente heranreichen.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 7","e":"w_rentdissipation","f":"llms-full.txt"},{"i":357,"d":"w05","t":"Lobbying","q":"Was zeigt die empirische Lobbying-Forschung?","a":"<b>de Figueiredo & Silverman (2006)</b>: Eine Verdopplung der Lobby-Ausgaben erhöht die zugeteilten Mittel signifikant — der Return on Lobbying ist messbar positiv. <b>Bombardini & Trebbi (2020)</b>: Lobbying ist teils <b>informational</b>, teils <b>quid pro quo</b>; Firmen mit höheren politischen Renten lobbyieren mehr, persistente Beziehungen sind besonders wertvoll.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 8","e":"w_lobbyingempirie","f":"llms-full.txt"},{"i":358,"d":"w05","t":"Lobbying","q":"Grossman/Helpman „Protection for Sale“ — Grundintuition?","a":"Die Regierung maximiert G = a·W(t) + Σ C_i(t) — eine <b>gewichtete Summe</b> aus aggregierter Wohlfahrt und <b>Lobby-Beiträgen</b>. Organisierte Branchen „kaufen“ Schutzzölle. Ergebnis: <b>Organisierte Branchen erhalten Schutz</b>, nicht organisierte nicht — obwohl der Zoll die Gesamtwohlfahrt senkt.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 9","e":"w_grossmanhelpman","f":"llms-full.txt"},{"i":359,"d":"w05","t":"Politische Ökonomie","q":"Wie hängen Markt- und Politikversagen zusammen?","a":"Marktversagen liefert nur einen <b>potenziellen</b> Anlass für Eingriffe. Dass ein Eingriff prinzipiell wohlfahrtsverbessernd wäre, heißt nicht, dass der politische Prozess ihn implementiert: Medianwähler, Lobbying und Rent-Seeking erzeugen Politik, die der <b>Mitte oder den Organisierten</b> gefällt — nicht notwendig der Effizienz.","s":"Wipo VL 05 — Politische Ökonomie","sec":"Lernfrage 10","e":"w_politikversagen","f":"llms-full.txt"},{"i":360,"d":"w06","t":"Externalitäten","q":"Warum führen negative externe Effekte zu Ineffizienz?","a":"Die sozialen Grenzkosten sind GK^soz = GK^priv + MES. Akteure berücksichtigen nur GK^priv und produzieren bis P = GK^priv. Wegen MES > 0 gilt an der Marktmenge <b>P &lt; GK^soz</b> — es wird <b>zu viel</b> produziert; die letzten Einheiten stiften weniger Nutzen als sie sozial kosten.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfragen 1 und 2","e":"w_externalitaeten","f":"llms-full.txt"},{"i":361,"d":"w06","t":"Externalitäten","q":"Papierfabrik und Fischzucht — Markt- vs. kooperative Lösung?","a":"Marktlösung: Firma 1 maximiert nur den eigenen Gewinn, p₁ = 2γ₁x₁^M — die Schädigung von Firma 2 bleibt unberücksichtigt. Kooperativ: p₁ = 2γ₁x₁^K + <b>x₂^K</b> — der zusätzliche Term ist der <b>externe Schaden</b>. Daraus folgt x₁^K &lt; x₁^M: Die kooperative Lösung produziert <b>weniger</b>.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 3","e":"w_papierfisch","f":"llms-full.txt"},{"i":362,"d":"w06","t":"Pigou","q":"Optimale Pigou-Steuer im Papierfabrik-Beispiel?","a":"Mit Steuer lautet die BEO p₁ − 2γ₁x₁ − t = 0. Setzt der Staat <b>t* = x₂^K</b>, also den externen Schaden in der Effizienzlösung, wählt die Firma <b>freiwillig</b> x₁ = x₁^K. Pointe: Die Steuer internalisiert die Schäden, ohne dass der Staat die Menge vorschreiben muss.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 4","e":"w_pigousteuer","f":"llms-full.txt"},{"i":363,"d":"w06","t":"Coase","q":"Coase-Theorem — Aussage und drei Annahmen?","a":"Bei 1) klar definierten und durchsetzbaren <b>Eigentumsrechten</b>, 2) <b>Transaktionskosten von null</b> und 3) vollständiger Information erreichen private Akteure durch Verhandlung eine <b>pareto-effiziente</b> Allokation — <b>unabhängig davon</b>, wem die Rechte zugewiesen wurden. Die Zuteilung ändert nur die Verteilung.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 5","e":"w_coase2","f":"llms-full.txt"},{"i":364,"d":"w06","t":"Coase","q":"Vier Gründe, warum Coase bei Umweltproblemen scheitert?","a":"1) <b>Hohe Transaktionskosten</b> (Schadensermittlung, Verhandlung, Durchsetzung). 2) <b>Viele Beteiligte</b> — Millionen Geschädigte, tausende Verursacher, plus Free-Riding auf Verhandlungserfolge. 3) <b>Unklare oder nicht durchsetzbare Eigentumsrechte</b> an Luft und Atmosphäre. 4) <b>Asymmetrische Information</b> über Kosten und Schäden.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 6","e":"w_coasegrenzen","f":"llms-full.txt"},{"i":365,"d":"w06","t":"Instrumente","q":"Auflagen, Pigou-Steuer und Zertifikate im Vergleich?","a":"<b>Statische Effizienz</b>: Auflagen −, Steuer ++, Zertifikate ++. <b>Dynamische Effizienz</b>: Auflagen −, Steuer ++, Zertifikate +/−. <b>Mengentreffsicherheit</b>: Auflagen ±, Steuer −, Zertifikate ++. Fokus: Verhalten / Preis / Menge. Hauptprobleme: Ineffizienz / Schadensinformation / Preisvolatilität.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 7","e":"w_instrumentenvergleich","f":"llms-full.txt"},{"i":366,"d":"w06","t":"ETS","q":"EU-Emissionshandel (ETS) — Grundzüge?","a":"Seit <b>2005</b>, größtes Cap-and-Trade-System weltweit. <b>ETS 1</b>: ca. 10.000 Anlagen aus Energiewirtschaft, energieintensiver Industrie und innereuropäischem Luftverkehr, rund <b>40 % der EU-Emissionen</b>. <b>ETS 2</b> ab 2027 für Gebäude und Verkehr. Der <b>Cap</b> sinkt jährlich um den linearen Reduktionsfaktor.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 8","e":"w_ets","f":"llms-full.txt"},{"i":367,"d":"w06","t":"Instrumente","q":"Weitzman (1974) — wann Preis, wann Menge?","a":"Bei perfekter Information sind beide gleichwertig. Unter <b>Unsicherheit</b> entscheidet die <b>relative Steigung</b>: <b>GVK steil, Grenzschaden flach ⇒ Steuer</b> überlegen (eine Mengenabweichung zöge hohe Vermeidungskosten nach sich). <b>Grenzschaden steil ⇒ Menge/Zertifikate</b> überlegen (Mengenfehler wären sehr teuer).","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 9","e":"w_weitzman","f":"llms-full.txt"},{"i":368,"d":"w06","t":"ETS","q":"CBAM — was ist es und welches Problem soll es lösen?","a":"Der <b>CO₂-Grenzausgleichsmechanismus</b> (EU-Verordnung 2023, Übergangsphase seit Oktober 2023, voll ab 2026) verpflichtet Importeure von Zement, Stahl, Aluminium, Düngemitteln, Strom und Wasserstoff, Zertifikate zum EU-ETS-Preis zu kaufen, abzüglich bereits gezahlter CO₂-Preise. Ziel ist die Vermeidung von <b>Carbon Leakage</b>.","s":"Wipo VL 06 — Umweltpolitik","sec":"Lernfrage 10","e":"w_cbam","f":"llms-full.txt"},{"i":369,"d":"w07","t":"Öffentliche Güter","q":"Die 2×2-Klassifikation der Gütertypen?","a":"<b>Rivalität + Ausschluss</b> = private Güter (Apfel). <b>Keine Rivalität + Ausschluss</b> = Clubgüter (Netflix). <b>Rivalität + kein Ausschluss</b> = Allmendegüter (Fischbestand Nordsee). <b>Keine Rivalität + kein Ausschluss</b> = öffentliche Güter (Landesverteidigung).","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfragen 1 und 2","e":"w_gueterklassen","f":"llms-full.txt"},{"i":370,"d":"w07","t":"Öffentliche Güter","q":"Warum führt Nicht-Ausschließbarkeit zur Unterversorgung?","a":"Weil niemand ausgeschlossen werden kann, hat jeder einen Anreiz, den eigenen Beitrag auf null zu setzen und auf die anderen zu warten — <b>Trittbrettfahren</b>. Formal: Individuum i vergleicht nur seinen <b>eigenen</b> Grenznutzen mit den Grenzkosten und ignoriert den Nutzen, den sein Beitrag allen anderen stiftet.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 3","e":"w_trittbrett","f":"llms-full.txt"},{"i":371,"d":"w07","t":"Öffentliche Güter","q":"Samuelson-Bedingung — Formel und Abgrenzung zum privaten Gut?","a":"Σ_i GZB_i = GK(G*): Die <b>Summe</b> der Grenzzahlungsbereitschaften muss den Grenzkosten entsprechen. Bei privaten Gütern gilt dagegen für <b>jeden einzelnen</b> GZB_i = GK. Grund: Beim öffentlichen Gut konsumieren alle <b>dieselbe</b> Menge, deshalb wird <b>vertikal</b> aggregiert statt horizontal.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 4","e":"w_samuelson2","f":"llms-full.txt"},{"i":372,"d":"w07","t":"Öffentliche Güter","q":"Modell mit U_i = x_i + θ_i·√G, GK = 1: Wie groß ist das effiziente G*?","a":"MRS_i = θ_i/(2√G). Samuelson: (θ_A + θ_B)/(2√G*) = 1 ⇒ √G* = (θ_A + θ_B)/2 ⇒ <b>G* = [(θ_A + θ_B)/2]²</b>.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 5","e":"w_effizientesniveau","f":"llms-full.txt"},{"i":373,"d":"w07","t":"Öffentliche Güter","q":"Nash-Gleichgewicht freiwilliger Beiträge — warum unterversorgt?","a":"Individuum A maximiert bei gegebenem g_B und setzt nur seine <b>eigene</b> GZB gleich den Grenzkosten: θ_A/(2√G) = 1. Es ignoriert vollständig den Nutzen, den B aus seinem Beitrag zieht — die <b>externe Wirkung</b>. Folge: G^Nash &lt; G*, das öffentliche Gut wird systematisch unterversorgt.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 6","e":"w_nashbeitraege","f":"llms-full.txt"},{"i":374,"d":"w07","t":"Öffentliche Güter","q":"Lindahl-Preise — Idee und warum sie praktisch scheitern?","a":"<b>Personalisierte Preise</b> p_i proportional zur individuellen Wertschätzung. Ein Lindahl-Gleichgewicht erfüllt zwei Bedingungen: <b>Kostendeckung</b> Σp_i = GK(G^L) und <b>individuelle Optimalität</b> GZB_i(G^L) = p_i. Praktisch scheitert es am <b>Präferenzoffenbarungsproblem</b>: Wer weiß, dass sein Preis von seiner Angabe abhängt, untertreibt.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 7","e":"w_lindahl","f":"llms-full.txt"},{"i":375,"d":"w07","t":"Öffentliche Güter","q":"Private Lösungsansätze für öffentliche Güter — welche und wann?","a":"<b>Freiwillige Beiträge</b> (Altruismus, Reputation) — bei kleinen Gruppen, z. B. Wikipedia und Open Source. <b>Clubgüter</b> — wenn technischer Ausschluss möglich ist (Pay-TV, private Parks). <b>Soziale Normen und Sanktionen</b> — bei überschaubaren, wiederholten Interaktionen.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 8","e":"w_privateloesungen","f":"llms-full.txt"},{"i":376,"d":"w07","t":"Evidenz","q":"Fehr & Gächter (2000) — Befund und Politikimplikation?","a":"Im Öffentliche-Güter-Experiment sinken die Beiträge <b>ohne</b> Bestrafungsmöglichkeit über die Runden gegen null. <b>Mit</b> Bestrafungsmöglichkeit bleiben sie hoch oder steigen — obwohl Bestrafen für den Bestrafenden kostspielig und individuell irrational ist. Implikation: <b>Sanktionsmechanismen und Institutionen</b> sind entscheidend für Kooperation.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 9","e":"w_fehrgaechter","f":"llms-full.txt"},{"i":377,"d":"w07","t":"Öffentliche Güter","q":"Warum verschärft sich das Trittbrettfahrerproblem auf globaler Ebene?","a":"Ein stabiles Klima ist ein <b>globales öffentliches Gut</b>: nicht-rival und nicht ausschließbar über Ländergrenzen hinweg. Es fehlt jedoch eine übergeordnete Instanz mit <b>Sanktionsmacht</b> — Abkommen beruhen auf Freiwilligkeit, und wer aussteigt, profitiert weiter von den Anstrengungen der anderen.","s":"Wipo VL 07 — Öffentliche Güter","sec":"Lernfrage 10","e":"w_globalegueter","f":"llms-full.txt"},{"i":378,"d":"w08","t":"Handelsmodell","q":"Wie entsteht der Weltmarktpreis im Grundmodell?","a":"Aus dem Schnittpunkt von <b>Importnachfragekurve MD</b> des Inlands (Nachfrageüberschuss bei P &lt; P_A) und <b>Exportangebotskurve XS</b> des Auslands (Angebotsüberschuss bei P > P_A*). Bedingungen: MD(P_W) = XS(P_W) — der Weltmarkt räumt.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 11","e":"w_weltmarktpreis","f":"llms-full.txt"},{"i":379,"d":"w08","t":"Zölle","q":"Zollanalyse für das kleine Land — die vier Flächen und der Nettoeffekt?","a":"Inlandspreis steigt auf P_W + t. <b>Produzentenrente +a</b>, <b>Zolleinnahmen +c</b>, <b>Konsumentenrente −(a+b+c+d)</b>. Netto: <b>−(b+d)</b> — Produktions- und Konsumverzerrung. Für ein kleines Land ist der Effekt <b>immer negativ</b>, weil der Weltmarktpreis unverändert bleibt.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 6","e":"w_zollklein","f":"llms-full.txt"},{"i":380,"d":"w08","t":"Zölle","q":"Großes Land und Optimalzoll — warum ist der Nettoeffekt mehrdeutig?","a":"Ein großes Land drückt mit dem Zoll den Preis für ausländische Exporteure: P_T* = P_T − t &lt; P_W. Der daraus entstehende <b>Terms-of-Trade-Gewinn (Fläche e)</b> steht den Dreiecksverlusten gegenüber: ΔW = e − (b+d). Der <b>Optimalzoll</b> maximiert diese Differenz. Einschränkung: Er geht zulasten der Partner und lädt zu <b>Vergeltung</b> ein.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 7","e":"w_zollgross","f":"llms-full.txt"},{"i":381,"d":"w08","t":"Protektionismus","q":"Motive für Protektionismus — wie stichhaltig sind Infant Industry und Merkantilismus?","a":"<b>Infant Industry</b>: setzt voraus, dass Kapitalmärkte versagen (sonst finanzierte privates Kapital die Anlaufphase) <i>und</i> dass der Staat die richtigen Branchen erkennt — beides fraglich. <b>Merkantilismus</b> (Exportüberschuss als Ziel) ist ökonomisch unhaltbar: Importe sind der <b>Zweck</b> des Handels, Exporte der Preis dafür.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 2","e":"w_protektionismusmotive","f":"llms-full.txt"},{"i":382,"d":"w08","t":"WTO","q":"Die drei Kernprinzipien der WTO?","a":"<b>Nichtdiskriminierung</b> — Meistbegünstigung (MFN: gleiche Behandlung aller Mitglieder) und Inländerbehandlung (importierte wie heimische Güter). <b>Freierer Handel</b> durch schrittweise Zollsenkung. <b>Vorhersehbarkeit</b> durch gebundene Zollsätze. Die WTO entstand 1995 aus dem GATT (1948) und erweiterte es um GATS und TRIPS.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 3","e":"w_wto","f":"llms-full.txt"},{"i":383,"d":"w08","t":"WTO","q":"Die vier Integrationsstufen regionaler Handelsabkommen?","a":"<b>Freihandelszone</b> (Zölle intern weg, eigene Außenzölle — USMCA, EFTA), <b>Zollunion</b> (plus gemeinsamer Außenzoll), <b>gemeinsamer Markt</b> (plus freier Verkehr von Gütern, Dienstleistungen, Kapital, Arbeit — EU-Binnenmarkt), <b>Wirtschafts- und Währungsunion</b>. Freihandelszonen brauchen <b>Ursprungsregeln</b>, um Umgehung über das Land mit dem niedrigsten Außenzoll zu verhindern.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 4","e":"w_rta","f":"llms-full.txt"},{"i":384,"d":"w08","t":"WTO","q":"EU-Handelspolitik — Rechtsgrundlage und Kompetenz?","a":"<b>Art. 207 AEUV</b> begründet die Gemeinsame Handelspolitik als <b>ausschließliche EU-Kompetenz</b>: Nur die EU darf Rechtsakte setzen und Abkommen schließen. Die Kommission verhandelt auf Mandat des Rates, der Rat beschließt, das Europäische Parlament muss zustimmen. Deutschland kann keine eigene Zollpolitik betreiben.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 5","e":"w_eukompetenz","f":"llms-full.txt"},{"i":385,"d":"w08","t":"Evidenz","q":"Amiti, Redding & Weinstein (2019) — was tragen die Zölle?","a":"Die US-Importzölle von 2018 wurden <b>fast vollständig auf die US-Importpreise überwälzt</b>. Ausländische Exporteure senkten ihre Preise kaum — es gab also praktisch <b>keinen Terms-of-Trade-Gewinn</b>. Die Last trugen US-Konsumenten und -Firmen.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 8","e":"w_amiti","f":"llms-full.txt"},{"i":386,"d":"w08","t":"Evidenz","q":"Autor, Dorn & Hanson (2013) — der „China-Schock“?","a":"Regionen der USA, die stark im Wettbewerb mit chinesischen Importen standen, verzeichneten dauerhaft <b>niedrigere Beschäftigung und Löhne</b> sowie höhere Transferzahlungen. Kernbotschaft: Handelsliberalisierung ist aggregiert vorteilhaft, aber die <b>Anpassungskosten sind regional und personell stark konzentriert</b>.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 8","e":"w_chinaschock","f":"llms-full.txt"},{"i":387,"d":"w08","t":"Protektionismus","q":"Warum schaden Zölle in globalen Wertschöpfungsketten auch Produzenten?","a":"Rund <b>70 % des Welthandels</b> sind Vorleistungen. Ein Zoll auf Zwischenprodukte verteuert die <b>eigenen</b> Produktionskosten — geschützte Endproduzenten werden über die Inputseite belastet. Protektionismus trifft damit nicht nur Konsumenten, sondern auch die heimische Industrie.","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 9","e":"w_gvc","f":"llms-full.txt"},{"i":388,"d":"w08","t":"Handelspolitik aktuell","q":"Section 232 vs. Section 301 — die Rechtsgrundlagen der Trump-Zölle?","a":"<b>Section 232</b> (Trade Expansion Act 1962): Zölle aus Gründen der <b>nationalen Sicherheit</b> — angewandt auf Stahl und Aluminium. <b>Section 301</b> (Trade Act 1974): Reaktion auf <b>unfaire Handelspraktiken</b> — angewandt gegen China (Technologietransfer, geistiges Eigentum).","s":"Wipo VL 08 — Handelspolitik","sec":"Lernfrage 12","e":"w_trumpzoelle","f":"llms-full.txt"},{"i":389,"d":"w09","t":"Staatsausgaben","q":"Struktur öffentlicher Ausgaben nach COFOG?","a":"<b>Soziale Sicherung</b> ist die größte Position (10–15 % BIP), <b>Gesundheit</b> 6–9 %, <b>Bildung</b> 4–6 %, <b>allgemeine Verwaltung</b> 4–6 %, <b>Verteidigung</b> 1–3 % (NATO-Ziel 2 %). Langfristiger Trend: Verschiebung von investiven zu <b>konsumtiven und sozialen</b> Ausgaben.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 2","e":"w_cofog","f":"llms-full.txt"},{"i":390,"d":"w09","t":"Umverteilung","q":"Drei ökonomische Begründungen für staatliche Umverteilung?","a":"1) <b>Versicherungsargument</b>: Bei unvollständigen Privatversicherungsmärkten (adverse Selektion, Moral Hazard) ist kollektive Absicherung gegen Einkommensausfälle effizient. 2) <b>Rawlsianische Gerechtigkeit</b>: Hinter dem Schleier des Nichtwissens würden risikoscheue Individuen Umverteilung wählen. 3) <b>Umverteilung als öffentliches Gut</b> (Armutsvermeidung stiftet allen Nutzen).","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 3","e":"w_umverteilungsgruende","f":"llms-full.txt"},{"i":391,"d":"w09","t":"Besteuerung","q":"Das Informationsproblem der optimalen Besteuerung (Mirrlees 1971)?","a":"Ideal wäre eine <b>Kopfsteuer nach Fähigkeit</b> — sie verzerrte das Arbeitsangebot nicht. Fähigkeiten sind aber <b>private Information</b>; beobachtbar ist nur das Einkommen y = w·l, das von Fähigkeit <i>und</i> Anstrengung abhängt. Deshalb muss die Steuer <b>anreizkompatibel</b> sein — und ist damit zwangsläufig verzerrend.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 4","e":"w_mirrlees","f":"llms-full.txt"},{"i":392,"d":"w09","t":"Besteuerung","q":"Diamond-Saez-Formel für den optimalen Spitzensteuersatz?","a":"t* = 1/(1 + a·e). Dabei ist <b>a</b> der Pareto-Parameter der Einkommensverteilung (Dünne des oberen Endes) und <b>e</b> die <b>Elastizität des zu versteuernden Einkommens</b>. Je elastischer die Reaktion und je dünner das obere Ende, desto niedriger der optimale Satz.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfragen 4 und 11","e":"w_diamondsaez","f":"llms-full.txt"},{"i":393,"d":"w09","t":"Besteuerung","q":"Diamond-Saez — mechanischer Effekt gegen Verhaltenseffekt?","a":"<b>Mechanisch</b>: Ohne Verhaltensanpassung steigen die Einnahmen um dR = (z_m − z̄)·N·dt. <b>Verhaltensreaktion</b>: Das steuerpflichtige Einkommen schrumpft mit der Elastizität e, was Einnahmen kostet. Der optimale Satz liegt dort, wo sich beide Effekte am Rand aufheben — das ergibt genau t* = 1/(1+ae).","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 11","e":"w_diamondsaez","f":"llms-full.txt"},{"i":394,"d":"w09","t":"Verschuldung","q":"Ricardianische Äquivalenz (Barro 1974) — Aussage und Kernmechanismus?","a":"Für die realwirtschaftlichen Entscheidungen ist es <b>irrelevant</b>, ob Staatsausgaben durch Steuern oder Schulden finanziert werden. Kernmechanismus: Rationale, vorausschauende Haushalte antizipieren, dass heutige Schulden künftige Steuern implizieren, und halten Staatsanleihen daher <b>nicht als Nettovermögen</b>.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 6","e":"w_ricardo2","f":"llms-full.txt"},{"i":395,"d":"w09","t":"Verschuldung","q":"Warum scheitert die Ricardianische Äquivalenz in der Realität?","a":"<b>Endliche Lebenszeit</b> ohne Erbmotiv (die Steuer trifft die nächste Generation), <b>Kreditbeschränkungen</b> (wer nicht borgen kann, reagiert auf laufendes Einkommen), <b>verzerrende statt pauschaler Steuern</b>, <b>Unsicherheit</b> über künftige Steuerlasten und <b>Bevölkerungswachstum</b> (die Last verteilt sich auf mehr Schultern).","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 6","e":"w_ricardo2","f":"llms-full.txt"},{"i":396,"d":"w09","t":"Verschuldung","q":"Schuldenstandsdynamik — Herleitung der Nachhaltigkeitsbedingung?","a":"Aus D_{t+1} = (1+r)D_t − X_t und Y_{t+1} = (1+g)(1+π)Y_t folgt für die Quote b = D/Y in Approximation Δb ≈ (r − g − π)·b_t − x_t. Nachhaltigkeit (Δb ≤ 0) erfordert <b>x_t ≥ (r − g − π)·b_t</b>: Der Primärüberschuss muss die Zins-Wachstums-Differenz mal Schuldenquote decken.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfragen 7 und 12","e":"w_schuldendynamik2","f":"llms-full.txt"},{"i":397,"d":"w09","t":"Verschuldung","q":"Was bedeutet die Zins-Wachstums-Differenz r − g?","a":"Ist <b>r &gt; g</b>, wächst die Schuld schneller als die Wirtschaft — die Quote steigt <b>von selbst</b>, es braucht Primärüberschüsse. Ist <b>r &lt; g</b>, sinkt sie von selbst, und selbst dauerhafte Primärdefizite sind tragfähig. In nominalen Größen entlastet zusätzlich die Inflation π, weil sie den Nenner vergrößert.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 12","e":"w_schuldendynamik2","f":"llms-full.txt"},{"i":398,"d":"w09","t":"Fiskalregeln","q":"Deutsche Schuldenbremse und EU-Stabilitätspakt — die Kernregeln?","a":"<b>Schuldenbremse</b> (Art. 109/115 GG, seit 2009, verbindlich ab 2016 für den Bund): strukturelles Defizit maximal <b>0,35 % des BIP</b>, Länder ausgeglichen, mit symmetrischer Konjunkturkomponente und Notfallklausel. <b>EU-SWP</b>: Defizit unter 3 %, Schuldenstand unter 60 % des BIP.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 8","e":"w_fiskalregeln","f":"llms-full.txt"},{"i":399,"d":"w09","t":"Fiskalregeln","q":"Pro und Contra Fiskalregeln?","a":"<b>Pro</b>: Selbstbindung gegen Defizitbias, Glaubwürdigkeit, Schutz künftiger Generationen, niedrigere Risikoprämien. <b>Contra</b>: Prozyklizität im Abschwung, Investitionsbremse (Investitionen werden zuerst gekürzt), <b>Messproblem</b> beim strukturellen Defizit, mangelnde Flexibilität bei echten Notlagen.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 8","e":"w_fiskalregeln","f":"llms-full.txt"},{"i":400,"d":"w09","t":"Verschuldung","q":"Drei politökonomische Erklärungen für persistente Defizite?","a":"1) <b>Kurzsichtigkeit der Wähler</b> (von Weizsäcker 1992) — Wähler unterschätzen abstrakte Schuldengrößen. 2) <b>Strategische Verschuldung</b> — eine Regierung bindet die Nachfolgeregierung durch Schulden. 3) <b>Common-Pool-Problem</b> — viele Ressorts greifen auf ein gemeinsames Budget zu, jedes internalisiert nur einen Bruchteil der Kosten.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 9","e":"w_defizitpolitik","f":"llms-full.txt"},{"i":401,"d":"w09","t":"Besteuerung","q":"Steuerwettbewerb und Pillar Two?","a":"Multinationale verlagern Gewinne über Verrechnungspreise und Lizenzen; jedes Land hat einen unilateralen Anreiz, Sätze zu senken ⇒ <b>Race to the Bottom</b>. Die OECD/G20-Initiative <b>Pillar Two</b> setzt eine <b>globale effektive Mindeststeuer von 15 %</b>: Besteuert das Sitzland zu niedrig, darf ein anderes Land nachversteuern — der Anreiz zur Verlagerung entfällt.","s":"Wipo VL 09 — Öffentliche Finanzen","sec":"Lernfrage 10","e":"w_pillartwo","f":"llms-full.txt"},{"i":402,"d":"w10","t":"Solow","q":"Steady State im Solow-Modell — k* und komparative Statik zu s?","a":"Aus s·A·k*^α = (δ + n)·k* folgt <b>k* = [sA/(δ+n)]^{1/(1−α)}</b> und y* = A^{1/(1−α)}·[s/(δ+n)]^{α/(1−α)}. Eine höhere Sparquote hebt k* und y*, aber <b>nicht die langfristige Wachstumsrate</b> — sie bleibt ohne technischen Fortschritt null.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 2","e":"w_solowsteady","f":"llms-full.txt"},{"i":403,"d":"w10","t":"Solow","q":"Solow mit technischem Fortschritt — was ändert sich?","a":"Mit Y = K^α(A·L)^{1−α} und Ȧ/A = g rechnet man in <b>Effizienzeinheiten</b> k̃ = K/(AL). Der Verwässerungsterm wird zu <b>(δ + n + g)</b>. Im Steady State ist k̃ konstant, das <b>Pro-Kopf-Einkommen wächst mit g</b> — nur technischer Fortschritt erzeugt langfristiges Wachstum.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 3","e":"w_solowtf","f":"llms-full.txt"},{"i":404,"d":"w10","t":"Solow","q":"Stärken und Schwächen des Solow-Modells?","a":"<b>Stärken</b>: analytische Sparsamkeit, Erklärung bedingter Konvergenz über abnehmende Grenzerträge, Trennung von Niveau- und Wachstumseffekten, gute Kalibrierbarkeit mit α ≈ 1/3. <b>Schwächen</b>: technischer Fortschritt bleibt <b>exogen</b>, Sparquote ist nicht mikrofundiert, Institutionen und Humankapital fehlen.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 4","e":"w_solowbewertung","f":"llms-full.txt"},{"i":405,"d":"w10","t":"Verteilung","q":"Kuznets-Hypothese — Aussage und Mechanismen?","a":"Ungleichheit folgt im Entwicklungsverlauf einem <b>umgekehrten U</b>: erst steigend, dann fallend. Mechanismen: <b>Strukturwandel</b> Agrar → Industrie erzeugt zunächst Einkommensspreizung; später wirken Bildungsexpansion, Sozialstaat und sinkende Bildungsprämie ausgleichend. <b>Empirisch</b> gilt sie heute als nicht robust — seit den 1980ern steigt die Ungleichheit in vielen reichen Ländern wieder.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 5","e":"w_kuznets","f":"llms-full.txt"},{"i":406,"d":"w10","t":"Verteilung","q":"Ungleichheit zwischen vs. innerhalb von Ländern — was hat sich verändert?","a":"Bis etwa 1990 dominierte die <b>Zwischen-Länder-Ungleichheit</b> den globalen Gini. Seither ist sie durch das Aufholen Chinas und Indiens deutlich gesunken, während die <b>Innerhalb-Länder-Ungleichheit</b> in vielen Ländern gestiegen ist. Der globale Gini ist insgesamt gefallen.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 6","e":"w_globaleungleichheit","f":"llms-full.txt"},{"i":407,"d":"w10","t":"Verteilung","q":"Was zeigt die Elefantenkurve?","a":"Das globale Einkommenswachstum 1988–2008 nach Perzentilen: <b>starke Zuwächse in der globalen Mitte</b> (aufholende Schwellenländer), <b>Stagnation</b> beim oberen Mittelfeld (untere Mittelschicht der reichen Länder) und <b>starke Zuwächse an der Spitze</b> (globales Top 1 %). Die Form gab der Kurve ihren Namen.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 6","e":"w_elefantenkurve","f":"llms-full.txt"},{"i":408,"d":"w10","t":"Verteilung","q":"Funktionale vs. personelle Einkommensverteilung?","a":"<b>Funktional</b>: Wie verteilt sich das Nationaleinkommen auf die <b>Produktionsfaktoren</b>? Messgröße ist der Kapitalanteil α. <b>Personell</b>: Wie verteilt es sich auf <b>Individuen</b>? Messgrößen sind Gini, Top-10-%- und Top-1-%-Anteil. Die funktionale Verteilung genügt nicht, weil auch die <b>Verteilung des Kapitalbesitzes</b> zählt.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 7","e":"w_funktionalpersonell","f":"llms-full.txt"},{"i":409,"d":"w10","t":"Piketty","q":"Piketty: β = s/g — Herleitung und Interpretation?","a":"β = W/Y ist die <b>Vermögens-Einkommens-Relation</b>. Im Steady State folgt aus konstantem β die Approximation <b>β = s/g</b> mit s als Sparquote und g als Wachstumsrate. Interpretation: β sagt, „wie viele Jahreseinkommen“ das Vermögen ausmacht. Typisch: Deutschland 5–6, Frankreich und UK 6–7.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 8","e":"w_piketty","f":"llms-full.txt"},{"i":410,"d":"w10","t":"Piketty","q":"Warum ist β seit den 1970ern gestiegen?","a":"Weil <b>g gefallen</b> ist (demografisch bedingt niedrigeres Bevölkerungs- und Produktivitätswachstum), während s relativ stabil blieb. Nach β = s/g steigt β dadurch mechanisch. Hinzu kommen Vermögenspreiseffekte, insbesondere bei Immobilien.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 8","e":"w_piketty","f":"llms-full.txt"},{"i":411,"d":"w10","t":"Piketty","q":"Zweite Piketty-Identität α = r·β — welche Rolle spielt die Substitutionselastizität?","a":"Der Kapitalanteil ist α = r·β. Steigt β, muss α <b>nicht</b> automatisch steigen, weil bei mehr Kapital typischerweise r sinkt. Entscheidend ist die <b>Substitutionselastizität σ</b> zwischen Kapital und Arbeit: Nur bei <b>σ &gt; 1</b> überwiegt der β-Effekt den r-Rückgang und der Kapitalanteil steigt.","s":"Wipo VL 10 — Wachstum & Verteilung","sec":"Lernfrage 9","e":"w_pikettyalpha","f":"llms-full.txt"},{"i":412,"d":"w11","t":"Arbeitslosigkeit","q":"Arten der Arbeitslosigkeit und das Search-and-Matching-Modell?","a":"<b>Friktionell</b> (Such- und Matching-Prozesse), <b>strukturell</b> (Qualifikations-, Regional-, Sektormismatch), <b>konjunkturell</b> (Nachfragemangel). Das Search-and-Matching-Modell (Diamond, Mortensen, Pissarides) erklärt Arbeitslosigkeit über eine <b>Matching-Funktion</b> M(U, V) aus Arbeitslosen und offenen Stellen — Suchen kostet Zeit, deshalb koexistieren Arbeitslose und Vakanzen.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 1","e":"w_searchmatching","f":"llms-full.txt"},{"i":413,"d":"w11","t":"Löhne","q":"Effizienzlohn nach Shapiro-Stiglitz — warum zahlen Firmen freiwillig zu viel?","a":"Weil Arbeitsleistung nicht perfekt beobachtbar ist (<b>Moral Hazard</b>) und Beschäftigte einen Anreiz zum Drücken haben. Die Firma zahlt einen Lohn über dem markträumenden Niveau, damit der Jobverlust <b>teuer</b> wird. <b>Unfreiwillige Arbeitslosigkeit ist dabei notwendig</b>: Nur wenn nicht sofort ein neuer Job verfügbar ist, wirkt die Entlassungsdrohung.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 2","e":"w_shapirostiglitz","f":"llms-full.txt"},{"i":414,"d":"w11","t":"Löhne","q":"Insider-Outsider-Theorie und Hysterese?","a":"<b>Insider</b> sind durch Gewerkschaften, Kündigungsschutz, Seniorität und Einarbeitungskosten geschützt; <b>Outsider</b> wären zu niedrigerem Lohn bereit, kommen aber nicht hinein. <b>Hysterese</b>: Ein temporärer Schock erhöht die Arbeitslosigkeit dauerhaft, weil Outsider Qualifikation und Verhandlungsmacht verlieren und die Insider die Löhne weiter hochhalten.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 3","e":"w_insideroutsider","f":"llms-full.txt"},{"i":415,"d":"w11","t":"Mindestlohn","q":"Mindestlohn im kompetitiven Modell — Vorhersage und Grenzen?","a":"Ein bindender Mindestlohn w̄ &gt; w* senkt die Nachfrage auf L^D(w̄) und erhöht das Angebot auf L^S(w̄) ⇒ <b>Überschussangebot</b>, also Arbeitslosigkeit, plus Wohlfahrtsverlust. <b>Grenze</b>: Das Modell unterstellt vollkommene Konkurrenz auf dem Arbeitsmarkt — genau diese Annahme ist empirisch fraglich.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 4","e":"w_mindestlohnkomp","f":"llms-full.txt"},{"i":416,"d":"w11","t":"Mindestlohn","q":"Mindestlohn im Monopson — warum kann er die Beschäftigung erhöhen?","a":"Ein Monopsonist sieht eine <b>steigende</b> Arbeitsangebotskurve w(L); um einen zusätzlichen Arbeiter einzustellen, muss er den höheren Lohn <b>allen</b> zahlen ⇒ MC_L &gt; w. Er beschäftigt daher zu wenige zu einem zu niedrigen Lohn. Ein Mindestlohn kappt die Grenzkosten und kann <b>Lohn und Beschäftigung gleichzeitig erhöhen</b> — bis er über das Wettbewerbsniveau steigt, dann kippt der Effekt.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 5","e":"w_monopson","f":"llms-full.txt"},{"i":417,"d":"w11","t":"Mindestlohn","q":"Cengiz et al. (2019) — die Bunching-Methode?","a":"Statt Durchschnittseffekten wird die <b>gesamte Lohnverteilung</b> betrachtet: Nach einer Mindestlohnerhöhung verschwinden Jobs <b>unterhalb</b> der neuen Schwelle und erscheinen in gleicher Zahl <b>knapp darüber</b> („bunching“). Ergebnis: Die Zahl der Jobs unterhalb plus oberhalb bleibt nahezu konstant — <b>kein nennenswerter Beschäftigungsverlust</b>.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 6","e":"w_bunching","f":"llms-full.txt"},{"i":418,"d":"w11","t":"Reformen","q":"Die Hartz-Reformen I–IV — Inhalte?","a":"<b>Hartz I</b> (2003): Leiharbeit erleichtert, Personal-Service-Agenturen, Bildungsgutscheine. <b>Hartz II</b> (2003): Mini- und Midi-Jobs, Ich-AG. <b>Hartz III</b> (2004): Umbau der Bundesanstalt zur Bundesagentur für Arbeit. <b>Hartz IV</b> (2005): Zusammenlegung von Arbeitslosen- und Sozialhilfe zum ALG II, verschärfte Zumutbarkeit.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 7","e":"w_hartz","f":"llms-full.txt"},{"i":419,"d":"w11","t":"Sozialversicherung","q":"Chetty (2008) — Liquiditätseffekt vs. Moral Hazard?","a":"Höheres Arbeitslosengeld verlängert die Suchdauer — das ist aber <b>nicht nur</b> Moral Hazard. Ein Teil ist ein <b>Liquiditätseffekt</b>: Vermögensbeschränkte Arbeitslose müssten sonst den erstbesten Job annehmen; das ALG erlaubt ihnen, <b>effizienter zu suchen</b>. Politikschluss: Der Liquiditätsanteil ist wohlfahrtssteigernd, nur der Moral-Hazard-Anteil ist eine Verzerrung.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 8","e":"w_chetty","f":"llms-full.txt"},{"i":420,"d":"w11","t":"Sozialversicherung","q":"Kurzarbeit — Mechanismus und Risiken?","a":"Die Firma reduziert die Arbeitszeit, der <b>Arbeitsvertrag bleibt bestehen</b>; die Bundesagentur zahlt <b>60 %</b> des entgangenen Nettoentgelts (67 % mit Kindern). Voraussetzung ist ein erheblicher Arbeitsausfall. <b>Risiken</b>: Konservierung nicht überlebensfähiger Strukturen und Mitnahmeeffekte (Balleer et al. 2016; Giupponi & Landais 2023).","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 10","e":"w_kurzarbeit","f":"llms-full.txt"},{"i":421,"d":"w11","t":"Automatisierung","q":"Acemoglu & Restrepo — die zwei Kanäle der Automatisierung?","a":"<b>Displacement-Effekt</b>: Maschinen ersetzen menschliche Arbeit in Aufgaben ⇒ Arbeitsnachfrage sinkt. <b>Reinstatement-Effekt</b>: Neue Aufgaben und Berufe entstehen ⇒ Arbeitsnachfrage steigt. Welcher überwiegt, ist eine empirische Frage. Beobachtet wird zudem <b>Job-Polarisierung</b>: Wachstum am oberen und unteren Ende, Rückgang in der Mitte.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 11","e":"w_automatisierung","f":"llms-full.txt"},{"i":422,"d":"w11","t":"Migration","q":"Card (1990) „Mariel Boatlift“ — Design und Befund?","a":"1980 kamen binnen weniger Monate rund 125.000 kubanische Migranten nach Miami; das Arbeitsangebot stieg dort um etwa 7 %. Card verglich Miami mit ähnlichen US-Städten. <b>Befund</b>: kaum messbare negative Effekte auf Löhne und Beschäftigung der Einheimischen — auch nicht bei Geringqualifizierten.","s":"Wipo VL 11 — Arbeitsmarktpolitik","sec":"Lernfrage 12","e":"w_mariel","f":"llms-full.txt"},{"i":423,"d":"w12","t":"Marktformen","q":"Vollkommener Wettbewerb, Monopol und Cournot im Vergleich?","a":"Bei p = a − bQ und Grenzkosten c: <b>Wettbewerb</b> Q_W = (a−c)/b, p_W = c. <b>Monopol</b> Q_M = (a−c)/2b, p_M = (a+c)/2 — also die halbe Menge. <b>Cournot mit n Firmen</b>: Q = n/(n+1)·(a−c)/b; für n → ∞ konvergiert das Ergebnis gegen den Wettbewerb.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 1","e":"w_marktformen","f":"llms-full.txt"},{"i":424,"d":"w12","t":"Marktformen","q":"Wohlfahrtsverlust des Monopols — die zwei Effekte?","a":"1) <b>Umverteilung</b>: Ein Teil der Konsumentenrente wird zur Produzentenrente — das ist kein Effizienzverlust, aber verteilungspolitisch relevant. 2) <b>Deadweight Loss (Harberger-Dreieck)</b>: Transaktionen mit Zahlungsbereitschaft zwischen c und p_M unterbleiben — dieser Teil kommt <b>niemandem</b> zugute. Der Konsumentenschaden ist deshalb größer als der reine Effizienzverlust.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 2","e":"w_monopolverlust","f":"llms-full.txt"},{"i":425,"d":"w12","t":"Institutionen","q":"Die drei Säulen der Wettbewerbspolitik und ihre Rechtsgrundlagen?","a":"<b>Kartellverbot</b> (Art. 101 AEUV), <b>Missbrauchsaufsicht</b> (Art. 102 AEUV) und <b>Fusionskontrolle</b> (EU-Fusionskontrollverordnung). Zuständig sind EU-Kommission (DG COMP) und nationale Behörden wie das Bundeskartellamt. Wichtig: Wettbewerbspolitik ist <b>nicht</b> Deregulierung — oft braucht es Regulierung, um Wettbewerb überhaupt herzustellen.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 3","e":"w_saeulen","f":"llms-full.txt"},{"i":426,"d":"w12","t":"Kartelle","q":"Horizontale vs. vertikale Kartelle und die drei Hardcore-Tatbestände?","a":"<b>Horizontal</b>: Absprachen zwischen Wettbewerbern auf derselben Marktstufe. <b>Vertikal</b>: zwischen Stufen der Lieferkette. Die drei Hardcore-Tatbestände sind <b>Preisabsprachen</b>, <b>Marktaufteilungen</b> und <b>Quoten-/Mengenabsprachen</b> — sie sind per se verboten.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 4","e":"w_kartelle","f":"llms-full.txt"},{"i":427,"d":"w12","t":"Kartelle","q":"Warum funktionieren Kronzeugenregelungen?","a":"Sie erzeugen ein <b>Gefangenendilemma</b> zwischen den Kartellmitgliedern: Wer zuerst aussagt, bekommt vollständigen Bußgelderlass. Weil jeder fürchtet, ein anderer könnte zuerst gehen, wird das Kartell <b>von innen instabil</b> — ohne dass die Behörde selbst ermitteln muss.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 4","e":"w_leniency","f":"llms-full.txt"},{"i":428,"d":"w12","t":"Kartelle","q":"Folk-Theorem — warum sind Kartelle im wiederholten Spiel stabil?","a":"Im einmaligen Spiel lohnt Abweichen immer. Bei <b>wiederholter</b> Interaktion mit hinreichend geduldigen Spielern (hoher Diskontfaktor δ) lässt sich das Kartellergebnis als Gleichgewicht stützen: Der kurzfristige Abweichungsgewinn wird durch die <b>Bestrafung</b> in allen Folgeperioden überkompensiert.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 5","e":"w_folktheorem","f":"llms-full.txt"},{"i":429,"d":"w12","t":"Kartelle","q":"Determinanten der Kartellstabilität?","a":"Stabilisierend wirken: <b>wenige Anbieter</b>, <b>homogene Produkte</b>, <b>Markttransparenz</b> (Abweichen wird schnell entdeckt), <b>häufige Interaktion</b>, <b>hoher Diskontfaktor</b> (Geduld) und stabile Nachfrage. Destabilisierend: viele Firmen, Innovation, Nachfrageschwankungen, Kronzeugenprogramme.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 5","e":"w_folktheorem","f":"llms-full.txt"},{"i":430,"d":"w12","t":"Fusionen","q":"Fusionskontrolle — SIEC-Test und warum präventiv?","a":"Der <b>SIEC-Test</b> („significant impediment to effective competition“) prüft, ob der Zusammenschluss wirksamen Wettbewerb erheblich behindert. Mögliche Entscheidungen: Freigabe, Freigabe mit <b>Auflagen</b> (Zusagen, Veräußerungen), Untersagung. <b>Präventiv</b>, weil eine vollzogene Fusion praktisch kaum rückabwickelbar ist.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 6","e":"w_fusionskontrolle","f":"llms-full.txt"},{"i":431,"d":"w12","t":"Vertikale Beziehungen","q":"Doppelte Marginalisierung — Ergebnis und wettbewerbspolitische Folgerung?","a":"Bei p = a − bQ und Upstream-Grenzkosten c setzt der Downstream-Monopolist Q(w) = (a−w)/2b; der Upstream-Monopolist wählt daraufhin w = (a+c)/2. Ergebnis: Q = (a−c)/4b — <b>nur die Hälfte</b> der integrierten Monopolmenge, bei <b>höherem</b> Endpreis. Folgerung: Eine <b>vertikale Fusion</b> kann Preis senken und Wohlfahrt erhöhen.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 7","e":"w_doublemarg","f":"llms-full.txt"},{"i":432,"d":"w12","t":"Missbrauch","q":"Art. 102 AEUV — die zweistufige Prüfung?","a":"<b>Stufe 1</b>: Feststellung der <b>Marktbeherrschung</b> — zuerst Marktabgrenzung (sachlich und räumlich), dann Marktanteile und Marktzutrittsschranken. <b>Stufe 2</b>: Prüfung des <b>Missbrauchs</b>. Marktbeherrschung selbst ist nicht verboten — sie kann legitimes Ergebnis überlegener Leistung sein.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 8","e":"w_art102","f":"llms-full.txt"},{"i":433,"d":"w12","t":"Missbrauch","q":"Ausbeutungs- vs. Behinderungsmissbrauch — und warum ist Predatory Pricing schwer nachweisbar?","a":"<b>Ausbeutung</b> richtet sich gegen die Marktgegenseite (überhöhte Preise, unfaire Konditionen). <b>Behinderung</b> richtet sich gegen Wettbewerber (Kampfpreise, Kopplung, Ausschließlichkeitsbindungen). <b>Predatory Pricing</b> ist schwer nachweisbar, weil niedrige Preise auch schlicht <b>guter Wettbewerb</b> sein können — man muss Verdrängungsabsicht und die spätere Amortisation belegen.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Lernfrage 8","e":"w_art102","f":"llms-full.txt"},{"i":434,"d":"w12","t":"Evidenz","q":"De Loecker et al. (2020) — was zeigt die Evidenz zu Marktmacht?","a":"Die durchschnittlichen <b>Preisaufschläge (Mark-ups)</b> US-amerikanischer Firmen stiegen von <b>21 % (1980) auf 61 % (2016)</b>. Das deutet auf zunehmende Marktmacht hin — die <b>Messung</b> von Mark-ups aus Bilanzdaten bleibt allerdings methodisch umstritten.","s":"Wipo VL 12 — Wettbewerbspolitik","sec":"Zusammenfassung VL 13","e":"w_deloecker","f":"llms-full.txt"}],"decks":[{"k":"m2","n":"Makro 2","s":"Wirtschaftswachstum (Solow)","f":"makro","c":31},{"k":"m3","n":"Makro 3","s":"Arbeitsmarkt und Arbeitslosigkeit","f":"makro","c":27},{"k":"m4","n":"Makro 4","s":"Geld, Preisniveau, Wechselkurs","f":"makro","c":20},{"k":"m5","n":"Makro 5","s":"Aggregierte Güternachfrage","f":"makro","c":32},{"k":"m6","n":"Makro 6","s":"Geld, Geldmarkt, Geldpolitik","f":"makro","c":41},{"k":"m7","n":"Makro 7","s":"Kurzfristiges Gleichgewicht (IS-TR)","f":"makro","c":40},{"k":"m8","n":"Makro 8","s":"Angebot, Beschäftigung, Inflation","f":"makro","c":26},{"k":"m9","n":"Makro 9","s":"AS-AD und allgemeines Gleichgewicht","f":"makro","c":27},{"k":"m10","n":"Makro 10","s":"Nachfrageorientierte Politik","f":"makro","c":37},{"k":"m11","n":"Makro 11","s":"Fiskalpolitik und Angebotspolitik","f":"makro","c":42},{"k":"w01","n":"Wipo VL 01","s":"Einführung: drei Perspektiven","f":"wipo","c":4},{"k":"w02","n":"Wipo VL 02","s":"Instrumente und Kausalität","f":"wipo","c":6},{"k":"w03","n":"Wipo VL 03","s":"Allokationstheorie und Wohlfahrt","f":"wipo","c":10},{"k":"w04","n":"Wipo VL 04","s":"Marktversagen und Information","f":"wipo","c":8},{"k":"w05","n":"Wipo VL 05","s":"Politische Ökonomie und Einflussnahme","f":"wipo","c":9},{"k":"w06","n":"Wipo VL 06","s":"Externe Effekte und Umweltpolitik","f":"wipo","c":9},{"k":"w07","n":"Wipo VL 07","s":"Öffentliche Güter","f":"wipo","c":9},{"k":"w08","n":"Wipo VL 08","s":"Handelspolitik","f":"wipo","c":11},{"k":"w09","n":"Wipo VL 09","s":"Öffentliche Finanzen","f":"wipo","c":13},{"k":"w10","n":"Wipo VL 10","s":"Wachstum und Verteilung","f":"wipo","c":10},{"k":"w11","n":"Wipo VL 11","s":"Arbeitsmarktpolitik","f":"wipo","c":11},{"k":"w12","n":"Wipo VL 12","s":"Wettbewerbspolitik","f":"wipo","c":12}],"expl":{"e_wachstumsrate":{"t":"Warum „relativ“ der Kern ist","b":"Eine Wachstumsrate ist keine Differenz, sondern eine Differenz <b>geteilt durch den Ausgangswert</b>. Genau daraus folgt die ganze Logik von Abschnitt 4.2: Zwei Länder mit gleichem g haben einen konstanten <i>relativen</i> Abstand, aber einen wachsenden <i>absoluten</i>. Land A (1.000 €) und Land B (10.000 €) wachsen beide mit 2 %; nach einem Jahr ist der absolute Abstand von 9.000 auf 9.180 € gestiegen, das Verhältnis bleibt 1:10."},"e_daumenregeln":{"t":"Die fünf Daumenregeln","b":"Quotientenregel, Produktregel, 72er-Regel, Log-Approximation und der Zinseszinseffekt. Die Quotientenregel ist die meistgebrauchte: y = Y/L ⇒ g_y = g_Y − g_L. Genau sie steckt hinter den beiden letzten Spalten der Wachstumstabelle — die USA wachsen mit 3,5 % beim BIP, aber nur mit 1,7 % pro Kopf; die Differenz ist das Bevölkerungswachstum."},"e_log":{"t":"Warum Logarithmieren linearisiert","b":"Aus x(t) = x(0)·e^{gt} wird ln x(t) = ln x(0) + g·t — eine Gerade. Der Nutzen ist doppelt: Man kann die Wachstumsrate direkt als Steigung <b>ablesen</b>, und man kann sie ökonometrisch <b>schätzen</b>. Genau das macht der USA-Trend mit dem Koeffizienten 0,0184, also 1,84 % pro Jahr über 170 Jahre."},"e_cdzerlegung":{"t":"Die Zerlegung als gewichteter Durchschnitt","b":"g_Y = α g_K + (1−α) g_L. Die Elastizitäten α und (1−α) addieren sich zu 1 — das Outputwachstum ist damit ein <b>gewichteter Durchschnitt</b> der Faktorwachstumsraten. Beispiel α = 1/3, g_K = 3 %, g_L = 1 %: g_Y = 1 + 0,667 = 1,67 %. Dieselbe Technik wird in Teil 4 auf M = kPY und auf σ = SP/P* angewandt."},"e_kaldor":{"t":"Kaldors Prüfliste","b":"Die sieben stilisierten Fakten sind der Maßstab, an dem das Solow-Modell zweimal gemessen wird — einmal ohne, einmal mit technischem Fortschritt. Die häufigste Verwechslung: Kapitalintensität K/L steigt, Kapitalkoeffizient K/Y ist trendlos. Kein Widerspruch, wenn K und Y gleich schnell wachsen und L langsamer. Empirisch: deutsche Kapitalkoeffizienten 1913–2020 zwischen 2,1 und 3,0."},"e_prodfkt":{"t":"Die vier Bausteine und warum sie zusammengehören","b":"Konstante Skalenerträge (a) sind die Voraussetzung dafür, dass man überhaupt zur intensiven Form übergehen darf — und zugleich dafür, dass das Ausschöpfungstheorem (d) gilt (Euler-Theorem). Abnehmende Grenzprodukte (b) sind der <b>Motor des ganzen Modells</b>: Die Erträge des Kapitals erschöpfen sich, die Abschreibungen nicht — daraus entsteht der Steady State."},"e_intensiv":{"t":"Die intensive Form","b":"y = f(k) spart eine Dimension: statt K und L nur noch k. Der Übergang funktioniert nur wegen der konstanten Skalenerträge (λ = 1/L). Die Grenzprodukte lauten GP_K = f′(k) und GP_L = f(k) − f′(k)k — Letzteres folgt direkt aus dem Ausschöpfungstheorem, geteilt durch L und nach w aufgelöst. Grafisch ist der Lohn der Achsenabschnitt der Tangente an f(k)."},"e_solowannahmen":{"t":"Die Annahmen — und wo die Kritik ansetzt","b":"S = sY ist <b>keine optimierende Entscheidung</b>, sondern eine mechanische Verhaltensannahme. Genau daran setzt die Kritik in Kapitel 15 an („keine Mikrofundierung“) — und genau diese Lücke schließt Teil 5 mit der Euler-Gleichung."},"e_bewegung":{"t":"Die Bewegungsgleichung als Waage","b":"Δk = sy − δk. Links die Zuflüsse (Ersparnis = Investition), rechts die Abflüsse (Abschreibung), die Differenz ist die Veränderung der Kapitalintensität. Aufbaulogik über das ganze Kapitel: erst δ, dann (n+δ), dann (a+n+δ). Alles, was k verwässert, landet in derselben Klammer."},"e_steadystate":{"t":"Warum es genau einen Schnittpunkt gibt","b":"sy ist konkav (abnehmende Grenzerträge), δk ist eine Gerade. Am Anfang liegt sy über δk, flacht aber ab, während δk konstant weitersteigt — irgendwann holt die Gerade auf. Rechenweg: s·k^α = δ·k ⇒ s/δ = k^{1−α} ⇒ k* = (s/δ)^{1/(1−α)}."},"e_stationaer":{"t":"Der irritierende Befund","b":"Ein <i>Wachstums</i>modell erzeugt im Gleichgewicht <b>null Wachstum</b>. Die Abschreibungen sind der einzige exogene Faktor, der überhaupt Bewegung auslöst; ohne Ersatzinvestitionen würde k auf null sinken („die Wirtschaft lebt auf Kosten der Substanz“). Der gesamte Rest der Vorlesung besteht darin, dieses Problem zu beheben."},"e_sparquote":{"t":"Sparen ist ein schwacher Hebel","b":"Eine höhere Sparquote erzeugt <b>Niveaueffekte, keine Wachstumseffekte</b> — g_y springt nur transitorisch ins Positive. Und der Hebel ist klein: ε_{y,s} = α/(1−α) = 0,5. Eine Verdopplung von s (0,20→0,40) hebt k* von 8 auf 22,63, aber y* nur von 2,000 auf 2,828 — also +41 %. <b>Man kann sich nicht reich sparen.</b>"},"e_goldene":{"t":"Die Goldene Regel","b":"Gesucht ist die Sparquote, die den Steady-State-<b>Konsum</b> maximiert, nicht das Einkommen: max_s [y − δk] ⇒ r = δ (allgemein r = a+n+δ). Grafisch: Der vertikale Abstand zwischen y und δk wird maximal, wenn beide dieselbe Steigung haben — der Tangentialpunkt. Bei Cobb-Douglas gilt immer s_gold = α."},"e_ineffizienz":{"t":"Free Lunch — wörtlich gemeint","b":"Bei s > s_gold kann man die Sparquote senken und <b>sofort mehr und dauerhaft mehr</b> konsumieren. Zahlenbeispiel (α=1/3, δ=0,05): Beim Übergang von s = 0,40 auf s = 1/3 springt der Konsum sofort auf 1,885 und pendelt sich bei 1,721 ein — beides über dem Ausgangswert 1,697. Zu keinem Zeitpunkt gibt es einen Verzicht."},"e_bevoelkerung":{"t":"Warum n zu δ addiert wird","b":"Beide drücken den Verhältniswert k: δ frisst den Zähler K auf, n bläht den Nenner L auf. Analogie: 20 Laptops für 20 Schüler — ob ein Laptop kaputtgeht oder ein Schüler dazukommt, ist für die Pro-Kopf-Zahl egal. Effekt: Bei α=1/3, s=0,20, δ=0,05 fällt y* von 2,000 (n=0) auf 1,690 (n=2 %) — rund 15 %."},"e_bilanz":{"t":"Vier Treffer, drei Fehlschläge","b":"Ohne technischen Fortschritt erklärt Solow: K/Y trendlos, r konstant, Einkommensquoten trendlos, β-Konvergenz. Nicht erklärt: wachsendes y, wachsendes k, wachsendes w. Die drei Fehlschläge hängen zusammen — es fehlt genau eine Sache: <b>anhaltendes Pro-Kopf-Wachstum</b>. Y wächst zwar mit n, aber nur weil mehr Köpfe da sind: extensives, nicht intensives Wachstum."},"e_residuum":{"t":"Das „Maß unserer Unwissenheit“","b":"Das Solow-Residuum wird als Rest berechnet und enthält <b>alles</b>, was nicht Faktormengenwachstum ist: technischen Fortschritt, aber auch Messfehler, Qualitätsverbesserungen, Organisation, Institutionen. Empirisch: TFP-Wachstum Deutschland 1913–1987 = 0,8 %, 1990–2019 nur noch 0,2 % — die Produktivitätsverlangsamung, in Frankreich und Japan sogar negativ."},"e_techfort":{"t":"Effizienzeinheiten","b":"Y = F(K, A·L) — das A steht <b>beim L</b>. Ein Arbeiter mit doppelt so guter Technologie zählt produktionstechnisch wie zwei Arbeiter von früher; die Folie nennt das die „quasi-vermehrte“ Bevölkerung. Deshalb wird a genauso zur Klammer addiert wie n. <b>Notation der Vorlesung:</b> hochgestelltes e (y^e, k^e), nicht Tilde."},"e_merktafel":{"t":"Die wichtigste Merktafel","b":"Effektive Größen y^e, k^e und der Zins r: Wachstumsrate <b>0</b>. Pro-Kopf-Größen y, k, w: <b>a</b>. Aggregate Y, K, AL: <b>a+n</b>. Die Frage „wächst y im Steady State?“ hat zwei Antworten, je nachdem ob effektive oder physische Größen gemeint sind — eine klassische Fehlerquelle."},"e_konvergenz":{"t":"Absolute und bedingte Konvergenz","b":"Konvergenz folgt aus den abnehmenden Grenzerträgen: Wo wenig Kapital pro Kopf ist, ist f′(k) hoch, also wächst k schnell. <b>Empirisch findet man absolute Konvergenz in Weltdaten nicht</b> — die Korrelation zwischen BIP pro Kopf 1960 und Wachstum 1960–2000 beträgt +0,182, also schwach positiv. Deshalb kontrolliert die Wachstumsregression für INV, HC, RD und POP."},"e_solowkritik":{"t":"Warum das Modell unvollständig bleibt","b":"Der Kernvorwurf: Alle Wachstumsdeterminanten sind <b>exogen</b>. Am pikantesten ist der dritte Punkt — das Modell erklärt, dass langfristiges Wachstum nur vom technischen Fortschritt kommt, und lässt ausgerechnet diesen unerklärt. Teil 5 schließt die Sparquoten-Lücke, die endogene Wachstumstheorie die Technologie-Lücke."},"e_endogen":{"t":"Endogenes Wachstum","b":"Der Trick besteht darin zu verhindern, dass f′(k) gegen null geht — anhaltendes Wachstum tritt bei langfristig <b>nicht sinkendem Realzins</b> auf. Drei Ansätze: technologische Externalitäten (Romer 1986), produktive Staatsausgaben (Barro 1990), Humankapital (Lucas 1988). Lucas ist derselbe, dessen Zitat die Vorlesung eröffnet."},"e_angebotidee":{"t":"Arbeit erscheint im Nutzen gar nicht","b":"Der Haushalt entscheidet über <b>Freizeit</b>, die Arbeitszeit ist der Rest des Zeitbudgets. Arbeit ist damit kein Gut mit eigenem Nutzen, sondern der Verzicht auf Freizeit — der Preis, den man für Konsum zahlt. Das unterscheidet dieses Kapitel vom Solow-Modell, wo L einfach exogen gegeben war."},"e_haushaltsoptimum":{"t":"Die Tangentialbedingung","b":"U_ℓ/U_C = |GRS| = w/p. Links die <b>subjektive</b> Bewertung (wozu der Haushalt bereit ist), rechts die <b>objektive</b> Rate (wozu der Markt ihn lässt). Der Reallohn ist damit der Opportunitätskostenpreis der Freizeit: Eine Stunde Freizeit kostet w/p Einheiten entgangenen Konsums."},"e_freizeitnachfrage":{"t":"Warum die Vorzeichen so sind","b":"Aus λ = 1/p und η·ℓ^{η−1} = w/p folgt ℓ^{η−1} = w/(ηp), also ℓ = [w/(ηp)]^{1/(η−1)}. Der Exponent ist <b>negativ</b>, weil η &lt; 1. Im Beispiel (η=0,5, p=1, ℓ_max=16 h): w/p = 0,20 ⇒ 6,25 h Freizeit; w/p = 0,40 ⇒ nur noch 1,56 h. Bei U = C + ℓ^η fällt der Einkommenseffekt gerade weg."},"e_essub":{"t":"Zwei gegenläufige Effekte","b":"Einkommenseffekt (−): Bei höherem Lohn erreicht man sein Zieleinkommen in kürzerer Zeit. Substitutionseffekt (+): Jede Stunde Nichtstun ist teurer geworden. <b>Theoretisch offen</b>, empirisch entschieden: Der deutsche Reallohn stieg seit 1870 auf das 16,6-fache, die Jahresarbeitszeit fiel von 2.941 auf 1.383 Stunden — langfristig dominiert der Einkommenseffekt."},"e_aggregat":{"t":"Intensive und extensive Marge","b":"Die individuelle Kurve kann rückwärtsgeneigt sein, die aggregierte ist trotzdem steigend — wegen der <b>extensiven Marge</b>: Bei höherem Lohn treten zusätzliche Personen ein. Empirisch sichtbar: Die Erwerbsbeteiligung von Frauen stieg in Deutschland von 51 % (1984) auf 74 % (2018), die Arbeitszeit pro Kopf der Bevölkerung blieb bei 15,5 → 15,9 Stunden."},"e_reservationslohn":{"t":"Die Brücke zur Sozialpolitik","b":"Der Reservationslohn steigt mit der <b>Outside Option</b>. Großzügigere Lohnersatzleistungen heben ihn, verschieben die Angebotskurve nach oben und können die Beschäftigung senken. Empirisch passt dazu, dass Länder mit kurzer ALG-Bezugsdauer (USA 26 Wochen, Kanada 45) niedrige Langzeitarbeitslosigkeit haben — aber Vorsicht, das ist Korrelation, keine bewiesene Kausalität."},"e_arbeitsnachfrage":{"t":"Die Grenzproduktkurve ist die Nachfragekurve","b":"Auf jedem Punkt maximiert der Unternehmer ceteris paribus seinen Gewinn. Dasselbe Prinzip wie in Teil 2: Faktoren werden nach ihrem Grenzprodukt entlohnt. Sie fällt wegen F_LL &lt; 0 — bei fixem Kapitalstock teilen sich immer mehr Arbeiter dieselben Maschinen."},"e_produktivitaet":{"t":"Produktivität statt Verhandlungsmacht","b":"Ein Produktivitätsanstieg verschiebt die Nachfragekurve nach rechts/oben ⇒ höherer Reallohn <b>und</b> höhere Beschäftigung. Das ist die Modellerklärung für den historischen Reallohnanstieg — nicht Gewerkschaften, sondern Produktivität. Und deren Wachstum kam laut Teil 2 vor allem vom technischen Fortschritt."},"e_amgleichgewicht":{"t":"Kein Platz für unfreiwillige Arbeitslosigkeit","b":"Im Gleichgewicht räumt der Markt. Dass L &lt; L_max ist, ist <b>freiwillig gewählte Freizeit</b>. Genau deshalb muss das Modell erst gestört werden, um Arbeitslosigkeit zu erklären. Merkregel für Verschiebungen: Nachfrage ⇒ w und L gleichläufig; Angebot ⇒ gegenläufig."},"e_alqdefinition":{"t":"Der Nenner ist die Falle","b":"u = Arbeitslose / <b>Erwerbspersonen</b>. Wer weder arbeitet noch sucht, taucht weder im Zähler noch im Nenner auf. Konsequenz: Entmutigung senkt die Quote, obwohl sich die Lage verschlechtert hat. Rechenhinweis: 46,15 + 2,81 = 48,96 Mio. Erwerbspersonen ⇒ 5,7 %; die offiziellen 6,0 % beruhen auf einer anderen Nennerabgrenzung."},"e_qualifikation":{"t":"Der Faktor acht","b":"2023: ohne abgeschlossene Berufsausbildung 20,8 %, akademisch 2,5 %. Arbeitslosigkeit ist weit überwiegend ein Problem der Geringqualifizierten. Das verbindet dieses Kapitel mit Teil 2 (Humankapital als Wachstumsfaktor) und liefert das Argument für <b>angebotsseitige, qualifikationsorientierte</b> Arbeitsmarktpolitik."},"e_ursachen":{"t":"(a) und (b) in einem Satz","b":"(a) <b>Der Lohn passt nicht</b> — er ist zu hoch und kann nicht fallen. (b) <b>Menschen und Stellen passen nicht zueinander</b> — es gibt offene Stellen und Arbeitslose gleichzeitig, aber am falschen Ort, im falschen Sektor, mit der falschen Qualifikation. Die Politikantworten sind entsprechend verschieden: Lohnflexibilität gegen (a), Qualifizierung und Matching gegen (b)."},"e_lohnrigiditaet":{"t":"Die kurze Marktseite bestimmt die Menge","b":"Bei w̄ > w* liegt die realisierte Beschäftigung immer bei A (auf der Nachfragekurve), nicht bei B. Die Strecke A–B ist unfreiwillig arbeitslos: Diese Menschen würden zum herrschenden Lohn arbeiten, finden aber keine Stelle. Rechts von B liegt dagegen freiwilliger Verzicht."},"e_gewerkschaften":{"t":"Organisationsgrad ≠ Deckungsgrad","b":"Für die ökonomische Wirkung zählt der <b>Deckungsgrad</b>, nicht die Mitgliederzahl. Frankreich 2016: 9 % Mitglieder, 98 % Tarifbindung. Modelliert wird die Gewerkschaft als monopolistischer Preissetzer mit Stone-Geary-Präferenzen; der CES-Parameter ρ misst, wie stark sie bereit ist, Beschäftigung für Lohn zu opfern."},"e_effizienzlohn":{"t":"Arbeitslosigkeit als Anreizinstrument","b":"Der entscheidende Unterschied zu Gewerkschaften und Mindestlöhnen: Das Unternehmen zahlt den überhöhten Lohn <b>freiwillig und aus eigenem Interesse</b>. Und die Pointe: Nur wenn Arbeitslosigkeit existiert, ist die Entlassungsdrohung glaubwürdig — bei Vollbeschäftigung hätte der Entlassene sofort einen neuen Job."},"e_friktionell":{"t":"Bestände und Ströme","b":"u^f = s/(s+f), Verweildauer 1/f. Dieselbe Quote kann sehr verschiedene Arbeitsmärkte beschreiben: s=0,02/f=0,15 und s=0,04/f=0,30 ergeben beide 11,76 %. Empirisch: In Deutschland kommen auf 2,3 Mio. Bestand 7,2 Mio. Ströme (gut 3 Umschläge), in den USA 37,3 Mio. bei 6,0 Mio. (über 6 Umschläge) — ein weit fluiderer Arbeitsmarkt."},"e_natuerlicheALQ":{"t":"„Natürlich“ heißt nicht unveränderlich","b":"u* wird durch angebotsseitige Faktoren bestimmt: Technologiestand, Qualifikationsniveau, Institutionen. Deutschlands Schätzwert fiel von 8,3 % (2000er) auf 4,8 % (2010er). Die zentrale Politikaussage: <b>Gegen zyklische Arbeitslosigkeit hilft Nachfragepolitik, gegen u* nur Angebotspolitik.</b>"},"e_persistenz":{"t":"Warum die Quoten hängenblieben","b":"Deutschland ging von 0,7 % (1960er) auf 5,8 % (1980er) — fast das Achtfache, und fast alle europäischen Länder machten den Sprung mit. Entscheidend ist die <b>Persistenz</b>: Die Quoten bilden sich über Jahrzehnte nicht zurück. Genau das kann ein reines Marktgleichgewichtsmodell nicht erklären."},"e_geldfunktionen":{"t":"Geld ist, was Geldfunktionen erfüllt","b":"Die Definition ist <b>funktional</b>, nicht physisch — die Erscheinungsformen ändern sich ständig (Münzen, Giralgeld, PayPal, Bitcoin). Die Recheneinheitsfunktion spart enorm: Bei 100 Gütern braucht man ohne Numéraire 4.950 Austauschverhältnisse, mit nur 99."},"e_neutralitaet":{"t":"Der Schleier","b":"Ein Schleier verändert nicht, <i>was</i> darunter liegt, nur wie es aussieht. Gedankenexperiment: Verzehnfacht sich über Nacht jeder Geldbetrag, kostet das Brot 30 € statt 3 € und du verdienst 30.000 € statt 3.000 € — real hat sich nichts geändert. <b>Wichtig: Das gilt nur langfristig.</b>"},"e_cambridge":{"t":"Cambridge-Gleichung","b":"M·v = P·Y bzw. M/P = kY mit k = 1/v. Beispiel M=1.000, v=5, Y=500 ⇒ P = 10; verdoppelt sich M, verdoppelt sich P auf 20, die reale Geldmenge M/P bleibt bei 100. k ist der Kassenhaltungskoeffizient: Bei v = 5 hält man ein Fünftel des Jahreseinkommens liquide."},"e_geldmarkt4":{"t":"Das Diagramm mit P auf der vertikalen Achse","b":"Das Geldangebot ist <b>senkrecht</b>, weil die Zentralbank Mengensetzer ist. Die Nachfrage fällt, weil bei höherem Preisniveau nominal mehr Geld für dieselben realen Transaktionen nötig ist. Eine Geldmengenausweitung treibt hier allein das Preisniveau. In Teil 6 steht auf derselben Achse stattdessen der Zins — das ist der Unterschied zwischen langer und kurzer Frist."},"e_dichotomie":{"t":"Warum g_M = g_P gilt","b":"Das langfristige Produktionspotenzial wird durch Kapital, Arbeit und technischen Fortschritt bestimmt — in keiner Gleichung des Solow-Modells kam Geld vor. Also muss bei stationärem k gelten g_M = g_P. <b>Drei Annahmen tragen den Schluss:</b> g_k = 0, g_Y unabhängig von g_M, und langfristige Betrachtung."},"e_inflation4":{"t":"Der Übertragungsweg","b":"π = g_M − g_Y. Die Geldmenge wirkt <b>nicht direkt</b> auf die Preise, sondern über das Ausgabenverhalten: zu viel Liquidität ⇒ mehr Ausgaben ⇒ Überschussnachfrage am Gütermarkt ⇒ steigende Preise. In einer Klausurantwort sollte diese Kette vollständig genannt werden."},"e_mengensteuerung":{"t":"Warum die Geldmengensteuerung scheiterte","b":"Veränderte Zahlungsgewohnheiten bedeuten, dass v (und damit k) <b>nicht mehr stabil</b> ist — genau die Annahme, auf der die Quantitätstheorie beruht. Die Geldmenge zu steuern nützt nichts, wenn man nicht weiß, wie stark sie wirkt. Deshalb der Wechsel zum Zins, der direkter auf das Ausgabenverhalten wirkt."},"e_fisher":{"t":"Die Fisher-Gleichung","b":"r = i − π. Wer Bargeld hält, verzichtet auf i <i>und</i> verliert durch π an Kaufkraft — der Realzins der Geldhaltung ist also −π (Inflationssteuer). Das r ist dasselbe wie das Grenzprodukt des Kapitals aus Teil 2. Präzisere Fassung in Teil 9: i = r + π^e mit der <b>erwarteten</b> Inflation."},"e_wechselkurs":{"t":"Nominal und real","b":"Nominal ist Währung gegen Währung, real ist Güter gegen Güter. <b>Für die Wohlfahrt zählt nur der reale Kurs.</b> Ein Land mit hoher Inflation kann nominal stark abwerten und real trotzdem unverändert dastehen — genau das zeigt die Türkei-Grafik."},"e_notierung":{"t":"Die häufigste Fehlerquelle des Kapitels","b":"In der Vorlesungskonvention (<b>Mengennotierung</b>: ausländische Währung je Einheit heimischer) bedeutet steigendes S eine <b>Aufwertung</b>. In Preisnotierung genau umgekehrt. Die Türkei-Grafik zeigt Lira je Dollar, also Preisnotierung — der Anstieg von 2 auf 16 ist dort eine massive Abwertung."},"e_realerWK":{"t":"σ = SP/P* Schritt für Schritt","b":"P ist der Preis heimischer Güter in heimischer Währung, S·P derselbe Preis in ausländischer Währung; geteilt durch P* kürzt sich die Währung heraus. Beispiel: deutsches Auto 30.000 €, S = 1,10 ⇒ 33.000 USD; US-Auto 30.000 USD ⇒ σ = 1,10. Steigendes σ = bessere Terms of Trade <b>und</b> schlechtere Wettbewerbsfähigkeit."},"e_wkaenderung":{"t":"g_σ = g_S + π − π*","b":"Bei festen Kursen (g_S = 0) bleibt g_σ = π − π*. Wer dauerhaft mehr Inflation hat, wertet real auf. <b>Das ist im Kern die Diagnose der Euro-Krise</b>: In einer Währungsunion sind die nominalen Kurse fix, Inflationsdifferenzen schlagen voll auf reale Wechselkurse und Leistungsbilanzen durch. Beispiel: g_S = −5 %, π = 8 %, π* = 2 % ⇒ g_σ = +1 %, also reale Aufwertung trotz nominaler Abwertung."},"e_effektiverWK":{"t":"Effektiver Kurs und Terms of Trade","b":"Der effektive Kurs ist ein <b>gewichtetes geometrisches</b> Mittel der bilateralen Kurse; die Gewichte sind Handelsanteile. Geometrisch, weil Wechselkurse Verhältniszahlen sind — sonst hinge das Ergebnis von der Notierungsrichtung ab. Beispiel: 1,05^{0,5}·0,98^{0,3}·1,20^{0,2} = 1,056."},"e_ppp":{"t":"Kaufkraftparität als internationale Geldneutralität","b":"Absolut: σ = 1. Relativ: σ konstant ⇒ g_σ = 0 und <b>g_S = π* − π</b>. In Abschnitt 6.2 galt: Mehr Geld ändert nur das Preisniveau. Hier: Mehr Inflation ändert nur den nominalen Wechselkurs. Derselbe Gedanke, einmal nach innen und einmal nach außen gewendet. Grenzen: kurzfristige Kapitalströme und nichthandelbare Güter."},"e_ratErw":{"t":"Rationale Erwartungen","b":"Sie bedeuten <b>nicht</b>, dass niemand sich irrt, sondern dass die Fehler zufällig sind und sich im Mittel aufheben — niemand liegt <i>systematisch</i> daneben, weil man aus systematischen Fehlern lernen würde. Ohne diese Annahme funktionieren weder die Permanent-Income-Hypothese noch die Ricardianische Äquivalenz."},"e_ibr":{"t":"Nur das Vermögen zählt","b":"Die Barwertform zeigt: Es zählt allein Ω, nicht die zeitliche Verteilung des Einkommens. Beispiel Y₁=100, Y₂=110, r=10 % ⇒ Ω = 200. Konsumiert man heute 120, nimmt man 20 Kredit auf und kann morgen 88 konsumieren (Probe: 120 + 80 = 200). <b>Aus diesem einen Gedanken folgen PIH, Konsumglättung und Ricardo gleichermaßen.</b>"},"e_budgetgerade":{"t":"Die Gerade dreht sich","b":"Verzichtet man heute auf eine Einheit, bekommt man morgen 1+r — daher die Steigung −(1+r). Der Ausstattungspunkt liegt immer auf der Geraden, weil „gar nichts tun“ stets möglich ist. Deshalb <b>dreht</b> sich die Gerade bei einer Zinsänderung um diesen Punkt, während sie sich bei einer G-Erhöhung <b>parallel</b> verschiebt."},"e_tvb":{"t":"Transversalitätsbedingung","b":"B₂/(1+r) = 0 schließt aus, dass Vermögen verschwendet oder Schulden hinterlassen werden — und damit <b>Ponzi-Spiele</b>. Bei endlichem Horizont gilt: Irgendwann muss abgerechnet werden. Dieselbe Bedingung gilt für den Staat (Kapitel 5) und für ein ganzes Land (Kapitel 6)."},"e_gpk1r":{"t":"Warum GP_K = 1 + r","b":"Über zwei Perioden kommt das eingesetzte Kapital selbst zurück: Man erhält den Einsatz (die 1) plus die Verzinsung (das r). Die Alternative zur Investition ist immer, das Geld zum Zins r zu verleihen. Im Solow-Modell mit laufender Abschreibung stand dagegen GP_K = r + δ — eine klassische Verwechslungsfalle."},"e_firmenwert":{"t":"Firmenwert und Risikoprämie","b":"V = F(K,L)/(1+r) − I^netto. Eine Investition lohnt bei positivem Gegenwartswert. Bei Risiko gilt GP_K = 1 + r + Risikoprämie — genau diese Prämie zeigt sich empirisch in den Zins-Spreads: Im Euroraum zahlten A-geratete Unternehmen 0,6 pp, BBB-geratete 1,6 pp mehr als der Staat."},"e_mm":{"t":"Modigliani-Miller","b":"Der Haushalt steht auf <b>beiden Seiten der Bilanz</b>: Er ist Eigentümer der Firma und ihr Kreditgeber. Ob die Firma sich bei ihm leiht oder er ihr Eigenkapital gibt, verschiebt nur die Etiketten. Gilt nur unter idealen Bedingungen — ohne Steuern, Insolvenzkosten und Informationsasymmetrien."},"e_staatbr":{"t":"Schulden sind ein Versprechen","b":"D₁ = Barwert der künftigen Budgetüberschüsse. Wer heute D₁ Schulden hat, muss im Barwert genau D₁ an Überschüssen erwirtschaften. Es ist dieselbe Transversalitätsbedingung wie beim Haushalt, nur für den Staat."},"e_primaersaldo":{"t":"Primärsaldo","b":"Der Budgetsaldo ohne Zinszahlungen. Die Zinsen r_G·D₁ stammen aus früheren Entscheidungen und sind heute nicht mehr beeinflussbar — der Primärsaldo ist die <b>politisch steuerbare</b> Größe. Er ist zugleich der Kern der Schuldenstandsdynamik in Teil 11 und in Wipo-Übungsblatt 7."},"e_crowdingout":{"t":"Der Rechenschritt","b":"Setzt man die staatliche in die private Budgetbeschränkung ein, verschwinden die Steuern und werden durch G ersetzt. Der private Sektor <b>internalisiert vollständig</b> die staatliche Budgetbeschränkung. Beispiel: Ω = 200, dann G₁ = 50 ⇒ neues Ω = 150, geschrumpft um genau den Barwert der Staatsausgaben."},"e_ricardo":{"t":"Ricardianische Äquivalenz nachgerechnet","b":"G₁ = 50, r = 10 %. Weg A: T₁ = 50, Barwert 50. Weg B: T₁ = 0, dafür T₂ = 55, Barwert 55/1,1 = 50. <b>Identisch.</b> Bei Weg B spart der Haushalt heute die 50 zusätzlich. <b>Achtung:</b> Irrelevant ist nur die <i>Finanzierungsart</i>. Die Höhe von G verdrängt sehr wohl privaten Konsum — das ist Crowding out."},"e_ricardobruch":{"t":"Wo Ricardo bricht","b":"Sechs Bruchstellen, praktisch am wichtigsten sind Kreditrestriktionen (Abschnitt 7.8) und unterschiedliche Zinssätze. Bei r = 10 % und r_G = 4 % gewinnt der private Sektor bei einem Defizit von 50 genau (0,10−0,04)/1,1 × 50 = <b>2,73</b> an Vermögen — der Staat borgt günstig für seine Bürger."},"e_plb":{"t":"Primärleistungsbilanz","b":"PLB = LBS − rF, begrifflich dieselbe Konstruktion wie der Primärsaldo des Staates. Ein Leistungsbilanzdefizit ist <b>nicht per se schlecht</b>: Werden die importierten Ressourcen investiert, steigt das künftige Produktionspotenzial und die Schuld ist bedienbar. Werden sie konsumiert, nicht."},"e_praeferenzen":{"t":"Additiv-separabel und der Diskontfaktor","b":"V = U(C₁) + b·U(C₂)
