ung in einer Zahl (0 = Gleichheit, 1 = maximale Ungleichheit). Am aufschlussreichsten ist die Gegenüberstellung von <b>Primär- und Sekundärverteilung</b>: Die Differenz misst exakt, was das Steuer-Transfer-System leistet."},"e_y_vermoegensdezile":{"t":"Bestand gegen Strom","b":"Vermögen ist regelmäßig deutlich ungleicher verteilt als Einkommen — das oberste Dezil hält typischerweise einen weit größeren Anteil am Vermögen als am Einkommen. Der Grund liegt im Zinseszinseffekt aus Teil 2: Vermögen ist ein <b>Bestand</b>, der sich akkumuliert und verzinst, Einkommen ein <b>Strom</b>. Kleine Einkommensunterschiede erzeugen über Jahrzehnte große Vermögensunterschiede. Für Deutschland ist das wegen der niedrigen Wohneigentumsquote besonders ausgeprägt."},"e_y_allmende11":{"t":"Warum das Allmende-Problem international ungelöst bleibt","b":"Beim Allmendegut trägt jeder den vollen Nutzen seines Verbrauchs, aber nur einen winzigen Bruchteil der Kosten — individuell rational, kollektiv katastrophal. Die bekannten Lösungen setzen alle eine <b>durchsetzungsfähige Instanz</b> voraus: Eigentumsrechte zuweisen (Coase), besteuern (Pigou) oder kontingentieren (Emissionshandel). National ist das der Staat. International gibt es sie nicht — Klimaabkommen beruhen auf Freiwilligkeit, und wer aussteigt, profitiert sogar als Trittbrettfahrer."},"e_y_diskontierungklima":{"t":"Die zeitlichen Konfliktlinien","b":"Der intergenerationelle Konflikt ist ein Diskontierungsproblem: Wie stark gewichtet man künftige Schäden gegenüber heutigen Kosten? Das ist die Zeitpräferenzrate ρ aus Teil 5, nur auf gesellschaftlicher Ebene — und bei Zeiträumen von hundert Jahren führen kleine Unterschiede in ρ zu völlig verschiedenen Politikempfehlungen. Der Kurzfrist-Langfrist-Trade-off ist zugleich ein Zeitinkonsistenzproblem: Die Kosten fallen sofort an, der Nutzen erst jenseits jedes Wahlzyklus."},"w_perspektiven":{"t":"Die drei Brillen der Wirtschaftspolitik","b":"Positiv, normativ und politökonomisch sind keine konkurrierenden Schulen, sondern <b>drei verschiedene Fragen</b> an dieselbe Maßnahme. Positiv: Was <i>ist</i> der Effekt? Normativ: Was <i>sollte</i> getan werden? Politische Ökonomie: Warum wird <i>tatsächlich</i> das getan, was getan wird? Die dritte Perspektive ist der rote Faden der Vorlesung — sie erklärt, warum gute Politik oft unterbleibt."},"w_ordnungprozess":{"t":"Rahmen setzen oder eingreifen","b":"Ordnungspolitik legt <b>allgemeine Spielregeln</b> fest, ohne einzelne Märkte anzusteuern — Kartellrecht, Eigentumsordnung, Vertragsrecht. Prozesspolitik greift <b>situativ und kurzfristig</b> ein — Konjunkturpakete, Subventionen, Preisbremsen. Der Unterschied ist nicht die Intensität, sondern die <b>Adressierung</b>: Regeln für alle gegen Reaktion auf eine konkrete Lage."},"w_instrumenteigenschaften":{"t":"Woran man ein gutes Instrument erkennt","b":"Kontrollierbarkeit, Effektivität, Unabhängigkeit und praktische Anwendbarkeit. Die vier Kriterien greifen ineinander: Ein Instrument, das theoretisch effektiv ist, aber rechtlich nicht durchsetzbar oder administrativ nicht handhabbar, nützt nichts. Automatische Stabilisatoren erfüllen die Unabhängigkeit besonders gut, weil sie ohne politische Entscheidung wirken."},"w_mehrebenen":{"t":"Wirtschaftspolitik ist mehrstufig","b":"Kommune, Land, Bund und EU haben jeweils eigene Zuständigkeiten — und diese überlappen. Handelspolitik liegt ausschließlich bei der EU, Arbeitsmarktpolitik beim Bund, Gewerbesteuer bei der Kommune. Konflikte entstehen an den Schnittstellen: nationale Fiskalpolitik gegen EU-Stabilitätspakt, kommunale Wirtschaftsförderung gegen Beihilferecht."},"w_lags":{"t":"Innenlag und Außenlag","b":"Beobachtungs-, Entscheidungs- und Durchführungslag bilden zusammen den <b>Innenlag</b> — die Zeit, die der politische Apparat braucht. Der <b>Außenlag</b> ist die Zeit, bis die durchgeführte Maßnahme wirkt. Bildungspolitik ist das Extrembeispiel: Selbst bei sofortiger Mittelvergabe dauert es Jahre, bis besser ausgebildete Absolventen den Arbeitsmarkt erreichen. Deshalb kann diskretionäre Politik prozyklisch werden."},"w_goldeneregel":{"t":"Tinbergens Zählregel","b":"Für n unabhängige Ziele braucht man mindestens n unabhängige Instrumente. Die Betonung liegt auf <b>unabhängig</b>: Zwei Instrumente, die dasselbe bewirken, zählen als eines. Gibt es weniger Instrumente als Ziele, verwandelt sich die Zielerreichung in ein <b>Optimierungsproblem unter Restriktionen</b> — der Staat muss gewichten, und damit wird die Wahl normativ."},"w_lucas":{"t":"Warum stabile Zusammenhänge zerbrechen","b":"Die Lucas-Kritik greift die <b>Methode</b> an, nicht eine einzelne Maßnahme: Ökonometrische Modelle schätzen Verhaltensparameter aus historischen Daten. Ändert sich das Politikregime, ändern rationale Akteure ihr Verhalten und die Parameter werden wertlos. Die Phillips-Kurve ist der Lehrbuchfall — sie funktionierte, solange niemand versuchte, sie auszunutzen."},"w_kausalitaet":{"t":"Warum Korrelation nicht reicht","b":"Drei Fallen: <b>Confounder</b> (eine Drittvariable treibt beides), <b>umgekehrte Kausalität</b> (das vermeintliche Ergebnis verursacht die Maßnahme) und <b>Selektion</b> (die Teilnahme an der Maßnahme ist nicht zufällig). Für Politikempfehlungen braucht man den <b>kausalen</b> Effekt — deshalb die Methoden der kausalen Identifikation."},"w_did":{"t":"Difference-in-Differences","b":"DiD vergleicht die <b>Veränderung</b> in der Treatmentgruppe mit der <b>Veränderung</b> in der Kontrollgruppe und rechnet damit gemeinsame Trends heraus. Die entscheidende Voraussetzung ist die <b>Parallel-Trends-Annahme</b>: Niveauunterschiede sind erlaubt, unterschiedliche zeitliche Entwicklungen ohne Maßnahme nicht. Sie ist nicht testbar, nur plausibilisierbar — etwa durch Vortrends."},"w_cardkrueger":{"t":"Die empirische Revolution","b":"Card & Krueger nutzten die Staatsgrenze zwischen New Jersey und Pennsylvania als natürliches Experiment und fanden <b>keinen</b> negativen Beschäftigungseffekt des Mindestlohns (DiD-Schätzer +2,76 FTE). Das widerspricht dem einfachen Wettbewerbsmodell, ist aber mit <b>Monopsonie</b> vereinbar: Hat der Arbeitgeber Lohnsetzungsmacht, kann ein Mindestlohn die Beschäftigung sogar erhöhen."},"w_pareto":{"t":"Relation gegen Eigenschaft","b":"Pareto-Superiorität vergleicht <b>zwei</b> Zustände, Pareto-Effizienz bewertet <b>einen</b> Zustand gegen <i>alle</i> Alternativen. Daraus folgt die wichtigste Konsequenz: Pareto liefert nur eine <b>partielle Ordnung</b>. Zwischen (5,5,5) und (3,4,6) lässt sich nicht entscheiden — genau deshalb braucht man Kaldor-Hicks oder eine soziale Wohlfahrtsfunktion."},"w_kaldorhicks":{"t":"Potentielle Pareto-Verbesserung","b":"Kaldor-Hicks macht fast alle realen Maßnahmen vergleichbar, weil es Gewinner und Verlierer zulässt — verlangt aber nur die <b>Möglichkeit</b> der Kompensation, nicht ihre Durchführung. Beispiel Freihandel: aggregiert positiv, die Verlierer werden praktisch selten entschädigt. Hinzu kommt das <b>Scitovsky-Paradox</b>: Beide Richtungen eines Übergangs können Kaldor-Hicks-Verbesserungen sein — das Kriterium liefert keine konsistente Ordnung."},"w_swfaxiome":{"t":"Von den Axiomen zur Funktion","b":"Aus Pareto-Konsistenz und Anonymität folgt (Satz 1), dass sich die SWF als streng monotone Aggregation der individuellen Nutzen schreiben lässt: V*(x) = W(U₁, …, U_n). Der zweite Satz ergänzt: Jeder Maximierer von W ist <b>pareto-effizient</b>. Damit wird aus einem normativen Bewertungssystem ein konsistentes Entscheidungsinstrument."},"w_swftypen":{"t":"Vier Aggregationsregeln","b":"Utilitarismus summiert und ist verteilungsblind. Bergson/Samuelson gewichtet — die Verteilungsfrage steckt in der Wahl der α_i. Nash/Bernoulli multipliziert und ist dadurch <b>implizit ungleichheitsavers</b>: Ein Nutzen nahe null zieht das Produkt gegen null. Rawls betrachtet nur das Minimum. Die Reihenfolge Utilitarismus → Nash → Rawls entspricht steigender Ungleichheitsaversion."},"w_benthamrawls":{"t":"Was hinter den Formeln steckt","b":"Bentham unterstellt, dass Nutzen interpersonell vergleichbar und aufaddierbar ist und dass die Identität des Empfängers normativ irrelevant ist. Rawls misst Gerechtigkeit am Los der Schwächsten. Die Verteilungsimplikationen unterscheiden sich fundamental: Steigt die Nutzensumme, während das Minimum fällt, liegt eine <b>Umverteilung nach oben</b> vor — utilitaristisch gerechtfertigt, rawlsianisch abzulehnen."},"w_arrow":{"t":"Die Unmöglichkeit der perfekten Aggregation","b":"Arrow zeigt: Bei mindestens drei Alternativen gibt es keine Aggregationsregel, die universellen Definitionsbereich, Pareto-Konsistenz, Unabhängigkeit von irrelevanten Alternativen, Transitivität und Nicht-Diktatur gleichzeitig erfüllt. Das Condorcet-Paradox ist ein Spezialfall. Praktische Konsequenz: Jede demokratische Regel muss mindestens eine dieser Anforderungen aufgeben."},"w_hauptsatz1":{"t":"Der Freibrief für den Markt — mit Kleingedrucktem","b":"Jedes Marktgleichgewicht ist pareto-effizient — aber nur unter vier idealisierten Voraussetzungen: vollständiger Wettbewerb, keine Externalitäten, vollständige Information, vollständige Märkte. Der Satz ist deshalb weniger eine Verteidigung des Marktes als eine <b>Checkliste für Eingriffe</b>: Wer eingreifen will, muss zeigen, welche Voraussetzung verletzt ist."},"w_hauptsatz2":{"t":"Effizienz und Verteilung — theoretisch trennbar","b":"Jedes Pareto-Optimum lässt sich als Marktgleichgewicht darstellen, wenn man die Anfangsausstattung geeignet umverteilt. Die Marktwirtschaft ist also nicht an eine bestimmte Verteilung gebunden. Praktisch scheitert die Trennung an den <b>pauschalen Transfers</b>: Sie müssten an unbeobachtbare Fähigkeiten anknüpfen. Reale Steuern knüpfen am Einkommen an und sind damit <b>verzerrend</b> — genau das Informationsproblem, das Mirrlees behandelt."},"w_marktversagentypen":{"t":"Vier Verletzungen, vier Typen","b":"Jeder Typ von Marktversagen verletzt genau eine Voraussetzung des 1. Hauptsatzes: Marktmacht den vollständigen Wettbewerb, externe Effekte die Abgeltung aller Wirkungen über Preise, öffentliche Güter die vollständigen Märkte, Informationsasymmetrien die vollständige Information. Diese Zuordnung ist der Bauplan der gesamten Vorlesung — jedes spätere Politikfeld greift einen Typ heraus."},"w_beseitigenkompensieren":{"t":"An der Ursache oder an den Folgen","b":"Beseitigen heißt, die Verzerrung selbst zu verkleinern — etwa die Informationsasymmetrie durch Offenlegungspflichten. Kompensieren heißt, sie zu akzeptieren und die Folgen abzumildern — etwa durch Versicherungspflicht. Welcher Weg richtig ist, hängt davon ab, ob die Ursache überhaupt und zu welchen Kosten beseitigbar ist. Bei Klimaexternalitäten ist Beseitigen (Vermeidung) und Kompensieren (Anpassung) beides Teil der Politik."},"w_secondbest":{"t":"Warum Teiloptimierung schaden kann","b":"Verzerrungen interagieren. Ist eine First-Best-Bedingung dauerhaft verletzt, verschieben sich die marginalen Nutzen-Kosten-Relationen — eine zweite „Verzerrung“ kann die erste teilweise ausgleichen. Deshalb ist es <b>nicht</b> automatisch gut, alle übrigen Bedingungen so gut wie möglich zu erfüllen. Das Second-Best-Theorem ist die theoretische Warnung vor naiver Einzelfalloptimierung."},"w_moralhazard":{"t":"Verborgene Handlung","b":"Der Prinzipal kann die Handlung des Agenten nicht beobachten oder nicht gerichtlich verifizieren; Verträge können daher nur auf beobachtbare <b>Ergebnisse</b> konditionieren, die statistisch von der Handlung abhängen. Daraus folgt die Notwendigkeit von Anreizverträgen — und der Trade-off zwischen Risikoteilung und Anreizstärke."},"w_adverseselection":{"t":"Der Markt für Zitronen","b":"Bei verborgenen <b>Eigenschaften</b> vor Vertragsschluss kann der Vertrag nicht typgerecht konditioniert werden. Eine Einheitsprämie ist für gute Risiken zu teuer; sie steigen aus, das Kollektiv verschlechtert sich, die Prämie steigt weiter. Diese Spirale kann bis zum <b>Marktzusammenbruch</b> führen — der Grund, warum Sozialversicherungen häufig obligatorisch sind."},"w_screening":{"t":"Selbstselektion über Vertragsmenüs","b":"Statt einer Pooling-Prämie bietet der Versicherer ein Menü an, aus dem sich die Typen selbst zu erkennen geben. Der <b>Selbstbehalt</b> im günstigen Vertrag muss so groß sein, dass Hochrisiken den teuren Vollversicherungsvertrag vorziehen — das ist die Anreizkompatibilitätsbedingung. Die Effizienzkosten trägt der gute Typ: Er ist <b>unterversichert</b>, obwohl er risikoavers ist."},"w_mechanismdesign":{"t":"Regeln, die Wahrheit erzeugen","b":"Das Grundproblem ist Hayeks: Relevante Information ist dezentral verteilt. Ein Mechanismus ist ein Regelwerk aus Strategiemengen und einer Ergebnisfunktion, das so gebaut ist, dass die Akteure im Eigeninteresse das gewünschte Ergebnis herbeiführen. Praktische Anwendungen: Frequenzauktionen (Milgrom & Wilson, Nobelpreis 2020), Schulplatzvergabe und Organspende-Matching (Roth, 2012)."},"w_medianwaehler":{"t":"Konvergenz zur Mitte","b":"Bei eindimensionalem Politikraum, eingipfligen Präferenzen und zwei Parteien ist die Medianposition der Condorcet-Sieger — wer abweicht, verliert. Das erklärt, warum sich Wahlprogramme im Zweiparteienwettbewerb ähneln. Das Modell ist aber fragil: Jede seiner drei Annahmen kann verletzt sein."},"w_mwmgrenzen":{"t":"Wo das Modell zerbricht","b":"Mehrdimensionalität zerstört die Existenz eines Condorcet-Siegers; bei drei oder mehr Parteien wird Differenzierung profitabel und ein reines Nash-Gleichgewicht existiert meist nicht; und ohne Eingipfligkeit entstehen Zyklen. Das Medianwählermodell ist damit ein <b>Referenzfall</b>, kein Naturgesetz — und seine Grenzen sind der Einstieg in Lobbying und Rent-Seeking."},"w_condorcet":{"t":"Individuell transitiv, kollektiv zyklisch","b":"Drei Wählerinnen mit den Ordnungen A≻B≻C, B≻C≻A und C≻A≻B erzeugen paarweise A≻B, B≻C und C≻A. Obwohl jede einzelne Ordnung transitiv ist, ist die kollektive es nicht. Die praktische Konsequenz ist <b>Agenda-Macht</b>: Wer die Reihenfolge der Abstimmungen festlegt, bestimmt das Ergebnis."},"w_plott":{"t":"Wann es doch ein Gleichgewicht gibt","b":"Die Plott-Bedingung verlangt <b>radiale Symmetrie</b> der Idealpunkte um einen Punkt — die Wähler müssen sich paarweise exakt gegenüberliegen. Nur dann existiert im mehrdimensionalen Raum ein Mehrheitsgleichgewicht. Weil das praktisch nie erfüllt ist, gilt: Im mehrdimensionalen Politikraum ist Zyklizität der Normalfall."},"w_rentseeking":{"t":"Rente suchen statt Wert schaffen","b":"Der Unterschied zu Profit-Seeking liegt nicht im Motiv, sondern im <b>Ergebnis</b>: Profit-Seeking erzeugt Wert für andere, Rent-Seeking verschiebt nur bestehende Werte und verbraucht dabei reale Ressourcen. Lobbying, juristische Verfahren und Wahlkampfspenden sind aus gesamtwirtschaftlicher Sicht Verschwendung — auch wenn sie für den Einzelnen rational sind."},"w_rentdissipation":{"t":"Die Rente verbrennt im Wettbewerb","b":"Im Tullock-Contest bestimmt der Ressourceneinsatz x_i die Erfolgswahrscheinlichkeit p_i = x_i/Σx_j. Solange der erwartete Grenznutzen die Grenzkosten übersteigt, wird weiter investiert. Im Gleichgewicht kann ein erheblicher Teil der Rente — im Grenzfall die gesamte — im Wettbewerb aufgezehrt werden. Der gesellschaftliche Verlust ist damit potenziell so groß wie die umkämpfte Rente selbst."},"w_lobbyingempirie":{"t":"Was Lobbying tatsächlich bewirkt","b":"de Figueiredo & Silverman zeigen an US-Universitäten, die für Earmarks lobbyieren, einen messbar positiven Return on Lobbying. Bombardini & Trebbi ordnen die Literatur: Lobbying ist teils <b>informational</b> (Firmen liefern Politikern Fachwissen), teils <b>quid pro quo</b>. Firmen mit höheren politischen Renten lobbyieren mehr, und persistente Beziehungen sind besonders wertvoll."},"w_grossmanhelpman":{"t":"Protection for Sale","b":"Die Regierung maximiert G = a·W(t) + Σ C_i(t) — sie gewichtet Gesamtwohlfahrt und Lobby-Beiträge. Organisierte Branchen bieten Beitragsschemata an, die von der gewählten Politik abhängen, und „kaufen“ damit Schutzzölle. Im Gleichgewicht erhalten <b>organisierte</b> Branchen Schutz. Das Modell erklärt, warum Zölle trotz aggregierter Wohlfahrtsverluste politisch stabil sind."},"w_politikversagen":{"t":"Marktversagen rechtfertigt keinen automatischen Eingriff","b":"Aus Marktversagen folgt nur, dass ein Eingriff <b>prinzipiell</b> wohlfahrtsverbessernd sein könnte. Ob der politische Prozess ihn auch implementiert, ist eine zweite Frage: Medianwähler erzeugen Politik für die Mitte, Lobbying Politik für die Organisierten, Rent-Seeking verbrennt Ressourcen. <b>Politikversagen ist die notwendige Ergänzung zum Marktversagen</b> — und der Grund, warum die Vorlesung beides behandelt."},"w_externalitaeten":{"t":"Die Grenzkostenlücke","b":"Ohne Externalität gilt im Wettbewerb P = GK^priv, und das ist effizient. Mit negativer Externalität sind die sozialen Grenzkosten GK^soz = GK^priv + MES höher, die Akteure rechnen aber nur mit GK^priv. An der Marktmenge gilt daher P &lt; GK^soz: Die letzten produzierten Einheiten kosten die Gesellschaft mehr, als sie ihr nützen — es wird systematisch zu viel produziert."},"w_papierfisch":{"t":"Was Kooperation ändert","b":"In der Marktlösung maximiert Firma 1 nur ihren eigenen Gewinn: p₁ = 2γ₁x₁. In der kooperativen Lösung kommt der Term x₂ hinzu — der <b>marginale Schaden</b> bei der Fischzucht. Weil die kooperative Bedingung strenger ist, gilt x₁^K &lt; x₁^M. Genau diese Differenz ist die Externalität, und genau sie muss eine Pigou-Steuer schließen."},"w_pigousteuer":{"t":"Die Steuer als Preisschild für den Schaden","b":"Mit der Mengensteuer t lautet die BEO p₁ − 2γ₁x₁ − t = 0. Setzt der Staat t* gleich dem externen Schaden in der Effizienzlösung, fällt die private Optimalbedingung mit der kooperativen zusammen — die Firma wählt <b>freiwillig</b> die effiziente Menge. Der Staat muss die Menge also nicht vorschreiben; er muss nur den Schaden korrekt bepreisen. Genau darin liegt auch die Schwäche: Er muss ihn <b>kennen</b>."},"w_coase2":{"t":"Verhandlung statt Staat","b":"Bei klaren Eigentumsrechten, vernachlässigbaren Transaktionskosten und vollständiger Information führt private Verhandlung zum effizienten Ergebnis — <b>unabhängig</b> von der Rechtszuteilung. Hat die Fischzucht das Recht auf sauberes Wasser, zahlt die Papierfabrik für jede Einheit Verschmutzung; hat die Fabrik das Recht, kauft die Fischzucht Reduktionen. Die <b>Menge</b> ist in beiden Fällen dieselbe, nur die Verteilung unterscheidet sich."},"w_coasegrenzen":{"t":"Warum Coase beim Klima versagt","b":"Vier Hindernisse: prohibitive Transaktionskosten, die schiere Zahl der Beteiligten samt Free-Riding auf Verhandlungserfolge, unklare oder nicht durchsetzbare Eigentumsrechte an der Atmosphäre und asymmetrische Information über Schäden. Hinzu kommt die zeitliche Dimension: Ein Teil der Geschädigten ist noch nicht geboren und kann nicht mitverhandeln."},"w_instrumentenvergleich":{"t":"Verhalten, Preis oder Menge","b":"Auflagen steuern <b>Verhalten</b> und sind statisch wie dynamisch ineffizient, weil sie die Vermeidung nicht dorthin lenken, wo sie am billigsten ist. Steuern steuern den <b>Preis</b> und gleichen die Grenzvermeidungskosten an (GVK_i = t), lassen aber die Menge offen — und verlangen Schadensinformation. Zertifikate steuern die <b>Menge</b> punktgenau, erzeugen dafür Preisvolatilität."},"w_ets":{"t":"Cap and Trade in Europa","b":"Seit 2005 das größte System weltweit. ETS 1 erfasst rund 10.000 Anlagen und etwa 40 % der EU-Emissionen; ETS 2 kommt ab 2027 für Gebäude und Verkehr hinzu. Der Cap sinkt jährlich um einen linearen Reduktionsfaktor. Die Anfangsphasen litten unter zu großzügiger <b>freier Zuteilung</b> und einem daraus folgenden Preisverfall — ein Beispiel dafür, dass Mengensteuerung nur so gut ist wie der gesetzte Cap."},"w_weitzman":{"t":"Preis oder Menge unter Unsicherheit","b":"Bei perfekter Information sind Steuer und Zertifikate gleichwertig. Unter Unsicherheit über die Grenzvermeidungskosten entscheidet die <b>relative Steigung</b> von Vermeidungskosten- und Grenzschadenskurve. Ist die Grenzschadenskurve flach, sind Mengenfehler billig und Kostenfehler teuer ⇒ Steuer. Ist sie steil (Schwellenwerte, Kipppunkte), sind Mengenfehler teuer ⇒ Zertifikate."},"w_cbam":{"t":"Carbon Leakage und die Handelsdimension","b":"Führt die EU strenge CO₂-Preise ein und andere Länder nicht, droht Verlagerung der Produktion und ein Wettbewerbsnachteil für heimische Anbieter. CBAM verpflichtet Importeure, Zertifikate zum ETS-Preis zu kaufen, abzüglich bereits gezahlter CO₂-Preise. Die <b>handelspolitische Spannung</b>: Drittländer sehen darin verdeckten Protektionismus, und die WTO-Konformität ist umstritten."},"w_gueterklassen":{"t":"Zwei Eigenschaften, vier Typen","b":"Rivalität und Ausschließbarkeit sind unabhängig voneinander und ergeben kombiniert vier Gütertypen. Wichtig ist, dass beide Eigenschaften <b>technisch und institutionell</b> bestimmt sind, nicht naturgegeben: Verschlüsselung machte aus Rundfunk ein Clubgut, Fangquoten machen aus einem Allmendegut ein bewirtschaftetes Gut. Öffentliche Güter werden <b>unterproduziert</b>, Allmendegüter <b>überkonsumiert</b>."},"w_trittbrett":{"t":"Kollektives Handlungsproblem","b":"Weil das Gut nicht-rival ist, genießt jeder die volle Menge G unabhängig vom eigenen Beitrag. Individuum i vergleicht daher nur den <b>eigenen</b> Grenznutzen mit den Grenzkosten und ignoriert den Nutzen für alle anderen. Das ist eine positive Externalität des eigenen Beitrags — und genau ihre Nicht-Internalisierung erzeugt die systematische Unterversorgung."},"w_samuelson2":{"t":"Vertikal statt horizontal aggregieren","b":"Bei privaten Gütern konsumiert jeder eine andere Menge zum gleichen Preis ⇒ horizontale Aggregation, GZB_i = GK für jeden. Beim öffentlichen Gut konsumieren alle <b>dieselbe</b> Menge ⇒ die gesellschaftliche Zahlungsbereitschaft für eine zusätzliche Einheit ist die <b>Summe</b> der individuellen: Σ GZB_i = GK. Das ist die Samuelson-Bedingung (1954)."},"w_effizientesniveau":{"t":"Das Rechenbeispiel","b":"Die quasi-lineare Nutzenfunktion U_i = x_i + θ_i√G hat konstanten Grenznutzen von x_i, also ist MRS_i = θ_i/(2√G). Samuelson verlangt Σ MRS_i = GK = 1, was auf √G* = (θ_A+θ_B)/2 und damit G* = [(θ_A+θ_B)/2]² führt. Der Vorteil dieser Funktionsform: keine Einkommenseffekte, das effiziente Niveau hängt nur von den θ ab."},"w_nashbeitraege":{"t":"Warum das Nash-Gleichgewicht unterversorgt","b":"Im Nash-Gleichgewicht setzt jeder <b>seine eigene</b> GZB gleich den Grenzkosten, also θ_i/(2√G) = 1. Die Samuelson-Bedingung verlangt aber die <b>Summe</b>. Da nur einer der Summanden berücksichtigt wird, ist G^Nash deutlich kleiner als G*. Ökonomische Ursache: die nicht internalisierte positive Externalität des eigenen Beitrags."},"w_lindahl":{"t":"Personalisierte Preise","b":"Lindahl (1919) schlug vor, jedem seinen eigenen Preis p_i zu berechnen, proportional zur Wertschätzung. Im Lindahl-Gleichgewicht gilt Kostendeckung Σp_i = GK und individuelle Optimalität GZB_i = p_i — zusammen ergibt das genau die Samuelson-Bedingung. Praktisch scheitert es am <b>Präferenzoffenbarungsproblem</b>: Wer weiß, dass ein höherer angegebener Nutzen einen höheren Preis bedeutet, untertreibt systematisch."},"w_privateloesungen":{"t":"Wann private Bereitstellung funktioniert","b":"Freiwillige Beiträge funktionieren bei kleinen Gruppen mit Reputationsmechanismen (Wikipedia, Open Source). Clubgüter funktionieren, wenn technischer Ausschluss möglich ist. Soziale Normen und Sanktionen funktionieren bei überschaubaren, wiederholten Interaktionen. Alle drei Bedingungen fehlen bei großen, anonymen Gruppen — deshalb übernimmt dort der Staat mit Zwangsabgaben."},"w_fehrgaechter":{"t":"Bestrafung stabilisiert Kooperation","b":"Ohne Sanktionsmöglichkeit erodieren die Beiträge im Öffentliche-Güter-Spiel über die Runden gegen null. Mit Bestrafungsmöglichkeit bleiben sie hoch — obwohl das Bestrafen den Bestrafenden selbst etwas kostet und daher „irrational“ ist. Der Befund zeigt: Menschen sind bereit, in Sanktionen zu investieren, und <b>Institutionen mit Sanktionsmacht</b> sind der Schlüssel zur Lösung kollektiver Handlungsprobleme."},"w_globalegueter":{"t":"Wenn die Instanz fehlt","b":"Ein stabiles Klima ist nicht-rival und nicht ausschließbar — über Ländergrenzen hinweg. Auf nationaler Ebene löst der Staat das Trittbrettfahrerproblem durch Zwangsabgaben. International existiert keine Instanz mit vergleichbarer Sanktionsmacht; Abkommen beruhen auf Freiwilligkeit. Lösungsansätze arbeiten deshalb mit <b>Handelsinstrumenten</b> (CBAM), Clubbildung und Reziprozität."},"w_weltmarktpreis":{"t":"MD und XS","b":"Die Importnachfragekurve MD ergibt sich aus dem inländischen Nachfrageüberschuss bei Preisen unterhalb des Autarkiepreises, die Exportangebotskurve XS aus dem ausländischen Angebotsüberschuss oberhalb dessen Autarkiepreises. Der Weltmarktpreis stellt sich dort ein, wo MD(P_W) = XS(P_W). Ein „kleines Land“ ist eines, dessen MD zu klein ist, um P_W zu bewegen — für es ist XS <b>vollkommen elastisch</b>."},"w_zollklein":{"t":"Die vier Flächen","b":"Der Zoll hebt den Inlandspreis auf P_W + t. Die Konsumentenrente sinkt um a+b+c+d; davon gehen a an die Produzenten und c an den Staat. Übrig bleiben die Dreiecke <b>b</b> (Produktionsverzerrung: teurere heimische Produktion ersetzt billigere Importe) und <b>d</b> (Konsumverzerrung: unterbliebener Konsum). Für ein kleines Land ist der Nettoeffekt daher <b>stets negativ</b>."},"w_zollgross":{"t":"Der Terms-of-Trade-Effekt","b":"Ein großes Land senkt mit seinem Zoll die Importnachfrage so stark, dass der Weltmarktpreis fällt: Ein Teil des Zolls wird von den ausländischen Exporteuren getragen. Diese Fläche <b>e</b> ist ein echter Gewinn für das Inland, und ΔW = e − (b+d) kann positiv sein. Der <b>Optimalzoll</b> maximiert die Differenz. Praktische Einschränkungen: Er ist ein <b>beggar-thy-neighbour</b>-Instrument und provoziert Vergeltung — was beide Seiten schlechter stellt."},"w_protektionismusmotive":{"t":"Wie gut sind die Argumente","b":"Das Infant-Industry-Argument setzt zwei Marktversagen voraus: unvollkommene Kapitalmärkte und überlegenes staatliches Wissen darüber, welche Branchen es schaffen werden. Beides ist begründungsbedürftig, und die historische Bilanz gezielter Industrieförderung ist gemischt. Das merkantilistische Argument (Exportüberschüsse als Ziel) verwechselt Mittel und Zweck: <b>Importe sind der Gewinn aus dem Handel</b>, Exporte sind das, was man dafür hergibt."},"w_wto":{"t":"Nichtdiskriminierung, freierer Handel, Vorhersehbarkeit","b":"MFN verhindert bilaterale Diskriminierung zwischen Mitgliedern, Inländerbehandlung verhindert Diskriminierung importierter Güter im Inland. Freierer Handel meint schrittweise Zollsenkung in Verhandlungsrunden. Vorhersehbarkeit entsteht durch <b>gebundene</b> Zollsätze, die nicht einseitig erhöht werden dürfen. Ökonomisch sinnvoll sind alle drei, weil sie das Gefangenendilemma wechselseitiger Zollerhöhungen entschärfen."},"w_rta":{"t":"Integrationsstufen und Ursprungsregeln","b":"Freihandelszone, Zollunion, gemeinsamer Markt, Wirtschafts- und Währungsunion — jede Stufe fügt eine Dimension hinzu. <b>Ursprungsregeln</b> braucht nur die Freihandelszone: Ohne gemeinsamen Außenzoll würde sonst alles über das Mitglied mit dem niedrigsten Außenzoll eingeführt. RTAs verletzen dem Wortlaut nach das MFN-Prinzip; <b>GATT Art. XXIV</b> erlaubt sie als Ausnahme, sofern sie im Wesentlichen den gesamten Handel abdecken."},"w_eukompetenz":{"t":"Ausschließliche Kompetenz","b":"Art. 207 AEUV macht die Handelspolitik zur ausschließlichen EU-Kompetenz: Nur die EU darf handeln, die Mitgliedstaaten nicht. Die Kommission verhandelt auf Mandat des Rates; Rat und Europäisches Parlament müssen zustimmen. Praktische Konsequenz: Deutschland kann keine eigenen Zölle setzen — auch die Reaktion auf US-Zölle liegt bei der Kommission."},"w_amiti":{"t":"Wer trägt die Zolllast","b":"Amiti, Redding und Weinstein zeigen für die US-Zölle von 2018 eine nahezu <b>vollständige Überwälzung</b> auf die US-Importpreise. Ausländische Exporteure senkten ihre Preise praktisch nicht — es gab also keinen Terms-of-Trade-Gewinn. Das ist empirisch bemerkenswert, weil die USA durchaus ein „großes Land“ sind und die Theorie dort einen Preiseffekt erwarten ließe."},"w_chinaschock":{"t":"Konzentrierte Anpassungskosten","b":"Autor, Dorn und Hanson finden für US-Regionen mit hoher Importkonkurrenz aus China dauerhaft niedrigere Beschäftigung und Löhne sowie höhere Transferzahlungen. Die Botschaft ist nicht, dass Handel schadet — aggregiert bleibt er vorteilhaft —, sondern dass die <b>Anpassungskosten regional und personell konzentriert</b> sind. Genau daraus entsteht die politische Ökonomie des Protektionismus."},"w_gvc":{"t":"Zölle treffen die eigenen Produzenten","b":"Etwa 70 % des Welthandels sind Vorleistungen. Ein Zoll auf Zwischenprodukte verteuert damit die Produktionskosten heimischer Unternehmen — der Schutz der einen Branche ist die Belastung der nachgelagerten. Bei fragmentierten Wertschöpfungsketten kann dasselbe Zwischenprodukt mehrfach Grenzen überqueren und mehrfach verzollt werden. Moderne Handelspolitik ist deshalb weit weniger eindeutig als das Lehrbuchmodell mit Endprodukten."},"w_trumpzoelle":{"t":"Zwei Rechtsgrundlagen, zwei Wellen","b":"Section 232 begründet Zölle mit <b>nationaler Sicherheit</b> (Stahl, Aluminium), Section 301 mit <b>unfairen Handelspraktiken</b> (China: Technologietransfer, geistiges Eigentum). Beide erlauben der Exekutive, ohne Kongress zu handeln — das erklärt ihre Attraktivität. Die empirische Bilanz (Amiti et al.; KITE-Simulationen) zeigt Preisanstiege im Inland und geringe Terms-of-Trade-Gewinne."},"w_cofog":{"t":"Wofür der Staat Geld ausgibt","b":"Nach der COFOG-Klassifikation dominiert die <b>soziale Sicherung</b> mit 10–15 % des BIP, gefolgt von Gesundheit (6–9 %) und Bildung (4–6 %). Der langfristige Trend geht von investiven zu konsumtiven und sozialen Ausgaben — was zur Beobachtung passt, dass Transfers heute über die Hälfte der Staatsausgaben ausmachen. Verteidigung liegt bei 1–3 %, das NATO-Ziel bei 2 %."},"w_umverteilungsgruende":{"t":"Drei Begründungen, drei Logiken","b":"Das <b>Versicherungsargument</b> ist ein Effizienzargument: Bei versagenden Privatversicherungsmärkten ist kollektive Absicherung effizient — es knüpft direkt an adverse Selektion aus VL 04 an. Das <b>Rawls-Argument</b> ist normativ: Hinter dem Schleier des Nichtwissens würde man Umverteilung wählen. Das <b>Argument vom öffentlichen Gut</b> sieht Armutsvermeidung selbst als Gut, von dessen Nutzen niemand ausgeschlossen werden kann."},"w_mirrlees":{"t":"Das Informationsproblem des Staates","b":"Eine Kopfsteuer nach Fähigkeit wäre nicht verzerrend, weil sie das Arbeitsangebot unberührt lässt. Fähigkeiten sind aber private Information — beobachtbar ist nur das Einkommen y = w·l. Eine Einkommensteuer trifft damit zwangsläufig auch die <b>Anstrengung</b> und verzerrt. Mirrlees' Beitrag ist, das optimale Steuersystem als <b>anreizkompatibles</b> Mechanismus-Design-Problem zu formulieren."},"w_diamondsaez":{"t":"t* = 1/(1 + a·e)","b":"Eine kleine Erhöhung des Spitzensteuersatzes hat zwei Effekte. <b>Mechanisch</b> steigen die Einnahmen um (z_m − z̄)·N·dt. <b>Verhaltensbedingt</b> schrumpft das steuerpflichtige Einkommen mit der Elastizität e. Am Optimum heben sich beide auf, woraus t* = 1/(1+ae) folgt. Beide Parameter sind empirisch strittig: e hängt stark von Steuervermeidungsmöglichkeiten ab, a von der Form des oberen Verteilungsendes."},"w_ricardo2":{"t":"Barro 1974 und seine Bruchstellen","b":"Rationale Haushalte antizipieren, dass heutige Schulden künftige Steuern bedeuten, und behandeln Staatsanleihen daher nicht als Nettovermögen — sie sparen die künftige Steuerlast an. Die Annahmen sind streng: unendlicher Planungshorizont bzw. Erbmotive, perfekte Kapitalmärkte, pauschale Steuern, keine Unsicherheit, konstante Bevölkerung. Jede Verletzung bricht die Äquivalenz — am wichtigsten sind <b>Kreditbeschränkungen</b> und <b>endliche Lebenszeit</b>."},"w_schuldendynamik2":{"t":"Die Nachhaltigkeitsbedingung","b":"Aus D_{t+1} = (1+r)D_t − X_t und nominalem BIP-Wachstum (1+g)(1+π) folgt näherungsweise Δb ≈ (r − g − π)·b − x. Nachhaltigkeit verlangt <b>x ≥ (r − g − π)·b</b>. Entscheidend ist das Vorzeichen der Zins-Wachstums-Differenz: Bei r &lt; g + π sinkt die Quote von selbst, bei r &gt; g + π braucht es Primärüberschüsse — und zwar umso größere, je höher b bereits ist."},"w_fiskalregeln":{"t":"Bindung gegen Flexibilität","b":"Die Schuldenbremse begrenzt das strukturelle Defizit des Bundes auf 0,35 % des BIP mit symmetrischer Konjunkturkomponente und Notfallklausel; der EU-Stabilitätspakt setzt 3 % Defizit und 60 % Schuldenstand. <b>Pro</b>: Selbstbindung gegen den Defizitbias, Glaubwürdigkeit, niedrigere Risikoprämien. <b>Contra</b>: Prozyklizität, Investitionsbremse und das <b>Messproblem</b> beim strukturellen Defizit — die Konjunkturkomponente wird geschätzt und regelmäßig revidiert."},"w_defizitpolitik":{"t":"Warum Defizite bleiben","b":"Normative Fiskaltheorie erwartet nur kleine, konjunkturbedingte Defizite. Beobachtet werden persistente Schulden. Erklärungen: <b>Kurzsichtigkeit</b> der Wähler (von Weizsäcker 1992), <b>strategische Verschuldung</b> zur Bindung der Nachfolgeregierung und das <b>Common-Pool-Problem</b>, bei dem viele Ressorts auf ein gemeinsames Budget zugreifen und jedes nur einen Bruchteil der Kosten internalisiert."},"w_pillartwo":{"t":"Race to the Bottom und die Gegenmaßnahme","b":"Multinationale verlagern Gewinne über Verrechnungspreise und Lizenzen; jedes Land hat einen unilateralen Anreiz, Sätze zu senken, um mobile Basis anzuziehen. Das Resultat ist ein klassisches Gefangenendilemma: Alle senken, die Allokation ändert sich kaum, alle haben weniger Einnahmen. <b>Pillar Two</b> setzt eine effektive Mindeststeuer von 15 % mit Nachversteuerungsrecht — damit verschwindet der Anreiz zur Verlagerung in Niedrigsteuerländer."},"w_solowsteady":{"t":"Der Steady State","b":"Aus der Bewegungsgleichung k̇ = sAk^α − (δ+n)k folgt im Steady State k* = [sA/(δ+n)]^{1/(1−α)}. Eine höhere Sparquote hebt k* und y* — aber nur das <b>Niveau</b>. Die langfristige Wachstumsrate des Pro-Kopf-Einkommens bleibt ohne technischen Fortschritt <b>null</b>. Das ist dieselbe Aussage wie in Makro Teil 2, hier nur in leicht anderer Notation."},"w_solowtf":{"t":"Effizienzeinheiten und die Rate g","b":"Mit Harrod-neutralem technischem Fortschritt Y = K^α(AL)^{1−α} rechnet man in Effizienzeinheiten k̃ = K/(AL); der Verwässerungsterm wird zu (δ+n+g). Im Steady State ist k̃ konstant, das Pro-Kopf-Einkommen wächst mit <b>g</b> und die Aggregate mit g+n. Nur der technische Fortschritt erzeugt dauerhaftes Pro-Kopf-Wachstum."},"w_solowbewertung":{"t":"Was Solow leistet und was nicht","b":"Stärken: analytische Sparsamkeit, überzeugende Erklärung bedingter Konvergenz über abnehmende Grenzerträge, saubere Trennung von Niveau- und Wachstumseffekten und gute Kalibrierbarkeit mit α ≈ 1/3. Schwächen: Der entscheidende Treiber — technischer Fortschritt — bleibt <b>exogen</b>; die Sparquote ist nicht aus Optimierung hergeleitet; Institutionen, Humankapital und Ungleichheit fehlen ganz."},"w_kuznets":{"t":"Das umgekehrte U — und seine Grenzen","b":"Kuznets (1955) vermutete, dass Ungleichheit im Entwicklungsverlauf erst steigt und dann fällt. Mechanismus: Der Strukturwandel von der Agrar- zur Industriegesellschaft spreizt die Einkommen zunächst, später wirken Bildungsexpansion und Sozialstaat ausgleichend. <b>Empirisch ist die Hypothese heute nicht mehr haltbar</b>: Seit den 1980er Jahren steigt die Ungleichheit in vielen reichen Ländern wieder — der abfallende Ast war offenbar eine historische Episode, kein Gesetz."},"w_globaleungleichheit":{"t":"Zwei Komponenten, gegenläufige Bewegung","b":"Die globale Ungleichheit zerfällt in Unterschiede <b>zwischen</b> Ländern und <b>innerhalb</b> von Ländern. Bis etwa 1990 dominierte die erste Komponente — es kam vor allem darauf an, wo man geboren wurde. Seither ist sie durch das Aufholen Chinas und Indiens stark gesunken, während die Ungleichheit innerhalb vieler Länder gestiegen ist. Der globale Gini ist per saldo gefallen."},"w_elefantenkurve":{"t":"Die Form erklärt die Politik","b":"Trägt man das Einkommenswachstum 1988–2008 gegen die globalen Einkommensperzentile ab, entsteht die Silhouette eines Elefanten: hoher Rücken bei der globalen Mitte (Schwellenländer), abfallender Rüsselansatz bei etwa Perzentil 80–90 (untere Mittelschicht der Industrieländer) und ein steil aufragender Rüssel beim globalen Top 1 %. Die stagnierende Gruppe ist genau jene, aus der sich politischer Widerstand gegen Globalisierung speist."},"w_funktionalpersonell":{"t":"Faktoren gegen Personen","b":"Die funktionale Verteilung fragt, wie sich das Nationaleinkommen auf Kapital und Arbeit aufteilt (Kapitalanteil α). Die personelle fragt, wie es sich auf Individuen verteilt (Gini, Top-Anteile). Beide hängen zusammen, aber die funktionale genügt nicht: Entscheidend ist zusätzlich, <b>wie konzentriert der Kapitalbesitz</b> ist. Ein steigender Kapitalanteil erhöht die personelle Ungleichheit nur, wenn Kapital ungleich verteilt ist — was empirisch der Fall ist."},"w_piketty":{"t":"β = s/g","b":"Die Vermögens-Einkommens-Relation β = W/Y gibt an, wie viele Jahreseinkommen der Vermögensbestand ausmacht — typisch 5–7 in Europa. Im Steady State folgt β = s/g. Weil <b>g gefallen</b> ist (demografisch und produktivitätsseitig), während s relativ stabil blieb, ist β seit den 1970er Jahren gestiegen. Hinzu kommen Bewertungseffekte, vor allem bei Immobilien."},"w_pikettyalpha":{"t":"Warum α nicht automatisch mitsteigt","b":"Aus α = r·β folgt: Steigt β, steigt α nur, wenn r nicht entsprechend fällt. Bei abnehmenden Grenzerträgen fällt r aber, wenn mehr Kapital vorhanden ist. Entscheidend ist die <b>Substitutionselastizität σ</b> zwischen Kapital und Arbeit: Nur bei σ &gt; 1 fällt r langsamer als β steigt, sodass der Kapitalanteil zunimmt. Empirisch ist σ umstritten — Schätzungen liegen häufig nahe oder unter eins, was Pikettys Prognose relativiert."},"w_searchmatching":{"t":"Warum Arbeitslose und offene Stellen koexistieren","b":"Im walrasianischen Markt dürfte es keine Arbeitslosen neben offenen Stellen geben. Das Search-and-Matching-Modell (Diamond, Mortensen, Pissarides — Nobelpreis 2010) erklärt genau das: Suchen kostet Zeit und Ressourcen, die Matching-Funktion M(U, V) erzeugt Treffer aus Arbeitslosen und Vakanzen. Friktionelle Arbeitslosigkeit ist damit kein Marktversagen, sondern die <b>normale Begleiterscheinung</b> eines suchintensiven Marktes."},"w_shapirostiglitz":{"t":"Arbeitslosigkeit als Disziplinierungsinstrument","b":"Weil Arbeitsleistung nicht perfekt beobachtbar ist, muss die Firma Anreize setzen. Ein Lohn über dem markträumenden Niveau macht den Jobverlust teuer und lohnt damit die Anstrengung. Wenn alle Firmen so handeln, entsteht ein Lohn über dem Gleichgewicht — und damit <b>unfreiwillige Arbeitslosigkeit</b>. Die Pointe: Sie ist kein Betriebsunfall, sondern notwendiger Bestandteil des Anreizsystems, denn nur sie macht die Entlassungsdrohung glaubwürdig."},"w_insideroutsider":{"t":"Hysterese","b":"Insider sind durch Einarbeitungskosten, Kündigungsschutz und gewerkschaftliche Vertretung geschützt; Outsider kommen trotz niedrigerer Lohnforderungen nicht hinein. <b>Hysterese</b> bedeutet, dass ein temporärer Schock die Arbeitslosigkeit <b>dauerhaft</b> erhöht: Wer lange draußen ist, verliert Qualifikation und Netzwerk, wird für Firmen unattraktiver und übt keinen Lohndruck mehr aus. Die natürliche Arbeitslosenquote folgt damit der tatsächlichen — was für rasches Gegensteuern in Rezessionen spricht."},"w_mindestlohnkomp":{"t":"Die Lehrbuchvorhersage","b":"Ein bindender Mindestlohn über w* senkt die Nachfrage, erhöht das Angebot und erzeugt ein Überschussangebot — Arbeitslosigkeit plus Wohlfahrtsverlust. Die Vorhersage ist eindeutig, hängt aber vollständig an der Annahme <b>vollkommener Konkurrenz auf dem Arbeitsmarkt</b>. Genau diese Annahme ist empirisch fraglich, und genau daran setzen Monopson-Modell und die Evidenz von Card & Krueger an."},"w_monopson":{"t":"Warum ein Mindestlohn Beschäftigung schaffen kann","b":"Ein Monopsonist muss zur Einstellung eines weiteren Arbeiters den höheren Lohn <b>allen</b> zahlen; seine Grenzkosten der Arbeit liegen daher über dem Lohn. Er beschäftigt zu wenige zu einem zu niedrigen Lohn. Ein Mindestlohn macht die Lohnkurve auf dem relevanten Bereich flach und senkt damit die Grenzkosten — Lohn <b>und</b> Beschäftigung können gleichzeitig steigen. Der Effekt kippt erst, wenn der Mindestlohn über das Wettbewerbsniveau hinausgeht."},"w_bunching":{"t":"Die ganze Verteilung statt des Mittelwerts","b":"Cengiz et al. zählen Jobs entlang der Lohnverteilung vor und nach einer Mindestlohnerhöhung. Unterhalb der neuen Schwelle verschwinden Jobs, knapp darüber entstehen fast genauso viele — die Verteilung wird gestaucht, nicht gekürzt. Der Vorteil der Methode: Sie misst <b>Verdrängung</b> und <b>Aufwertung</b> getrennt und ist robuster als Durchschnittsvergleiche. Ergebnis: kein nennenswerter Beschäftigungsverlust im untersuchten Bereich."},"w_hartz":{"t":"Agenda 2010","b":"Ausgangslage waren über 10 % Arbeitslosigkeit und der Titel „kranker Mann Europas“. Die vier Gesetze reichten von Leiharbeit und Mini-Jobs über den Umbau der Bundesagentur bis zur Zusammenlegung von Arbeitslosen- und Sozialhilfe im ALG II. Empirisch dokumentiert sind ein deutlicher Rückgang der Arbeitslosigkeit und eine höhere Matching-Effizienz — normativ umstritten bleiben die Ausweitung des Niedriglohnsektors und die Verschärfung der Zumutbarkeit."},"w_chetty":{"t":"Nicht jede Verlängerung ist Moral Hazard","b":"Chetty zerlegt die längere Suchdauer bei höherem Arbeitslosengeld in zwei Teile. Der <b>Moral-Hazard-Anteil</b> ist eine echte Verzerrung: Die Suche lohnt sich weniger. Der <b>Liquiditätsanteil</b> ist dagegen wohlfahrtssteigernd: Vermögensbeschränkte Arbeitslose müssten sonst den erstbesten Job annehmen; das ALG erlaubt ihnen, das <b>passendere</b> Match zu finden. Politikschluss: Das optimale ALG ist höher, als die reine Moral-Hazard-Betrachtung nahelegt."},"w_kurzarbeit":{"t":"Beschäftigung erhalten statt neu suchen","b":"Bei temporären Nachfragerückgängen reduziert die Firma die Arbeitszeit, der Arbeitsvertrag bleibt bestehen, die Bundesagentur zahlt 60 % (67 % mit Kindern) des entgangenen Nettoentgelts. Der ökonomische Vorteil: Firmenspezifisches Humankapital und bestehende Matches bleiben erhalten, teure Neusuche entfällt. Die Risiken laut Forschung: <b>Konservierung</b> nicht überlebensfähiger Strukturen und Mitnahmeeffekte bei Firmen, die auch ohne Förderung gehalten hätten."},"w_automatisierung":{"t":"Displacement und Reinstatement","b":"Acemoglu und Restrepo modellieren Automatisierung als Wettlauf zweier Kräfte: Der <b>Displacement-Effekt</b> ersetzt Arbeit in bestehenden Aufgaben, der <b>Reinstatement-Effekt</b> schafft neue Aufgaben. Historisch überwog der zweite — Beschäftigung wurde transformiert, nicht eliminiert. Beobachtet wird zusätzlich <b>Job-Polarisierung</b>: Wachstum bei hoch- und geringqualifizierten Tätigkeiten, Rückgang bei den routineintensiven mittleren."},"w_mariel":{"t":"Ein natürliches Experiment","b":"1980 erlaubte Kuba kurzfristig die Ausreise; binnen Monaten kamen rund 125.000 Menschen nach Miami und erhöhten das dortige Arbeitsangebot um etwa 7 %. Card verglich Miami mit vergleichbaren Städten und fand kaum negative Effekte auf Löhne und Beschäftigung Einheimischer. Erklärungen: Kapitalanpassung, Ausweichen in andere Regionen und komplementäre statt substitutive Qualifikationen. Die Studie ist methodisch prägend, ihre Interpretation aber bis heute umstritten."},"w_marktformen":{"t":"Drei Marktformen, ein Vergleich","b":"Mit p = a − bQ und Grenzkosten c: Im Wettbewerb gilt p = c und Q_W = (a−c)/b. Der Monopolist setzt Grenzerlös gleich Grenzkosten und produziert die <b>halbe</b> Menge zum Preis (a+c)/2. Cournot mit n Firmen liegt dazwischen: Q = n/(n+1)·(a−c)/b — für n = 1 ergibt sich das Monopol, für n → ∞ der Wettbewerb. Die Zahl der Anbieter ist damit direkt das Maß für die Wettbewerbsintensität."},"w_monopolverlust":{"t":"Umverteilung und Deadweight Loss","b":"Der Monopolpreis bewirkt zweierlei: Ein Teil der Konsumentenrente wandert als Produzentenrente zum Anbieter — das ist Umverteilung, kein Effizienzverlust. Zusätzlich unterbleiben alle Transaktionen mit Zahlungsbereitschaft zwischen c und p_M; dieses <b>Harberger-Dreieck</b> kommt niemandem zugute. Für die Konsumenten ist der Schaden deshalb größer als der volkswirtschaftliche Effizienzverlust — was erklärt, warum Wettbewerbspolitik oft am Konsumentenwohl ausgerichtet ist."},"w_saeulen":{"t":"Drei Säulen","b":"Kartellverbot (Art. 101 AEUV) gegen Absprachen, Missbrauchsaufsicht (Art. 102 AEUV) gegen die Ausnutzung marktbeherrschender Stellungen, Fusionskontrolle gegen problematische Marktstrukturveränderungen. Zuständig sind die EU-Kommission (DG COMP) und nationale Behörden wie das Bundeskartellamt. Wichtig ist die Abgrenzung: Wettbewerbspolitik ist <b>nicht</b> Deregulierung — oft ist Regulierung (etwa Entflechtung von Netzen) die Voraussetzung dafür, dass Wettbewerb überhaupt entstehen kann."},"w_kartelle":{"t":"Horizontal und vertikal","b":"Horizontale Absprachen zwischen Wettbewerbern zielen direkt auf die Beseitigung von Wettbewerb; die drei Hardcore-Tatbestände Preisabsprache, Marktaufteilung und Quotenabsprache sind <b>per se</b> verboten. Vertikale Absprachen entlang der Lieferkette werden differenzierter beurteilt, weil sie auch effizienzsteigernd wirken können — etwa gegen doppelte Marginalisierung."},"w_leniency":{"t":"Das Kartell von innen aufbrechen","b":"Kronzeugenregelungen gewähren dem ersten aussagenden Mitglied vollständigen Bußgelderlass. Damit entsteht zwischen den Kartellmitgliedern ein <b>Gefangenendilemma</b>: Jeder fürchtet, ein anderer könnte zuerst gehen. Das destabilisiert das Kartell, ohne dass die Behörde selbst aufwendig ermitteln muss — ein Musterbeispiel dafür, wie Mechanismusgestaltung Informationsprobleme löst."},"w_folktheorem":{"t":"Geduld macht Kartelle stabil","b":"Im einmaligen Spiel ist Abweichen dominant — das Nash-Gleichgewicht ist Wettbewerb, nicht Monopol. Bei wiederholter Interaktion lässt sich das Kartellergebnis stützen, wenn die Spieler hinreichend geduldig sind: Der einmalige Abweichungsgewinn wird durch Bestrafung in allen Folgeperioden überkompensiert. Daraus folgen die Determinanten der Stabilität — wenige Firmen, homogene Produkte, Transparenz, häufige Interaktion, stabile Nachfrage."},"w_fusionskontrolle":{"t":"Warum präventiv","b":"Eine Fusion verändert die Marktstruktur <b>dauerhaft</b> und ist praktisch kaum rückabwickelbar — Unternehmen lassen sich nicht sinnvoll wieder auseinanderdividieren. Deshalb besteht Anmeldepflicht ab bestimmten Umsatzschwellen, und die Prüfung erfolgt <b>vor</b> Vollzug. Der SIEC-Test fragt, ob wirksamer Wettbewerb erheblich behindert würde; die Kommission kann freigeben, mit Auflagen freigeben oder untersagen."},"w_doublemarg":{"t":"Zwei Monopole sind schlimmer als eines","b":"Der Downstream-Monopolist behandelt den Großhandelspreis w als seine Grenzkosten und setzt Q(w) = (a−w)/2b. Der Upstream-Monopolist antizipiert das und wählt w = (a+c)/2. Ergebnis: Q = (a−c)/4b — die <b>halbe</b> integrierte Monopolmenge bei höherem Endpreis. Beide Stufen schlagen unabhängig auf, ohne die Wirkung auf die jeweils andere zu berücksichtigen. Wettbewerbspolitische Folgerung: Eine <b>vertikale Fusion</b> kann hier Preis senken und Wohlfahrt erhöhen — vertikale Zusammenschlüsse sind deshalb weniger problematisch als horizontale."},"w_art102":{"t":"Zwei Stufen, zwei Missbrauchsformen","b":"Erst wird die Marktbeherrschung festgestellt — dafür braucht es eine sachliche und räumliche Marktabgrenzung, dann Marktanteile und Zutrittsschranken. Erst danach wird der Missbrauch geprüft. <b>Ausbeutungsmissbrauch</b> richtet sich gegen die Marktgegenseite, <b>Behinderungsmissbrauch</b> gegen Wettbewerber. Predatory Pricing ist der schwierigste Fall, weil niedrige Preise auch schlicht intensiver Wettbewerb sein können — nachzuweisen sind Verdrängungsabsicht und die Möglichkeit späterer Amortisation."},"w_deloecker":{"t":"Steigende Mark-ups","b":"De Loecker, Eeckhout und Unger schätzen den durchschnittlichen Preisaufschlag US-amerikanischer Firmen und finden einen Anstieg von 21 % (1980) auf 61 % (2016). Das gilt als zentrale Evidenz für zunehmende Marktmacht. Einschränkung: Die Schätzung von Mark-ups aus Bilanzdaten erfordert Annahmen über Produktionsfunktionen und die Abgrenzung variabler Kosten — die Größenordnung ist deshalb methodisch umstritten, die Richtung des Trends weniger."}}};
const byId = Object.fromEntries(D.cards.map(c=>[c.i,c]));
const deckOf = Object.fromEntries(D.decks.map(d=>[d.k,d]));
const box = {};            // Leitner-Box je Karte (1..5), nur in dieser Sitzung
D.cards.forEach(c=>box[c.i]=1);

let S = {screen:'home', deck:null, queue:[], pos:0, shown:false, right:0, wrong:0, q:''};
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- Navigation ---------- */
function go(scr, opts={}){ Object.assign(S,{screen:scr},opts); render(); window.scrollTo(0,0); }

function cardsOf(k){
  if(k==='all') return D.cards.slice();
  if(k==='makro'||k==='wipo') return D.cards.filter(c=>deckOf[c.d].f===k);
  return D.cards.filter(c=>c.d===k);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;
  [a[i],a[j]]=[a[j],a[i]];} return a; }

function startSession(k){
  const cs = cardsOf(k);
  const q = shuffle(cs).sort((x,y)=>box[x.i]-box[y.i]).map(c=>c.i);
  go('study',{deck:k, queue:q, pos:0, shown:false, right:0, wrong:0});
}

function answer(ok){
  const id = S.queue[S.pos];
  if(ok){ box[id]=Math.min(5,box[id]+1); S.right++; }
  else  { box[id]=1; S.wrong++; S.queue.push(id); }
  S.pos++; S.shown=false;
  if(S.pos>=S.queue.length) go('done'); else render();
}

/* ---------- Sheets ---------- */
function openSheet(h){ $('#sheetbody').innerHTML=h; $('#sheet').classList.add('on');
  $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

function sheetSource(c){
  openSheet(`<div class="kicker">Fundstelle</div>
    <h3>Wo das im Material steht</h3>
    <div class="filebox">
      <div class="fl">Dokument</div><div class="fn">${esc(c.s)}</div>
      <div class="fs">${esc(c.sec)}</div>
      ${c.f?`<a class="filelink" href="${esc(c.f)}" target="_blank" rel="noopener">${esc(c.f)} öffnen</a>`:''}
    </div>
    <div class="body">Thema: <b>${esc(c.t)}</b>. Die Makro-Zusammenfassungen sind PDFs mit
    anklickbarem Inhaltsverzeichnis — die Abschnittsnummer führt dort direkt zur Stelle.
    Die Wipo-Karten verweisen auf das Original-Übungsblatt von Dr. Groh.
    <br><br>Der Link oben öffnet die Datei, wenn sie im <b>selben Ordner</b> wie diese
    Seite liegt.</div>
    <button class="closebtn" onclick="closeSheet()">Schließen</button>`);
}
function sheetExpl(c){
  const e = D.expl[c.e];
  if(!e){ openSheet(`<h3>Keine Erklärung hinterlegt</h3>
    <div class="body">Zu dieser Karte gibt es noch keinen Erklärtext.</div>
    <button class="closebtn" onclick="closeSheet()">Schließen</button>`); return; }
  openSheet(`<div class="kicker">Erklärung · ${esc(c.s)}, ${esc(c.sec)}</div>
    <h3>${esc(e.t)}</h3>
    <div class="body">${e.b}</div>
    <button class="closebtn" onclick="closeSheet()">Schließen</button>`);
}

/* ---------- Ansichten ---------- */
function vHome(){
  const grp = f => D.decks.filter(d=>d.f===f).map(d=>{
    const cs=cardsOf(d.k), done=cs.filter(c=>box[c.i]>=3).length;
    const pct=Math.round(done/cs.length*100);
    return `<button class="deck ${f}" onclick="startSession('${d.k}')">
      <div><div class="nm">${d.n}</div><div class="ds">${esc(d.s)}</div></div>
      <div class="meta"><div class="n">${cs.length} Karten</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div></button>`;
  }).join('');
  const nM = cardsOf('makro').length, nW = cardsOf('wipo').length;
  return `<div class="hero">
    <h2>Was sitzt schon,<br>was noch nicht?</h2>
    <p>${D.cards.length} Karten aus elf Makro-Vorlesungen und sieben
    Wipo-Übungsblättern. Jede Karte nennt ihre Fundstelle und hat eine
    ausführliche Erklärung dahinter.</p></div>
    <button class="bigbtn" onclick="startSession('all')">Alles gemischt üben</button>
    <div class="secline">
      <button class="bigbtn ghost" onclick="startSession('makro')">Nur Makro · ${nM}</button>
      <button class="bigbtn ghost" onclick="startSession('wipo')">Nur Wipo · ${nW}</button>
    </div>
    <button class="bigbtn ghost" onclick="go('browse')" style="margin-bottom:4px">
      Karten durchsuchen</button>
    <div class="grouphead"><b>Makroökonomische Theorie</b><span>Clemens</span></div>
    <div class="decks">${grp('makro')}</div>
    <div class="grouphead"><b>Wirtschaftspolitik</b><span>Übungen, Dr. Groh</span></div>
    <div class="decks">${grp('wipo')}</div>
    <div class="note">Der Lernstand gilt für diese Sitzung: Karten, die du „Nochmal“
    setzt, kommen am Ende der Runde erneut. Wird die Seite neu geladen, startet der
    Kasten wieder bei null.</div>`;
}

function vStudy(){
  const c = byId[S.queue[S.pos]];
  const fam = deckOf[c.d].f;
  const front = `<div class="q">${c.q}</div>
    <div class="hint">Antwort im Kopf formulieren, dann aufdecken.</div>`;
  const back = `<div class="q">${c.q}</div><div class="rule"></div>
    <div class="a">${c.a}</div>
    <div class="srcline">Quelle: <b>${esc(c.s)}</b> · ${esc(c.sec)}</div>
    <div class="tools">
      <button class="tool" onclick="sheetExpl(byId[${c.i}])">Erklärung ansehen</button>
      <button class="tool" onclick="sheetSource(byId[${c.i}])">Fundstelle</button>
    </div>`;
  return `<div class="stage">
    <span class="pill ${fam}">${deckOf[c.d].n} · ${esc(c.t)}</span>
    <div class="kcard ${fam}" onclick="${S.shown?'':'S.shown=true;render()'}">
      ${S.shown?back:front}</div></div>`;
}
function footStudy(){
  return S.shown
   ? `<button class="ans again" onclick="answer(false)">Nochmal</button>
      <button class="ans ok" onclick="answer(true)">Gewusst</button>`
   : `<button class="flip" onclick="S.shown=true;render()">Antwort aufdecken</button>`;
}

function vDone(){
  const tot = S.right + S.wrong;
  const pct = tot? Math.round(S.right/tot*100):0;
  return `<div class="done"><div class="big">${pct}%</div>
    <p>${S.right} auf Anhieb gewusst, ${S.wrong} wiederholt — ${S.queue.length} Karten
    insgesamt.</p>
    <button class="bigbtn" onclick="startSession(S.deck)">Runde wiederholen</button>
    <button class="bigbtn ghost" onclick="go('home')">Zur Übersicht</button></div>`;
}

function vBrowse(){
  const q = S.q.trim().toLowerCase();
  const strip = s=>s.replace(/<[^>]+>/g,'');
  const hits = q ? D.cards.filter(c=>
      (strip(c.q)+' '+strip(c.a)+' '+c.t+' '+deckOf[c.d].n).toLowerCase().includes(q))
    : D.cards;
  const list = hits.slice(0,300).map(c=>`<button class="row"
      onclick="sheetCard(${c.i})"><div class="rq">${c.q}</div>
      <div class="rm">${deckOf[c.d].n} · ${esc(c.t)} · ${esc(c.sec)}</div></button>`).join('');
  return `<input class="search" id="sq" placeholder="Suchen: Euler, Okun, Coase, Zoll …"
      value="${esc(S.q)}" oninput="S.q=this.value;renderList()">
    <div id="list">${hits.length?list:'<div class="empty">Nichts gefunden. Andere Begriffe versuchen — die Suche geht über Frage, Antwort und Thema.</div>'}</div>`;
}
function renderList(){
  const q = S.q.trim().toLowerCase();
  const strip = s=>s.replace(/<[^>]+>/g,'');
  const hits = q ? D.cards.filter(c=>
      (strip(c.q)+' '+strip(c.a)+' '+c.t+' '+deckOf[c.d].n).toLowerCase().includes(q))
    : D.cards;
  $('#list').innerHTML = hits.length ? hits.slice(0,300).map(c=>`<button class="row"
      onclick="sheetCard(${c.i})"><div class="rq">${c.q}</div>
      <div class="rm">${deckOf[c.d].n} · ${esc(c.t)} · ${esc(c.sec)}</div></button>`).join('')
    : '<div class="empty">Nichts gefunden. Andere Begriffe versuchen — die Suche geht über Frage, Antwort und Thema.</div>';
  $('#cnt').textContent = hits.length + ' Treffer';
}
function sheetCard(i){
  const c = byId[i];
  openSheet(`<div class="kicker">${deckOf[c.d].n} · ${esc(c.t)}</div>
    <h3>${c.q}</h3><div class="body">${c.a}</div>
    <div class="filebox" style="margin-top:16px">
      <div class="fl">Fundstelle</div><div class="fn">${esc(c.s)}</div>
      <div class="fs">${esc(c.sec)}</div>
      ${c.f?`<a class="filelink" href="${esc(c.f)}" target="_blank" rel="noopener">${esc(c.f)} öffnen</a>`:''}</div>
    ${D.expl[c.e]?`<div class="kicker">Erklärung</div>
      <h3 style="font-size:16.5px">${esc(D.expl[c.e].t)}</h3>
      <div class="body">${D.expl[c.e].b}</div>`:''}
    <button class="closebtn" onclick="closeSheet()">Schließen</button>`);
}

/* ---------- Renderer ---------- */
function render(){
  const v=$('#view'), foot=$('#foot');
  $('#back').style.display = S.screen==='home' ? 'none' : 'grid';
  foot.style.display='none';
  if(S.screen==='home'){
    $('#ttl').innerHTML='Karteikasten<span class="sub">Makroökonomik &amp; Wirtschaftspolitik</span>';
    $('#cnt').textContent=''; v.innerHTML=vHome();
  } else if(S.screen==='study'){
    const c=byId[S.queue[S.pos]];
    $('#ttl').innerHTML=`${esc(deckOf[c.d].n)}<span class="sub">${esc(deckOf[c.d].s)}</span>`;
    $('#cnt').textContent=`${S.pos+1}/${S.queue.length}`;
    v.innerHTML=vStudy(); $('#footin').innerHTML=footStudy(); foot.style.display='block';
  } else if(S.screen==='done'){
    $('#ttl').innerHTML='Runde beendet<span class="sub">Ergebnis dieser Sitzung</span>';
    $('#cnt').textContent=''; v.innerHTML=vDone();
  } else {
    $('#ttl').innerHTML='Karten durchsuchen<span class="sub">Frage, Antwort und Thema</span>';
    v.innerHTML=vBrowse(); renderList();
  }
}
$('#back').onclick = ()=>{ closeSheet(); go(S.screen==='study'||S.screen==='done'?'home':'home'); };
document.addEventListener('keydown',e=>{
  if(S.screen!=='study') return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault(); if(!S.shown){S.shown=true;render();}}
  if(S.shown&&(e.key==='1')) answer(false);
  if(S.shown&&(e.key==='2')) answer(true);
});
render();
</script>
</body></html>
