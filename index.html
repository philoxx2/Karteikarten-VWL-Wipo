schließt Gewöhnung, Sucht und Sättigung über die Perioden hinweg aus — eine starke, aber technisch praktische Annahme, die erst die einfache Euler-Gleichung erlaubt. b = 1/(1+ρ): ρ ist die <b>subjektive Ungeduld</b>, r der <b>objektive Marktpreis</b> der Zukunft."},"e_ies":{"t":"Was σ misst","b":"Wie bereitwillig ein Haushalt Konsum zwischen den Perioden verschiebt. Großes σ: schichtet bei hohem Zins stark um. Kleines σ: will in beiden Perioden ungefähr gleich viel konsumieren, fast egal was der Zins sagt. <b>Vorsicht:</b> In Teil 4 stand σ für den realen Wechselkurs."},"e_euler":{"t":"Die Euler-Gleichung lesen","b":"Eine Indifferenzbedingung am Rand: Links der Nutzenverlust einer heute weniger konsumierten Einheit, rechts der Nutzengewinn morgen (auf 1+r angewachsen, mit U′(C₂) bewertet, mit b diskontiert). Im Optimum gleich — „Grenznutzen = Grenzkosten“, nur über die Zeit gespannt."},"e_zeitpfade":{"t":"Der Konsumpfad in einem Satz","b":"<b>Der Konsum wächst genau dann, wenn der Markt geduldiger belohnt, als der Haushalt ungeduldig ist.</b> Ist r > ρ, zahlt der Markt fürs Warten mehr, als es subjektiv kostet — also wird gespart. Bei r = ρ glättet der Haushalt perfekt. Damit ist die Sparquote endogen — genau die Mikrofundierung, die im Solow-Modell fehlte."},"e_pih":{"t":"Permanent-Income-Hypothese","b":"C₁ = μ·Ω: Der Konsum ist ein konstanter Anteil des <b>Gesamtvermögens</b>, nicht des laufenden Einkommens. Beispiel (Y₁=100, Y₂=110, r=10 %, ρ=5 %, σ=1): μ = 0,512, C₁ = 102,4, C₂ = 107,3. Das Einkommen steigt um 10 %, der Konsum nur um 4,8 % — das ist Konsumglättung."},"e_zinseffekte":{"t":"Drei Effekte, Nettoeffekt unbestimmt","b":"Substitutionseffekt (−): höherer Zins macht Sparen attraktiver. Einkommenseffekt (+): höheres künftiges Einkommen, beide Konsumarten sind normale Güter. Vermögenseffekt (−): der Barwert des Vermögens sinkt. <b>Zwei negativ, einer positiv ⇒ unbestimmt.</b> Strukturell dieselbe Situation wie beim Reallohnanstieg in Teil 3."},"e_randomwalk":{"t":"Random Walk","b":"Ist alles Vorhersehbare eingeplant, ändert sich der Konsum nur bei Überraschungen — die beste Prognose für morgen ist der heutige Konsum (Hall 1978). Überraschende Implikation: Eine <b>angekündigte</b> Steuersenkung wirkt schon bei der Ankündigung; zum Auszahlungszeitpunkt passiert nichts mehr."},"e_kreditrestriktion":{"t":"Wer nicht borgen kann, kann nicht glätten","b":"Die Budgetgerade knickt am Ausstattungspunkt, im Extremfall wird sie senkrecht. Der Konsum folgt dann dem <b>laufenden Einkommen</b> statt dem Vermögen — deshalb steht Y^d in der Konsumfunktion. Zugleich Bruchstelle der Ricardianischen Äquivalenz: Diese Haushalte sind die Zielgruppe konjunktureller Transfers."},"e_akzelerator":{"t":"Warum Investitionen so stark schwanken","b":"I = ν·ΔY^e. Bei ν = 2 und einem BIP-Anstieg von 1.000 auf 1.030 ist I = 60. Fällt die Wachstumserwartung von 3 % auf 1 %, fällt I auf 20 — also um <b>zwei Drittel</b>. Ein moderater Rückgang der Erwartung löst einen dramatischen Investitionseinbruch aus. Empirisch bestätigt: Investitionen schwanken 2,7-mal so stark wie das BIP."},"e_multakz":{"t":"Der Rückkopplungskreis","b":"Akzelerator: mehr erwartetes Wachstum ⇒ mehr Investition. Multiplikator: mehr Investition ⇒ mehr Einkommen ⇒ mehr erwartetes Wachstum. Diese sich selbst verstärkende Schleife kann <b>endogene Konjunkturzyklen</b> erzeugen, ohne dass ein äußerer Schock nötig wäre."},"e_tobinq":{"t":"Tobins q","b":"q > 1 heißt: Der Markt bewertet eine installierte Maschine höher, als sie neu zu kaufen kostet — Investieren ist ein Geschäft. q &lt; 1 heißt: Eine Übernahme wäre günstiger. Der Realzins kommt über den Barwert ins Spiel: Ein höherer Zins drückt den Firmenwert und damit q."},"e_anpassungskosten":{"t":"Die vollständige Investitionsfunktion","b":"I = I(r⁻, q⁺, ΔY⁺) fasst alle drei Erklärungsansätze zusammen: Grenzproduktivitätsbedingung, q-Theorie und Akzelerator. Ohne Anpassungskosten wäre die Investition eine <b>Sprungfunktion</b>; mit ihnen wird sie zu einer glatten, steigenden Funktion von q — erst dadurch wird das Modell empirisch brauchbar."},"e_oeffentlicheGueter":{"t":"Öffentliche Güter","b":"Nichtrivalität und Nichtausschließbarkeit erzeugen zusammen das <b>Trittbrettfahrerproblem</b>. Teil 11 argumentiert schärfer und angebotsseitig: Bei C′ = 0 würde p = C′ eine kostenlose Abgabe erzwingen — selbst wenn man alle zum Zahlen zwingen könnte, käme unter Konkurrenz kein privates Angebot zustande."},"e_haushaltsspielraum":{"t":"95–98 % sind festgelegt","b":"Fast alle Staatsausgaben sind durch Gesetze, Verträge, Personalkosten und Zinsen prädeterminiert. Kurzfristige diskretionäre Konjunktursteuerung über G ist damit praktisch kaum möglich — ein starkes Argument für <b>automatische Stabilisatoren</b> statt aktiver Feinsteuerung."},"e_zusatzlast":{"t":"Die Zusatzlast","b":"Die Steuer treibt einen Keil zwischen Käufer- und Verkäuferpreis; beidseitig vorteilhafte Transaktionen unterbleiben. Dieser Verlust kommt <b>niemandem</b> zugute, auch nicht dem Staat. Mirrlees-Regel: dort besteuern, wo die Reaktion unelastisch ist. Kehrseite: Unelastisch nachgefragt werden vor allem Grundbedürfnisse — Konflikt mit Verteilungszielen."},"e_anreizsteuer":{"t":"Anreizeffekte der Besteuerung","b":"Die Kapitalertragsteuer diskriminiert das Sparen: Das Einkommen ist bereits versteuert, die Zinserträge werden ein zweites Mal besteuert. Sie senkt den Nettozins und verschiebt die Euler-Gleichung Richtung Gegenwartskonsum. Die Kopfsteuer ist umgekehrt maximal effizient (Zusatzlast null) und maximal regressiv — der equity-efficiency-Trade-off in Reinform."},"e_aggregate":{"t":"Die Aggregate und M0","b":"Geschachtelt nach abnehmender Liquidität: M1 ⊂ M2 ⊂ M3. M0 hat eine Sonderrolle — es ist das einzige direkt kontrollierte Aggregat und zugleich die Passivseite der Zentralbankbilanz. Im Euroraum 2019: M0 = 3.249 Mrd. €, M3 = 12.996 Mrd. € — die Differenz ist Giralgeldschöpfung der Banken."},"e_reserven":{"t":"Warum Reserven unverzinslich sind","b":"Weil Reserven keinen Ertrag bringen, halten Banken freiwillig so wenig wie möglich — genau deshalb ist die Mindestreserve bindend und wirksam. Während der Finanzkrise kehrte sich das um: Banken parkten freiwillig riesige Summen in der Einlagenfazilität, obwohl deren Verzinsung gegen null fiel. Aus Misstrauen gegenüber dem Interbankenmarkt."},"e_fristentrafo":{"t":"Fristentransformation","b":"Banken nehmen kurzfristig auf und verleihen langfristig — das ist ihr ökonomischer Beitrag. Die Kehrseite: Wollen alle Einleger gleichzeitig ihr Geld, kann die Bank nicht zahlen, obwohl sie solvent ist. Deshalb braucht es Einlagensicherung und einen Lender of last resort — mit dem bekannten Moral-Hazard-Konflikt."},"e_multiplikator6":{"t":"Die Kaskade","b":"Bei rr = 10 %: 1.000 ⇒ 100 Reserve, 900 Kredit ⇒ 90 Reserve, 810 Kredit … Geometrische Reihe: 1.000 · 1/(1−0,9) = <b>10.000</b>. Davon hat der Bankensektor 9.000 selbst geschöpft. Realistischer mit Bargeldabzug c: m = (1+c)/(c+rr) — bei c = 0,15 nur noch 4,6. Und viele Länder (USA, UK, Kanada, Schweden) haben gar keine Mindestreserve mehr."},"e_refinanzierung":{"t":"Die Kostenreihenfolge","b":"Die Zentralbank ist <b>bewusst</b> die teuerste Quelle — sie soll der letzte Ausweg sein, nicht die erste Wahl. Zugleich setzt sie damit eine Obergrenze für den Interbankenzins: Niemand leiht sich teurer, als er bei der EZB bekäme. Darauf beruht der Zinskorridor."},"e_geldmotive":{"t":"Die Motive der Geldhaltung","b":"Transaktions-, Vorsichts- und Portfoliomotiv, dazu das Spekulationsmotiv als Spezialfall. Letzteres beruht auf dem gegenläufigen Zusammenhang von Zins und Anleihekurs: Wer bei niedrigen Zinsen mit Zinsanstieg rechnet, rechnet mit Kursverlusten — und bleibt lieber liquide."},"e_zinskurs":{"t":"Zins und Anleihekurs","b":"Eine Anleihe zahlt einen festen Kupon. Steigt das Marktzinsniveau, ist der alte Kupon relativ unattraktiv, also fällt der Kurs. Diese Mechanik erklärt sowohl das Spekulationsmotiv als auch den Anpassungsprozess am Geldmarkt: Eine Überschussnachfrage nach Geld <b>ist</b> ein Überschussangebot an Wertpapieren."},"e_geldnachfrage":{"t":"k = k(i) — der entscheidende Fortschritt","b":"In Teil 4 war k konstant. Erst durch die Zinsabhängigkeit bekommt die Geldpolitik einen kurzfristigen Hebel. Und es erklärt zugleich, warum die langfristige Quantitätstheorie in der Praxis wackelt: Wenn k mit i schwankt, ist der Zusammenhang M↔P kurzfristig nicht stabil."},"e_geldmarkt6":{"t":"Kurze vs. lange Frist","b":"In Teil 4 stand auf der vertikalen Achse P, und die Geldmengenerhöhung trieb P nach oben. Hier steht i, und die Geldmengenerhöhung drückt i nach unten. <b>Beides ist richtig</b> — kurzfristig ist P fix und der Zins passt sich an; langfristig ist der Zins real bestimmt und P passt sich an."},"e_geldmarktanpassung":{"t":"Die fünf Schritte","b":"Überschussnachfrage nach Geld ⇒ Verkauf von Wertpapieren oder Kreditaufnahme ⇒ Konkurrenz treibt den Zins ⇒ Überschussangebot am Wertpapiermarkt, Kurse fallen ⇒ neues Gleichgewicht bei höherem Zins. Wer nur „der Zins steigt“ schreibt, hat den Mechanismus nicht gezeigt."},"e_geldpolitikziele":{"t":"Ziele, Mittel, Träger","b":"Die Rangfolge der Ziele ist rechtlich verbindlich (Maastricht-Vertrag), nicht bloß eine Präferenz. Und: Die Zentralbank hat keinen direkten Draht zu Haushalten und Unternehmen — sie setzt Anreize <b>über den Bankensektor</b>. Genau dieser indirekte Weg riss 2008."},"e_inflationsteuerung":{"t":"Inflation ist ein Ergebnis, kein Stellhebel","b":"Die Zentralbank hat kein Instrument namens „Inflation“. Sie setzt Zinsen bzw. Liquidität und hofft auf eine Wirkungskette über Banken, Kredite, Nachfrage und Preise. Daraus folgt, warum <b>Glaubwürdigkeit</b> so zentral ist: Wer nicht direkt steuern kann, muss über Erwartungen wirken."},"e_zinskorridor":{"t":"Der Korridor","b":"Spitzenrefinanzierungsfazilität als Obergrenze, Einlagenfazilität als Untergrenze, Hauptrefinanzierungssatz dazwischen. EONIA und EURIBOR verlaufen zwingend dazwischen, weil keine Bank teurer leiht oder schlechter anlegt als bei der EZB. So steuert die Zentralbank den Marktzins, ohne ihn festzusetzen."},"e_preismenge":{"t":"Preis oder Menge — nicht beides","b":"Der Geldmarkt hat eine Gleichgewichtsbedingung mit zwei Variablen. Grafisch: Mengenpolitik = <b>senkrechte</b> Angebotskurve (Zins ergibt sich), Zinspolitik = <b>waagerechte</b> Angebotskurve (Menge ergibt sich). Die beiden Kurvenformen und die jeweils endogene Größe sollte man sicher zuordnen können."},"e_taylor":{"t":"Die Taylor-Regel und das Taylor-Prinzip","b":"i − ī = a(π−π̄) + b·Y_gap. Typisch ī = 3 %, a = 1,5, b = 0,5. Bei π = 4 %, π̄ = 2 % und +1 % Outputlücke: i = 6,5 %. <b>a > 1 ist notwendig</b>, sonst fällt der Realzins bei steigender Inflation und die Geldpolitik wirkt destabilisierend. Praktisches Problem: π und Ȳ sind in Echtzeit nicht genau bekannt."},"e_zlb":{"t":"Zero Lower Bound und QE","b":"Unter null halten alle lieber Bargeld, das immerhin null bietet — der Zinskanal ist erschöpft. Quantitative Easing kauft stattdessen <b>langfristige</b> Wertpapiere und drückt die langen Zinsen. Wirkungskanäle: Kredit-, Wertpapierpreis-, Vermögens- und langfristiger Zinskanal."},"e_regelbindung":{"t":"Regelbindung statt Diskretion","b":"Wenn alle wissen, dass die Zentralbank eventuell doch Inflation zulässt, erwarten sie genau das — und die Erwartung erzeugt die Inflation. Eine glaubwürdig gebundene Zentralbank erreicht ihr Ziel zu geringeren Kosten. Diese Zeitinkonsistenz-Logik kehrt in Teil 10 wieder."},"e_seignorage":{"t":"Seignorage und die Unabhängigkeit","b":"Geld wird zum Nennwert emittiert, nicht zu Produktionskosten — die Differenz fließt dem Staat zu. Ein Staat mit Zugriff auf die Notenpresse hat deshalb einen dauerhaften Anreiz zur Inflationssteuer, im Extremfall bis zur Hyperinflation. Die Unabhängigkeit der Zentralbank ist der Schutzwall gegen genau diesen Anreiz."},"e_stroemungen":{"t":"Zwei Ansätze, zwei Zeithorizonte","b":"Neoklassisch: Preisflexibilität, Dichotomie, Geldneutralität. Keynesianisch: Preisrigidität, Interdependenz, keine Geldneutralität. <b>Beide sind nicht Gegner, sondern Zeithorizonte:</b> Kurzfristig sind Preise träge, langfristig passen sie sich an. Teil 4 war die lange Frist, Teil 7 die kurze."},"e_preisrigiditaet":{"t":"Die eine Annahme, an der alles hängt","b":"Können Preise nicht reagieren, muss die Menge reagieren — also der Output. Nur deshalb wird die Nachfrage zur unmittelbaren Ursache der Outputschwankungen, und nur deshalb funktionieren Multiplikatoren und wirkt Geld real."},"e_dd":{"t":"Die Güternachfrage DD","b":"DD besteht aus bekannten Bausteinen: der Konsumfunktion und der Investitionsfunktion aus Teil 5 sowie dem realen Wechselkurs aus Teil 4. Entscheidend ist, dass DD auf Y <b>unterproportional</b> reagiert — deshalb ist die Kurve flacher als 45° und es gibt überhaupt einen Schnittpunkt."},"e_nx":{"t":"Warum NX negativ von Y und σ abhängt","b":"Y (−): mehr Einkommen ⇒ mehr Absorption ⇒ mehr Importe. σ (−): reale Aufwertung macht heimische Güter im Ausland teurer und ausländische im Inland billiger — Exporte fallen, Importe steigen. Genau die Wettbewerbsfähigkeitsseite aus Teil 4."},"e_45grad":{"t":"Die 45°-Linie ist eine Hilfslinie","b":"Auf ihr gilt Y^D = Y^S — sie stellt die Gleichgewichtsbedingung geometrisch dar, ist aber keine Verhaltenskurve. DD ist die Verhaltenskurve. Der Schnittpunkt ist der einzige Punkt, an dem Plan und Realität übereinstimmen."},"e_multiplikator7":{"t":"Der Multiplikator als geometrische Reihe","b":"ΔG·[1 + c + c² + …] = ΔG/(1−c). Runde 1: Der Staat gibt 100 aus. Runde 2: Die Empfänger konsumieren 80. Runde 3: 64. Summe bei c = 0,8: <b>500</b>. Multiplikatoreffekte entstehen nur bei Preisrigidität."},"e_sickerverluste":{"t":"Sickerverluste","b":"Der Anteil des Einkommens, der als Steuern, Ersparnis und Importe abfließt — alles, was nicht weiterkonsumiert wird, unterbricht die Kette. Realistischer Multiplikator: 1/(1 − c(1−t) + m). Bei c = 0,8, t = 0,25, m = 0,15 nur noch <b>1,82</b> statt 5."},"e_is":{"t":"Wie die IS-Kurve entsteht","b":"Man variiert den Zins und schaut, wo der neue Schnittpunkt im 45°-Diagramm liegt: höherer Zins ⇒ weniger Investition ⇒ DD nach unten ⇒ niedrigeres Y. Bereichslogik: Oberhalb der IS-Kurve Überschussangebot, unterhalb Überschussnachfrage."},"e_issteigung":{"t":"Was die Steigung enthält","b":"dY/di = (∂I/∂i)/(1−c): im Zähler die Zinsreagibilität, im Nenner der Kehrwert des Multiplikators. Die IS-Kurve ist umso flacher, je zinsreagibler die Investition <b>und</b> je größer der Multiplikator. Beispiel: ∂I/∂i = −10, c = 0,8 ⇒ dY/di = −50; bei c = 0,5 nur −20."},"e_bewegungverschiebung":{"t":"Die häufigste Verwechslung","b":"<b>Endogene</b> Variablen (Y, i) ⇒ Bewegung auf der Kurve. <b>Exogene</b> (G, T, NX, q, Ω, Y*) ⇒ Verschiebung. Ein Zinsanstieg allein verschiebt die IS-Kurve nicht — er ist eine Bewegung darauf."},"e_tr":{"t":"Die TR-Kurve ist eine Reaktionsfunktion","b":"Keine Marktgleichgewichtskurve, sondern die Verhaltensregel der Zentralbank. Steigung 1/b: umso flacher, je aggressiver die Reaktion. Und: Die Volkswirtschaft liegt <b>immer</b> auf der TR-Kurve, weil die Zentralbank die Geldmenge passiv anpasst — es gibt hier kein Ungleichgewicht."},"e_istrgrenzen":{"t":"Was das Modell nicht kann","b":"Das IS-TR-Diagramm beschreibt <b>nicht</b> das allgemeine Gleichgewicht: Arbeitsmarkt, Beschäftigung, Güterproduktion und das endogene Preisniveau fehlen. Es erklärt die Nachfrageseite bei gegebenen Preisen. Die Angebotsseite folgt in Teil 8, die Zusammenführung in Teil 9."},"e_dämpfung":{"t":"Die Zentralbank dämpft den Multiplikator","b":"Beispiel: IS: Y = 1000 − 50i, TR: i = 2 + 0,02(Y−900). Ausgang Y = 900, i = 2 %. Nach einer horizontalen IS-Verschiebung um 50: Y = 925, i = 2,5 %. <b>Der Output steigt nur um 25 statt um 50</b> — die Hälfte des Impulses frisst die Zinsreaktion auf."},"e_schockregel":{"t":"Die Merkregel für Schockaufgaben","b":"Bewegen sich Y und i <b>gleichläufig</b> ⇒ IS hat sich verschoben (man wandert die steigende TR entlang). Bewegen sie sich <b>gegenläufig</b> ⇒ TR hat sich verschoben (man wandert die fallende IS entlang)."},"e_zlbistr":{"t":"Ohnmacht der Zinspolitik","b":"Am ZLB knickt die TR-Kurve ab und verläuft waagerecht bei i = 0. Dort fehlt die dämpfende Zinsreaktion: Ein Nachfrageschock schlägt in voller Multiplikatorhöhe durch — nach oben wie nach unten. Deshalb wird Fiskalpolitik am ZLB relativ wirksamer: Es fehlt das Crowding out über den Zins."},"e_zinsparitaet":{"t":"Die IFM-Kurve","b":"i = i*, waagerecht, weil eine kleine offene Volkswirtschaft Preisnehmer am Weltkapitalmarkt ist. Es gibt damit drei Bedingungen (IS, TR, IFM), aber nur zwei endogene Größen — eine muss weichen, und welche das ist, entscheidet das Wechselkursregime."},"e_festeWK":{"t":"Feste Kurse: Zins gefesselt","b":"Der Wechselkurs ist fixiert, also wird der Zins durch i = i* festgenagelt. Die TR-Kurve wird irrelevant, jede Offenmarktoperation wird durch eine gegenläufige Devisenintervention neutralisiert. Fiskalpolitik wirkt dafür <b>voll</b> — es gibt kein Crowding out über den Zins. Das ist das Trilemma: freier Kapitalverkehr, fester Kurs und autonome Geldpolitik — höchstens zwei davon."},"e_flexibleWK":{"t":"Flexible Kurse: der Wechselkurs passt sich an","b":"Sind P und P* rigide, schlägt jede Änderung von S eins zu eins auf σ durch, und σ verschiebt über NX die IS-Kurve. Geldpolitik wirkt deshalb über den <b>Außenbeitrag</b>. Fiskalpolitik dagegen erzeugt Aufwertung, die den Impuls über NX wieder auffrisst — Crowding out über den Wechselkurs."},"e_flemingmundell":{"t":"Fleming-Mundell in einem Satz","b":"<b>Fest → Fiskalpolitik wirkt. Flexibel → Geldpolitik wirkt.</b> Die Zeilen der Tabelle sind perfekt spiegelbildlich. Beim Auslandszins gilt dieselbe Logik: Bei festen Kursen importiert man den fremden Zins (kontraktiv), bei flexiblen wertet man ab und gewinnt Exporte (expansiv)."},"e_asaufbau":{"t":"Der Bauplan","b":"Phillips-Kurve verbindet π mit U, Okuns Gesetz verbindet U mit Y — zusammen ergibt sich die AS-Kurve (π gegen Y). Formal ist das nur eine Achsenumrechnung mit a = b·h. Aus der fallenden Phillips-Kurve wird dadurch die steigende AS-Kurve."},"e_selbstheilung":{"t":"Der Selbstheilungsmechanismus","b":"Bei Preisflexibilität: P sinkt, der Reallohn steigt, das Überschussangebot am Arbeitsmarkt drückt W, das Angebot kehrt nach A zurück. Zweiter Kanal: sinkende Preise senken σ, das steigert NX und stützt die Nachfrage. <b>Die entscheidende Bedingung ist Preisflexibilität</b> — ohne sie bleibt die Wirtschaft in der keynesianischen Welt hängen."},"e_phillips":{"t":"Der Phillips-Trade-off","b":"Wäre er stabil, könnte die Politik ihn ausnutzen: etwas mehr Inflation gegen dauerhaft weniger Arbeitslosigkeit — man könnte sich einen Punkt auf der Kurve aussuchen. Genau diese Vorstellung prägte die 1960er Jahre und wird von Friedman und Phelps zerlegt."},"e_friedmanphelps":{"t":"Geldillusion","b":"Langfristig können nominale Größen keine realen beeinflussen — es sei denn, Menschen verwechseln nominale mit realen Größen. Der Trade-off funktioniert nur, solange diese Täuschung anhält; sobald die Inflation in die Lohnforderungen eingepreist wird, bleibt nur die höhere Inflation. <b>Die langfristige Phillips-Kurve ist vertikal</b> — Geldneutralität, gezeichnet im π-U-Diagramm."},"e_kurzfristanpassung":{"t":"Warum Output und Beschäftigung gemeinsam schwanken","b":"Unternehmen fahren in der Rezession zuerst Überstunden zurück, dann Kurzarbeit, dann Einstellungsstopps, erst zuletzt Entlassungen. Der Arbeitseinsatz reagiert <b>graduell</b> — deshalb ist der Zusammenhang systematisch, aber nicht eins zu eins (h &lt; 1)."},"e_okun":{"t":"Okuns Gesetz","b":"U − Ū = −h·(Y−Ȳ)/Ȳ. Links Prozentpunkte Arbeitslosigkeit, rechts Prozent Output. h liegt empirisch meist zwischen 0,3 und 0,5. Bei h = 0,5 und 4 % Outputlücke nach unten: +2 Prozentpunkte Arbeitslosigkeit. Wegen h &lt; 1 schlägt eine Outputänderung nur gedämpft durch."},"e_markupP":{"t":"Mark-up auf der Güterpreisseite","b":"P = (1+θ)·WL/Y. Bei vollkommener Konkurrenz wäre θ = 0 und P = Grenzkosten; erst monopolistische Konkurrenz macht Unternehmen zu Preissetzern und erlaubt die Weitergabe von Kostensteigerungen. WL/Y ist die Lohnquote — dieselbe Größe wie in Kaldors Fakt 6."},"e_markupW":{"t":"Warum P^e und nicht P","b":"Tarifverträge werden im Voraus geschlossen, also auf Basis der <b>erwarteten</b> Preise. Genau daraus entsteht die Dynamik — und genau deshalb spielen Inflationserwartungen und die Glaubwürdigkeit der Zentralbank eine so große Rolle."},"e_kampfmarkups":{"t":"Der Kampf der Mark-ups","b":"P = (1+θ)(1+γ)·s̄_L·P^e. Zwei Gruppen beanspruchen gleichzeitig mehr, als verteilbar ist; beide überwälzen. Damit P = P^e gilt, muss (1+θ)(1+γ)s̄_L = 1 sein — bei θ = 0,2 also eine Lohnquote von 83,3 %. Setzen die Gewerkschaften γ = 0,05 durch, entstehen <b>5 % Inflation über den Erwartungen</b>, allein aus dem Verteilungskonflikt."},"e_asformel":{"t":"AS und Phillips sind dieselbe Kurve","b":"π = π̄ + a·Y_gap = π̄ − b·U_gap, mit a = b·h über Okuns Gesetz. Es ist dieselbe Aussage, nur mit gespiegelter horizontaler Achse: Läuft die Wirtschaft heiß, steigt die Inflation über die Kerninflation. Bei b = 0,5 und h = 0,5 ist a = 0,25 — die AS-Kurve ist flacher als die Phillips-Kurve."},"e_angebotsschock":{"t":"Warum Angebotsschocks anders sind","b":"Bei Nachfrageschocks bewegen sich Output und Inflation in dieselbe Richtung — kein Zielkonflikt. Bei Angebotsschocks gegenläufig: Inflation hoch, Output runter. <b>Es gibt keine Politik, die beides repariert</b> — nur eine Entscheidung, welchen Schmerz man vorzieht. Historisch: 1973/74, 1979/80, 2022."},"e_kurzlang":{"t":"Kurzfristig geneigt, langfristig senkrecht","b":"Der Trade-off existiert nur, solange die Erwartungen der Realität hinterherhinken. Sind sie angepasst, bleibt nur die natürliche Arbeitslosenquote bzw. das Trend-BIP — und die Inflation ist reine Zugabe."},"e_anpassung8":{"t":"Der Anpassungsprozess","b":"1) Nachfrageimpuls treibt Y über Ȳ, man wandert die AS-Kurve hinauf. 2) Die höhere Inflation wandert in die Erwartungen, die Kerninflation steigt, AS verschiebt sich nach oben. 3) Man wandert die AD-Kurve zurück bis Y = Ȳ. <b>Der Outputgewinn war temporär, der Inflationsanstieg ist permanent.</b>"},"e_allgemeinesGG":{"t":"Der Schlussstein","b":"Im Schnittpunkt von AS und AD sind Arbeitsmarkt, Gütermarkt sowie Geld- und Devisenmarkt <b>simultan</b> im Gleichgewicht. Teil 7 konnte das ausdrücklich nicht, weil Arbeitsmarkt, Produktion und Preisniveau fehlten — genau diese drei liefert die AS-Kurve aus Teil 8."},"e_festeAD":{"t":"AD bei festen Kursen","b":"Höhere Inflation ⇒ σ steigt (bei festem S) ⇒ Wettbewerbsfähigkeit sinkt ⇒ PLB fällt ⇒ IS nach links ⇒ Output sinkt. Die AD-Kurve fällt also über den <b>realen Wechselkurs</b>, nicht über den Zins — der ist an i* gefesselt. Verschoben wird sie durch G, T, q, Ω, Y* und i*."},"e_langfristbed":{"t":"Die drei Bedingungen","b":"Y = Ȳ (keine Outputlücke), π = π̄ (Erwartungen eingeholt), π̄ = π* (keine Inflationsdifferenz zum Ausland). Fehlt eine davon, ist die Wirtschaft unterwegs, nicht im Ruhezustand. Die LAD-Kurve markiert zusätzlich die erfüllte Kaufkraftparität."},"e_fiskalfest":{"t":"Fiskalpolitik bei festen Kursen","b":"Kurzfristig voll wirksam (kein Crowding out über den Zins), langfristig aber wirkungslos — aus zwei Gründen: Erwartungsanpassung (AS wandert nach oben) und staatliche Budgetrestriktion (AD wandert zurück). Auf dem Weg kann es zur <b>Stagflation</b> kommen: Y &lt; Ȳ bei π > π*."},"e_neutralerZins":{"t":"ī = r̄ + π̄","b":"Bisher war ī ein gegebener Parameter der Taylor-Regel, jetzt wird er erklärt: Den Realzins r̄ bestimmt die reale Seite (im Solow-Modell das Grenzprodukt des Kapitals), das Inflationsziel π̄ wählt die Zentralbank. Bei r̄ = 1 % und π̄ = 2 % ist ī = 3 %. Weicht π̄ vom Ausland ab, gleicht der Wechselkurs die Differenz aus."},"e_fisher9":{"t":"Warum π^e","b":"Verträge werden im Voraus geschlossen: Wer heute einen Kredit aufnimmt, kennt die künftige Inflation nicht und kalkuliert mit seiner Erwartung. Nur ex post lässt sich der realisierte Realzins mit der tatsächlichen Inflation berechnen. Das ist die präzisere Fassung gegenüber Teil 4."},"e_flexAD":{"t":"AD bei flexiblen Kursen","b":"Höhere Inflation ⇒ Taylor-Regel verlangt höheren Zins ⇒ i > i* ⇒ Kapitalimporte ⇒ Aufwertung ⇒ IS nach links ⇒ Output sinkt. Der Weg läuft über die <b>Zentralbank</b>. Verschoben wird AD deshalb nur durch π̄, a, b und i* — IS-Verschiebungen sind wegen der Wechselkursanpassung endogen."},"e_geldflex":{"t":"Geldneutralität in AS-AD-Sprache","b":"Eine geldpolitische Lockerung hebt kurzfristig Y und π. Dann holen die Erwartungen auf, AS verschiebt sich nach oben, Y kehrt zu Ȳ zurück — aber bei dauerhaft höherer Inflation (LAD springt auf ein neues Niveau). Langfristig verändert Geldpolitik nur die Inflationsrate."},"e_dreiFristen":{"t":"Die drei Fristen","b":"<b>Kurz:</b> Preisrigidität, Mundell-Fleming, Multiplikatoreffekte (Teil 7). <b>Mittel:</b> Erwartungen (forward- und backward-looking) verschieben AS, der reale Wechselkurs stellt Kaufkraftparität her (Teile 8/9). <b>Lang:</b> Dichotomie, Geldneutralität, Y_gap = 0, σ = 1, i = i* (Teile 2/4). Der Motor des Übergangs sind Erwartungsanpassung und Wechselkursanpassung."},"e_politikdilemma":{"t":"Das Dilemma","b":"Nachfrage stützen ⇒ noch höhere Inflation. Inflation bekämpfen ⇒ Outputrückgang und mehr Arbeitslosigkeit. <b>Inflation ist der Preis der Outputstabilisierung, Output der Preis der Inflationsbekämpfung.</b> Nur bei Angebotsschocks gibt es dieses Dilemma."},"e_asadbewertung":{"t":"Die Bilanz","b":"Bei flexiblen Kursen ist die <b>langfristige Inflationsrate eine politische Entscheidung</b> der Zentralbank — das rechtfertigt ein veröffentlichtes Inflationsziel. Feste Kurse verlangen gleichartige Politikstrategien, daher Koordinationsbedarf in der EU. Gegen Angebotsschocks hilft nur angebotsorientierte Politik."},"e_positionen":{"t":"Der Streit in einer Größe","b":"Beide Seiten sind sich einig, dass die Wirtschaft langfristig zum Trend zurückkehrt. Umstritten ist nur, <b>wie lange das dauert</b>. Dauert es Monate, ist Eingreifen schädlich; dauert es Jahre, ist Nichtstun teuer. Das ist eine empirische Frage — deshalb sammelt das Kapitel so viel Empirie."},"e_backwardlooking":{"t":"Institutionelle Trägheit","b":"Das keynesianische Argument beruft sich nicht auf Irrationalität, sondern darauf, dass Verträge zeitlich gebunden sind: Tarifverträge laufen zwei Jahre, Mietverträge länger. Selbst wenn alle die Inflation korrekt vorhersehen, <b>können</b> sie ihre Preise nicht sofort anpassen. Rationale Erwartungen und träge Preise sind vereinbar — genau das ist der DSGE-Ansatz."},"e_preissignal":{"t":"Die Informationsfunktion der Preise","b":"Steigt der Preis meines Produkts um 8 %, weiß ich bei allgemeiner Inflation nicht, ob meine Kunden mehr wollen (echtes Signal) oder ob einfach alles teurer wird (Rauschen). Fehlentscheidungen sind die Folge — <b>nominale Fluktuationen bekommen reale Effekte</b>. Je höher und variabler die Inflation, desto schlechter das Signal."},"e_deflation":{"t":"Warum Deflation gefährlich ist","b":"Der Kaufaufschub ist selbstverstärkend: weniger Nachfrage ⇒ fallende Preise ⇒ noch mehr Aufschub. Der Schuldnereffekt kehrt sich um: Schulden <b>wachsen</b> real (Debt Deflation). Und am ZLB ist die Geldpolitik wehrlos. Deshalb liegt das Inflationsziel bei knapp 2 % und nicht bei null."},"e_konjunktur":{"t":"Was Konjunktur ist — und was nicht","b":"„Nicht durch individuelle Ereignisse ausgelöst“ ist der Kern: Ein einzelner Firmenzusammenbruch ist keine Konjunktur. Gemeint ist ein <b>systematisches, wiederkehrendes Muster</b>, das die gesamte Volkswirtschaft erfasst. Genau das ist erklärungsbedürftig — warum bewegen sich so viele unabhängige Akteure gleichzeitig?"},"e_rezession":{"t":"Rezessionsdefinitionen","b":"Rezessionen sind nicht objektiv beobachtbar, sondern müssen definiert werden. Die Faustregel „zwei Quartale negatives Wachstum“ ist nur eine Näherung — CEPR und NBER betonen zusätzlich die <b>Breite</b> des Rückgangs über viele Indikatoren. Der „R-Word Index“ des Economist zählt halb scherzhaft Zeitungserwähnungen."},"e_frisch":{"t":"Das Schaukelpferd","b":"Die Schocks sind reines Rauschen ohne jedes Muster, trotzdem entsteht ein regelmäßiger Zyklus — weil das System <b>träge</b> ist und jeder Schock nachwirkt. Frischs Bild: Ein Schaukelpferd, das man unregelmäßig anstößt, schwingt im eigenen Rhythmus. Zyklen entstehen bei a² &lt; 4b; ohne fortlaufende Schocks würde die Schwingung auslaufen."},"e_volatilitaet":{"t":"Die Volatilitätstabelle","b":"Relativ zum BIP: Investitionen 2,71, Konsum 0,96, Löhne 0,56. Das bestätigt PIH und Akzelerator aus Teil 5 empirisch. Und die Autokorrelationen verraten die Zykluslänge: Der Nulldurchgang liegt bei etwa Lag 5, also eine Viertelperiode ⇒ volle Periode rund 20 Quartale = <b>5 Jahre</b>."},"e_rbc":{"t":"RBC und DSGE","b":"Sind Konjunkturschwankungen die optimale Reaktion rationaler Akteure, sind sie kein Problem, sondern die effiziente Antwort — jeder Eingriff schadet. Beispiel: Sinkt die Produktivität vorübergehend, ist es rational, weniger zu arbeiten. <b>DSGE ist die Synthese</b>: Optimierungsrahmen der RBC plus keynesianische Friktionen — und weil diese echte Ineffizienzen sind, gibt es wieder Politikspielraum."},"e_stilisiertekonj":{"t":"Die stilisierten Fakten","b":"Zyklen treten mit 5–8 Jahren wiederholt, aber irregulär auf. Fakt 4 (Investitionen volatiler, Konsum glatter) ist Teil 5. Fakt 5 (Staatsnachfrage mit 4 Quartalen Lag) ist die Time-lag-Problematik. Fakt 7 (Arbeitslosigkeit antizyklisch) ist Okuns Gesetz. Fakt 10 (TFP prozyklisch) ist das Solow-Residuum — und das Hauptargument der RBC-Theorie."},"e_timelags":{"t":"Warum aus antizyklisch prozyklisch wird","b":"Erkennung, Entscheidung, Durchführung und Wirkung summieren sich leicht auf ein bis zwei Jahre. Beträgt der Zyklus 5 Jahre, liegt zwischen Tief und Hoch gut zwei Jahre. <b>Eine in der Rezession beschlossene Expansion trifft dann den Aufschwung</b> — sie heizt an, statt zu stabilisieren. Kein Argument gegen gute Absichten, sondern gegen Machbarkeit."},"e_lucas":{"t":"Die Lucas-Kritik","b":"Sie greift nicht eine Maßnahme an, sondern die <b>Methode</b>: Ökonometrische Modelle schätzen Verhaltensparameter aus historischen Daten. Ändert sich das Politikregime, ändern rationale Akteure ihr Verhalten — die Parameter werden wertlos. Beispiel: Wer gelernt hat, dass Steuersenkungen später gegenfinanziert werden, spart den Betrag. Das ist Ricardo, als Lucas-Kritik formuliert."},"e_zeitinkonsistenz":{"t":"Zeitinkonsistenz und Selbstbindung","b":"Das Patentbeispiel: Vorher ist das Monopol sinnvoll (ohne Aussicht auf Gewinne forscht niemand), nachher schädlich (die Erfindung existiert schon). Wenn Forscher das vorhersehen, forschen sie gar nicht erst. <b>Die Ankündigung muss glaubwürdig sein</b> — deshalb unabhängige Zentralbanken, Schuldenbremsen und gesetzlich fixierte Patentlaufzeiten."},"e_proStabil":{"t":"Die Gegenargumente","b":"Frühindikatoren kontern die Erkennungsverzögerung. Kreditrestriktionen greifen Teil 5 auf: Wer nicht borgen kann, kann nicht glätten — genau diese Haushalte sind die Zielgruppe konjunktureller Transfers. Und „Selbstheilung dauert zu lange“ ist ein politisches, aber ernstzunehmendes Argument."},"e_autostabil":{"t":"Automatische Stabilisatoren","b":"Sie <b>umgehen sämtliche Time-lags</b>: Niemand muss erkennen, entscheiden oder durchführen. In der Rezession brechen Einkommen- und Mehrwertsteuer ein, die Ausgaben für ALG steigen, das Defizit wächst automatisch. Die progressive Einkommensteuer wirkt besonders stark — die positive Kehrseite der kalten Progression."},"e_politoekonomie":{"t":"Politische Ökonomie","b":"Wenn man Haushalte und Unternehmen als Nutzenmaximierer modelliert, ist es inkonsistent, Politiker als selbstlose Wohlfahrtsmaximierer anzunehmen. Politische Konjunkturzyklen sind ein Sonderfall der Zeitinkonsistenz: Vor der Wahl ist Expansion optimal, nach der Wahl Konsolidierung. Die Lösung ist wieder Selbstbindung durch Institutionen."},"e_oeffGut11":{"t":"Das Grenzkostenargument","b":"Meist wird Marktversagen mit dem Trittbrettfahrerproblem begründet; die Folie argumentiert schärfer und angebotsseitig: Ein zusätzlicher Nutzer verursacht keine Kosten (C′ = 0), ein Anbieter im Wettbewerb setzt p = C′ und müsste das Gut <b>verschenken</b> — die Fixkosten wären nicht gedeckt. Selbst mit Zahlungszwang käme kein privates Angebot zustande."},"e_verteilung":{"t":"Primär- und Sekundärverteilung","b":"Die Differenz der beiden Gini-Koeffizienten misst exakt, was der Sozialstaat leistet. Ungleichheit ist nicht per se schlecht — sie trägt Anreizfunktion. Rawls (Maximin) und Bergson-Samuelson (gewichtete Summe) stehen für zwei Enden der normativen Skala."},"e_defizit":{"t":"Defizit und Schuldendienst","b":"ΔB = (G−T) + rB. Der Schuldendienst rB ist heute nicht mehr beeinflussbar, das Primärdefizit ist die laufende Politikentscheidung. Stabilisierung der absoluten Schuld verlangt T − G = rB: im laufenden Betrieb genau so viel mehr einnehmen, wie die Zinsen kosten."},"e_schuldendynamik":{"t":"Die wichtigste Formel des Kapitels","b":"Δ(B/Y) = (G−T)/Y + (r − g_Y)(B/Y). Der zweite Term ist der Motor: Bei r > g_Y steigt die Quote <b>von selbst</b> (Schneeball), bei r &lt; g_Y sinkt sie von selbst. Beispiel B/Y = 60 %, ausgeglichenes Primärbudget, r = 3 %, g = 1 % ⇒ +1,2 Prozentpunkte pro Jahr. Nötiger Primärüberschuss zur Stabilisierung: 1,2 % des BIP — bei B/Y = 150 % schon 3,0 %."},"e_wege":{"t":"Die fünf Wege im Ranking","b":"Weg 1 (Defizitreduktion) ist der ehrliche, aber teuerste. Weg 2 (Wachstum) ist der beste, aber nicht frei wählbar. Wege 3 und 5 (Monetisierung, Repudiation) sind verdeckte bzw. offene Enteignungen und zerstören die Glaubwürdigkeit. Weg 4 (Vermögensverkauf) ist ein Buchungstrick — die Nettovermögensposition ändert sich nicht."},"e_angebotspolitik":{"t":"Warum es keinen Trade-off gibt","b":"Nachfragepolitik verschiebt AD entlang einer gegebenen AS-Kurve — mehr Output nur gegen mehr Inflation, langfristig bleibt nur die Inflation. Angebotspolitik verschiebt die <b>LAS-Kurve selbst</b>: Output steigt dauerhaft, und weil das Angebot wächst, entsteht kein Inflationsdruck. Der Preis ist Zeit — Wirkungen erst nach Jahren."},"e_marktversagen11":{"t":"Der vollkommene Markt als Maßstab","b":"Er ist kein Ideal, sondern ein Maßstab: Nur wo eines seiner fünf Merkmale verletzt ist, gibt es eine ökonomische Rechtfertigung für staatliches Eingreifen. Das ist eine Bringschuld für die Politik. Bemerkenswert: Externalitäten werden auf <b>fehlende Eigentumsrechte</b> zurückgeführt — die Coase-Perspektive, die auch das Allmende-Problem trägt."},"e_massnahmen11":{"t":"Angebotspolitik ist Wachstumspolitik","b":"Humankapital, Rechtssystem, Institutionen — das sind genau die Faktoren mit den höchsten Korrelationen in der Wachstumsempirie aus Teil 2 (Schuljahre +0,871, Rule of Law +0,606, Korruption −0,759). Kehrseite beim Steuerwettbewerb: Aus Sicht aller Länder ein Nullsummenspiel mit Verlusten."},"e_laffer":{"t":"Die Laffer-Kurve","b":"Bei τ = 0 % und τ = 100 % ist das Aufkommen null, dazwischen liegt ein Maximum. Rechts davon wäre eine Steuersenkung selbstfinanzierend — das Kernargument der Reagan-Politik. <b>Die entscheidende Einschränkung:</b> Die Kurve beweist die Existenz eines Maximums, nicht seine Nähe. Empirisch operieren die meisten Länder links davon."},"e_ampolitik":{"t":"Arbeitsmarktpolitik zielt auf Ū","b":"Matching verbessern erhöht f und senkt u^f = s/(s+f). Anreizstrukturen betreffen den Reservationslohn. Qualifikation adressiert den Mismatch (Faktor acht zwischen ohne Ausbildung und akademisch). Frauenpartizipation und Mobilität erhöhen das effektive Angebot. Alle fünf zielen auf die natürliche Arbeitslosenquote."},"e_aktivpassiv":{"t":"Aktiv vs. passiv","b":"Aktive Maßnahmen verändern die Beschäftigungsfähigkeit und zielen auf Ū; passive sichern das Einkommen. Dänemark und Frankreich geben beide rund 3 % des BIP aus — Dänemark hälftig aktiv/passiv, Frankreich fast nur passiv. Ergebnis: 1,2 % gegenüber 3,9 % Langzeitarbeitslose. Das ist das dänische „Flexicurity“-Modell."},"e_grenzsteuersatz":{"t":"Der 100-%-Grenzsteuersatz","b":"Wird jeder verdiente Euro voll angerechnet, verläuft die Budgetgerade waagerecht: Mehr Arbeit bringt keinen zusätzlichen Konsum. Da Freizeit Nutzen stiftet, wählt der Haushalt rational maximale Freizeit — kein Faulheitsproblem, sondern Optimalverhalten. Anrechnungsregelungen lösen es, aber: <b>zielgenau, anreizfreundlich und günstig geht nicht gleichzeitig.</b>"},"e_allmende":{"t":"Allmende vs. öffentliches Gut","b":"Öffentliches Gut: nichtrival ⇒ <b>unterproduziert</b>. Allmendegut: rival, aber nicht ausschließbar ⇒ <b>überkonsumiert</b>. Beim Allmendegut trägt jeder den vollen Nutzen seines Verbrauchs, aber nur einen Bruchteil der Kosten — individuell rational, kollektiv katastrophal."},"e_klima":{"t":"Warum der letzte Punkt alles entscheidet","b":"Die üblichen Lösungen — Eigentumsrechte (Coase), Besteuerung (Pigou), Kontingentierung (Emissionshandel) — setzen eine <b>durchsetzungsfähige Instanz</b> voraus. National ist das der Staat, international gibt es sie nicht. Der intergenerationelle Konflikt ist zudem ein Diskontierungsproblem: die Zeitpräferenzrate ρ auf gesellschaftlicher Ebene."},"e_zusammen11":{"t":"Das Programm in vier Sätzen","b":"Punkt 2 sagt <b>wann</b> der Staat eingreifen darf (nur bei Marktversagen), Punkt 3 <b>wobei</b> (nur bei nicht marktfähigen Gütern), Punkt 4 <b>wie</b> (mit wenig verzerrender Besteuerung), Punkt 1 <b>warum</b> es sich lohnt (kein Trade-off). Das ist die ordnungspolitische Antwort auf die Frage, die Teil 10 offengelassen hat."},"e_w_multiplikator":{"t":"Multiplikator und Konjunkturwelle","b":"Y(t) = [I(t)+Ḡ]/(1−c). Mit I(t) = Ī + α·sin(πt) schwankt der Output um Ȳ mit der Amplitude α/(1−c). Der Multiplikator verstärkt also nicht nur den Impuls, sondern auch die <b>Schwankung</b>. Bei α = 50 und c = 0,75 beträgt die Amplitude 200."},"e_w_lags":{"t":"Die Lags und die Friedman-Kritik","b":"Entscheidungslag, Implementierungslag und Außenlag summieren sich. Wird der Abschwung bei t = 3 erkannt und betragen die Lags ½ + ¼ + ¼, wirkt die Maßnahme erst ab t = 4 — dann, wenn der Zyklus schon dreht. <b>Aus antizyklischer wird prozyklische Politik.</b> Dieselbe Argumentation wie in Makro Teil 10, Abschnitt 6.1."},"e_w_autostabil":{"t":"Der automatische Stabilisator","b":"C(t) = cY(t) + β(Ȳ − Y(t)). Der zweite Term wirkt <b>gegenläufig</b>: Im Abschwung (Y &lt; Ȳ) stützt er den Konsum, im Aufschwung dämpft er. Der Vorteil gegenüber diskretionärer Politik ist, dass er ohne jeden Time-lag wirkt. Er dämpft die Amplitude, eliminiert den Zyklus aber nicht."},"e_w_tinbergen":{"t":"Tinbergen-Regel und Zuordnung","b":"Für n unabhängige Ziele braucht man n unabhängige Instrumente. Die Vektorschreibweise macht das sichtbar: Sind die Instrumentenvektoren linear abhängig, ist das Zielsystem nicht erreichbar. Die „goldene Regel“ (Mundell) ergänzt: Jedes Instrument sollte dem Ziel zugeordnet werden, auf das es den relativ stärksten Einfluss hat."},"e_w_verlustfunktion":{"t":"Die staatliche Verlustfunktion","b":"L = U²/2 + θB²/2 — quadratische Verluste bedeuten, dass große Abweichungen überproportional schwer wiegen. Die Indifferenzkurven sind Ellipsen; θ misst, wie stark Schulden relativ zu Arbeitslosigkeit gewichtet werden. Minimiert wird unter der aus dem Modell abgeleiteten Trade-off-Beziehung zwischen U und B."},"e_w_did":{"t":"Difference-in-Differences","b":"Der Effekt ist die Differenz der Veränderungen: (nachher−vorher in der Treatmentgruppe) minus (nachher−vorher in der Kontrollgruppe). Damit werden <b>gemeinsame Trends</b> herausgerechnet. Im Verkehrsbeispiel: ΔA = +2, ΔB = +3 ⇒ DID = −1, also relativ erfolgreich trotz absolut gestiegener Unfallzahlen. Kernannahme: parallele Trends ohne Maßnahme."},"e_w_pareto":{"t":"Pareto-Effizienz","b":"Effizient heißt: Niemand kann besser gestellt werden, ohne einen anderen schlechter zu stellen. Superior heißt: niemand schlechter, mindestens einer besser. Pareto liefert nur eine <b>partielle</b> Ordnung — zwischen B (2;3) und C (4;1) lässt sich nicht entscheiden. Genau deshalb braucht man soziale Wohlfahrtsfunktionen."},"e_w_nutzengrenze":{"t":"Nutzenmöglichkeitengrenze","b":"Aus U_i = x_i^α folgt U₁^{1/α} + U₂^{1/α} = x̄ — für α &lt; 1 konkav. Bei Altruismus (U₁ = x₁^α x₂^{1−α}) profitiert jeder vom Konsum des anderen; für α = ½ sind beide Nutzenfunktionen identisch, und die Pareto-Grenze schrumpft auf einen einzigen Punkt."},"e_w_kaldor":{"t":"Kaldor-Kompensationskriterium","b":"Eine Maßnahme ist zu befürworten, wenn die Gewinner die Verlierer <b>hypothetisch</b> kompensieren könnten. Im Marktöffnungsbeispiel: 0,02·(−50) + 0,98·(+1,5) = +0,47 > 0 ⇒ befürworten. Die Schwäche des Kriteriums: Die Kompensation muss nicht tatsächlich erfolgen — die Verlierer bleiben Verlierer."},"e_w_lobbying":{"t":"Konzentrierte Kosten, gestreute Nutzen","b":"Die 2 % Verlierer haben je 50 zu verlieren und sind gut organisierbar; die 98 % Gewinner haben je 1,5 zu gewinnen und kaum Anreiz, aktiv zu werden. Deshalb scheitern gesamtwirtschaftlich vorteilhafte Reformen oft politisch. Dasselbe Muster erklärt Agrarsubventionen und Protektionismus."},"e_w_swf":{"t":"Soziale Wohlfahrtsfunktionen","b":"Rawls: W = min{V_i} — nur der Schlechtestgestellte zählt (Maximin), maximale Ungleichheitsaversion. Bergson/Samuelson: W = Σα_i V_i — gewichtete Summe; mit α_i = 1 wird daraus die utilitaristische SWF. Das Pareto-Axiom verlangt <b>strikt positive</b> Gewichte, sonst kann eine Person besser gestellt werden, ohne dass W steigt."},"e_w_swfrechnung":{"t":"Utilitaristisch vs. Rawls im Zahlenbeispiel","b":"U₁=10x₁, U₂=5x₂, U₃=9x₃. Verteilung A (0;2;8): 0+10+72 = 82. Verteilung B (4;3;3): 40+15+27 = 82. Utilitaristisch <b>Gleichstand</b>. Rawls: min(A) = 0 gegen min(B) = 15 ⇒ B strikt besser. Die utilitaristische SWF ist verteilungsblind — sie zählt nur die Summe."},"e_w_versicherung":{"t":"Warum Versicherung Nutzen stiftet","b":"Nur bei konkaver Nutzenfunktion (U(Y) = √Y) ist der Nutzen des sicheren Erwartungswerts größer als der Erwartungswert des Nutzens. Bei fairer, gruppenspezifischer Prämie wählen risikoaverse Personen deshalb <b>vollständige</b> Deckung. Ein risikoneutraler Akteur wäre indifferent."},"e_w_adverseselektion":{"t":"Adverse Selektion","b":"Sind die Gruppen nicht unterscheidbar, gibt es nur eine Einheitsprämie auf Basis des Durchschnittsrisikos. Für gute Risiken ist sie zu teuer, sie steigen aus; das verbleibende Kollektiv wird schlechter, die Prämie steigt weiter — im Extremfall bricht der Markt zusammen. Instrumente: <b>Versicherungspflicht</b>, Screening über Selbstbehalte, Signaling. Abgrenzung: Adverse Selektion betrifft verborgene <b>Eigenschaften</b>, Moral Hazard verborgene <b>Handlungen</b>."},"e_w_condorcet":{"t":"Condorcet und zyklische Mehrheiten","b":"Ein Condorcet-Sieger schlägt jede Alternative im paarweisen Vergleich — er muss aber nicht existieren. Beim Condorcet-Paradoxon gilt A≻B, B≻C, C≻A: Das Ergebnis hängt dann allein von der <b>Abstimmungsreihenfolge</b> ab, also von der Agenda-Kontrolle."},"e_w_eingipflig":{"t":"Eingipfligkeit","b":"Präferenzen sind eingipflig, wenn sich die Alternativen so anordnen lassen, dass der Nutzen vom Gipfel aus in beide Richtungen monoton fällt. Existiert eine solche Anordnung, gibt es einen Condorcet-Sieger — nämlich die Position des Medianwählers. Findet man keine Permutation, sind zyklische Mehrheiten möglich."},"e_w_median":{"t":"Medianwähler-Theorem","b":"Bei eindimensionalem Politikraum und eingipfligen Präferenzen setzt sich die Position des Medianwählers durch. Konsequenz: Parteien haben einen starken Anreiz, zur Mitte zu konvergieren — das erklärt, warum sich Wahlprogramme oft ähneln. Derselbe Gedanke taucht in Makro Teil 10 auf."},"e_w_arrow":{"t":"Arrow-Unmöglichkeitstheorem","b":"Es gibt keine kollektive Entscheidungsregel, die gleichzeitig unbeschränkten Definitionsbereich, Pareto-Prinzip, Unabhängigkeit von irrelevanten Alternativen und Nicht-Diktatur erfüllt. Die Aggregation individueller zu kollektiven Präferenzen ist damit grundsätzlich problematisch — das Condorcet-Paradoxon ist ein Spezialfall."},"e_w_lnverteilung":{"t":"Logarithmischer Nutzen und Gleichverteilung","b":"ln x ist streng konkav ⇒ abnehmender Grenznutzen. Bei identischen Nutzenfunktionen ist die Gleichverteilung utilitaristisch optimal: A (10;10;10) schlägt B und C. Rawls kommt hier zum selben Ergebnis. Beachte bei C, dass die Güter nicht voll ausgeschöpft werden — Verschwendung ist nie effizient."},"e_w_coase":{"t":"Coase-Theorem","b":"Bei klaren Eigentumsrechten und vernachlässigbaren Transaktionskosten führt Verhandlung zum <b>effizienten</b> Ergebnis, unabhängig von der Rechtszuteilung. Die Zuteilung beeinflusst nur die <b>Verteilung</b> (über die Drohpunkte), nicht die Allokation. Beim CO₂-Problem scheitert das an der Zahl der Beteiligten, an undefinierten Eigentumsrechten an der Atmosphäre und an fehlender internationaler Durchsetzbarkeit."},"e_w_nash":{"t":"Nash-Verhandlungslösung","b":"Maximiert wird das Nash-Produkt (βG−G₁⁰)^α((1−β)G−G₂⁰)^{1−α}. Praktisch: erst logarithmieren, dann nach β ableiten. Die <b>Drohpunkte</b> G_i⁰ hängen von der Rechtszuteilung ab — deshalb ändert sich die Gewinnaufteilung, nicht aber die effiziente Produktionsmenge."},"e_w_pigou":{"t":"Pigou-Steuer","b":"Der Markt setzt PGK = p, sozial optimal wäre SGK = PGK + EGK = p. Die Pigou-Steuer schließt genau diese Lücke: t = EGK(x*). Rechenbeispiel: PGK = 3x+2, EGK = 2x, p = −x+14 ⇒ Markt x_M = 3, Optimum x* = 2, Steuer t = 4. Die Externalität wird internalisiert."},"e_w_zertifikate":{"t":"Zertifikate und Grenzvermeidungskosten","b":"Kostenminimal wird ein Vermeidungsziel erreicht, wenn die <b>Grenzvermeidungskosten aller Unternehmen gleich</b> sind. Der Zertifikatsmarkt stellt das automatisch her: Wer billiger vermeidet, vermeidet mehr und verkauft Zertifikate. Unterschied zur Steuer: Bei der Steuer steht der Preis fest und die Menge ist unsicher, bei Zertifikaten umgekehrt."},"e_w_oeffGut":{"t":"Öffentliche Güter und Trittbrettfahren","b":"Nichtrivalität und Nichtausschließbarkeit erzeugen zusammen das Trittbrettfahrerproblem. Dezentral wäre eine effiziente Lösung über bindende Absprachen denkbar, scheitert aber an Transaktionskosten und der Zahl der Beteiligten — deshalb übernimmt der Staat und finanziert über Zwangsabgaben."},"e_w_reaktionskurve":{"t":"Reaktionskurven im Bereitstellungsspiel","b":"g₁*(g₂) ist die optimale Wahl von Person 1 bei gegebenem g₂ — typischerweise <b>fallend</b>: Der Beitrag des anderen wird teilweise verdrängt (crowding out privater Beiträge). Der Schnittpunkt beider Kurven ist das Nash-Gleichgewicht; je nach Präferenzen und Ausstattungen kann es innen liegen oder auf dem Rand (nur einer trägt bei)."},"e_w_samuelson":{"t":"Samuelson-Bedingung","b":"Σ_i MRS_i = MRT. Weil alle <b>dieselbe</b> Menge konsumieren, werden die Zahlungsbereitschaften <b>vertikal</b> aggregiert (bei privaten Gütern horizontal). Im Nash-Gleichgewicht berücksichtigt jeder nur seine eigene MRS ⇒ Σ MRS > MRT ⇒ <b>Unterversorgung</b>. Das ist die formale Fassung des Trittbrettfahrerproblems."},"e_w_praeferenzoffenbarung":{"t":"Präferenzoffenbarung","b":"Individuen haben einen Anreiz, ihre wahre Zahlungsbereitschaft zu verschweigen: untertreiben, wenn die eigene Zahlung davon abhängt; übertreiben, wenn nicht. Deshalb kann der Staat die effiziente Menge nicht einfach abfragen — anreizkompatible Mechanismen sind aufwendig und selten praktikabel."},"e_w_zoll":{"t":"Die vier Flächen der Zollanalyse","b":"Konsumentenrentenverlust = a+b+c+d. Davon gehen a an die Produzenten und c an den Staat als Zolleinnahmen; b und d sind <b>Nettowohlfahrtsverlust</b> (Produktions- und Konsumverzerrung). Bei einem kleinen Land bleibt der Weltmarktpreis unverändert — der Nettoeffekt ist immer negativ."},"e_w_zollrechnung":{"t":"Die Zollrechnung im Beispiel","b":"A = 15p−30, N = −10p+520, p_W = 10, t = 2. Vorher: A = 120, N = 420, Import 300. Nachher (p = 12): A = 150, N = 400, Import 250. Produzentengewinn 270, Zolleinnahmen 500, Konsumentenverlust 820 ⇒ <b>Netto −50</b>. Die Stärke des Mengeneffekts hängt von den Elastizitäten ab."},"e_w_grossesland":{"t":"Großes Land und Optimalzoll","b":"Ein großes Land drückt mit dem Zoll den Weltmarktpreis und verbessert seine <b>Terms of Trade</b>. Dieser Gewinn kann die Dreiecksverluste überkompensieren — daher die Optimalzolltheorie. Der Gewinn geht allerdings zulasten der Handelspartner und lädt zu Vergeltung ein."},"e_w_umverteilung":{"t":"Das Umverteilungsmodell","b":"U_i = α ln c_i + (1−α) ln(ℓ̄_i − ℓ_i) mit c_i = (1−t)wℓ_i + T. Unterschiede in ℓ̄_i lassen sich als Produktivität, Gesundheit oder verfügbare Zeit deuten. Aus der FOC folgt ℓ_i* = α ℓ̄_i − (1−α)T/[(1−t)w]: <b>Sowohl höhere Transfers als auch höhere Steuersätze senken das Arbeitsangebot.</b>"},"e_w_laffer":{"t":"Die Laffer-Kurve im Umverteilungsmodell","b":"T = t·w·(1/n)Σℓ_i*(t,T) — T steht auf beiden Seiten, die Gleichung ist simultan zu lösen. Ergebnis ist die Laffer-Kurve: erst steigend (Satzeffekt), dann fallend (Mengeneffekt über das schrumpfende Arbeitsangebot). Wichtig: Das <b>Aufkommensmaximum</b> ist nicht der sozial optimale Satz — dieser liegt darunter, weil die Zusatzlast mitgewichtet wird."},"e_x_aggregateempirie":{"t":"Was die Aggregate-Tabelle zeigt","b":"Drei Beobachtungen: Erstens wachsen die Aggregate deutlich mit der Nummer — im Euroraum von 3.249 Mrd. € (M0) auf 12.996 Mrd. € (M3), also etwa Faktor vier. Diese Differenz ist das, was der Bankensektor an Giralgeld schöpft. Zweitens sind die Länderunterschiede erheblich (M3 von 68,9 % des BIP in Polen bis 131,0 % in Großbritannien) — unterschiedliche Finanzstrukturen und Zahlungsgewohnheiten. Drittens ist der Bargeldanteil überall klein: <b>Der ganz überwiegende Teil des Geldes ist Buchgeld.</b>"},"e_x_bankbilanz":{"t":"Der bilanztechnische Ansatz","b":"Die Geldbasis M0 ist nichts anderes als die <b>Passivseite der Zentralbankbilanz</b> — Bargeldumlauf plus Einlagen von Geschäftsbanken. Dass Bargeld eine Verbindlichkeit ist, überrascht zunächst, ist aber konsequent: Es ist ein Zahlungsversprechen der Zentralbank. Dieselbe Logik beim Bankkonto: aus Sicht der Bank eine Verbindlichkeit, aus Sicht des Kunden ein Guthaben — und genau deshalb kann Buchgeld durch Kreditvergabe neu geschaffen werden."},"e_x_hoheit":{"t":"Geld als öffentliches Gut","b":"Stabiles Geld ist <b>nichtrival</b> (mein Vertrauen in die Währung schmälert deins nicht) und <b>nicht ausschließbar</b> — genau die beiden Kriterien für ein öffentliches Gut. Deshalb liefert der Markt Geldwertstabilität nicht von selbst, und deshalb ist Geldemission hoheitlich. Zugleich gilt der Trade-off zwischen Liquidität und Ertrag: Geld ist unmittelbar fällig, aber unverzinslich; sein Realzins beträgt −π."},"e_x_reservevergleich":{"t":"Die Mindestreserve ist heute kaum noch Instrument","b":"USA, Großbritannien, Kanada, Schweden, Dänemark, Australien und Neuseeland haben <b>gar keine</b> Mindestreserve mehr; im Euroraum liegt der Satz bei 1 %. Das relativiert den Geldschöpfungsmultiplikator erheblich: Er bleibt ein wichtiges Lehrbuchmodell zum Verständnis der Giralgeldschöpfung, ist als aktives geldpolitisches Instrument aber weitgehend bedeutungslos. Gesteuert wird über den <b>Zins</b>."},"e_x_finanzkrise":{"t":"Wenn die Transmission reißt","b":"Zwischen 2008 und 2011 explodierte die Einlagenfazilität von nahe null auf über 600.000 Mio. €, während ihre Verzinsung von 3,25 % auf unter 0,5 % fiel. Die Banken verzichteten also <b>bewusst auf Ertrag</b>, weil sie einander misstrauten. Die EZB pumpte Liquidität ins System, aber sie kam nicht in der Realwirtschaft an — sie floss direkt zurück. Genau das führte zu den unkonventionellen Instrumenten."},"e_x_preisstabilitaet":{"t":"Preisstabilität als vorrangiges Ziel","b":"Der Maastricht-Vertrag macht die Rangfolge rechtlich verbindlich: „Es ist das vorrangige Ziel des ESZB, die Preisstabilität zu gewährleisten.“ Der Gouverneursrat definiert sie als HVPI-Anstieg von unter 2 %. Entscheidend ist der Zusatz: Die Zentralbank kann die Inflationsrate <b>nicht direkt beeinflussen</b> — sie entsteht aus dem Zusammenspiel von realer Geldnachfrage und nominaler Geldversorgung."},"e_x_hyperinflation":{"t":"Das Tempo, nicht die Zahl","b":"Jede Zeile der Tabelle ist ungefähr eine Verzehnfachung. Interessant ist der <b>Abstand</b>: Die erste Verzehnfachung brauchte 2.009 Tage (gut fünfeinhalb Jahre), die letzte nur noch 17 Tage. Der Prozess beschleunigt sich dramatisch selbst. Insgesamt entwertete sich die Mark um den Faktor 10¹² — eine Billion. Das ist die historische Erfahrung, aus der die deutsche und später die europäische Stabilitätsorientierung erwächst."},"e_x_gewinnerverlierer":{"t":"Wer gewinnt, wer verliert","b":"Bemerkenswert ist, dass der Staat auf beiden Seiten auftaucht: als Gewinner über Wertsteuern und kalte Progression, der Steuerzahler als Verlierer. Kalte Progression heißt: Bei 5 % Inflation und 5 % Lohnerhöhung ist man real gleich gestellt, rutscht aber in einen höheren Steuersatz und zahlt <b>real mehr</b>. Am Ende steht: <b>Geld verliert seine Funktionen</b> — erst die Wertaufbewahrung, dann die Recheneinheit, zuletzt das Tauschmittel."},"e_x_interbank":{"t":"Laufzeit und Besicherung","b":"Eonia = über Nacht, unbesichert. Euribor = längere Frist, unbesichert. Eurepo = besichert gegen Staatspapiere. Je unbesicherter und je länger, desto höher der Satz — der Aufschlag ist die <b>Risikoprämie</b>. Deshalb sind Spreads Stressindikatoren: Der Abstand zwischen Euribor und Eurepo misst genau, wie viel Misstrauen zwischen den Banken herrscht."},"e_x_offenmarkt":{"t":"Offenmarktgeschäfte und der Korridor","b":"Geschäftsbanken erzielen auf dem Geldmarkt für ihre Überschussreserven bessere Erträge als auf Zentralbankkonten. Gehandelt werden Kredite mit sehr kurzer Laufzeit (ein Tag bis zwei Wochen, fortwährender rollover), meist gegen Wertpapiere als Sicherheit. Die Kreditvergabe wirkt <b>expansiv</b>; die Liquiditätsknappheit bestimmt den Zins, den die Zentralbank über die Fazilitäten in einen Korridor zwingt."},"e_x_wirkungskanaele":{"t":"Die Kanäle — und wo sie reißen","b":"Der Zinskanal wirkt über die kurzfristigen Geldmarktsätze, der Kreditkanal über Marktliquidität und Reservehaltung. Am <b>Zero Lower Bound</b> ist der Zinskanal erschöpft, weil Bargeld immerhin null bietet. Quantitative Easing wechselt dann vom Preis- zurück zum Mengeninstrument, allerdings an einer anderen Stelle der Zinsstrukturkurve: bei den <b>langfristigen</b> Zinsen."},"e_x_grundsaetze":{"t":"Warum Selbstbindung besser ist","b":"Diskretionär hieße: Die Zentralbank entscheidet in jeder Situation neu. Regelgebunden heißt: Sie bindet sich vorab an ein Ziel. Der Grund für die Bindung: Wenn alle wissen, dass die Zentralbank eventuell doch Inflation zulässt (etwa um Beschäftigung zu stützen), <b>erwarten</b> sie genau das — und die Erwartung erzeugt die Inflation. Diese Zeitinkonsistenz-Logik verbindet das Kapitel mit Teil 10."},"e_x_bankenaufsicht":{"t":"Der Moral-Hazard-Konflikt der Aufsicht","b":"Einlagensicherung und Lender of last resort verhindern Bank Runs — nehmen Banken und Einlegern aber zugleich den Anreiz, auf Risiken zu achten. Wer weiß, dass er gerettet wird, geht größere Risiken ein. Die Antwort sind <b>Kapitaldeckungsregeln</b>: Wer riskanter agiert, muss mehr Eigenkapital vorhalten und haftet damit selbst zuerst. Derselbe Anreizgedanke wie beim Effizienzlohn in Teil 3."},"e_x_trendzyklus":{"t":"Trend und Zyklus","b":"Die Zerlegung BIP = Trend + Zyklus ordnet die ganze Vorlesung: Teil 2 (Solow) erklärt den Trend über Kapital, Arbeit und technischen Fortschritt; Teil 7 erklärt die Abweichungen davon. Die Log-Darstellung hat denselben Grund wie in Teil 2: Im Logarithmus sind Abweichungen direkt als <b>prozentuale</b> Abweichungen lesbar. Diese Trendabweichung ist genau die Outputlücke der Taylor-Regel."},"e_x_gleichgewichtdef":{"t":"Gleichgewicht als Ruhezustand","b":"Die Definition betont zwei Dinge: den <b>markträumenden Preis</b> und den <b>Ruhezustand ohne divergente Kräfte</b>. Genau deshalb ist Preisrigidität so folgenreich — kann der Preis nicht räumen, bleibt der Markt im Ungleichgewicht, und stattdessen passt sich die Menge an."},"e_x_interdependenz":{"t":"Das Schaubild ist die Gliederung","b":"Der Kreis Gütermarkt ↔ Geldmarkt ergibt das <b>IS-TR-Modell</b>. Kommt der Devisenmarkt dazu (Zins bestimmt Wechselkurs, Wechselkurs bestimmt Güternachfrage), entsteht das <b>Fleming-Mundell-Modell</b>. Interdependenz statt Dichotomie ist die keynesianische Gegenposition zur klassischen Trennung von realer und monetärer Sphäre."},"e_x_endogenexogen":{"t":"Endogen oder exogen — die praktische Konsequenz","b":"Die Unterscheidung entscheidet in jeder Aufgabe darüber, ob man sich <b>auf</b> einer Kurve bewegt oder sie <b>verschiebt</b>. Endogen sind Konsum, verfügbares Einkommen, Investition, Zins und Preisniveau; exogen sind Staatsausgaben und Exporte. Ein Zinsanstieg allein verschiebt die IS-Kurve also nicht."},"e_x_ristgleichi":{"t":"Warum r = i zulässig ist","b":"Aus der Fisher-Gleichung r = i − π folgt bei π = 0 unmittelbar r = i. Weil die Preise in diesem Kapitel ohnehin rigide sind, ist die Vereinfachung konsistent — man muss nur eine Zinsvariable mitführen. In Teil 9 wird sie wieder aufgehoben, dort steht i = r̄ + π̄."},"e_x_isflach":{"t":"Wovon die Steigung abhängt","b":"dY/di = (∂I/∂i)/(1−c). Die IS-Kurve verläuft umso <b>flacher</b>, je größer die Zunahme des Outputs sein muss, um nach einer Zinsänderung das Gütermarktgleichgewicht wiederherzustellen — also je zinsreagibler die Nachfrage und je größer der Multiplikator. Der Multiplikator ist wiederum umso größer, je steiler die Ausgabenkurve im 45°-Diagramm verläuft, das heißt je geringer die Sickerverluste."},"e_x_trverschieben":{"t":"Die fünf Strategieparameter","b":"a, b, ī, π̄ und Ȳ bestimmen die geldpolitische Strategie und damit die Lage der TR-Kurve. Wichtig ist der Zusatz: Die Volkswirtschaft befindet sich <b>definitionsgemäß immer auf</b> der TR-Kurve, weil die Zentralbank die Geldmenge passiv an den gesetzten Zins anpasst. Anders als bei der IS-Kurve gibt es hier keine Bereiche mit Überschussangebot oder -nachfrage."},"e_x_kleineoffene":{"t":"Groß heißt geschlossen","b":"Die USA haben 24,4 % des Weltbruttos, aber nur 13,8 % Außenhandelsquote; Belgien 0,6 % des Weltbruttos, aber 82,7 %. Große Länder handeln viel mit sich selbst. Noch dramatischer ist die Finanzmarktoffenheit: Die Niederlande halten Forderungen von <b>1.096 % des BIP</b>. Für das Modell heißt das: Die Annahme der kleinen offenen Volkswirtschaft passt auf Deutschland, nicht auf die USA."},"e_x_regime":{"t":"Die drei Regime","b":"Flexibel: freie Kursbildung, keine Intervention. Fest: festgeschriebene Relation, Interventionspflicht mit Währungsreserven. Eingeschränktes Floating: freies Schwanken zwischen Ober- und Untergrenze, Interventionspflicht erst beim Durchbruch. Die Wahl des Regimes entscheidet darüber, welche der drei Bedingungen (IS, TR, IFM) weichen muss."},"e_x_reserven7":{"t":"Interventionsmechanik","b":"Bei Überschussangebot der eigenen Währung kauft die Zentralbank sie auf und gibt dafür Devisen her — die Reserven sinken. Bei Überschussnachfrage stellt sie zusätzliches Angebot bereit und nimmt Devisen herein — die Reserven steigen. Genau dieser Zwang kostet sie die binnenwirtschaftliche Souveränität."},"e_x_trilemma":{"t":"Das Trilemma","b":"Freier Kapitalverkehr, fester Wechselkurs und autonome Geldpolitik — höchstens zwei davon sind gleichzeitig möglich. Bei festen Kursen mit freiem Kapitalverkehr ist der Zins an i* gebunden, die TR-Kurve wird irrelevant, und jede Offenmarktoperation löst eine gegenläufige Devisenmarktintervention aus."},"e_x_zinsschock":{"t":"Zinsschocks — spiegelbildlich","b":"Bei <b>festen</b> Kursen muss der heimische Zins dem Weltmarktzins folgen: höhere Zinsen drosseln die Investitionen, das BIP sinkt — man importiert die fremde Geldpolitik einschließlich ihrer Rezessionen. Bei <b>flexiblen</b> Kursen wertet die Währung ab, NX steigt, die IS-Kurve wandert nach rechts und das BIP steigt. Dieselbe Ursache, entgegengesetzte Wirkung."},"e_x_anpassungsventil":{"t":"Der Wechselkurs als Ventil","b":"σ = SP/P*: Sind P und P* rigide, schlägt jede Änderung von S eins zu eins auf σ durch. Und weil NX negativ von σ abhängt, verschiebt jede Wechselkursänderung über den Außenbeitrag die IS-Kurve. Der Kurs bewegt sie so lange, bis sie TR und IFM im selben Punkt schneidet — deshalb ist die IS-Lage bei flexiblem Regime endogen."},"e_x_qekanaele":{"t":"Quantitative Easing","b":"QE weitet die Geldbasis M0 über Offenmarktoperationen aus und wird eingesetzt, wenn eine Leitzinssenkung nicht mehr greift. Der entscheidende Unterschied zur klassischen Zinspolitik: Es wirkt auf die <b>langfristigen</b> Zinsen, während der kurzfristige Satz am ZLB erschöpft ist. Dazu kommen Kredit-, Wertpapierpreis- und Vermögenskanal."},"e_x_istrluecken":{"t":"Der Ausblick","b":"Das IS-TR-Modell erklärt die Nachfrageseite bei gegebenen Preisen. Sobald man das Preisniveau endogen macht und die Angebotsseite hinzunimmt, entsteht das <b>AS-AD-Modell</b>: Die IS-TR-Kurve liefert dort die aggregierte Nachfragekurve AD, der Arbeitsmarkt aus Teil 3 über Phillips und Okun das Angebot AS. Damit schließt sich der Bogen von der kurzen über die mittlere zur langen Frist."},"e_x_flexpreisdiagramm":{"t":"Der Selbstheilungsmechanismus im Diagramm","b":"Der Unterschied liegt allein im Reallohn. Keynesianisch ist er fix, weil W und P rigide sind — es bleibt bei unfreiwilliger Arbeitslosigkeit AB′. Bei Preisflexibilität sinkt zuerst P (der Reallohn steigt, Beschäftigung in B), dann drückt das Überschussangebot am Arbeitsmarkt auch W, und die Wirtschaft kehrt nach A zurück. Zusätzlich wirkt der Wechselkurskanal: Sinkende Preise senken σ, das steigert NX."},"e_x_fpfragen":{"t":"Die drei Fragen — und die vertikale Kurve","b":"Alle drei zielen auf dasselbe: Langfristig können nominale Größen keine realen beeinflussen, weil ein gleichzeitiger Anstieg von Preisen und Löhnen die relativen Preise unverändert lässt. Die einzige Ausnahme wäre <b>Geldillusion</b> — und die ist mit rationaler Erwartungsbildung unvereinbar. Ergebnis: Die langfristige Phillips-Kurve verläuft vertikal bei Ū, die langfristige AS-Kurve senkrecht bei Ȳ."},"e_x_produktionsanpassung":{"t":"Lange und kurze Anpassung","b":"Langfristig passt man über zusätzliche Produktionsfaktoren und bessere Technik an — genau die Wachstumsfaktoren K, L und A aus Teil 2. Kurzfristig variiert man den Arbeitseinsatz: erst Überstunden, dann Kurzarbeit, dann Einstellungsstopps, zuletzt Entlassungen. Weil diese Anpassung <b>graduell</b> erfolgt, ist der Okun-Koeffizient h kleiner als eins."},"e_x_kerninflation":{"t":"Kerninflation und die Lage der Kurve","b":"π̄ ist der von Konjunktur und Schocks bereinigte Sockel der Inflation. Zusammen mit Ū bzw. Ȳ bestimmt sie die <b>Lage</b> der kurzfristigen Kurve: Änderungen von π̄ verschieben sie vertikal, Änderungen von Ū oder Ȳ horizontal, Angebotsschocks ε ebenfalls vertikal. Alles Übrige — insbesondere Nachfrageimpulse — bewirkt nur eine Bewegung entlang der Kurve."},"e_x_natALQtabelle":{"t":"Was die Ū-Tabelle beweist","b":"Drei Beobachtungen. Erstens der große Sprung 1970 → 1990: Deutschland von 0,9 % auf 7,2 %, Frankreich von 2,1 % auf 7,7 %, Spanien von 4,3 % auf 14,3 % — die Persistenzdebatte aus Teil 3. Zweitens die deutsche Umkehr von 7,2 % (2000) auf <b>3,7 %</b> (2020), praktisch eine Halbierung: ein starkes Argument dafür, dass Ū keine Naturkonstante ist. Drittens die stabilen Extreme — Spanien dauerhaft zweistellig, Japan und die Schweiz dauerhaft unter 5 %."},"e_x_pfadZ":{"t":"Der Weg nach Z","b":"Erst wandert man auf der kurzfristigen AS-Kurve hinauf (A → B): Output und Inflation steigen. Dann übernehmen die Erwartungen die höhere Inflation, die Kerninflation springt von π̄₁ auf π̄₂ und die AS-Kurve verschiebt sich nach oben. Schließlich wandert man <b>entlang der AD-Kurve</b> zurück, bis der Output wieder bei Ȳ liegt — Punkt Z, mit dauerhaft höherer Inflation."},"e_x_zusammen8":{"t":"Die Bilanz von Teil 8","b":"Die sechs Punkte fassen den Bauplan zusammen: Phillips-Kurve plus Okun ergibt AS; die Komponentenzerlegung erklärt, woher die Inflation kommt; Grundinflation und Ū bzw. Ȳ bestimmen die Lage der kurzfristigen Kurven; langfristig kehrt alles zu Ū und zum Trend zurück. Der Schlusssatz — <b>langfristig herrscht Dichotomie</b> — schließt den Kreis zu Teil 4, wo sie nur behauptet, hier aber abgeleitet wurde."},"e_x_festebesonderheit":{"t":"Warum die AD-Kurve bei festen Kursen anders funktioniert","b":"Zwei Besonderheiten: Erstens verschiebt sich die aggregierte Nachfrage nur über die IS-Kurve oder über i*. Zweitens verliert die Zentralbank durch die Interventionspflicht ihre Souveränität — die TR-Kurve ist wirkungslos. Beides ist wörtlich das Ergebnis aus Teil 7, nur jetzt in die Herleitung der AD-Kurve eingebaut."},"e_x_gmfest":{"t":"Auch die Geldmenge ist fremdbestimmt","b":"Aus M = P·L(Y,i) folgt g_M = g_Y + π; mit π = π* wird daraus g_M = g_Y + π*. Das ist die zahlenmäßige Version des Souveränitätsverlusts: Die Zentralbank kann nicht einmal mehr die Geldmenge wählen, sondern muss genau so viel schöpfen, wie importierte Inflation und eigenes Wachstum verlangen."},"e_x_lad":{"t":"LAS und LAD","b":"Bei den kurzfristigen Kurven ist AS steigend und AD fallend. Bei den langfristigen ist <b>LAS senkrecht im Output</b> (bei Ȳ) und <b>LAD in der Inflation verankert</b> (dort, wo Kaufkraftparität erfüllt ist). Beide zusammen schneiden sich in genau einem Punkt — das langfristige allgemeine Gleichgewicht."},"e_x_abwertungswettlauf":{"t":"Beggar-thy-neighbour","b":"Prinzipiell ist Geldpolitik bei festen Kursen wirkungslos. Die Zentralbank könnte aber versuchen, durch wiederholte Abwertung das reale BIP dauerhaft über seinen Trend zu drücken. Das funktioniert nur, solange die Partner nicht mitziehen — tun sie es, verpuffen alle Effekte und übrig bleibt Instabilität. Genau deshalb betont die Schlussfolie den <b>Koordinationsbedarf in der EU</b>."},"e_x_realzinsrelevanz":{"t":"Wofür der Realzins zählt","b":"Für die intertemporale Konsumentscheidung (Euler-Gleichung, Teil 5 Abschnitt 7.3) und für die Investitionsentscheidung (GP_K = 1+r, Teil 5 Abschnitt 8.1). Das Fisher-Prinzip i = r + π^e sagt zugleich: Der negative Effekt der erwarteten Inflation auf die reale Geldnachfrage ist im Nominalzins <b>bereits enthalten</b>."},"e_x_realzinsangleich":{"t":"Warum sich Realzinsen angleichen","b":"Internationale Kapitalmobilität führt zum Ausgleich von Produktivitätsunterschieden und damit zur Angleichung der Realzinsen. Jede Abweichung der Inflationsraten wird über den <b>nominalen</b> Wechselkurs ausgeglichen — genau die relative Kaufkraftparität g_S = π* − π aus Teil 4. Deshalb gilt langfristig ī = r̄ + π̄ = i*."},"e_x_schockformel9":{"t":"Der Angebotsschock","b":"π = π̄ + a(Y − Ȳ) + s. Der Schockterm verschiebt die kurzfristige Angebotsfunktion und erzeugt <b>Stagflation</b>. In Teil 8 hieß derselbe Term ε — gemeint sind alle Störungen der Produktionskosten: Steuerpolitik, Rohstoffpreise, Währungsschocks, gesetzliche Regulierung. Historisch: 1973/74, 1979/80, 2022."},"e_x_forwardbackward":{"t":"Forward- und backward-looking","b":"Forward-looking ist die Lohnverhandlung auf Basis von P^e — Tarifparteien preisen die erwartete Inflation ein. Backward-looking sind Indexierung und Nachholeffekte, also Anpassung an die bereits realisierte Inflation. Beides zusammen erzeugt die <b>Trägheit</b> der Inflation und damit den mittelfristigen Anpassungsprozess zwischen kurzer und langer Frist."},"e_x_langfristvier":{"t":"Die lange Frist in vier Bedingungen","b":"Y_gap = 0, π_gap = 0, σ = 1 (Kaufkraftparität) und i = i* (Zinsparität) — dazu die Dichotomie von monetärem und realem Bereich. Der Motor des Übergangs dorthin sind zwei Anpassungen: die <b>Erwartungen</b> verschieben die AS-Kurve, der <b>reale Wechselkurs</b> stellt die Kaufkraftparität her. Beide zusammen fressen jeden kurzfristigen Politikerfolg auf."},"e_x_koordination":{"t":"Die Theorie hinter der Währungsunion","b":"Feste Kurse zwingen alle Beteiligten in dieselbe Inflationsrate (π = π*). Wer abweichende Politik fährt, verliert Wettbewerbsfähigkeit oder muss den Kurs aufgeben. Eine Währungsunion ohne abgestimmte Fiskal- und Lohnpolitik erzeugt deshalb genau die Divergenzen, die in der Euro-Krise sichtbar wurden — dieselbe Diagnose wie in Teil 4, Abschnitt 8.4."},"e_x_timelag9":{"t":"Time-lags und die Konsequenz","b":"Erkennungs-, Entscheidungs- und Wirkungsverzögerung summieren sich leicht auf mehrere Quartale. Bis die Maßnahme greift, kann der Konjunkturzyklus gedreht haben — dann wirkt sie <b>prozyklisch</b> statt stabilisierend. Das ist das klassische Argument für regelgebundene statt diskretionäre Politik und für automatische Stabilisatoren, die ohne Entscheidungsverzögerung wirken."},"e_y_verteilungsinflation":{"t":"Inflation als Umverteilungsmechanismus","b":"Die Liste aus Teil 6 wird hier um einen Punkt ergänzt: die <b>Verzerrung relativer Vermögenspreise</b>. Wer Sachwerte hält, ist geschützt; wer Geldvermögen hält, verliert. Inflation wirkt damit systematisch zugunsten der Vermögenden. Hinzu kommt, dass der Staat auf beiden Seiten auftaucht — als Gewinner über Wertsteuern und kalte Progression, während der Steuerzahler verliert."},"e_y_hpfilter":{"t":"Der HP-Filter und das Problem mit Ȳ","b":"Der Hodrick-Prescott-Filter sucht denjenigen Trendpfad, der Datennähe und Glätte ausbalanciert. Das Ergebnis ist die zyklische Komponente — in Deutschland 1991–2023 zwischen etwa −0,10 und +0,04, mit Einbrüchen 2009 und 2020. <b>Entscheidend für dieses Kapitel:</b> Ȳ ist nicht beobachtbar, sondern geschätzt und wird nachträglich revidiert. Damit ist auch die Outputlücke unsicher — einer der Gründe für die Unsicherheitsproblematik der Stabilisierungspolitik."},"e_y_ar2":{"t":"Impuls und Propagation","b":"Y_t = a·Y_{t−1} − b·Y_{t−2} + ε_t erzeugt nur dann Schwingungen, wenn die charakteristischen Wurzeln komplex sind, also bei <b>a² &lt; 4b</b>. Mit a = 1,5 und b = 0,7 ist das erfüllt; der Dämpfungsfaktor √b = 0,84 sorgt dafür, dass die Schwingung abklingt, die Periode liegt bei rund 14 Perioden. <b>Ohne fortlaufende Schocks würde der Zyklus auslaufen</b> — erst die Zufallsimpulse halten ihn am Leben. Das ist Frischs Trennung von Impuls und Propagation."},"e_y_schocktypen":{"t":"Welche Schocks in Frage kommen","b":"Technologie, Produktivität und Innovation auf der realen Seite; fiskalische und monetäre Schocks über i und σ; dazu geologische und klimatische Ereignisse. Die Schocks selbst sind unregelmäßig — die Regelmäßigkeit des Zyklus entsteht erst durch die zeitverzögerte Anpassung der makroökonomischen Variablen, also durch die Impulse-Response des Systems."},"e_y_autokorrelation":{"t":"Was die Autokorrelationen verraten","b":"Die AKF des BIP fällt von 0,85 (Lag 1) über 0,19 (Lag 4) und wird bei Lag 6 negativ. Der Nulldurchgang bei etwa Lag 5 markiert eine <b>Vierteldrehung</b> des Zyklus — vier davon ergeben rund 20 Quartale, also 5 Jahre. Das passt genau zum unteren Rand der 5-bis-8-Jahre-Spanne der stilisierten Fakten. Der stark negative Wert bei Lag 8 ist die Gegenphase: Was heute über Trend liegt, liegt zwei Jahre später darunter."},"e_y_kreuzkorrelogramm":{"t":"Vor-, gleich- und nachlaufend","b":"Ein Kreuzkorrelogramm zeigt die Korrelation einer Variablen mit dem BIP bei verschiedenen zeitlichen Verschiebungen. Das Maximum verrät die Beziehung: Lag 0 gleichlaufend, negativer Lag vorlaufend, positiver Lag nachlaufend. Praktisch wichtig sind die <b>vorlaufenden</b> Indikatoren — Kapazitätsauslastung, Auftragseingänge, Aktienkurse, Geldhaltung. Sie sind das Gegenmittel gegen die Erkennungsverzögerung."},"e_y_schockfortpflanzung":{"t":"Ein Gleichgewicht, das nie erreicht wird","b":"Die AR(2)-Gleichung ist die abstrakte Formulierung der Schockfortpflanzung, das AS-AD-Diagramm die ökonomische. Ein Schock verschiebt AD oder AS; die Erwartungen passen sich verzögert an, wodurch AS nachwandert; bis das abgeschlossen ist, hat der nächste Schock zugeschlagen. Ergebnis ist die geschwungene Bahn um LAS."},"e_y_tfpprozyklisch":{"t":"Warum die prozyklische TFP für RBC spricht","b":"Die TFP ist das Solow-Residuum aus Teil 2 und erklärt einen substantiellen Anteil der BIP-Schwankungen. Schwankt sie prozyklisch, liegt der Schluss nahe, dass reale Produktivitätsschocks die Konjunktur treiben. Die radikale Konsequenz der RBC-Theorie: Sind Schwankungen die <b>optimale Reaktion</b> rationaler Akteure, sind sie kein Problem — dann schadet jeder Eingriff. Sinkt die Produktivität, ist weniger Arbeit rational."},"e_y_unsicherheit":{"t":"Unsicherheit plus Lags","b":"Zur Time-lag-Kritik kommt die Unsicherheit — exogen wie endogen — und asymmetrische Information. Zusammen ergibt das Friedmans Vorwurf: Stabilitätspolitische Eingriffe verstärken die zyklischen Schwankungen sogar noch. Verschärft wird das dadurch, dass die Outputlücke selbst nur geschätzt ist."},"e_y_commonknowledge":{"t":"Antizipation macht Politik überflüssig","b":"Die erwartete zukünftige Politik beeinflusst heutige Marktaktivitäten — und die Politik wird ihrerseits von den Erwartungen beeinflusst. Bei common knowledge antizipieren die Wirtschaftssubjekte den Eingriff und passen sich so an, dass die Maßnahme gegebenenfalls gar nicht mehr nötig ist. Das ist die schärfste Form der Lucas-Kritik."},"e_y_schlussfolgerungen":{"t":"Was folgt daraus für die Praxis","b":"Kein Aktionismus, Regelbindung statt Diskretion, und gegenwärtige Maßnahmen nur zusammen mit verbindlichen Zukunftsverpflichtungen. Der gemeinsame Nenner ist <b>Selbstbindung</b>: Man muss sich die Möglichkeit nehmen, später umzuentscheiden. Genau dafür gibt es unabhängige Zentralbanken, Schuldenbremsen und gesetzlich fixierte Regeln."},"e_y_stabilisierungasad":{"t":"Zwei Wege zum selben Ziel","b":"Ohne Politik kehrt die Wirtschaft nach einem negativen Schock von selbst zu Ȳ zurück — aber nur über die langsame Abwärtsanpassung der AS-Kurve, also über sinkende Löhne und Preise. Das dauert und kostet Beschäftigung. Mit expansiver Politik geht es schneller, aber bei höherer Inflation. <b>Beide Wege enden bei Ȳ</b>; der Unterschied liegt in Zeit und Preis. Genau das ist der Abwägungspunkt des Kapitels."},"e_y_medianwaehler":{"t":"Politische Ökonomie","b":"Wenn man Haushalte und Unternehmen als Nutzenmaximierer modelliert, ist es inkonsistent, Politiker als selbstlose Wohlfahrtsmaximierer anzunehmen. Der Medianwähler erklärt die Konvergenz der Parteiprogramme zur Mitte; politische Konjunkturzyklen sind ein Sonderfall der Zeitinkonsistenz — vor der Wahl Expansion, danach Konsolidierung. Die Antwort ist wieder Selbstbindung durch Institutionen."},"e_y_staatsausgaben2019":{"t":"Was die Tabelle zeigt","b":"Drei Beobachtungen. Erstens hat der Euroraum mit 46,3 % die höchste Staatsquote, die USA mit 38,3 % die niedrigste — das europäische Sozialstaatsmodell in einer Zahl. Zweitens haben die USA trotzdem das größte Defizit (−7,2 % gegenüber −0,8 %): <b>Hohe Staatsquote und hohes Defizit sind nicht dasselbe</b>, es kommt auf die Einnahmenseite an. Drittens Japan mit 236,5 % Schuldenquote — der Beleg dafür, dass die Höhe allein noch keine Krise auslöst, weil die <b>Dynamik</b> über r − g_Y entscheidet."},"e_y_transfers":{"t":"Der Staat als Umverteilungsmaschine","b":"In fünfzig Jahren haben sich die Transferquoten in fast allen Industrieländern vervielfacht — Spanien von 2,9 auf 20,4 % des BIP, die USA von 6,0 auf 30,9 %. Noch aussagekräftiger ist die andere Hälfte der Tabelle: Transfers machen 2010 überall <b>über die Hälfte</b> der Staatsausgaben aus. Das passt zur deutschen Ressortverteilung (Arbeit und Soziales 37,5 %) und ist ein Beispiel für Wagners Gesetz vom wachsenden Staatsanteil."},"e_y_defizitbias":{"t":"Defizite sind der Normalfall","b":"Frankreich und Italien hatten in 46 Jahren kein einziges Überschussjahr, die USA eines von fünfzig. Nur Finnland, Estland und Schweden sind einigermaßen ausgeglichen. <b>Das widerspricht der Theorie:</b> Die Budgetglättung aus Teil 5 würde Defizite in Rezessionen und Überschüsse in Booms vorhersagen, im Mittel also null. Die Erklärung liefert Teil 10 — politische Konjunkturzyklen, Sperrklinkeneffekte, Zeitinkonsistenz. Ausgeben ist populär, konsolidieren nicht."},"e_y_historischesmuster":{"t":"Abbau über den Nenner","b":"Schuldenquoten steigen in Kriegen und Krisen sprunghaft und werden danach über Jahrzehnte abgebaut — meist <b>nicht durch Tilgung</b>, sondern weil Wachstum und Inflation den Nenner vergrößern. Das ist Weg 2 der Stabilisierung in Reinform und erklärt, warum die Jahre nach 1945 mit hohem Wachstum und moderater Inflation für die Staatsfinanzen so günstig waren."},"e_y_primaerueberschuss":{"t":"Die Last steigt mit der Quote","b":"Der zur Stabilisierung nötige Primärüberschuss beträgt (r − g_Y)·(B/Y). Bei 60 % Schuldenquote und 2 Prozentpunkten Zins-Wachstums-Differenz sind das 1,2 % des BIP, bei 150 % schon 3,0 %. Weil die Last proportional zur Quote steigt, sind hoch verschuldete Länder überproportional verwundbar gegenüber Zinsanstiegen — genau das war die Mechanik der Euro-Schuldenkrise."},"e_y_vermoegensverkauf":{"t":"Wege 4 und 5 im Klartext","b":"Der Vermögensverkauf bringt nur einen einmaligen Effekt und kostet künftige Erträge — die Nettovermögensposition ändert sich nicht, es ist ein Buchungstrick. Repudiation, also der Staatsbankrott, ist die offene Enteignung; die Monetisierung ist ihre verdeckte Variante über die Inflationssteuer. Beide zerstören die Glaubwürdigkeit auf Jahrzehnte und damit den künftigen Kapitalmarktzugang."},"e_y_ampolprobleme":{"t":"Vier Probleme, vier Ansätze","b":"Heterogenität und unvollständige Information über die Qualität der Arbeitskräfte sind Matching-Probleme; die Anreizproblematik der sozialen Sicherung betrifft den Reservationslohn; der unzureichende Matching-Prozess bestimmt direkt die Findungsrate f in u^f = s/(s+f). Die fünf Ansatzpunkte — Deregulierung, Frauenpartizipation, Mobilität, Anreizstrukturen, Vermittlung — adressieren jeweils eines davon und zielen alle auf Ū."},"e_y_lasverschiebung":{"t":"Der Kanal der Angebotspolitik","b":"Das kombinierte Diagramm verbindet Arbeitsmarkt und Output: Eine erfolgreiche Reform hebt die gleichgewichtige Beschäftigung von L̄ auf L̄′, über die Produktionsfunktion Y = F(K, L) steigt damit das Trend-BIP von Ȳ auf Ȳ′, und die <b>LAS-Kurve verschiebt sich nach rechts</b>. Damit ist der Arbeitsmarkt der konkrete Mechanismus, über den angebotsorientierte Politik das Produktionspotential erhöht."},"e_y_ampausgaben":{"t":"Aktiv und passiv im Vergleich","b":"Dänemark und Frankreich geben beide rund 3 % des BIP für Arbeitsmarktprogramme aus, verteilen aber völlig verschieden: Dänemark etwa hälftig aktiv (1,96) und passiv (1,09), Frankreich fast ausschließlich passiv (0,87 zu 1,97). Das Ergebnis passt dazu — 1,2 % gegenüber 3,9 % Langzeitarbeitslose bei ähnlicher Gesamtquote. Deutschland gibt insgesamt am wenigsten aus (1,40 %) und hat mit 4 % die niedrigste Quote; ein einfacher Kausalschluss verbietet sich hier allerdings, die Ausgangslagen sind zu verschieden."},"e_y_verteilungsmasse":{"t":"Welches Maß was misst","b":"Der Perzentilsabstand 90/50 misst die Spreizung in der oberen Hälfte und ist robust gegen Ausreißer. Der Top-1-%-Anteil misst die Konzentration an der Spitze — genau dort, wo der Gini unempfindlich ist. Der Gini fasst die gesamte Verteil
