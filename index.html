<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355B">
<title>Karteikasten — Makro &amp; Wirtschaftspolitik</title>
<style>
:root{
  --ink:#12355B; --ink2:#26527A; --line:#C8D4E0; --bg:#EEF2F6; --card:#FFFFFF;
  --muted:#5B6B7C; --ok:#2F6B23; --okbg:#EEF6EC; --again:#9A6A12; --againbg:#FBF3E2;
  --wipo:#6B3F6E; --wipobg:#F2ECF3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:#16202B;font-family:var(--sans);
  font-size:16px;line-height:1.5;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px
  env(safe-area-inset-bottom) 16px;min-height:100%}

/* ---------- Kopfzeile ---------- */
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.hd{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.hd h1{font-size:15px;font-weight:600;margin:0;flex:1;letter-spacing:.1px}
.hd .sub{display:block;font-size:11.5px;font-weight:400;opacity:.72;margin-top:1px}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:19px;background:rgba(255,255,255,.12);flex:none}
.iconbtn:active{background:rgba(255,255,255,.26)}
.count{font-variant-numeric:tabular-nums;font-size:12.5px;opacity:.85;flex:none}

/* ---------- Start ---------- */
.hero{padding:26px 0 6px}
.hero h2{font-family:var(--serif);font-size:27px;line-height:1.2;margin:0 0 6px;
  color:var(--ink);font-weight:400}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.bigbtn{display:block;width:100%;margin:18px 0 8px;padding:15px;border-radius:12px;
  background:var(--ink);color:#fff;font-weight:600;font-size:15.5px;text-align:center}
.bigbtn:active{background:#0d2843}
.bigbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.secline{display:flex;gap:10px;margin:0 0 20px}
.secline .bigbtn{margin:0}

.grouphead{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px}
.grouphead b{font-size:13px;letter-spacing:.3px;color:var(--ink)}
.grouphead span{font-size:12px;color:var(--muted)}
.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-left:5px solid var(--ink);
  border-radius:10px;padding:12px 13px;text-align:left;width:100%}
.deck.wipo{border-left-color:var(--wipo)}
.deck:active{background:#F7FAFC}
.deck .nm{font-weight:600;font-size:14.5px;color:var(--ink)}
.deck.wipo .nm{color:var(--wipo)}
.deck .ds{font-size:12.5px;color:var(--muted);margin-top:1px}
.deck .meta{margin-left:auto;text-align:right;flex:none}
.deck .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;width:64px;border-radius:2px;background:#DDE5EC;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- Karte ---------- */
.stage{padding:14px 0 108px}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;
  background:#DDE7F0;color:var(--ink2);margin-bottom:12px}
.pill.wipo{background:var(--wipobg);color:var(--wipo)}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:20px 18px;min-height:230px;position:relative;
  box-shadow:0 1px 0 rgba(18,53,91,.05)}
.kcard::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;
  background:var(--ink);border-radius:0 0 3px 3px}
.kcard.wipo::before{background:var(--wipo)}
.q{font-family:var(--serif);font-size:20.5px;line-height:1.38;color:var(--ink)}
.hint{margin-top:20px;font-size:12.5px;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:18px 0 15px}
.a{font-size:15.5px;line-height:1.6}
.a b{color:var(--ink)}
.srcline{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted)}
.srcline b{color:var(--ink2);font-weight:600}
.tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;
  background:#fff;font-size:13px;color:var(--ink2);text-align:center}
.tool:active{background:#F0F5F9}

.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(
  to top,var(--bg) 68%,rgba(238,242,246,0));padding:12px 16px
  calc(env(safe-area-inset-bottom) + 14px);z-index:15}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.ans{flex:1;padding:15px;border-radius:12px;font-weight:600;font-size:15px;
  text-align:center;border:1px solid}
.ans.again{background:var(--againbg);border-color:#E3CE9E;color:var(--again)}
.ans.ok{background:var(--okbg);border-color:#B6D3AC;color:var(--ok)}
.ans:active{filter:brightness(.95)}
.flip{width:100%;padding:15px;border-radius:12px;background:var(--ink);color:#fff;
  font-weight:600;font-size:15px;text-align:center}

/* ---------- Blätterliste ---------- */
.search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:15px;margin:14px 0 10px}
.search:focus{outline:2px solid var(--ink2);outline-offset:1px}
.row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  margin-bottom:7px;width:100%;text-align:left}
.row:active{background:#F7FAFC}
.row .rq{font-family:var(--serif);font-size:15px;line-height:1.35;color:var(--ink)}
.row .rm{font-size:11.5px;color:var(--muted);margin-top:5px}
.empty{padding:34px 4px;color:var(--muted);font-size:14.5px}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,26,42,.44);z-index:30;
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;
  border-radius:16px 16px 0 0;max-height:86vh;overflow:auto;
  transform:translateY(102%);transition:transform .22s ease;
  padding:6px 18px calc(env(safe-area-inset-bottom) + 22px)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:#CBD6E0;margin:9px auto 14px}
.sheet h3{font-family:var(--serif);font-size:19px;color:var(--ink);margin:0 0 4px;
  font-weight:400}
.sheet .kicker{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.sheet .body{font-size:15px;line-height:1.62}
.sheet .body b{color:var(--ink)}
.filebox{background:#F3F7FA;border:1px solid var(--line);border-radius:10px;
  padding:13px;margin:6px 0 14px}
.filebox .fl{font-size:12px;color:var(--muted)}
.filebox .fn{font-size:15px;color:var(--ink);font-weight:600;margin-top:3px}
.filebox .fs{font-size:13.5px;color:var(--ink2);margin-top:2px}
.filelink{display:inline-block;margin-top:9px;font-size:13px;color:#fff;
  background:var(--ink);border-radius:8px;padding:8px 12px;text-decoration:none}
.filelink:active{background:#0d2843}
.closebtn{display:block;width:100%;margin-top:18px;padding:13px;border-radius:11px;
  background:#EDF2F6;color:var(--ink);font-weight:600;text-align:center}

/* ---------- Zusammenfassung Ende ---------- */
.done{text-align:center;padding:46px 10px}
.done .big{font-family:var(--serif);font-size:44px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.done p{color:var(--muted);font-size:14.5px;margin:6px 0 22px}
.note{font-size:12.5px;color:var(--muted);margin:22px 0 30px;line-height:1.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header><div class="hd">
  <button class="iconbtn" id="back" style="display:none" aria-label="Zurück">‹</button>
  <h1 id="ttl">Karteikasten<span class="sub" id="stl">Makroökonomik &amp; Wirtschaftspolitik</span></h1>
  <span class="count" id="cnt"></span>
</div></header>

<div class="wrap" id="view"></div>

<script>
const D = {"cards":[{"i":0,"d":"m2","t":"Handwerkszeug","q":"Wachstumsrate g_t — Definition?","a":"g_t = (x_t − x_{t−1}) / x_{t−1}. Entscheidend ist das Wort <b>relativ</b>: nicht die Differenz, sondern die Differenz geteilt durch den Ausgangswert.","s":"Makro VL02 (Solow)","sec":"Abschnitt 4.1","e":"e_wachstumsrate","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":1,"d":"m2","t":"Handwerkszeug","q":"Quotientenregel und Produktregel für Wachstumsraten?","a":"Quotient: g_{x/z} = g_x − g_z. Produkt: g_{x·z} = g_x + g_z.<br>Anwendung: y = Y/L ⇒ g_y = g_Y − g_L.","s":"Makro VL02 (Solow)","sec":"Abschnitt 4.3","e":"e_daumenregeln","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":2,"d":"m2","t":"Handwerkszeug","q":"72er-Regel — was sagt sie, und wie genau ist sie?","a":"Verdopplungszeit t ≈ 72/g. Bei g = 2 %: 36 Jahre. Exakt: ln2/ln(1,02) = 35,0 Jahre — also eine Approximation, kein exaktes Ergebnis.","s":"Makro VL02 (Solow)","sec":"Abschnitt 4.3","e":"e_daumenregeln","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":3,"d":"m2","t":"Handwerkszeug","q":"Warum zeichnet man Wachstumsgrafiken logarithmisch?","a":"Aus x(t)=x(0)e^{gt} wird ln x(t) = ln x(0) + g·t — eine Gerade mit Steigung g. Im Log-Diagramm bedeuten parallele Linien gleiche Wachstumsraten und Annäherung echte relative Konvergenz.","s":"Makro VL02 (Solow)","sec":"Abschnitt 4.4","e":"e_log","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":4,"d":"m2","t":"Handwerkszeug","q":"Cobb-Douglas-Wachstumszerlegung — Ergebnis und Herleitungsschritte?","a":"g_Y = α g_K + (1−α) g_L.<br>1) Logarithmieren, 2) 1. Differenz bilden, 3) Log-Approximation g_x ≈ ln x_t − ln x_{t−1} einsetzen.","s":"Makro VL02 (Solow)","sec":"Abschnitt 4.5","e":"e_cdzerlegung","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":5,"d":"m2","t":"Kaldor","q":"Kaldors stilisierte Fakten — nennen Sie alle sieben.","a":"1) Arbeitsproduktivität wächst mit nicht abnehmender Rate. 2) Kapitalintensität K/L nimmt zu. 3) Kapitalkoeffizient K/Y trendlos. 4) Kapitalrendite r konstant. 5) Stundenlöhne steigen. 6) Einkommensquoten trendlos. 7) Große geographische Streuung der Produktivitätswachstumsraten.","s":"Makro VL02 (Solow)","sec":"Kapitel 5","e":"e_kaldor","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":6,"d":"m2","t":"Kaldor","q":"Kapitalintensität vs. Kapitalkoeffizient — Unterschied?","a":"Kapitalintensität k = K/L ist Kapital <b>pro Arbeiter</b> (steigt). Kapitalkoeffizient K/Y ist Kapital <b>pro Outputeinheit</b> (trendlos). Kein Widerspruch: K und Y wachsen gleich schnell, L langsamer.","s":"Makro VL02 (Solow)","sec":"Kapitel 5","e":"e_kaldor","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":7,"d":"m2","t":"Produktionsfunktion","q":"Die vier Bausteine der neoklassischen Produktionsfunktion?","a":"(a) Konstante Skalenerträge λY = F(λK, λL). (b) Positive, aber abnehmende Grenzprodukte: F_K>0, F_KK<0; F_L>0, F_LL<0. (c) Faktorentlohnung nach Grenzprodukt: GP_K = r, GP_L = w. (d) Ausschöpfungstheorem Y = rK + wL.","s":"Makro VL02 (Solow)","sec":"Abschnitt 6.1","e":"e_prodfkt","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":8,"d":"m2","t":"Produktionsfunktion","q":"Warum darf man die Produktionsfunktion durch L teilen (intensive Form)?","a":"Nur wegen der konstanten Skalenerträge: In λY = F(λK, λL) setzt man λ = 1/L. Ergebnis: y = f(k). Ohne lineare Homogenität funktioniert dieser Schritt nicht.","s":"Makro VL02 (Solow)","sec":"Abschnitt 6.2","e":"e_intensiv","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":9,"d":"m2","t":"Produktionsfunktion","q":"Grenzprodukt der Arbeit in intensiver Form — Formel und Herleitung?","a":"GP_L = f(k) − f′(k)·k. Herleitung: Y = rK + wL durch L teilen gibt y = rk + w, nach w auflösen. Der Lohn ist der Achsenabschnitt der Tangente an f(k).","s":"Makro VL02 (Solow)","sec":"Abschnitt 6.2","e":"e_intensiv","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":10,"d":"m2","t":"Produktionsfunktion","q":"Cobb-Douglas in intensiver Form — Rechenweg?","a":"y = K^α L^{1−α}/L = K^α L^{−α} = (K/L)^α = k^α. Der Schritt, der oft stockt: L^{1−α−1} = L^{−α}.","s":"Makro VL02 (Solow)","sec":"Abschnitt 6.3","e":"e_intensiv","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":11,"d":"m2","t":"Solow-Modell","q":"Die fünf Annahmen des Solow-Grundmodells?","a":"1) Neoklassische Produktionsfunktion y=f(k) mit konstanten Skalenerträgen. 2) Konstante Sparquote S=sY. 3) Konstante Abschreibungsquote δ. 4) Konstantes Arbeitskräftepotential, unelastisches Arbeitsangebot. 5) Geschlossene Volkswirtschaft ohne Staat.","s":"Makro VL02 (Solow)","sec":"Abschnitt 7.1","e":"e_solowannahmen","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":12,"d":"m2","t":"Solow-Modell","q":"Fundamentale Bewegungsgleichung des Solow-Grundmodells?","a":"Δk = s·y_t − δ·k_t. Links die Zuflüsse (Ersparnis = Investition), rechts die Abflüsse (Abschreibung), die Differenz ist die Veränderung der Kapitalintensität.","s":"Makro VL02 (Solow)","sec":"Abschnitt 7.3","e":"e_bewegung","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":13,"d":"m2","t":"Solow-Modell","q":"Steady-State-Bedingung und k* bei Cobb-Douglas?","a":"s·y = δ·k ⇒ Δk = 0. Mit y = k^α: k* = (s/δ)^{1/(1−α)}.<br>Beispiel α=1/3, s=0,20, δ=0,05: k* = 4^{1,5} = 8, y* = 2.","s":"Makro VL02 (Solow)","sec":"Abschnitt 7.4","e":"e_steadystate","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":14,"d":"m2","t":"Solow-Modell","q":"Warum ist die Wirtschaft im Solow-Grundmodell stationär?","a":"L ist konstant, es wird nur das verbrauchte Kapital ersetzt ⇒ K und L konstant ⇒ Y wächst nicht ⇒ y = Y/L konstant. Ein Wachstumsmodell erzeugt im Gleichgewicht null Wachstum.","s":"Makro VL02 (Solow)","sec":"Abschnitt 7.5","e":"e_stationaer","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":15,"d":"m2","t":"Sparquote","q":"Wirkung einer höheren Sparquote — Niveau oder Wachstum?","a":"<b>Niveaueffekt, kein Wachstumseffekt.</b> k und y steigen auf ein neues, höheres Niveau; g_y springt nur transitorisch ins Positive und fällt dann wieder auf null.","s":"Makro VL02 (Solow)","sec":"Abschnitt 8.1–8.2","e":"e_sparquote","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":16,"d":"m2","t":"Sparquote","q":"Elastizität ε_{y,s} — Formel und Größenordnung?","a":"ε_{y,s} = α/(1−α); bei α = 0,33 also 1/2. Eine Verdopplung von s (0,20→0,40) erhöht y* nur um den Faktor √2, also +41 %. <b>Sparen ist ein schwacher Hebel.</b>","s":"Makro VL02 (Solow)","sec":"Abschnitt 8.3","e":"e_sparquote","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":17,"d":"m2","t":"Goldene Regel","q":"Goldene Regel — Kriterium und Bedingung 1. Ordnung?","a":"Maximiere den Steady-State-Pro-Kopf-Konsum: max_s c = max_s [y − δk]. FOC: ∂c/∂s = (∂k/∂s)[∂y/∂k − δ] = 0 ⇒ <b>GP_K ≡ r = δ</b>. Normatives Kriterium (Phelps 1966).","s":"Makro VL02 (Solow)","sec":"Abschnitt 9.1","e":"e_goldene","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":18,"d":"m2","t":"Goldene Regel","q":"Goldene-Regel-Sparquote bei Cobb-Douglas?","a":"s_gold = α. Bei α = 1/3 und δ = 0,05: k_gold = (α/δ)^{1/(1−α)} = 17,21, c* = 1,721 — höher als bei s=0,20 (1,600) und bei s=0,40 (1,697).","s":"Makro VL02 (Solow)","sec":"Abschnitt 9.3","e":"e_goldene","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":19,"d":"m2","t":"Goldene Regel","q":"Dynamische Ineffizienz — Lage, Motto, Bedeutung?","a":"s > s_gold, also r &lt; δ. Motto „Free Lunch“: Der Konsum kann durch Senkung der Sparquote <b>sofort und dauerhaft</b> steigen, niemand verliert. Gegenstück: dynamische Effizienz, „No Pain No Gain“.","s":"Makro VL02 (Solow)","sec":"Abschnitt 9.3","e":"e_ineffizienz","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":20,"d":"m2","t":"Bevölkerung","q":"Bewegungsgleichung und Goldene Regel mit Bevölkerungswachstum?","a":"Δk = s·y − (n+δ)k; Steady State s·y = (n+δ)k; Goldene Regel r = n + δ. n wird zu δ addiert, weil beide k drücken: δ frisst den Zähler K, n bläht den Nenner L auf.","s":"Makro VL02 (Solow)","sec":"Kapitel 10","e":"e_bevoelkerung","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":21,"d":"m2","t":"Bilanz","q":"Welche Kaldor-Fakten erklärt Solow OHNE technischen Fortschritt nicht?","a":"Drei Fehlschläge: y wächst nicht, k wächst nicht, w wächst nicht. Erklärt werden: K/Y trendlos, r konstant, Einkommensquoten trendlos, β-Konvergenz, Y/K/L wachsen mit n.","s":"Makro VL02 (Solow)","sec":"Kapitel 11","e":"e_bilanz","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":22,"d":"m2","t":"TFP","q":"Solow-Residuum — Formel und Interpretation?","a":"g_A = g_Y − α g_K − (1−α) g_L. Es wird nicht gemessen, sondern als Rest berechnet, und enthält alles, was nicht Faktormengenwachstum ist — Solows „Maß unserer Unwissenheit“.","s":"Makro VL02 (Solow)","sec":"Abschnitt 12.1","e":"e_residuum","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":23,"d":"m2","t":"TFP","q":"Rechnen Sie: g_Y=3 %, g_K=3 %, g_L=1 %, α=1/3. Wie groß ist g_A?","a":"g_A = 3 − (1/3)·3 − (2/3)·1 = 3 − 1 − 0,667 = <b>1,33 %</b>. Das sind 44 % des Outputwachstums — nicht erklärt durch Faktormengen.","s":"Makro VL02 (Solow)","sec":"Abschnitt 12.1","e":"e_residuum","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":24,"d":"m2","t":"Techn. Fortschritt","q":"Arbeitsvermehrender technischer Fortschritt — wie wird er modelliert?","a":"Y_t = F(K_t, A_t L_t). Das A steht <b>beim L</b>, nicht vor der Funktion — das ist die Definition von arbeitsvermehrend (labour-augmenting, Harrod-neutral). A_{t+1} = (1+a)A_t.","s":"Makro VL02 (Solow)","sec":"Abschnitt 13.1","e":"e_techfort","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":25,"d":"m2","t":"Techn. Fortschritt","q":"Bewegungsgleichung und Goldene Regel mit technischem Fortschritt?","a":"Δk^e = s·y^e − (a+n+δ)k^e; Gleichgewicht s·y^e = (a+n+δ)k^e; Goldene Regel r = a + n + δ. Größen je Effizienzeinheit: y^e = Y/(AL), k^e = K/(AL).","s":"Makro VL02 (Solow)","sec":"Abschnitt 13.2","e":"e_techfort","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":26,"d":"m2","t":"Techn. Fortschritt","q":"Was wächst im Steady State mit welcher Rate?","a":"Effektive Größen y^e, k^e (und r): <b>0</b>. Pro-Kopf-Größen y, k, w: <b>a</b>. Aggregate Y, K, AL: <b>a + n</b>.<br>Logik: y = y^e·A ⇒ g_y = 0 + a = a.","s":"Makro VL02 (Solow)","sec":"Abschnitt 13.3","e":"e_merktafel","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":27,"d":"m2","t":"Konvergenz","q":"Absolute vs. bedingte β-Konvergenz?","a":"Absolut: alle Länder streben demselben Einkommensniveau zu, Unterschiede verschwinden. Bedingt: Fundamentalfaktoren unterscheiden sich, jedes Land läuft zu seinem eigenen y*, aber wer weiter weg ist, wächst schneller.","s":"Makro VL02 (Solow)","sec":"Abschnitt 14.1","e":"e_konvergenz","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":28,"d":"m2","t":"Konvergenz","q":"Konvergenzgeschwindigkeit β = 0,02 — was folgt daraus?","a":"(y_t − y*)/y* = e^{−βt}·(y_0 − y*)/y*. Halbe Lücke: t = ln2/β = 34,7 ≈ <b>35 Jahre</b>. Eine Generation reicht gerade für die halbe Lücke.","s":"Makro VL02 (Solow)","sec":"Abschnitt 14.2","e":"e_konvergenz","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":29,"d":"m2","t":"Kritik","q":"Die vier Kritikpunkte am Solow-Modell?","a":"Alle Wachstumsdeterminanten sind exogen: 1) keine Konsum-Spar-Entscheidung der Haushalte, 2) keine Investitionsentscheidung der Firmen, 3) technischer Fortschritt „fällt wie Manna vom Himmel“, 4) andere Determinanten (politisches System, Demografie, Kultur) fehlen.","s":"Makro VL02 (Solow)","sec":"Abschnitt 15.1","e":"e_solowkritik","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":30,"d":"m2","t":"Kritik","q":"Endogenes Wachstum — die Schlüsselbedingung und drei Ansätze?","a":"Anhaltendes Pro-Kopf-Wachstum tritt bei <b>langfristig nicht sinkendem Realzins</b> auf, f′(k) darf nicht gegen null gehen. Ansätze: technologische Externalitäten (Romer 1986), produktive Staatsausgaben (Barro 1990), Humankapital (Lucas 1988).","s":"Makro VL02 (Solow)","sec":"Abschnitt 15.2","e":"e_endogen","f":"Makro_VL02_Wirtschaftswachstum_Solow.pdf"},{"i":31,"d":"m3","t":"Arbeitsangebot","q":"Wie wird das Arbeitsangebot hergeleitet — und wo bleibt die Arbeit im Nutzen?","a":"Aus der Nutzenmaximierung U(C, ℓ) über Konsum und <b>Freizeit</b>. Arbeit erscheint im Nutzen gar nicht: Der Haushalt wählt Freizeit, die Arbeitszeit ist der Rest des Zeitbudgets.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.1","e":"e_angebotidee","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":32,"d":"m3","t":"Arbeitsangebot","q":"Budgetbeschränkung des Haushalts und Tangentialbedingung?","a":"w(ℓ_max − ℓ) = p·C. Aus dem Lagrange-Ansatz folgt U_ℓ/U_C = |GRS| = <b>w/p</b>: subjektive Bewertung = Reallohn. Der Reallohn ist der Opportunitätskostenpreis der Freizeit.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.2","e":"e_haushaltsoptimum","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":33,"d":"m3","t":"Arbeitsangebot","q":"Freizeitnachfrage im Folienbeispiel U = C + ℓ^η — Formel und Vorzeichen?","a":"ℓ = [w/(ηp)]^{1/(η−1)} mit ∂ℓ/∂w &lt; 0 und ∂ℓ/∂p > 0. Der Exponent 1/(η−1) ist negativ, weil η &lt; 1 — deshalb kehrt sich die Wirkungsrichtung um.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.3","e":"e_freizeitnachfrage","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":34,"d":"m3","t":"Arbeitsangebot","q":"Reallohnanstieg: Einkommens- vs. Substitutionseffekt?","a":"Einkommenseffekt (−): höheres Einkommen ⇒ Anreiz, Arbeitszeit zu reduzieren. Substitutionseffekt (+): höhere Opportunitätskosten der Freizeit ⇒ Anreiz, mehr zu arbeiten. <b>Nettoeffekt theoretisch offen</b>; die Kurve kann rückwärtsgeneigt sein.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.4","e":"e_essub","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":35,"d":"m3","t":"Arbeitsangebot","q":"Welcher Effekt dominiert empirisch langfristig — und woran sieht man das?","a":"Der <b>Einkommenseffekt</b>. Der deutsche Reallohn stieg seit 1870 auf das 16,6-fache, die Jahresarbeitszeit fiel von 2.941 auf 1.383 Stunden — also fast auf die Hälfte.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.5","e":"e_essub","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":36,"d":"m3","t":"Arbeitsangebot","q":"Warum ist die aggregierte Arbeitsangebotskurve steigend, auch wenn die individuelle rückwärtsgeneigt sein kann?","a":"Wegen der <b>extensiven Marge</b>: Bei höherem Lohn treten zusätzliche Personen in den Arbeitsmarkt ein. Das überwiegt in der Summe die Stundenreduktion einzelner Beschäftigter.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.6","e":"e_aggregat","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":37,"d":"m3","t":"Arbeitsangebot","q":"Reservationslohn — Definition und wirtschaftspolitische Bedeutung?","a":"Der Lohnsatz, bei dem der Anbieter gerade indifferent zwischen Beschäftigung und Arbeitslosigkeit ist. Er steigt mit der <b>Outside Option</b> (ALG, Bürgergeld, Vermögen). Großzügigere Leistungen heben ihn und können die Beschäftigung senken.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 3.6","e":"e_reservationslohn","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":38,"d":"m3","t":"Arbeitsnachfrage","q":"Arbeitsnachfrage: Optimalitätsbedingungen kurz- und langfristig?","a":"Kurz (K fix): Π = F(L) − wL ⇒ <b>GP_L = w</b>. Lang: Π = F(K,L) − rK − wL ⇒ GP_L = w <i>und</i> GP_K = r. Die Grenzproduktkurve <b>ist</b> die Arbeitsnachfragekurve.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 4.1","e":"e_arbeitsnachfrage","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":39,"d":"m3","t":"Arbeitsnachfrage","q":"Warum fällt die Arbeitsnachfragekurve?","a":"Wegen des abnehmenden Grenzprodukts der Arbeit (F_LL &lt; 0). Bei fixem Kapitalstock teilen sich immer mehr Arbeiter dieselben Maschinen. Ist der Lohn hoch, wird GP_L = w früher erreicht.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 4.1","e":"e_arbeitsnachfrage","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":40,"d":"m3","t":"Arbeitsnachfrage","q":"Was bewirkt ein Produktivitätsanstieg auf dem Arbeitsmarkt?","a":"Die Arbeitsnachfragekurve verschiebt sich nach rechts/oben ⇒ <b>höherer Reallohn und höhere Beschäftigung gleichzeitig</b>. Das erklärt den historischen Reallohnanstieg — nicht Gewerkschaften, sondern Produktivität.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 4.2","e":"e_produktivitaet","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":41,"d":"m3","t":"Gleichgewicht","q":"Gibt es im Arbeitsmarktgleichgewicht Arbeitslosigkeit?","a":"<b>Keine unfreiwillige.</b> Jeder, der zum herrschenden Reallohn arbeiten will, findet eine Stelle. Dass L &lt; L_max ist, ist freiwillig gewählte Freizeit — nicht Arbeitslosigkeit.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 5.1","e":"e_amgleichgewicht","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":42,"d":"m3","t":"Gleichgewicht","q":"Merkregel für Verschiebungen im Arbeitsmarktdiagramm?","a":"Verschiebt sich die <b>Nachfrage</b>, bewegen sich w und L in die <b>gleiche</b> Richtung. Verschiebt sich das <b>Angebot</b>, bewegen sie sich <b>entgegengesetzt</b>.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 5.2","e":"e_amgleichgewicht","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":43,"d":"m3","t":"Abgrenzung","q":"Wie ist die Arbeitslosenquote definiert — und wo liegt die Falle?","a":"u = Arbeitslose / <b>Erwerbspersonen</b> (nicht Gesamtbevölkerung). Falle: Wandern Arbeitslose in die Stille Reserve ab, <b>sinkt</b> die Quote, obwohl sich die Lage verschlechtert hat.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 6.3","e":"e_alqdefinition","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":44,"d":"m3","t":"Abgrenzung","q":"OECD-Definition eines Arbeitslosen — die drei Kriterien?","a":"Eine Person, die in der Referenzperiode 1) <b>ohne Beschäftigungsverhältnis</b> ist, 2) <b>aktiv danach sucht</b> und 3) <b>bereit ist zu arbeiten</b>. Alle drei müssen gleichzeitig erfüllt sein.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 6.3","e":"e_alqdefinition","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":45,"d":"m3","t":"Empirie","q":"Qualifikationsstruktur der Arbeitslosigkeit in Deutschland 2023?","a":"Ohne abgeschlossene Berufsausbildung <b>20,8 %</b>, insgesamt 5,7 %, betriebliche/schulische Ausbildung 3,2 %, akademisch <b>2,5 %</b> — der Faktor acht. Arbeitslosigkeit ist überwiegend ein Problem der Geringqualifizierten.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 6.4","e":"e_qualifikation","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":46,"d":"m3","t":"Ursachen","q":"Systematik der Ursachen unfreiwilliger Arbeitslosigkeit?","a":"(a) <b>Lohnrigidität/Marktversagen</b>: Gewerkschaften, Mindestlöhne, Effizienzlöhne, Sozialversicherung. (b) <b>friktionell/strukturell</b>: sektoral, regional, technologisch, zyklisch.<br>(a) Der Lohn passt nicht. (b) Menschen und Stellen passen nicht zueinander.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 7.1","e":"e_ursachen","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":47,"d":"m3","t":"Ursachen","q":"Warum heißt die Arbeitslosigkeit bei Lohnrigidität „unfreiwillig“?","a":"Bei w̄ > w* liegt A auf der Nachfragekurve (realisierte Beschäftigung), B auf der Angebotskurve. Die Strecke A–B würde zum herrschenden Lohn arbeiten wollen, findet aber keine Stelle. <b>Die kurze Marktseite bestimmt die Menge.</b>","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 7.2","e":"e_lohnrigiditaet","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":48,"d":"m3","t":"Gewerkschaften","q":"Organisationsgrad vs. Deckungsgrad — Unterschied und Beispiel?","a":"Organisationsgrad = Anteil <b>Gewerkschaftsmitglieder</b>. Deckungsgrad = Anteil, dessen Lohn durch <b>Tarifvertrag</b> bestimmt wird. Frankreich 2016: nur 9 % Mitglieder, aber <b>98 %</b> Tarifbindung. Ökonomisch zählt der Deckungsgrad.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 7.3","e":"e_gewerkschaften","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":49,"d":"m3","t":"Gewerkschaften","q":"Gewerkschaft als Nutzenmaximierer — Präferenzen und Optimalbedingung?","a":"Stone-Geary: U(w − w_ref, L − L_ref) mit U_w, U_L > 0 und U_ww, U_LL &lt; 0. Optimalbedingung U_w/U_L = −L′(w). Die Gewerkschaft ist monopolistischer Preissetzer unter der Nachfragerestriktion.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 7.3","e":"e_gewerkschaften","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":50,"d":"m3","t":"Effizienzlöhne","q":"Effizienzlöhne — die fünf Schritte des Arguments?","a":"1) Arbeiter zieht Faulenzen vor (shirking). 2) Anstrengung ist unbeobachtbar ⇒ Moral Hazard. 3) Bei Entdeckung droht Entlassung. 4) Anreizkompatibler Vertrag zahlt Lohn > Grenzprodukt. 5) Lohn > GP_L ⇒ weniger Nachfrage ⇒ unfreiwillige Arbeitslosigkeit.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 7.5","e":"e_effizienzlohn","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":51,"d":"m3","t":"Effizienzlöhne","q":"Warum ist die Effizienzlohn-Erklärung besonders elegant?","a":"Das Unternehmen zahlt den überhöhten Lohn <b>freiwillig</b>, nicht aufgezwungen. Und: Arbeitslosigkeit ist hier ein <b>notwendiger Bestandteil des Anreizsystems</b> — nur so ist die Entlassungsdrohung glaubwürdig.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 7.5","e":"e_effizienzlohn","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":52,"d":"m3","t":"Dynamik","q":"Arbeitsmarktdynamik: ΔU und die friktionelle Quote?","a":"ΔU = sL − fU (Zugänge minus Abgänge). Im Gleichgewicht sL = fU ⇒ <b>u^f = s/(s+f)</b>, mit du/df &lt; 0 und du/ds > 0. Durchschnittliche Verweildauer = 1/f.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 8.2","e":"e_friktionell","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":53,"d":"m3","t":"Dynamik","q":"Warum verrät die Arbeitslosenquote allein zu wenig?","a":"s=0,02/f=0,15 und s=0,04/f=0,30 ergeben beide u^f = 11,76 % — einmal wenige Betroffene, die lange arbeitslos sind, einmal viele, die kurz arbeitslos sind. Man braucht die Stromgrößen dazu.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 8.2","e":"e_friktionell","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":54,"d":"m3","t":"Natürliche ALQ","q":"Natürliche Arbeitslosenquote — Definition nach Friedman/Phelps?","a":"Der hypothetische Wert u*, der sich einstellt, wenn die Produktion <b>in Abwesenheit temporärer Friktionen</b> auf ihrem langfristigen Niveau ist. Bestimmt durch <b>angebotsseitige</b> Faktoren: Technologiestand, Qualifikationsniveau, Institutionen.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 9.1","e":"e_natuerlicheALQ","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":55,"d":"m3","t":"Natürliche ALQ","q":"Zerlegung der Arbeitslosigkeit und die Politikkonsequenz?","a":"tatsächliche ALQ = natürliche ALQ (u*) + zyklische Arbeitslosigkeit.<br><b>Gegen zyklische hilft Nachfragepolitik, gegen die natürliche nur Angebotspolitik.</b> Nachfragepolitik gegen u* erzeugt langfristig nur Inflation.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 9.1","e":"e_natuerlicheALQ","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":56,"d":"m3","t":"Natürliche ALQ","q":"Ist die „natürliche“ Arbeitslosenquote naturgegeben?","a":"Nein. Deutschlands Schätzwert fiel von 8,3 % (2000er) auf 4,8 % (2010er) — rund 40 % in einer Dekade. Sie hängt von Institutionen und Qualifikation ab, ist also politisch beeinflussbar, nur nicht kurzfristig und nicht über die Nachfrage.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 9.2","e":"e_natuerlicheALQ","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":57,"d":"m3","t":"Persistenz","q":"Sechs Erklärungen für die Persistenz der Arbeitslosigkeit in Europa?","a":"1) Schocks mit zu kurzen Erholungsphasen. 2) Arbeitsmarktinstitutionen. 3) Productivity Slowdown. 4) Öffnungsgrad/Globalisierung. 5) Sozialisierung der Verteilungsaufgabe (Vorruhestand, ALG-Bezugsdauer). 6) Gegenläufig: demographischer Wandel.","s":"Makro VL03 (Arbeitsmarkt)","sec":"Abschnitt 9.4","e":"e_persistenz","f":"Makro_VL03_Arbeitsmarkt_Arbeitslosigkeit.pdf"},{"i":58,"d":"m4","t":"Geldfunktionen","q":"Die drei Geldfunktionen?","a":"<b>Tauschmittel</b> (befreit von der doppelten Koinzidenz der Wünsche), <b>Recheneinheit</b> (Numéraire, reduziert die Zahl der relativen Preise), <b>Wertaufbewahrungsmittel</b> (intertemporaler Werttransfer).","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Kapitel 3","e":"e_geldfunktionen","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":59,"d":"m4","t":"Geldfunktionen","q":"Wie viele relative Preise gibt es mit und ohne Numéraire?","a":"Ohne: n(n−1)/2 — bei 100 Gütern <b>4.950</b>. Mit Numéraire: n−1, also <b>99</b>.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Kapitel 3","e":"e_geldfunktionen","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":60,"d":"m4","t":"Neutralität","q":"Geldneutralität — Definition und Einschränkung?","a":"Geld wirkt nur auf das Preisniveau und lässt die reale Seite unbeeinflusst („Schleier über der Volkswirtschaft“). <b>Einschränkung: Das gilt nur langfristig.</b> Kurzfristig kann Geldpolitik reale Wirkung entfalten.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Kapitel 4","e":"e_neutralitaet","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":61,"d":"m4","t":"Quantitätstheorie","q":"Cambridge-Gleichung und ihre Aussage?","a":"M·v = P·Y. Die nominale Geldnachfrage ist proportional zum nominalen BIP. v ist die Umlaufgeschwindigkeit.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 5.1","e":"e_cambridge","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":62,"d":"m4","t":"Quantitätstheorie","q":"Reale Geldnachfrage und der Kassenhaltungskoeffizient?","a":"M/P = k·Y mit k = 1/v. k ist der Anteil des Jahreseinkommens, der als Geld gehalten wird. v = 5 ⇒ k = 0,2. Wer viel Kasse hält (großes k), gibt selten aus (kleines v).","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 5.2","e":"e_cambridge","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":63,"d":"m4","t":"Quantitätstheorie","q":"Warum ist die Geldangebotskurve senkrecht und die Nachfragekurve fallend?","a":"Angebot senkrecht: Die Zentralbank setzt M unabhängig vom Preisniveau (Mengensetzer). Nachfrage fallend: Bei höherem P braucht man nominal mehr Geld für dieselben realen Transaktionen.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 5.3","e":"e_geldmarkt4","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":64,"d":"m4","t":"Dichotomie","q":"Dynamisierte Cambridge-Gleichung und Dichotomie?","a":"g_M = g_k + g_P + g_Y (Produktregel). Bei stationärem k und real bestimmtem g_Y folgt <b>g_M = g_P</b>: Inflation ist langfristig ein rein monetäres Phänomen.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitte 6.1–6.2","e":"e_dichotomie","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":65,"d":"m4","t":"Dichotomie","q":"Auf welchen drei Annahmen beruht g_M = g_P?","a":"1) g_k = 0 (stationärer Kassenhaltungskoeffizient). 2) g_Y unabhängig von g_M (Dichotomie). 3) Langfristige Betrachtung. Fällt eine weg, gilt die Reinform nicht mehr.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 6.2","e":"e_dichotomie","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":66,"d":"m4","t":"Inflation","q":"Inflation in einer wachsenden Volkswirtschaft — Formel und Übertragungsweg?","a":"π = g_M − g_Y. Der Weg: zu viel Geld → mehr Ausgaben → Überschussnachfrage am Gütermarkt → steigende Preise. Die Geldmenge wirkt <b>nicht direkt</b> auf die Preise.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 6.3","e":"e_inflation4","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":67,"d":"m4","t":"Geldpolitik","q":"Warum wurde die Geldmengensteuerung aufgegeben?","a":"Offene Volkswirtschaft und freier Devisenverkehr, <b>veränderte Zahlungsgewohnheiten</b> (v und k nicht mehr stabil), Koordinationsbedarf im Euroraum. Heute: Steuerung über den <b>Preis</b> des Geldes statt über die Menge.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 7.1","e":"e_mengensteuerung","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":68,"d":"m4","t":"Fisher","q":"Fisher-Gleichung?","a":"r = i − π (bzw. präziser i = r + π^e). Der Realzins ist der Nominalzins minus Inflation. Bei i = 5 % und π = 6 % ist r = −1 %.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 7.2","e":"e_fisher","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":69,"d":"m4","t":"Wechselkurs","q":"Nominaler vs. realer Wechselkurs — Definitionen?","a":"Nominal: relativer Preis der <b>heimischen Währung</b> in Einheiten ausländischer Währung. Real: relativer Preis <b>heimischer Güter</b> in Einheiten ausländischer Güter. Real = um die Geldpreise bereinigter nominaler Kurs.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.1","e":"e_wechselkurs","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":70,"d":"m4","t":"Wechselkurs","q":"Mengen- vs. Preisnotierung — und was bedeutet ein steigendes S?","a":"Mengennotierung: ausländische Währung je Einheit heimischer Währung. In dieser (Vorlesungs-)Konvention bedeutet <b>steigendes S = Aufwertung</b>. In Preisnotierung genau umgekehrt.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.2","e":"e_notierung","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":71,"d":"m4","t":"Wechselkurs","q":"Realer Wechselkurs — Formel und Lesart?","a":"σ = S·P/P*. P ist der Preis heimischer Güter in heimischer Währung, S·P derselbe Preis in ausländischer Währung, geteilt durch P* ergibt ein reines <b>Güterverhältnis</b>.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.3","e":"e_realerWK","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":72,"d":"m4","t":"Wechselkurs","q":"Reale Aufwertung (σ steigt) — gut oder schlecht?","a":"<b>Beides.</b> Gut: Terms of Trade verbessern sich, man bekommt je Exporteinheit mehr Importgüter. Schlecht: preisliche Wettbewerbsfähigkeit verschlechtert sich, Exporte gehen zurück. Eine vollständige Antwort nennt beide.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.3","e":"e_realerWK","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":73,"d":"m4","t":"Wechselkurs","q":"Änderung des realen Wechselkurses — Formel und Spezialfall?","a":"g_σ = g_S + π − π*. Bei <b>festen</b> Wechselkursen (g_S = 0): g_σ = π − π*. Wer dauerhaft mehr Inflation hat als seine Partner, wertet real auf und verliert Wettbewerbsfähigkeit.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.4","e":"e_wkaenderung","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":74,"d":"m4","t":"Wechselkurs","q":"Effektiver Wechselkurs — wie wird aggregiert?","a":"Als <b>gewichtetes geometrisches Mittel</b> aller bilateralen realen Kurse: σ = Π (S_i·P/P_i)^{ω_i} mit Σω_i = 1. Gewichte sind Handelsanteile. Geometrisch, weil Wechselkurse Verhältniszahlen sind.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.5","e":"e_effektiverWK","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":75,"d":"m4","t":"Wechselkurs","q":"Externe vs. interne Terms of Trade?","a":"Extern: Exportpreise/Importpreise — Verhältnis zum Ausland. Intern: Preise <b>nichthandelbarer</b> Güter / Preise <b>handelbarer</b> Güter — Verhältnis zwischen geschütztem und dem Weltmarkt ausgesetztem Sektor.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 8.5","e":"e_effektiverWK","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":76,"d":"m4","t":"PPP","q":"Absolute vs. relative Kaufkraftparität?","a":"Absolut: σ = S·P/P* = <b>1</b> (Gesetz der Unterschiedslosigkeit der Preise, Jevons). Relativ: σ = <b>konstant</b> — Preisunterschiede dürfen bestehen, aber nicht wachsen. Die relative Version ist empirisch besser haltbar.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitte 9.1–9.2","e":"e_ppp","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":77,"d":"m4","t":"PPP","q":"Was impliziert Kaufkraftparität für die Wachstumsraten?","a":"g_σ = 0 und <b>g_S = π* − π</b>. Geldneutralität gilt auch international: Mehr Inflation ändert nur den nominalen Wechselkurs, nicht den realen.","s":"Makro VL04 (Geld/Wechselkurs)","sec":"Abschnitt 9.3","e":"e_ppp","f":"Makro_VL04_Geld_Preisniveau_Wechselkurs.pdf"},{"i":78,"d":"m5","t":"Erwartungen","q":"Rationale Erwartungen (Muth 1961) — was bedeuten sie genau?","a":"Korrekte Prognosen <b>ohne systematischen Fehler</b>; die Erwartungsbildung ist im Durchschnitt korrekt. Nicht: dass niemand sich irrt — die Fehler sind zufällig und heben sich im Mittel auf.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 2.3","e":"e_ratErw","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":79,"d":"m5","t":"Budgetrestriktion","q":"Intertemporale Budgetrestriktion in Barwertform?","a":"C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r) ± B₁ = Ω. <b>Es zählt nur das Vermögen Ω, nicht die zeitliche Verteilung des Einkommens.</b>","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 3.3","e":"e_ibr","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":80,"d":"m5","t":"Budgetrestriktion","q":"Warum hat die Budgetgerade die Steigung −(1+r), und was folgt daraus für Zinsänderungen?","a":"Verzichtet man heute auf eine Einheit Konsum, bekommt man morgen 1+r. Der Ausstattungspunkt liegt <b>immer</b> auf der Geraden ⇒ bei Zinsänderung <b>dreht</b> sie sich um diesen Punkt (statt sich parallel zu verschieben).","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 3.1","e":"e_budgetgerade","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":81,"d":"m5","t":"Budgetrestriktion","q":"Transversalitätsbedingung — Formel und Zweck?","a":"B₂/(1+r) = 0. Sie stellt sicher, dass (a) kein Vermögen verschwendet und (b) keine Restschuld hinterlassen wird ⇒ <b>Ausschluss von Ponzi-Spielen</b>.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 3.4","e":"e_tvb","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":82,"d":"m5","t":"Firmenoptimum","q":"Optimaler Kapitalstock der Firma im Zwei-Perioden-Modell?","a":"GP_K = 1 + r. <b>Warum 1+r und nicht r?</b> Über zwei Perioden kommt das eingesetzte Kapital selbst zurück (die 1) plus die Verzinsung (das r). Im Solow-Modell mit laufender Abschreibung stand GP_K = r + δ.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitte 4.2 / 8.1","e":"e_gpk1r","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":83,"d":"m5","t":"Firmenoptimum","q":"Firmenwert und Risikoprämie?","a":"V = F(K,L)/(1+r) − I^netto > 0. Eine Investition lohnt, wenn ihr Gegenwartswert positiv ist. Bei Risiko gilt GP_K = 1 + r + Risikoprämie.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 4.3","e":"e_firmenwert","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":84,"d":"m5","t":"Firmenoptimum","q":"Modigliani-Miller-Theorem — Aussage und Intuition?","a":"Für die Höhe des Haushaltsvermögens ist es unbedeutsam, ob Investitionen eigen- oder fremdfinanziert werden. Der Haushalt steht auf <b>beiden Seiten der Bilanz</b> — es verschiebt nur die Etiketten.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 4.4","e":"e_mm","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":85,"d":"m5","t":"Staat","q":"Staatliche Budgetrestriktion über zwei Perioden?","a":"D₁ = [T₁ + T₂/(1+r_G)] − [G₁ + G₂/(1+r_G)]. Bestehende Schulden sind ein <b>Versprechen auf zukünftige Überschüsse</b> — dieselbe Transversalitätsbedingung wie beim Haushalt.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 5.1","e":"e_staatbr","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":86,"d":"m5","t":"Staat","q":"Primärsaldo — Definition und warum er zählt?","a":"Budgetsaldo <b>ohne</b> Zinszahlungen, also T − G. Die Zinsen r_G·D₁ stammen aus früheren Entscheidungen und sind heute nicht mehr beeinflussbar; der Primärsaldo ist die politisch steuerbare Größe.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 5.1","e":"e_primaersaldo","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":87,"d":"m5","t":"Staat","q":"Crowding out — der Rechenschritt und die Konsequenz?","a":"Setzt man die staatliche in die private Budgetbeschränkung ein, <b>verschwinden die Steuern T</b> und werden durch G ersetzt: C₁ + C₂/(1+r) = (Y₁−G₁) + (Y₂−G₂)/(1+r). Der private Sektor internalisiert die staatliche Budgetbeschränkung vollständig.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 5.3","e":"e_crowdingout","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":88,"d":"m5","t":"Ricardo","q":"Ricardianische Äquivalenz — Aussage?","a":"Die <b>zeitliche Aufteilung</b> von Staatsausgaben und Steuern ist irrelevant für das Vermögen der Haushalte. Ob G₁ heute durch Steuern oder durch Verschuldung finanziert wird, ändert den Barwert der Steuerlast nicht.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 5.4","e":"e_ricardo","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":89,"d":"m5","t":"Ricardo","q":"Sechs Bruchstellen der Ricardianischen Äquivalenz?","a":"1) Unvollkommene Kapitalmärkte (Kreditrestriktionen; r ≠ r_G). 2) Unsicherheit/Risikoaversion. 3) Verzerrende Besteuerung. 4) Bevölkerungswachstum. 5) Fiskalillusion. 6) Ponzi-Spiele/Staatsbankrott.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 5.5","e":"e_ricardobruch","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":90,"d":"m5","t":"Ricardo","q":"Was passiert, wenn r ≠ r_G?","a":"Zusatzterm [(r−r_G)/(1+r)]·(G₁−T₁) im privaten Vermögen. <b>Geringere Kreditkosten des Staates subventionieren den privaten Sektor</b> — die Verschuldung ist dann nicht mehr neutral.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 5.5","e":"e_ricardobruch","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":91,"d":"m5","t":"Ausland","q":"Primärleistungsbilanz — Formel und Parallele?","a":"PLB = LBS − r·F mit LBS = X − Z und F als Nettoauslandsposition. Begrifflich dieselbe Konstruktion wie der Primärsaldo des Staates: Zinsen auf Altbestände herausrechnen.","s":"Makro VL05 (Güternachfrage)","sec":"Kapitel 6","e":"e_plb","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":92,"d":"m5","t":"Konsum","q":"Intertemporale Präferenzen — Nutzenfunktion und Diskontfaktor?","a":"V(C₁,C₂) = U(C₁) + b·U(C₂), additiv-separabel, mit b = 1/(1+ρ). ρ ist die <b>subjektive Zeitpräferenzrate</b> (Ungeduld): je größer ρ, desto kleiner b.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.2","e":"e_praeferenzen","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":93,"d":"m5","t":"Konsum","q":"Was misst die intertemporale Substitutionselastizität σ?","a":"Wie bereitwillig ein Haushalt Konsum zwischen den Perioden verschiebt, wenn sich der Zins ändert. Großes σ: schichtet leicht um. Kleines σ: starke Präferenz für Konsumglättung. <b>Achtung:</b> hier <i>nicht</i> der reale Wechselkurs.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.2","e":"e_ies","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":94,"d":"m5","t":"Konsum","q":"Euler-Gleichung — Formel und Lesart?","a":"U′(C₁) = b(1+r)·U′(C₂). Links der Nutzenverlust einer heute weniger konsumierten Einheit, rechts der diskontierte Nutzengewinn morgen. Im Optimum gleich — „Grenznutzen = Grenzkosten“ über die Zeit.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.3","e":"e_euler","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":95,"d":"m5","t":"Konsum","q":"Zeitpfade des Konsums — die drei Fälle?","a":"r = ρ ⇒ konstanter Konsum. r > ρ ⇒ wachsender Konsum. r &lt; ρ ⇒ sinkender Konsum.<br>Merkregel: <b>Der Konsum wächst genau dann, wenn der Markt geduldiger belohnt, als der Haushalt ungeduldig ist.</b>","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.4","e":"e_zeitpfade","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":96,"d":"m5","t":"Konsum","q":"Konsumfunktion bei isoelastischer Nutzenfunktion?","a":"C₁ = μ·Ω mit μ = 1/(1 + b^σ(1+r)^{σ−1}). Der Konsum ist ein <b>konstanter Anteil des Gesamtvermögens</b>, nicht des laufenden Einkommens — der formale Kern der Permanent-Income-Hypothese.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.5","e":"e_pih","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":97,"d":"m5","t":"Konsum","q":"Die drei Effekte einer Zinserhöhung auf den heutigen Konsum?","a":"Substitutionseffekt <b>(−)</b>, Einkommenseffekt <b>(+)</b>, Vermögenseffekt <b>(−)</b>. Der Vermögenseffekt allein ist eindeutig positiv (dC₁/dΩ > 0); der Nettoeffekt einer Zinsänderung ist <b>unbestimmt</b>.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.6","e":"e_zinseffekte","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":98,"d":"m5","t":"Konsum","q":"Random-Walk-Theorie des Konsums — Begründung und Implikation?","a":"Ist alles Vorhersehbare eingeplant, ändert sich der Konsum nur bei Überraschungen; die beste Prognose für morgen ist der heutige Konsum (Hall 1978). Implikation: Eine <b>angekündigte</b> Steuersenkung wirkt schon bei der Ankündigung.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.7","e":"e_randomwalk","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":99,"d":"m5","t":"Konsum","q":"Konsumfunktion allgemein — Argumente und Vorzeichen?","a":"C = C(r^?, Ω^+, Y^{d,+}). r unbestimmt (drei gegenläufige Effekte), Ω positiv, verfügbares Einkommen positiv — letzteres, weil nicht alle Haushalte perfekt am Kapitalmarkt agieren können.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.7","e":"e_randomwalk","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":100,"d":"m5","t":"Konsum","q":"Was bewirken Kreditrestriktionen?","a":"Die Budgetgerade knickt am Ausstattungspunkt (Sollzins > Habenzins), im Extremfall wird sie senkrecht. <b>Ein kreditbeschränkter Haushalt kann nicht glätten</b> — sein Konsum folgt dem laufenden Einkommen. Zugleich Bruchstelle der Ricardianischen Äquivalenz.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 7.8","e":"e_kreditrestriktion","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":101,"d":"m5","t":"Investition","q":"Akzeleratorprinzip — Formeln?","a":"K₂ = ν·Y₂^e ⇒ I₁ = ν·ΔY^e und I₁/Y₁ = ν·g_Y^e. Für ν > 1 reagieren Investitionen <b>überproportional</b> — laut Folie der empirisch relevante Fall.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 8.2","e":"e_akzelerator","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":102,"d":"m5","t":"Investition","q":"Multiplikator-Akzelerator-Modell (Harrod) — der Rückkopplungskreis?","a":"Akzelerator: mehr erwartetes Wachstum → mehr Investition. Multiplikator: mehr Investition → mehr Einkommen → mehr erwartetes Wachstum. Die Schleife kann <b>endogene Konjunkturzyklen</b> erzeugen (inflatorische/deflatorische Lücke).","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 8.3","e":"e_multakz","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":103,"d":"m5","t":"Investition","q":"Tobins q — Definition und Investitionsregel?","a":"q = Marktwert des installierten Kapitals / Wiederbeschaffungskosten. Regel: <b>investiere, solange q > 1, hör auf, wenn q = 1</b>. Bei q &lt; 1 wäre eine Übernahme günstiger als eigene Investition.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 8.4","e":"e_tobinq","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":104,"d":"m5","t":"Investition","q":"Anpassungskosten und die vollständige Investitionsfunktion?","a":"GP_K/(1+r) = 1 + φ mit φ′(I) > 0 ⇒ graduelle Anpassung. Investitionsfunktion: <b>I = I(r^−, q^+, ΔY^+)</b> — sie fasst Grenzproduktivitätsbedingung, q-Theorie und Akzelerator zusammen.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 8.5","e":"e_anpassungskosten","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":105,"d":"m5","t":"Staatsausgaben","q":"Warum stellt der Markt öffentliche Güter nicht bereit?","a":"Nichtrivalität + Nichtausschließbarkeit ⇒ Trittbrettfahrerproblem. Schärfer (VL11): Bei C′ = 0 würde die Bedingung p = C′ eine <b>kostenlose Abgabe</b> erzwingen — die Fixkosten wären nicht gedeckt.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 9.1","e":"e_oeffentlicheGueter","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":106,"d":"m5","t":"Staatsausgaben","q":"Wie groß ist der haushaltspolitische Spielraum — und was folgt daraus?","a":"Nur ca. <b>2–5 %</b>; 95–98 % der Ausgaben sind prädeterminiert. Folge: Kurzfristige diskretionäre Konjunktursteuerung über G ist praktisch kaum möglich — ein Argument für <b>automatische Stabilisatoren</b>.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 9.1","e":"e_haushaltsspielraum","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":107,"d":"m5","t":"Besteuerung","q":"Zusatzlast der Besteuerung und die Mirrlees-Regel?","a":"Die Steuer treibt einen Keil zwischen Käufer- und Verkäuferpreis; beidseitig vorteilhafte Transaktionen unterbleiben. Dieser Verlust kommt <b>niemandem</b> zugute. Regel: <b>Besteuere dort, wo Angebot bzw. Nachfrage unelastisch ist.</b>","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 9.3","e":"e_zusatzlast","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":108,"d":"m5","t":"Besteuerung","q":"„Doppelbesteuerung der Ersparnis“ — was ist gemeint?","a":"Wer spart, hat sein Einkommen bereits versteuert; die Zinserträge werden <b>ein zweites Mal</b> besteuert. Wer sofort konsumiert, zahlt nur einmal. Folge: negativer Akkumulationsanreiz.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 9.4","e":"e_anreizsteuer","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":109,"d":"m5","t":"Besteuerung","q":"Warum ist eine Kopfsteuer maximal effizient und trotzdem problematisch?","a":"Pauschalbetrag pro Person ⇒ verzerrt gar nichts, Zusatzlast null. Aber ein fester Betrag belastet niedrige Einkommen prozentual stärker ⇒ <b>regressiv</b>. Der equity-efficiency-Trade-off in Reinform.","s":"Makro VL05 (Güternachfrage)","sec":"Abschnitt 9.4","e":"e_anreizsteuer","f":"Makro_VL05_Aggregierte_Gueternachfrage.pdf"},{"i":110,"d":"m6","t":"Aggregate","q":"Die vier Geldmengenaggregate?","a":"<b>M0</b> = Bargeldumlauf + Bankreserven (Geldbasis). <b>M1</b> = Bargeld + Sichtguthaben. <b>M2</b> = M1 + Termin-/Spareinlagen mit unbeschränkter Verfügbarkeit. <b>M3</b> = M2 + längere Kündigungsfristen + Konten bei Finanzintermediären.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 2.3","e":"e_aggregate","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":111,"d":"m6","t":"Aggregate","q":"Warum ist M0 eine Sonderrolle?","a":"Es ist das einzige Aggregat, das die Zentralbank <b>direkt</b> kontrolliert — daher „Geldbasis“. Alles darüber entsteht erst durch Kreditvergabe der Geschäftsbanken. M0 ist zugleich die Passivseite der Zentralbankbilanz.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitte 2.3 / 3.4","e":"e_aggregate","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":112,"d":"m6","t":"Geldschöpfung","q":"Warum ist Reservehaltung für Banken unattraktiv — und warum ist das der Hebel der Geldpolitik?","a":"<b>Reserven sind unverzinslich</b>, Banken halten also so wenig wie möglich. Genau deshalb ist die Mindestreserve eine bindende Restriktion und damit ein wirksames Steuerungsinstrument.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.2","e":"e_reserven","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":113,"d":"m6","t":"Geldschöpfung","q":"Was ist Fristentransformation — und wo liegt das Risiko?","a":"Banken nehmen kurzfristig auf (Sichteinlagen) und verleihen langfristig. Risiko: Wollen alle Einleger gleichzeitig ihr Geld, kann die Bank nicht zahlen, obwohl sie solvent ist — ein <b>Bank Run</b>.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.3","e":"e_fristentrafo","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":114,"d":"m6","t":"Geldschöpfung","q":"Geldschöpfungsmultiplikator — einfache und erweiterte Formel?","a":"Einfach: m = 1/rr (bei rr = 10 % also m = 10; aus 1.000 werden 10.000 Einlagen). Mit Bargeldabzugsquote c: m = (1+c)/(c+rr) — bei c = 0,15 und rr = 0,10 nur noch 4,6.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.5","e":"e_multiplikator6","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":115,"d":"m6","t":"Geldschöpfung","q":"Wo refinanzieren sich Banken — und in welcher Kostenreihenfolge?","a":"1) Einlagen des privaten Sektors (am billigsten), 2) Interbankenmarkt (EONIA, EURIBOR), 3) Zentralbank (am teuersten, „lender of last resort“). Die Zentralbank ist bewusst die teuerste Quelle und setzt so eine Obergrenze für den Interbankenzins.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.5","e":"e_refinanzierung","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":116,"d":"m6","t":"Geldnachfrage","q":"Die drei Motive der Geldhaltung (plus Spezialfall)?","a":"<b>Transaktionsmotiv</b> (Tauschmittel), <b>Vorsichtsmotiv</b> (unvorhergesehene Zahlungen), <b>Portfoliotheorie</b> (Ertrag und Risiko der Anlage). Spezialfall: <b>Spekulationsmotiv</b> — bei niedrigen Zinsen erwartet man Zinsanstieg und Kursverluste, also bleibt man liquide.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 4.1","e":"e_geldmotive","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":117,"d":"m6","t":"Geldnachfrage","q":"Zusammenhang Zins und Anleihekurs?","a":"<b>Gegenläufig.</b> Eine Anleihe zahlt einen festen Kupon; steigt das Marktzinsniveau, wird der alte Kupon unattraktiv und der Kurs fällt. Ohne diesen Zusammenhang lassen sich weder Spekulationsmotiv noch Geldmarktanpassung erklären.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 4.1","e":"e_zinskurs","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":118,"d":"m6","t":"Geldnachfrage","q":"Geldnachfragefunktion und ihre Vorzeichen?","a":"M^d = k(i)·P·Y mit k′(i) &lt; 0. Preisniveau P (+), Realeinkommen Y (+), Nominalzins i (−). Der Nominalzins ist der <b>Opportunitätskostenpreis der Geldhaltung</b>.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 4.2","e":"e_geldnachfrage","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":119,"d":"m6","t":"Geldnachfrage","q":"Was ist der Fortschritt gegenüber Teil 4?","a":"Dort war k konstant, hier ist <b>k = k(i)</b>. Erst durch die Zinsabhängigkeit der Geldnachfrage bekommt die Geldpolitik einen kurzfristigen Hebel — und erst dadurch wird der Zusammenhang M↔P kurzfristig instabil.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 4.2","e":"e_geldnachfrage","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":120,"d":"m6","t":"Geldmarkt","q":"Kurzfristiges Geldmarktgleichgewicht — Annahmen und Bedingung?","a":"Kurzfristig sind <b>Y und P konstant</b>; das reale Geldangebot ist exogen. Markträumung: M^s = M^d = k(i*)·P·Y. Auf der vertikalen Achse steht hier <b>i</b>, in Teil 4 stand dort P.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 4.3","e":"e_geldmarkt6","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":121,"d":"m6","t":"Geldmarkt","q":"Anpassungsprozess bei Überschussnachfrage nach Geld — die Kette?","a":"Wirtschaftssubjekte verkaufen Wertpapiere oder nehmen Kredite auf ⇒ Konkurrenz treibt den Nominalzins ⇒ Überschussangebot am Wertpapiermarkt ⇒ <b>Kurse fallen</b> ⇒ neues Gleichgewicht bei höherem Zins.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 4.4","e":"e_geldmarktanpassung","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":122,"d":"m6","t":"Geldpolitik","q":"Ziele, Mittel und Träger der Geldpolitik?","a":"Ziele: <b>Preisstabilität vorrangig</b>, Wechselkursstabilität und Wachstum nachrangig. Mittel: Offenmarktgeschäfte, ständige Fazilitäten, Mindestreserven. Träger: ESZB/EZB, ausgeführt durch die nationalen Zentralbanken.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.1","e":"e_geldpolitikziele","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":123,"d":"m6","t":"Geldpolitik","q":"Kann die Zentralbank die Inflation direkt steuern?","a":"<b>Nein.</b> Sie hat kein Instrument namens „Inflation“ — sie setzt Zinsen bzw. Liquidität und hofft auf eine Wirkungskette über den Bankensektor. Die Inflation ist ein Ergebnis, kein Stellhebel. Deshalb ist Glaubwürdigkeit so zentral.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.2","e":"e_inflationsteuerung","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":124,"d":"m6","t":"Geldpolitik","q":"Der Zinskorridor — welche drei Leitzinsen und welche Rolle?","a":"<b>Spitzenrefinanzierungsfazilität</b> = Obergrenze, <b>Einlagenfazilität</b> = Untergrenze, <b>Hauptrefinanzierungssatz</b> dazwischen. EONIA und EURIBOR verlaufen zwingend innerhalb dieses Korridors.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.5","e":"e_zinskorridor","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":125,"d":"m6","t":"Geldpolitik","q":"Warum schließen sich Preis- und Mengensteuerung aus?","a":"Der Geldmarkt hat <b>eine</b> Gleichgewichtsbedingung mit <b>zwei</b> Variablen (i und M). Setzt man eine fest, ergibt sich die andere. Grafisch: Mengenpolitik = senkrechte Angebotskurve, Zinspolitik = waagerechte.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.6","e":"e_preismenge","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":126,"d":"m6","t":"Taylor-Regel","q":"Taylor-Regel — Formel und Bedeutung der Terme?","a":"i − ī = a(π − π̄) + b·(Y − Ȳ)/Ȳ. Erster Term: Inflationslücke, zweiter: Outputlücke. ī ist der neutrale Zins, a und b die Reaktionsgewichte.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.7","e":"e_taylor","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":127,"d":"m6","t":"Taylor-Regel","q":"Warum muss a > 1 sein (Taylor-Prinzip)?","a":"Damit bei steigender Inflation der <b>Realzins</b> r = i − π überhaupt steigt, muss der Nominalzins um <i>mehr</i> als einen Prozentpunkt steigen. Bei a &lt; 1 würde die Geldpolitik die Inflation anheizen statt sie zu bremsen.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.7","e":"e_taylor","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":128,"d":"m6","t":"Geldpolitik","q":"Was ist die Zero Lower Bound — und was ist die Antwort darauf?","a":"Der Nominalzins kann kaum unter null fallen, weil Bargeld immerhin null bietet. Der klassische Zinskanal ist dann erschöpft. Antwort: <b>Quantitative Easing</b> — Aufkauf langfristiger Wertpapiere, um die langen Zinsen zu drücken.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 6.1","e":"e_zlb","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":129,"d":"m6","t":"Geldpolitik","q":"Warum regelgebundene statt diskretionärer Geldpolitik?","a":"Wenn alle wissen, dass die Zentralbank eventuell doch Inflation zulässt, <b>erwarten</b> sie genau das — und die Erwartung erzeugt die Inflation. Eine glaubwürdig gebundene Zentralbank erreicht ihr Ziel zu geringeren Kosten.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 6.2","e":"e_regelbindung","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":130,"d":"m6","t":"Geldpolitik","q":"Monetisierung der Staatsschuld und Seignorage?","a":"Direkte Kreditvergabe an den Staat oder Aufkauf von Staatspapieren. Folgen: Multiplikatoreffekte auf die Geldmenge, <b>Verlust der geldpolitischen Unabhängigkeit</b>, Gefährdung der Preisstabilität. Seignorage: Geld wird zum Nennwert, nicht zu Produktionskosten emittiert.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 6.3","e":"e_seignorage","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":131,"d":"m6","t":"Empirie","q":"Geldmengenaggregate Euroraum 2019 — Größenordnungen?","a":"M0 = 3.249 Mrd. € (27,3 % des BIP), M1 = 8.944, M2 = 12.378, M3 = 12.996 Mrd. € (109,1 %). Bargeld nur 1.352 Mrd. € (<b>11,1 % des BIP</b>). Der ganz überwiegende Teil des Geldes ist Buchgeld; M3 ist rund viermal so groß wie M0.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 2.4","e":"e_x_aggregateempirie","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":132,"d":"m6","t":"Empirie","q":"Warum unterscheiden sich M3-Quoten so stark zwischen Ländern?","a":"M3 reicht von 68,9 % des BIP (Polen) bis 131,0 % (Großbritannien). Ursache sind unterschiedliche <b>Finanzstrukturen und Zahlungsgewohnheiten</b> — und genau deshalb ist die Geldmengensteuerung so unzuverlässig.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 2.4","e":"e_x_aggregateempirie","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":133,"d":"m6","t":"Bilanzen","q":"Bilanz einer Geschäftsbank — Aktiva und Passiva?","a":"<b>Aktiva:</b> Bargeld und Einlagen bei der Zentralbank, Wertpapiere, Forderungen aus Krediten. <b>Passiva:</b> Verbindlichkeiten gegenüber der Zentralbank, Kundeneinlagen, Reinvermögen (Eigenkapital).","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.3","e":"e_x_bankbilanz","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":134,"d":"m6","t":"Bilanzen","q":"Bilanz der Zentralbank — und was daran überrascht?","a":"<b>Aktiva:</b> Kredite an Geschäftsbanken, Wertpapiere, Devisenreserven. <b>Passiva:</b> Bargeldumlauf, Einlagen von Geschäftsbanken, Einlagen des Staates, Reinvermögen.<br>Überraschend: <b>Bargeld steht auf der Passivseite</b> — es ist eine Verbindlichkeit. Die ersten beiden Passivposten ergeben zusammen genau M0.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.4","e":"e_x_bankbilanz","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":135,"d":"m6","t":"Geldschöpfung","q":"Warum ist Geldemission ein hoheitliches Recht?","a":"Allgemeine Akzeptanz als Zahlungsmittel kann nur durch <b>Vertrauen</b> gesichert werden, und die <b>Kaufkraftsicherung der Währung ist ein öffentliches Gut</b> — nichtrival und nicht ausschließbar. Der Markt liefert Geldwertstabilität daher nicht von selbst.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.1","e":"e_x_hoheit","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":136,"d":"m6","t":"Geldschöpfung","q":"Wie hoch ist der Realzins der Geldhaltung?","a":"Bargeld hat i = 0, also folgt aus r = i − π: <b>r = −π</b>. Bei 5 % Inflation verliert man jährlich real 5 % — die <b>Inflationssteuer</b>. Bei Deflation wäre der Realzins der Geldhaltung positiv, was die Wirtschaftsaktivität lähmt.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.1","e":"e_x_hoheit","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":137,"d":"m6","t":"Empirie","q":"Mindestreserve im internationalen Vergleich 2020 — was fällt auf?","a":"<b>Die Mehrheit der Länder hat gar keine mehr</b>: USA, Großbritannien, Kanada, Schweden, Dänemark, Australien, Neuseeland. Euroraum 1 %, Ungarn 1 %, Tschechien 2 %, Schweiz 2,5 %, Polen 3,5 %, China 12,5 %. Der Multiplikator bleibt ein Lehrbuchmodell — als Instrument ist die Mindestreservepolitik heute bedeutungslos.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.6","e":"e_x_reservevergleich","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":138,"d":"m6","t":"Finanzkrise","q":"Warum parkten Banken 2008–2011 freiwillig Geld bei der EZB, obwohl die Verzinsung gegen null fiel?","a":"Wegen <b>Misstrauen am Interbankenmarkt</b> — niemand wusste, welche Bank als Nächste ausfällt. Lieber null Zinsen bei der sicheren Zentralbank als ein Aufschlag bei möglicherweise insolventer Gegenpartei. Folge: Der <b>Transmissionsmechanismus war unterbrochen</b>, die Liquidität floss in die Einlagenfazilität zurück.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 3.7","e":"e_x_finanzkrise","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":139,"d":"m6","t":"Geldpolitik","q":"Wie definiert die EZB Preisstabilität?","a":"Als jährlichen Anstieg des <b>Harmonisierten Verbraucherpreisindex (HVPI)</b> für den Euroraum von <b>unter 2 %</b>. Der Maastricht-Vertrag macht Preisstabilität zum vorrangigen Ziel; die Unterstützung der allgemeinen Wirtschaftspolitik ist ausdrücklich nachrangig.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.2","e":"e_x_preisstabilitaet","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":140,"d":"m6","t":"Inflation","q":"Hyperinflation 1923 — welche Größenordnung, und was ist das eigentlich Lehrreiche?","a":"Mark je Dollar: 4,20 (Juli 1914) → 4,2 Billionen (20.11.1923), also Faktor <b>10¹²</b>. Lehrreich ist nicht die Zahl, sondern das <b>Tempo</b>: Die erste Verzehnfachung brauchte 2.009 Tage, die letzte nur noch <b>17 Tage</b>. Der Prozess beschleunigt sich selbst.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.3","e":"e_x_hyperinflation","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":141,"d":"m6","t":"Inflation","q":"Inflation: Gewinner und Verlierer?","a":"<b>Gewinner:</b> Schuldner, Staat bei Wertsteuern, Unternehmen als Arbeitsnachfrager (sinkender Reallohn), kalte Progression. <b>Verlierer:</b> Gläubiger, Sparer und Bargeldbesitzer (inflation tax), Nominaleinkommensbezieher ohne Indexierung, Steuerzahler; die internationale Wettbewerbsfähigkeit leidet.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.4","e":"e_x_gewinnerverlierer","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":142,"d":"m6","t":"Inflation","q":"Kalte Progression — Definition?","a":"Der durch die <b>Steuerprogression</b> bedingte Anstieg der realen Steuerlast infolge <b>inflationsausgleichender Einkommenssteigerungen</b>, sofern der Steuertarif nicht angepasst wird. Bei 5 % Inflation und 5 % Lohnerhöhung ist man real gleich gestellt, rutscht aber in einen höheren Satz.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.4","e":"e_x_gewinnerverlierer","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":143,"d":"m6","t":"Inflation","q":"Warum verliert Geld bei hoher Inflation seine Funktionen?","a":"Das <b>Wertaufbewahrungsmittel</b> versagt (Ersparnisse schmelzen), die <b>Recheneinheit</b> wird unbrauchbar (Preise ändern sich täglich), zuletzt sogar das <b>Tauschmittel</b> — man kehrt zum Naturaltausch zurück. Preisstabilität ist die Voraussetzung dafür, dass Geld Geld bleibt.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.4","e":"e_x_gewinnerverlierer","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":144,"d":"m6","t":"Interbankenmarkt","q":"Euribor, Eonia, Eurepo — die Unterschiede?","a":"<b>Euribor:</b> Termineinlagen zwischen Prime Banks, <b>unbesichert</b>. <b>Eonia:</b> gewichteter Durchschnitt aller <b>unbesicherten Übernachtkredite</b>. <b>Eurepo:</b> <b>besicherte</b> Kreditvergabe gegen staatliche Wertpapiere. Ordnungsprinzip: je unbesicherter und je länger, desto höher der Satz.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.5","e":"e_x_interbank","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":145,"d":"m6","t":"Interbankenmarkt","q":"Warum sind Zins-Spreads Stressindikatoren?","a":"Der Abstand zwischen <b>unbesichertem</b> Euribor und <b>besichertem</b> Eurepo ist die Risikoprämie — er misst direkt, wie viel Misstrauen die Banken untereinander haben. In der Krise weitet er sich dramatisch.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.5","e":"e_x_interbank","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":146,"d":"m6","t":"Geldpolitik","q":"Die vier Typen von Offenmarktgeschäften?","a":"<b>Hauptrefinanzierungsgeschäfte</b> (zwei Wochen), <b>längerfristige Refinanzierungsgeschäfte</b> (ein Monat), <b>Feinsteuerungsmaßnahmen und strukturelle Operationen</b> (nur bei Bedarf), <b>ständige Fazilitäten</b> (setzen Ober- und Untergrenze für den Tagesgeldsatz).","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 5.5","e":"e_x_offenmarkt","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":147,"d":"m6","t":"Geldpolitik","q":"Die vier Wirkungskanäle der Geldpolitik?","a":"<b>Zinskanal</b> (kurzfristige Geldmarktsätze), <b>Kapitalmarkt</b> (Finanzmarkt- und Wertpapierkurse), <b>Kreditkanal</b> (Marktliquidität und Reservehaltung) und als Spezialfall die <b>Zero Lower Bound</b> mit unkonventionellen Instrumenten (negative Nominalzinsen, Quantitative Easing).","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 6.1","e":"e_x_wirkungskanaele","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":148,"d":"m6","t":"Geldpolitik","q":"Die vier Grundsätze der EZB-Geldpolitik?","a":"<b>Unabhängigkeit</b> der Entscheidungen; <b>Inflationsziel als primäres Anliegen</b>; <b>regelgebundene statt diskretionäre</b> Geldpolitik; institutionelle Eigenschaften <b>Glaubwürdigkeit, Selbstbindung, Reputation</b>.","s":"Makro VL06 (Geldmarkt)","sec":"Abschnitt 6.2","e":"e_x_grundsaetze","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":149,"d":"m6","t":"Bankenaufsicht","q":"Regulierung des Bankensektors — Probleme und Absicherungsinstrumente?","a":"<b>Probleme:</b> exogene und endogene (systemische) Risiken, Unsicherheit mit asymmetrischer Information und Moral Hazard, Kreditrestriktionen. <b>Absicherung:</b> Einlagensicherungsfonds, Kapitaldeckungsregeln mit Risikoklassifizierung, Zentralbank als „Lender of last resort“.","s":"Makro VL06 (Geldmarkt)","sec":"Kapitel 7","e":"e_x_bankenaufsicht","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":150,"d":"m6","t":"Bankenaufsicht","q":"Was unterscheidet systemisches von exogenem Risiko?","a":"Exogenes Risiko trifft eine Bank von außen (Konjunktureinbruch). <b>Systemisches</b> Risiko entsteht im System selbst: Fällt eine Bank aus, reißt sie über den Interbankenmarkt andere mit. Deshalb reicht Einzelaufsicht nicht — und deshalb entsteht „too big to fail“.","s":"Makro VL06 (Geldmarkt)","sec":"Kapitel 7","e":"e_x_bankenaufsicht","f":"Makro_VL06_Geld_Geldmarkt_Geldpolitik.pdf"},{"i":151,"d":"m7","t":"Grundlagen","q":"Klassischer vs. keynesianischer Ansatz — die Kernannahmen?","a":"Neoklassisch: <b>Preisflexibilität</b>, Dichotomie der Märkte, Geldneutralität. Keynesianisch: <b>Preisrigidität</b>, Interdependenz der Märkte, keine Geldneutralität. Der Unterschied ist im Kern ein Zeithorizont.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 2.3","e":"e_stroemungen","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":152,"d":"m7","t":"Grundlagen","q":"Warum ist Preisrigidität die Grundannahme des ganzen Kapitels?","a":"Können Preise nicht reagieren, muss die <b>Menge</b> reagieren — also der Output. Nur deshalb wird die Nachfrage zur unmittelbaren Ursache der Outputschwankungen und nur deshalb funktionieren Multiplikatoren.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 2.3","e":"e_preisrigiditaet","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":153,"d":"m7","t":"Gütermarkt","q":"Die gesamtwirtschaftliche Güternachfrage DD?","a":"DD = C(Ω, Y−T̄) + I(r,q) + Ḡ + NX(Y, Y*, σ). Sie reagiert auf Y <b>positiv, aber unterproportional</b> — deshalb ist DD im 45°-Diagramm flacher als 45° und es gibt einen Schnittpunkt.","s":"Makro VL07 (IS-TR)","sec":"Abschnitte 3.1–3.2","e":"e_dd","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":154,"d":"m7","t":"Gütermarkt","q":"Warum hängt NX negativ von Y und negativ von σ ab?","a":"Y (−): höheres Einkommen ⇒ höhere Absorption ⇒ mehr <b>Importe</b>. σ (−): reale Aufwertung macht heimische Güter im Ausland teurer (Exporte fallen) und ausländische im Inland billiger (Importe steigen).","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 3.1","e":"e_nx","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":155,"d":"m7","t":"Gütermarkt","q":"Wozu dient die 45°-Linie?","a":"Sie ist keine Verhaltenskurve, sondern eine <b>Hilfslinie</b>: Auf ihr gilt Y^D = Y^S, also die Gleichgewichtsbedingung „geplante Ausgaben = Einkommen“. DD ist die Verhaltenskurve.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 3.3","e":"e_45grad","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":156,"d":"m7","t":"Multiplikator","q":"Ausgabenmultiplikator — Formel, Herleitung, Zahlenbeispiel?","a":"ΔY = ΔG/(1−c). Geometrische Reihe: ΔG·[1 + c + c² + …]. Bei c = 0,8 ist der Multiplikator <b>5</b>: 100 Staatsausgaben erzeugen 500 zusätzliches Einkommen.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 4.2","e":"e_multiplikator7","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":157,"d":"m7","t":"Multiplikator","q":"Was sind Sickerverluste — und wie verändern sie den Multiplikator?","a":"Der Anteil des Einkommens, der als <b>Steuern, Ersparnis und Importe</b> abfließt. Mit Steuersatz t und Importquote m: 1/(1 − c(1−t) + m). Bei c=0,8, t=0,25, m=0,15 nur noch <b>1,82</b> statt 5.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 4.1","e":"e_sickerverluste","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":158,"d":"m7","t":"IS-Kurve","q":"IS-Kurve — Definition und warum sie fällt?","a":"Alle Kombinationen von i und Y, die mit einem <b>Gütermarktgleichgewicht</b> vereinbar sind. Sie fällt, weil ein höherer Zins die private Nachfrage senkt — Angebot und Nachfrage stimmen dann nur bei geringerem Einkommen überein.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.1","e":"e_is","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":159,"d":"m7","t":"IS-Kurve","q":"Steigung der IS-Kurve — Formel und Interpretation?","a":"dY/di = (∂I/∂i)/(1−c) &lt; 0. Im Zähler die Zinsreagibilität der Investition, im Nenner der Kehrwert des Multiplikators. Die IS-Kurve ist umso <b>flacher</b>, je zinsreagibler die Investition und je größer der Multiplikator.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.2","e":"e_issteigung","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":160,"d":"m7","t":"IS-Kurve","q":"Bewegung auf vs. Verschiebung der IS-Kurve?","a":"<b>Endogene</b> Variablen (Y, i) ⇒ Bewegung entlang der Kurve. <b>Exogene</b> Variablen (G, T, NX, q, Ω, Y*) ⇒ Verschiebung. Ein Zinsanstieg allein verschiebt die IS-Kurve <b>nicht</b>.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.3","e":"e_bewegungverschiebung","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":161,"d":"m7","t":"TR-Kurve","q":"TR-Kurve — was ist sie, und warum steigt sie?","a":"Die <b>Reaktionsfunktion der Zentralbank</b> nach der (vereinfachten) Taylor-Regel i = ī + b(Y−Ȳ)/Ȳ. Steigung dY/di = 1/b > 0. Sie ist umso flacher, je aggressiver die Zentralbank auf die Outputlücke reagiert.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.4","e":"e_tr","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":162,"d":"m7","t":"TR-Kurve","q":"Warum liegt die Volkswirtschaft immer auf der TR-Kurve?","a":"Weil die Zentralbank die Geldmenge passiv an den gesetzten Zins anpasst — der Geldmarkt ist immer geräumt. Es gibt hier <b>kein Ungleichgewicht</b>, anders als bei der IS-Kurve.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.5","e":"e_tr","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":163,"d":"m7","t":"IS-TR","q":"Was erklärt das IS-TR-Modell ausdrücklich NICHT?","a":"Es beschreibt <b>nicht</b> das allgemeine Gleichgewicht: Arbeitsmarkt und Beschäftigung, Güterproduktion sowie das endogen bestimmte Preisniveau fehlen. Das Preisniveau ist im IS-TR-Diagramm exogen.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 6.1","e":"e_istrgrenzen","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":164,"d":"m7","t":"IS-TR","q":"Wie dämpft die Taylor-Regel den Multiplikator?","a":"Ein Nachfrageschock verschiebt IS nach rechts; die Zentralbank hebt den Zins, drosselt die Investition, der Output steigt weniger stark
