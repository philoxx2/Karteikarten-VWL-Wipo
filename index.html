. Beispiel: IS-Verschiebung um 50 führt nur zu ΔY = 25 und Δi = 0,5 pp.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 6.2","e":"e_dämpfung","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":165,"d":"m7","t":"IS-TR","q":"Merkregel: Woran erkennt man, welche Kurve sich verschoben hat?","a":"Bewegen sich <b>Y und i gleichläufig</b> ⇒ die <b>IS</b>-Kurve hat sich verschoben (man wandert die steigende TR entlang). Bewegen sie sich <b>gegenläufig</b> ⇒ die <b>TR</b>-Kurve hat sich verschoben.","s":"Makro VL07 (IS-TR)","sec":"Abschnitte 6.2–6.3","e":"e_schockregel","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":166,"d":"m7","t":"IS-TR","q":"Was passiert am Zero Lower Bound im IS-TR-Modell?","a":"Die TR-Kurve <b>knickt ab und verläuft waagerecht</b> bei i = 0. Dort gibt es keine dämpfende Zinsreaktion mehr: Ein Nachfrageschock schlägt in <b>voller Multiplikatorhöhe</b> durch, und Fiskalpolitik wird relativ wirksamer.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 6.4","e":"e_zlbistr","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":167,"d":"m7","t":"Offene VW","q":"Zinsparität und die IFM-Kurve?","a":"i = i*. Zinsarbitrage gleicht den heimischen an den Weltmarktzins an. Die IFM-Kurve ist <b>waagerecht</b>, weil eine kleine offene Volkswirtschaft Preisnehmer am Weltkapitalmarkt ist.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.2","e":"e_zinsparitaet","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":168,"d":"m7","t":"Wechselkursregime","q":"Warum ist bei festen Wechselkursen die TR-Kurve irrelevant?","a":"Der Wechselkurs ist fixiert, also wird der Zins durch i = i* festgenagelt. Jede Offenmarktoperation löst eine gegenläufige Devisenintervention aus — die Zentralbank verliert ihre <b>binnenwirtschaftliche Souveränität</b>.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.4","e":"e_festeWK","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":169,"d":"m7","t":"Wechselkursregime","q":"Wie wirkt Fiskalpolitik bei FESTEN Wechselkursen?","a":"<b>Voll.</b> IS verschiebt sich nach rechts, der Zins darf nicht steigen (Devisenintervention erhöht die Geldmenge) ⇒ <b>kein Crowding out</b> ⇒ voller Multiplikatoreffekt.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.4","e":"e_festeWK","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":170,"d":"m7","t":"Wechselkursregime","q":"Wie wirkt Geldpolitik bei FLEXIBLEN Wechselkursen — die Kette?","a":"Zinssenkung ⇒ TR nach unten ⇒ i &lt; i* ⇒ Kapitalexporte ⇒ Abwertung, σ fällt ⇒ NX steigt ⇒ IS nach rechts ⇒ höheres Y bei i = i*. <b>Geldpolitik wirkt über den Außenbeitrag, nicht über die Investition.</b>","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.5","e":"e_flexibleWK","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":171,"d":"m7","t":"Wechselkursregime","q":"Warum ist Fiskalpolitik bei FLEXIBLEN Wechselkursen wirkungslos?","a":"IS nach rechts ⇒ Zins über i* ⇒ Kapitalimporte ⇒ Aufwertung, σ steigt ⇒ NX fällt ⇒ IS wandert zurück. <b>Crowding out über den Wechselkurs statt über den Zins</b> — verdrängt werden die Exporte.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.5","e":"e_flexibleWK","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":172,"d":"m7","t":"Fleming-Mundell","q":"Fleming-Mundell: Die Ergebnistabelle?","a":"<b>Fest / flexibel:</b> Fiskalpolitik wirkt / wirkungslos. Geldpolitik wirkungslos / wirkt. Auslandszinserhöhung: BIP sinkt / BIP steigt.<br>Merkregel: <b>Fest → Fiskal. Flexibel → Geld.</b>","s":"Makro VL07 (IS-TR)","sec":"Kapitel 8","e":"e_flemingmundell","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":173,"d":"m7","t":"Fleming-Mundell","q":"Exogenes und endogenes geldpolitisches Instrument je Regime?","a":"Feste Kurse: exogen ist der <b>Wechselkurs</b>, endogen der Zinssatz (bzw. die Geldmenge). Flexible Kurse: exogen der <b>Zinssatz</b>, endogen der Wechselkurs.","s":"Makro VL07 (IS-TR)","sec":"Kapitel 8","e":"e_flemingmundell","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":174,"d":"m7","t":"Grundlagen","q":"Wie zerlegt man das BIP — und was erklärt welches Kapitel?","a":"BIP = <b>Trend + Zyklus</b>. Teil 2 (Solow) erklärt den Trend, dieses Kapitel den Zyklus. Die Trendabweichung im Log-Diagramm ist direkt als prozentuale Abweichung lesbar — und genau die <b>Outputlücke</b>, die in der Taylor-Regel steht.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 2.2","e":"e_x_trendzyklus","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":175,"d":"m7","t":"Grundlagen","q":"Definition „Gleichgewicht“ laut Folie?","a":"Ein Markt ist im Gleichgewicht, wenn zum <b>markträumenden Preis</b> weder von der Angebots- noch von der Nachfrageseite der Wunsch nach weiteren Transaktionen besteht — ein <b>Ruhezustand</b>, in dem keine divergenten Kräfte auftreten.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 2.3","e":"e_x_gleichgewichtdef","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":176,"d":"m7","t":"Grundlagen","q":"Interdependenz der Märkte — welche vier Wirkungspfeile?","a":"Gütermarkt → Geldmarkt (<b>Einkommen</b> bestimmt Geldnachfrage). Geldmarkt → Gütermarkt (<b>Zins</b> bestimmt Güternachfrage). Geldmarkt → Devisenmarkt (Zins bestimmt <b>Wechselkurs</b>). Devisenmarkt → Gütermarkt (Wechselkurs bestimmt Güternachfrage).","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 2.3","e":"e_x_interdependenz","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":177,"d":"m7","t":"Gütermarkt","q":"Welche Variablen sind im Gütermarktmodell endogen, welche exogen?","a":"<b>Endogen:</b> Konsum, verfügbares Einkommen, Investition, Zins, Preisniveau. <b>Exogen:</b> Staatsausgaben und Exporte. Diese Unterscheidung entscheidet darüber, ob man sich auf einer Kurve bewegt oder sie verschiebt.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 3.2","e":"e_x_endogenexogen","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":178,"d":"m7","t":"IS-Kurve","q":"Warum darf man im IS-TR-Modell r = i setzen?","a":"Aus der Fisher-Gleichung r = i − π folgt bei <b>π = 0</b> unmittelbar r = i. Weil die Preise ohnehin als rigide angenommen werden, ist das konsistent — man muss nur noch eine Zinsvariable mitführen.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.1","e":"e_x_ristgleichi","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":179,"d":"m7","t":"IS-Kurve","q":"Wovon hängt ab, wie flach die IS-Kurve verläuft?","a":"Von der <b>Zinsreagibilität der Nachfrage</b> und von der <b>Größe des Multiplikatoreffekts</b>. Der Multiplikator ist umso größer, je steiler die Kurve der geplanten Ausgaben im 45°-Diagramm verläuft, also je geringer die Sickerverluste.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.3","e":"e_x_isflach","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":180,"d":"m7","t":"TR-Kurve","q":"Was verschiebt die TR-Kurve?","a":"Fünf Faktoren bestimmen die geldpolitische Strategie: <b>a, b, ī, π̄ und Ȳ</b>. Ändert sich einer davon, verschiebt sich die TR-Kurve. Die Volkswirtschaft liegt definitionsgemäß immer auf ihr.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 5.5","e":"e_x_trverschieben","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":181,"d":"m7","t":"Offene VW","q":"Was ist eine kleine offene Volkswirtschaft — und passt die Annahme auf Deutschland?","a":"Ein Land, das <b>Weltmarktpreise und Weltmarktzins nicht beeinflussen</b> kann. Für Deutschland (4,4 % des Weltbruttos, Außenhandelsquote 44,3 %) ist die Annahme brauchbar, für die USA (24,4 % des Weltbruttos, aber nur 13,8 % Außenhandelsquote) nicht.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.1","e":"e_x_kleineoffene","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":182,"d":"m7","t":"Offene VW","q":"Was bedeutet Finanzmarktintegration konkret — ein Beispiel?","a":"Die Niederlande halten Auslandsforderungen von <b>1.096 % des BIP</b> und Verbindlichkeiten von 1.032 % — das Elffache der Jahreswirtschaftsleistung. Systematik der Tabelle: <b>groß heißt geschlossen, klein heißt offen</b>, weil große Länder viel mit sich selbst handeln.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.1","e":"e_x_kleineoffene","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":183,"d":"m7","t":"Wechselkursregime","q":"Die drei Wechselkursregime?","a":"<b>Flexibel:</b> freie Kursbildung aus privatem Devisenangebot und -nachfrage, keine Intervention. <b>Fest:</b> festgeschriebene Austauschrelation, die Zentralbank muss mit ihren <b>Währungsreserven</b> intervenieren. <b>Eingeschränktes Floating:</b> freies Schwanken zwischen Ober- und Untergrenze, Interventionspflicht erst beim Durchbruch.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.3","e":"e_x_regime","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":184,"d":"m7","t":"Wechselkursregime","q":"Was passiert bei festen Kursen mit den Devisenreserven?","a":"Bei einem <b>Überschussangebot</b> kauft die Zentralbank eigene Währung auf ⇒ die Reserven <b>sinken</b>. Bei <b>Überschussnachfrage</b> stellt sie zusätzliches Angebot bereit ⇒ die Reserven <b>steigen</b>.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.4","e":"e_x_reserven7","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":185,"d":"m7","t":"Wechselkursregime","q":"Das Trilemma der Wechselkurspolitik?","a":"<b>Freier Kapitalverkehr, fester Wechselkurs und autonome Geldpolitik</b> — man kann höchstens zwei davon haben. Bei festen Kursen mit freiem Kapitalverkehr wird der Zins durch i = i* festgenagelt, die geldpolitische Souveränität ist verloren.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.4","e":"e_x_trilemma","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":186,"d":"m7","t":"Wechselkursregime","q":"Zinsschock bei FESTEN Wechselkursen — Wirkung auf das BIP?","a":"Steigt i*, muss der heimische Zins folgen — es gibt keine Wahl. Der höhere Zins drosselt die Investitionen, man wandert die IS-Kurve nach links oben, das <b>BIP sinkt</b>. Man importiert die Geldpolitik des Auslands einschließlich ihrer Rezessionen.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.4","e":"e_x_zinsschock","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":187,"d":"m7","t":"Wechselkursregime","q":"Zinsschock bei FLEXIBLEN Wechselkursen — Wirkung auf das BIP?","a":"Steigt i*, wertet die heimische Währung <b>ab</b>, NX steigt, die IS-Kurve verschiebt sich nach rechts und das <b>BIP steigt</b> — genau umgekehrt zum festen Regime.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.5","e":"e_x_zinsschock","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":188,"d":"m7","t":"Wechselkursregime","q":"Warum ist der Wechselkurs bei flexiblem Regime das Anpassungsventil?","a":"Sind P und P* rigide, schlägt jede Änderung von S <b>eins zu eins</b> auf σ durch. Und weil NX negativ von σ abhängt, verschiebt jede Wechselkursänderung die <b>IS-Kurve</b> — so lange, bis sie TR und IFM im selben Punkt schneidet.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 7.5","e":"e_x_anpassungsventil","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":189,"d":"m7","t":"IS-TR","q":"Die vier Wirkungskanäle von Quantitative Easing?","a":"<b>Kreditkanal</b> (mehr Liquidität ⇒ mehr Kreditvergabe), <b>Wertpapierpreise/Aktienkurse</b> (Aufkäufe treiben Kurse), <b>Vermögenskanal</b> (höheres Ω ⇒ höherer Konsum), <b>Zinskanal</b> auf die <b>langfristigen</b> Zinsen.","s":"Makro VL07 (IS-TR)","sec":"Abschnitt 6.4","e":"e_x_qekanaele","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":190,"d":"m7","t":"IS-TR","q":"Was fehlt im IS-TR-Modell — die vier Lücken?","a":"Die <b>Produktionsseite</b>, die <b>Wechselwirkungen mit dem Arbeitsmarkt</b>, die <b>Reaktionen des Preisniveaus</b> und generell der <b>Übergang von der kurzen zur mittleren und langen Frist</b>. Genau diese Lücken schließen Teil 8 und 9.","s":"Makro VL07 (IS-TR)","sec":"Kapitel 8","e":"e_x_istrluecken","f":"Makro_VL07_Kurzfristiges_Gleichgewicht_IS_TR.pdf"},{"i":191,"d":"m8","t":"Aufbau","q":"Wie ist die AS-Kurve aufgebaut?","a":"Die <b>Phillips-Kurve</b> verbindet Inflation mit Arbeitslosigkeit, <b>Okuns Gesetz</b> verbindet Arbeitslosigkeit mit Output. Zusammengesetzt ergibt sich die AS-Kurve: Inflation gegen Output.","s":"Makro VL08 (Angebot/Inflation)","sec":"Kapitel 1","e":"e_asaufbau","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":192,"d":"m8","t":"Flexpreis","q":"Was zeigt das Flexpreis-Argument bei einem Nachfragerückgang?","a":"Bei Preisflexibilität: P sinkt, Reallohn steigt, Überschussangebot am Arbeitsmarkt drückt W ⇒ Rückkehr ins alte Gleichgewicht. Zusätzlich wirkt der <b>Wechselkurskanal</b> (Abwertung, höhere Wettbewerbsfähigkeit). Nachfragestörungen sind nur <b>temporär</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 2.2","e":"e_selbstheilung","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":193,"d":"m8","t":"Phillips-Kurve","q":"Einfache Phillips-Kurve — Aussage?","a":"Negative Korrelation zwischen Inflation und Arbeitslosenquote ⇒ <b>Zielkonflikt</b> zwischen Vollbeschäftigung und Preisniveaustabilität (Phillips-Trade-off).","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 3.2","e":"e_phillips","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":194,"d":"m8","t":"Phillips-Kurve","q":"Die Kritik von Friedman und Phelps — der Kern?","a":"Langfristig können <b>nominale</b> Größen keine <b>realen</b> beeinflussen; ein gleichzeitiger Anstieg von Preisen und Löhnen lässt die relativen Preise unverändert. Ausnahme wäre <b>Geldillusion</b>. Ergebnis: Die langfristige Phillips-Kurve verläuft <b>vertikal</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 3.3","e":"e_friedmanphelps","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":195,"d":"m8","t":"Phillips-Kurve","q":"Was bedeutet Geldillusion?","a":"Menschen verwechseln nominale mit realen Größen — wer 5 % Lohnerhöhung bei 5 % Inflation als Verbesserung empfindet, unterliegt ihr. Der Phillips-Trade-off funktioniert nur, solange diese Täuschung anhält.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 3.3","e":"e_friedmanphelps","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":196,"d":"m8","t":"Okun","q":"Wie passen Unternehmen kurzfristig den Arbeitseinsatz an?","a":"Überstunden, Kurzarbeit, Einstellungsstopps, Teilzeit/Zeitarbeitskonten, Entlassungen. Weil die Anpassung <b>graduell</b> erfolgt, ist der Zusammenhang Output↔Arbeitslosigkeit systematisch, aber nicht eins zu eins.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 4.1","e":"e_kurzfristanpassung","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":197,"d":"m8","t":"Okun","q":"Okuns Gesetz — Formel und Zahlenbeispiel?","a":"U − Ū = −h·(Y − Ȳ)/Ȳ mit h > 0. Bei h = 0,5 und einem BIP 4 % unter Trend liegt die Arbeitslosenquote <b>2 Prozentpunkte</b> über ihrem Gleichgewichtswert.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 4.2","e":"e_okun","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":198,"d":"m8","t":"Mark-ups","q":"Mark-up auf der Güterpreisseite?","a":"P = (1+θ)·W·L/Y — der Güterpreis ist ein Aufschlag θ auf die Lohnstückkosten, also eine Funktion der Lohnquote. Voraussetzung ist <b>monopolistische Konkurrenz</b>; bei vollkommener wäre θ = 0.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 5.1","e":"e_markupP","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":199,"d":"m8","t":"Mark-ups","q":"Mark-up auf der Lohnseite — und warum steht dort P^e?","a":"W·L/Y = (1+γ)·s̄_L·P^e. Tarifverträge werden <b>im Voraus</b> geschlossen, also auf Basis der <b>erwarteten</b> Preise. Deshalb sind Inflationserwartungen und Zentralbankglaubwürdigkeit so zentral.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 5.2","e":"e_markupW","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":200,"d":"m8","t":"Mark-ups","q":"„Kampf der Mark-ups“ — Formel und Aussage?","a":"P = (1+θ)(1+γ)·s̄_L·P^e. Zwei Gruppen beanspruchen gleichzeitig mehr, als verteilbar ist; beide überwälzen. Ergebnis ist nicht Umverteilung, sondern <b>Inflation</b> — die Preis-Lohn-Spirale.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 5.3","e":"e_kampfmarkups","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":201,"d":"m8","t":"Mark-ups","q":"Inflationszerlegung mit konjunkturellen Aufschlägen?","a":"π = π^e + Δθ/(1+θ) + Δγ/(1+γ). Das Produkt der Mark-ups verhält sich <b>prozyklisch</b> — es steigt im Aufschwung und fällt im Abschwung.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 5.3","e":"e_kampfmarkups","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":202,"d":"m8","t":"AS-Kurve","q":"AS-Kurve und Phillips-Kurve in Formeln — und wie hängen a und b zusammen?","a":"π = π̄ + a·Y_gap = π̄ − b·U_gap. Über Okuns Gesetz U_gap = −h·Y_gap folgt <b>a = b·h</b>. Die AS-Kurve ist damit flacher als die Phillips-Kurve.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitte 5.3 / 7.1","e":"e_asformel","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":203,"d":"m8","t":"Angebotsschocks","q":"Angebotsschock — Formel und was ε umfasst?","a":"π = π̄ ± [a·Y_gap bzw. b·U_gap] + ε. ε umfasst alle Störungen der <b>Produktionskosten</b>: Steuerpolitik, Rohstoffpreise, Währungsschocks, gesetzliche Regulierung.","s":"Makro VL08 (Angebot/Inflation)","sec":"Kapitel 6","e":"e_angebotsschock","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":204,"d":"m8","t":"Angebotsschocks","q":"Warum sind Angebotsschocks politisch unangenehmer als Nachfrageschocks?","a":"Nachfrageschocks bewegen π und Y in <b>dieselbe</b> Richtung — kein Zielkonflikt. Angebotsschocks bewegen sie <b>gegenläufig</b>: Inflationsbekämpfung verschärft die Rezession und umgekehrt. Das ist <b>Stagflation</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Kapitel 6","e":"e_angebotsschock","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":205,"d":"m8","t":"AS-Kurve","q":"Kurz- und langfristige Kurven — der Überblick?","a":"Kurzfristige Phillips-Kurve: fallend. Langfristige: <b>senkrecht bei Ū</b>. Kurzfristige AS: steigend. Langfristige LAS: <b>senkrecht bei Ȳ</b>. Merkregel: kurzfristig geneigt, langfristig senkrecht.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 7.2","e":"e_kurzlang","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":206,"d":"m8","t":"AS-Kurve","q":"Anpassungsprozess von der kurzen zur langen Frist — die drei Schritte?","a":"1) Nachfrageimpuls treibt Y über Ȳ, man wandert die AS-Kurve hinauf. 2) Höhere Inflation geht in die Erwartungen, die AS-Kurve verschiebt sich nach oben. 3) Man wandert die AD-Kurve zurück bis Y = Ȳ — bei <b>dauerhaft höherer Inflation</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 7.4","e":"e_anpassung8","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":207,"d":"m8","t":"Flexpreis","q":"Was zeigt das Arbeitsmarktdiagramm bei einem Nachfragerückgang — keynesianisch vs. flexibel?","a":"<b>Keynesianisch:</b> Der Reallohn ist fix (W und P rigide), es entsteht unfreiwillige Arbeitslosigkeit AB′. <b>Bei Preisflexibilität:</b> P sinkt, der Reallohn steigt, Beschäftigung liegt in B, Arbeitslosigkeit BC; das Überschussangebot lässt dann W sinken und die Wirtschaft kehrt nach A zurück.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 2.2","e":"e_x_flexpreisdiagramm","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":208,"d":"m8","t":"Phillips-Kurve","q":"Die drei Fragen der Friedman-Phelps-Kritik?","a":"1) Wo bleibt die langfristige <b>Geldneutralität</b>? 2) Können Änderungsraten <b>nominaler</b> Variablen langfristig auf <b>reale</b> Größen wirken? 3) Ein gleichzeitiger Anstieg von Preisen und Löhnen sollte die <b>relativen Preise</b> unverändert lassen — es sei denn, es herrscht Geldillusion.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 3.3","e":"e_x_fpfragen","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":209,"d":"m8","t":"Phillips-Kurve","q":"Was folgt aus der Dichotomie für die langfristigen Kurven?","a":"Output auf dem langfristigen Wachstumspfad Ȳ, Arbeitslosigkeit auf Ū, Inflation durch das Geldmengenwachstum bestimmt. ⇒ Die <b>langfristige Phillips-Kurve verläuft vertikal</b> und die <b>langfristige AS-Kurve ist inflationsunelastisch</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 3.3","e":"e_x_fpfragen","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":210,"d":"m8","t":"Okun","q":"Wie unterscheiden sich langfristige und kurzfristige Produktionsanpassung?","a":"<b>Langfristig:</b> Einsatz zusätzlicher Produktionsfaktoren und Verbesserungen der Produktionstechnik — also genau K, L und A aus Teil 2. <b>Kurzfristig:</b> Variation des Arbeitseinsatzes über Überstunden, Kurzarbeit, Einstellungsstopps, Teilzeit und Entlassungen.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 4.1","e":"e_x_produktionsanpassung","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":211,"d":"m8","t":"AS-Kurve","q":"Was ist die Kerninflation π̄ in der AS-Gleichung?","a":"Die <b>Grundinflation</b> — der von Konjunktur und Angebotsschocks bereinigte Sockel. Sie bestimmt zusammen mit Ū bzw. Ȳ die <b>Lage</b> der kurzfristigen Phillips- bzw. AS-Kurve. Ändert sich eine der beiden, verschiebt sich die Kurve.","s":"Makro VL08 (Angebot/Inflation)","sec":"Kapitel 6","e":"e_x_kerninflation","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":212,"d":"m8","t":"AS-Kurve","q":"Was verschiebt die kurzfristige AS-Kurve, was bewirkt nur eine Bewegung darauf?","a":"<b>Verschiebung:</b> Änderungen der Kerninflation π̄ (vertikal), von Ū bzw. Ȳ (horizontal) sowie Angebotsschocks ε (vertikal). <b>Bewegung entlang:</b> alles Übrige, insbesondere Nachfrageimpulse.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 7.2","e":"e_x_kerninflation","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":213,"d":"m8","t":"Empirie","q":"Natürliche Arbeitslosenquoten 1970–2020: Was zeigt der deutsche Verlauf?","a":"Von <b>0,9 %</b> (1970) über 7,2 % (1990/2000) auf <b>3,7 %</b> (2020). Der Sprung nach oben ist die europäische Persistenzdebatte, der Rückgang danach der Beleg, dass Ū <b>keine Naturkonstante</b>, sondern institutionell bestimmt ist.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 7.3","e":"e_x_natALQtabelle","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":214,"d":"m8","t":"Empirie","q":"Welche Länder sind in der Ū-Tabelle die Extrempunkte?","a":"<b>Dauerhaft hoch:</b> Spanien (14,3 % 1990, 15,4 % 2015, 14,8 % 2020), Italien und Frankreich über 8 %. <b>Dauerhaft niedrig:</b> Japan (1,6 % 1970, 3,5 % 2020) und die Schweiz (unter 5 %). Die Unterschiede sind zu groß und zu stabil, um konjunkturell erklärbar zu sein — sie sind <b>strukturell</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 7.3","e":"e_x_natALQtabelle","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":215,"d":"m8","t":"AS-Kurve","q":"Wie hängen AD-Kurve und der Übergang zur langen Frist zusammen?","a":"Nach dem Nachfrageimpuls steigt die Kerninflation von π̄₁ auf π̄₂, die AS-Kurve wandert nach oben — und man bewegt sich <b>entlang der AD-Kurve</b> zurück nach links, bis Punkt Z bei Y = Ȳ erreicht ist.","s":"Makro VL08 (Angebot/Inflation)","sec":"Abschnitt 7.4","e":"e_x_pfadZ","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":216,"d":"m8","t":"Zusammenfassung","q":"Die sechs Punkte der Schlusszusammenfassung von Teil 8?","a":"1) Phillips-Kurve bildet den Trade-off ab. 2) AS-Kurve = Phillips + Okun. 3) Komponentenzerlegung erklärt Inflation über Aufschlagskalkulation. 4) Grundinflation und Ū bestimmen die Lage der kurzfristigen Kurve. 5) Änderungen von π̄ oder Ȳ verschieben die kurzfristigen Kurven. 6) Langfristig Rückkehr zu Ū und zum Trend ⇒ <b>Dichotomie</b>.","s":"Makro VL08 (Angebot/Inflation)","sec":"Kapitel 8","e":"e_x_zusammen8","f":"Makro_VL08_Angebot_Beschaeftigung_Inflation.pdf"},{"i":217,"d":"m9","t":"Gleichgewicht","q":"Was ist im Schnittpunkt von AS und AD im Gleichgewicht?","a":"<b>Arbeitsmarkt, Gütermarkt sowie Geld- und Devisenmarkt simultan</b> — das allgemeine Gleichgewicht. Teil 7 konnte das noch nicht, weil Arbeitsmarkt, Produktion und Preisniveau fehlten.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 2","e":"e_allgemeinesGG","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":218,"d":"m9","t":"Feste WK","q":"Was gilt bei FESTEN Wechselkursen langfristig für die Inflation?","a":"g_σ = π − π* = 0 ⇒ <b>π = π*</b>. Ein Land mit festem Wechselkurs kann sich seine Inflationsrate langfristig nicht aussuchen — sie wird ihm vom Ausland vorgegeben. Auch g_M = g_Y + π* ist damit fremdbestimmt.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.1","e":"e_festeAD","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":219,"d":"m9","t":"Feste WK","q":"Wie entsteht die AD-Kurve bei FESTEN Wechselkursen?","a":"Höhere heimische Inflation (bei festem S) ⇒ σ steigt ⇒ reale Aufwertung ⇒ PLB fällt ⇒ IS nach links ⇒ Output sinkt. Die AD-Kurve fällt also über den <b>realen Wechselkurs</b>, nicht über den Zins.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.2","e":"e_festeAD","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":220,"d":"m9","t":"Feste WK","q":"Was verschiebt die AD-Kurve bei FESTEN Wechselkursen?","a":"Alles, was die IS-Kurve verschiebt: <b>G, T, q, Ω, Y*</b> — sowie der Weltmarktzins i*. Der reale Wechselkurs ist wegen der Preisniveauanpassung endogen.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.3","e":"e_festeAD","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":221,"d":"m9","t":"Gleichgewicht","q":"Die drei Langfristbedingungen der AS-Seite?","a":"1) Y = Ȳ (keine Outputlücke). 2) π = π̄ (Erwartungen eingeholt). 3) π̄ = π* (keine Inflationsdifferenz zum Ausland). Die LAD-Kurve markiert zusätzlich: Kaufkraftparität ist erfüllt.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.4","e":"e_langfristbed","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":222,"d":"m9","t":"Feste WK","q":"Fiskalpolitik bei festen Wechselkursen — Ablauf A→B→C→D?","a":"A→B: AD nach rechts, man wandert die AS-Kurve hinauf (Y und π steigen). B→C: Erwartungen holen auf, AS verschiebt sich nach oben. C→D: Die aufgelaufene Inflation verschlechtert über σ die Wettbewerbsfähigkeit, AD wandert zurück. Y ist wieder bei Ȳ.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.5","e":"e_fiskalfest","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":223,"d":"m9","t":"Feste WK","q":"Fünf Bewertungspunkte zur Fiskalpolitik bei festen Wechselkursen?","a":"1) Stagflation im Rückkehrprozess möglich. 2) Nachfrageschocks ändern auch die Inflation. 3) Erfolg nur temporär — die staatliche Budgetrestriktion erzwingt Rückverschiebung. 4) Inflatorischer Effekt erodiert den Erfolg, Leistungsbilanz verschlechtert sich. 5) Geldpolitik wirkungslos, außer über wiederholte Abwertung (Abwertungswettläufe).","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.6","e":"e_fiskalfest","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":224,"d":"m9","t":"Fisher/Taylor","q":"Neutraler Zins — woraus setzt er sich zusammen?","a":"ī = r̄ + π̄, und langfristig ī = i*. Den Realzins r̄ bestimmt die reale Seite, das Inflationsziel π̄ wählt die Zentralbank. Weicht π̄ vom Ausland ab, gleicht der Wechselkurs die Differenz aus.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 4.2","e":"e_neutralerZins","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":225,"d":"m9","t":"Fisher/Taylor","q":"Warum steht in der Fisher-Gleichung hier π^e statt π?","a":"Weil Verträge im Voraus geschlossen werden: Wer heute einen Kredit aufnimmt, kennt die künftige Inflation nicht und kalkuliert mit seiner <b>Erwartung</b>. Nur ex post lässt sich mit der tatsächlichen Inflation rechnen.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 4.1","e":"e_fisher9","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":226,"d":"m9","t":"Flexible WK","q":"Wie entsteht die AD-Kurve bei FLEXIBLEN Wechselkursen?","a":"Höhere Inflation ⇒ Taylor-Regel verlangt höheren Zins ⇒ TR nach oben ⇒ i > i* ⇒ Kapitalimporte ⇒ Aufwertung ⇒ σ steigt ⇒ IS nach links ⇒ Output sinkt. Der Weg läuft über die <b>Zentralbank</b>.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 5.1","e":"e_flexAD","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":227,"d":"m9","t":"Flexible WK","q":"Was verschiebt die AD-Kurve bei FLEXIBLEN Wechselkursen — und was nicht?","a":"Verschiebt: <b>π̄, a, b, i*</b> (Taylor-Regel und Weltmarktzins). Verschiebt <b>nicht</b>: IS-Verschiebungen — die Lage der IS-Kurve ist wegen der Wechselkursanpassung endogen. Deshalb ist Fiskalpolitik hier unwirksam.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 5.2","e":"e_flexAD","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":228,"d":"m9","t":"Flexible WK","q":"Geldpolitische Lockerung bei flexiblen Wechselkursen — Endergebnis?","a":"Kurzfristig steigen Y und π (Bewegung auf der AS-Kurve). Dann holen die Erwartungen auf, AS verschiebt sich nach oben, Y kehrt zu Ȳ zurück — aber bei <b>dauerhaft höherer Inflation</b>. Das ist Geldneutralität in AS-AD-Sprache.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 5.4","e":"e_geldflex","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":229,"d":"m9","t":"Fristen","q":"Die drei Fristen — was gilt jeweils?","a":"<b>Kurz:</b> Preisrigidität, Mundell-Fleming, Multiplikatoreffekte. <b>Mittel:</b> Erwartungen und Preisanpassung verschieben AS, der reale Wechselkurs stellt Kaufkraftparität her. <b>Lang:</b> Dichotomie, Geldneutralität, Y_gap = 0, σ = 1, i = i*.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 6","e":"e_dreiFristen","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":230,"d":"m9","t":"Angebotsschock","q":"Das Politikdilemma bei einem negativen Angebotsschock?","a":"Nachfrage stützen ⇒ nur um den Preis <b>noch höherer Inflation</b>. Inflation bekämpfen ⇒ nur mit <b>kontraktiver</b> Politik, also Outputrückgang. Es gibt keine Maßnahme, die beides repariert.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 7.2","e":"e_politikdilemma","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":231,"d":"m9","t":"Bewertung","q":"Vier Bewertungspunkte zum AS-AD-Rahmen?","a":"1) Bei flexiblen Kursen entscheidet die Zentralbank über die langfristige Inflationsrate. 2) Feste Kurse verlangen gleichartige Politikstrategien ⇒ Koordinationsbedarf in der EU. 3) Nachfragepolitik ist ungeeignet gegen Angebotsschocks. 4) Wirksam bei Nachfrageschocks, aber mit Time-lag-Problematik ⇒ Angebotspolitik.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 8","e":"e_asadbewertung","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":232,"d":"m9","t":"Feste WK","q":"Die zwei Besonderheiten fester Wechselkurse für die AD-Seite?","a":"(a) Verschiebungen der aggregierten Nachfrage resultieren nur aus einer <b>Verschiebung der IS-Kurve</b> oder einer Änderung des <b>Weltmarktzinses i*</b>. (b) Die Zentralbank muss intervenieren und <b>verliert ihre binnenwirtschaftliche Souveränität</b> — die TR-Kurve ist wirkungslos.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 2","e":"e_x_festebesonderheit","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":233,"d":"m9","t":"Feste WK","q":"Warum ist bei festen Kursen auch das Geldmengenwachstum fremdbestimmt?","a":"Aus M = P·L(Y,i) folgt g_M = g_Y + π, und wegen Kaufkraftparität π = π* gilt <b>g_M = g_Y + π*</b>. Die Zentralbank kann nicht einmal mehr die Geldmenge wählen — sie muss genau so viel schöpfen, wie importierte Inflation und eigenes Wachstum verlangen.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.1","e":"e_x_gmfest","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":234,"d":"m9","t":"Gleichgewicht","q":"Was ist die LAD-Kurve — und wie unterscheidet sie sich von LAS?","a":"Die <b>langfristige AD-Kurve</b> ist senkrecht und markiert den Punkt, an dem <b>Kaufkraftparität</b> erfüllt ist. LAS ist senkrecht beim Trend-<b>Output</b> Ȳ, LAD markiert die mit dem Regime vereinbare <b>Inflationsrate</b>.","s":"Makro VL09 (AS-AD)","sec":"Abschnitte 3.2 / 3.4","e":"e_x_lad","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":235,"d":"m9","t":"Feste WK","q":"Was sind Abwertungswettläufe — und warum funktionieren sie nicht dauerhaft?","a":"Der Versuch, durch <b>wiederholte Abwertung</b> das reale BIP über seinen Trend zu drücken (competitive devaluation, beggar-thy-neighbour). Das funktioniert nur, solange die Handelspartner nicht mitziehen — tun sie es, verpuffen alle Effekte und übrig bleibt Instabilität.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 3.6","e":"e_x_abwertungswettlauf","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":236,"d":"m9","t":"Fisher/Taylor","q":"Wofür ist der Realzins laut Folie relevant?","a":"Für <b>intertemporale Konsumentscheidungen</b> (Euler-Gleichung aus Teil 5) und für <b>Investitionsentscheidungen</b> (GP_K = 1+r). Der negative Effekt der erwarteten Inflation auf die reale Geldnachfrage ist im Nominalzins bereits enthalten (Fisher-Prinzip).","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 4.1","e":"e_x_realzinsrelevanz","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":237,"d":"m9","t":"Fisher/Taylor","q":"Warum gleichen sich international die Realzinsen an?","a":"Internationale Kapitalmobilität führt zum <b>Ausgleich von Produktivitätsunterschieden</b> und damit zur Angleichung der Realzinsen. Jede Abweichung der Inflationsraten wird über Anpassungen des <b>nominalen</b> Wechselkurses ausgeglichen.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 4.2","e":"e_x_realzinsangleich","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":238,"d":"m9","t":"Angebotsschock","q":"Angebotsschock im AS-AD-Modell — Formel und Wirkung?","a":"π = π̄ + a(Y − Ȳ) + <b>s</b>. Der Schockterm verschiebt die <b>kurzfristige Angebotsfunktion</b>. Ergebnis ist <b>Stagflation</b>: Outputrückgang Y &lt; Ȳ bei gleichzeitig hoher Inflation π &gt; π̄.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 7.1","e":"e_x_schockformel9","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":239,"d":"m9","t":"Angebotsschock","q":"Wie unterscheidet sich der Schockterm in Teil 8 und Teil 9?","a":"Nur in der Notation: In Teil 8 heißt er <b>ε</b>, in Teil 9 <b>s</b>. Gemeint ist dasselbe — alle Störungen der Produktionskosten: Steuerpolitik, Rohstoffpreise, Währungsschocks, gesetzliche Regulierung.","s":"Makro VL09 (AS-AD)","sec":"Abschnitt 7.1","e":"e_x_schockformel9","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":240,"d":"m9","t":"Fristen","q":"Was ist mit „forward-looking“ und „backward-looking“ Inflationskomponenten gemeint?","a":"<b>Forward-looking:</b> Tarifparteien preisen die <b>erwartete</b> künftige Inflation ein (P^e in der Lohngleichung). <b>Backward-looking:</b> Löhne und Preise werden an die <b>bereits realisierte</b> Inflation angepasst (Indexierung, Nachholeffekte). Beides zusammen erzeugt die Trägheit der Inflation.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 6","e":"e_x_forwardbackward","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":241,"d":"m9","t":"Fristen","q":"Was gilt in der langen Frist gleichzeitig — die vier Bedingungen?","a":"<b>Y_gap = 0</b>, <b>π_gap = 0</b>, <b>Kaufkraftparität σ = 1</b> und <b>Zinsparität i = i*</b>. Dazu Dichotomie des monetären und realen Bereichs, also Geldneutralität.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 6","e":"e_x_langfristvier","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":242,"d":"m9","t":"Bewertung","q":"Warum verlangen feste Wechselkurse eine koordinierte Politik?","a":"Weil sie alle Beteiligten in dieselbe Inflationsrate zwingen (π = π*). Wer eine abweichende Politik fährt, verliert Wettbewerbsfähigkeit oder muss den Kurs aufgeben. <b>Eine Währungsunion ohne abgestimmte Fiskal- und Lohnpolitik erzeugt genau die Divergenzen der Euro-Krise.</b>","s":"Makro VL09 (AS-AD)","sec":"Kapitel 8","e":"e_x_koordination","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":243,"d":"m9","t":"Bewertung","q":"Warum ist Nachfragepolitik trotz Wirksamkeit bei Nachfrageschocks problematisch?","a":"Wegen der <b>time-lag-Problematik</b>: Erkennungs-, Entscheidungs- und Wirkungsverzögerung summieren sich auf mehrere Quartale. Bis die Maßnahme greift, kann der Zyklus gedreht haben — dann wirkt sie <b>prozyklisch</b>. Das ist das Argument für Regelbindung und automatische Stabilisatoren.","s":"Makro VL09 (AS-AD)","sec":"Kapitel 8","e":"e_x_timelag9","f":"Makro_VL09_AS_AD_Allgemeines_Gleichgewicht.pdf"},{"i":244,"d":"m10","t":"Positionen","q":"Worauf reduziert sich der Streit zwischen Keynesianern und Neoklassikern?","a":"Auf die <b>Anpassungsgeschwindigkeit</b>. Beide Seiten sind sich einig, dass die Wirtschaft langfristig zum Trend zurückkehrt — umstritten ist nur, wie lange das dauert. Das ist eine empirische, keine ideologische Frage.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 2.1","e":"e_positionen","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":245,"d":"m10","t":"Positionen","q":"Warum sehen Keynesianer und Neoklassiker eine expansive Politik verschieden?","a":"Keynesianer verorten die Wirtschaft <b>links</b> von LAS, wo die AS-Kurve flach ist: viel Output, wenig Inflation. Neoklassiker verorten sie nahe Ȳ, wo AS steil ist: kaum Output, viel Inflation.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 2.2","e":"e_positionen","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":246,"d":"m10","t":"Positionen","q":"Warum halten Keynesianer die Preisanpassung für langsam?","a":"Nicht wegen Irrationalität, sondern wegen <b>institutioneller Trägheit</b>: Es sind nicht nur Erwartungsänderungen, sondern auch <b>Vertragsanpassungen</b> nötig, und Verträge sind zeitlich gebunden (backward-looking Komponente dominiert).","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 2.3","e":"e_backwardlooking","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":247,"d":"m10","t":"Inflationskosten","q":"Kosten der Fehleinschätzung des Preissignals?","a":"Preise haben eine <b>Informationsfunktion</b>. Bei allgemeiner Inflation lässt sich nicht mehr unterscheiden, ob ein Preisanstieg echte Knappheit signalisiert oder bloß Rauschen ist. Nominale Fluktuationen bekommen so <b>reale Effekte</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 3.2","e":"e_preissignal","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":248,"d":"m10","t":"Inflationskosten","q":"Ist geringe Inflation oder Deflation immer gut?","a":"Nein. Drei Gegenargumente: <b>Kaufaufschub</b> in Erwartung fallender Preise senkt die Nachfrage; <b>Kreditblasen</b> und realer Wertanstieg bestehender Schulden; <b>beengter Spielraum</b> der Geldpolitik am Zero Lower Bound.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 3.3","e":"e_deflation","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":249,"d":"m10","t":"Konjunktur","q":"Konjunktur — Definition laut Folie?","a":"Wiederkehrende, <b>nicht durch individuelle Ereignisse ausgelöste</b> wirtschaftliche Wechsellagen industrialisierter Volkswirtschaften; kurz- bis mittelfristige zyklische Schwankungen der wirtschaftlichen Aktivität.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.1","e":"e_konjunktur","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":250,"d":"m10","t":"Konjunktur","q":"Wie definieren CEPR und NBER eine Rezession?","a":"CEPR: deutlicher, breit gestreuter Rückgang, üblicherweise <b>zwei oder mehr aufeinanderfolgende Quartale</b> negativen Wachstums bei BIP, Beschäftigung u. a. NBER: deutlicher Rückgang über <b>mehr als einige Monate</b>, sichtbar in BIP, Einkommen, Beschäftigung, Industrieproduktion, Handel.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.2","e":"e_rezession","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":251,"d":"m10","t":"Konjunktur","q":"Frisch (1933) — wie entstehen Zyklen aus zufälligen Schocks?","a":"Y_t = a·Y_{t−1} − b·Y_{t−2} + ε_t. Die Schocks sind reines Rauschen; die <b>Trägheit des Systems</b> erzeugt daraus regelmäßige Schwingungen — wie ein Schaukelpferd, das unregelmäßig angestoßen wird und im eigenen Rhythmus schwingt.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.4","e":"e_frisch","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":252,"d":"m10","t":"Empirie","q":"Volatilität der Aggregate relativ zum BIP (Deutschland)?","a":"Investitionen <b>2,71</b>, Konsum <b>0,96</b>, Löhne <b>0,56</b>. Das bestätigt Konsumglättung (PIH) und Akzeleratorprinzip (ν > 1) aus Teil 5 empirisch.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.1","e":"e_volatilitaet","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":253,"d":"m10","t":"RBC/DSGE","q":"RBC-Theorie — Kernaussage und radikale Konsequenz?","a":"Konjunkturschwankungen gehen auf <b>reale Schocks</b> zurück und spiegeln <b>Optimalverhalten</b> (Planrevisionen) wider. Folge: kein stabilitätspolitischer Handlungsbedarf; staatliche Eingriffe wirken <b>immer wohlfahrtsmindernd</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.4","e":"e_rbc","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":254,"d":"m10","t":"RBC/DSGE","q":"Was ergänzen DSGE-Modelle gegenüber RBC?","a":"Auch <b>nicht-reale</b> Schocks (monetär, News, Nachfrage) und <b>keynesianische Elemente</b>: verzögerte Preisanpassung, Matching-Probleme am Arbeitsmarkt. Dadurch entsteht wieder Spielraum für wohlfahrtssteigernde Eingriffe.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.4","e":"e_rbc","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":255,"d":"m10","t":"Empirie","q":"Stilisierte Fakten: Was ist prozyklisch, antizyklisch, vorlaufend, nachlaufend?","a":"<b>Prozyklisch:</b> Konsum, Investitionen, Im-/Exporte, Löhne, Zinsen, TFP. <b>Antizyklisch:</b> Arbeitslosigkeit. <b>Vorlaufend:</b> Kapazitätsauslastung, Auftragseingänge, Aktienkurse, Geldhaltung. <b>Nachlaufend:</b> Inflation; Staatsnachfrage mit Lag von 4 Quartalen.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.5","e":"e_stilisiertekonj","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":256,"d":"m10","t":"Kritik","q":"Die vier Zeitverzögerungen und die Friedman-Kritik?","a":"Erkennungs-/Diagnose-, Entscheidungs-, Durchführungs- und Wirkungsverzögerung. Friedman: Wegen dieser Lags kann aus <b>antizyklischer</b> Politik <b>prozyklische</b> werden, die die Ziele konterkariert.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 6.1","e":"e_timelags","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":257,"d":"m10","t":"Kritik","q":"Lucas-Kritik — Aussage?","a":"Wirkungen wirtschaftspolitischer Maßnahmen lassen sich <b>nicht ohne Weiteres aus vergangenen Verhaltensmustern</b> ableiten, weil das Verhalten vom <b>Politikregime</b> abhängt. Wirtschaftssubjekte antizipieren Eingriffe und passen ihr Verhalten an.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 6.2","e":"e_lucas","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":258,"d":"m10","t":"Kritik","q":"Zeitinkonsistenz — Definition und Standardbeispiel?","a":"Aus heutiger Sicht optimale Maßnahmen sind zukünftig nicht mehr optimal, besonders wenn die Wirtschaftssubjekte ihr Verhalten angepasst haben ⇒ die Politik ist nicht glaubwürdig. Beispiel: Das <b>Patent</b> liefert erst den F&E-Anreiz, wird aber nach dem Forschungserfolg unattraktiv.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 6.3","e":"e_zeitinkonsistenz","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":259,"d":"m10","t":"Pro","q":"Fünf Argumente FÜR Stabilisierungspolitik?","a":"1) Frühindikatoren ermöglichen rechtzeitige Eingriffe. 2) Selbstheilung dauert zu lange (soziale Folgen). 3) Kreditrestriktionen behindern die Konsumglättung. 4) Arbeitslosigkeit näher an u* halten. 5) <b>Automatische Stabilisatoren</b> wirken konstruktionsbedingt.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 7.1","e":"e_proStabil","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":260,"d":"m10","t":"Pro","q":"Wie funktionieren automatische Stabilisatoren?","a":"Der Staatskonsum schwankt kaum, die Nettobesteuerung ist <b>stark prozyklisch</b>. Bei schwachem Wachstum steigt das Defizit ⇒ implizite fiskalische Expansion; bei starkem Wachstum umgekehrt. Sie <b>umgehen sämtliche Time-lags</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 7.2","e":"e_autostabil","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":261,"d":"m10","t":"Politische Ökonomie","q":"Politische Konjunkturzyklen und der Medianwähler?","a":"Der „wohlwollende Diktator“ ist Fiktion; Politiker verfolgen eigennützige Ziele (Wiederwahl, Budgetmaximierung). Folge: In Wahljahren sind Wachstumsraten und Defizite tendenziell höher. Parteien konkurrieren um die Stimme des <b>Medianwählers</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Kapitel 8","e":"e_politoekonomie","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":262,"d":"m10","t":"Inflationskosten","q":"Wie wirkt Inflation auf Einkommens- und Vermögensverteilung?","a":"Steuerzahler werden über <b>kalte Progression und Wertsteuern</b> belastet. Je nach Verhandlungsmacht profitieren Unternehmen von sinkenden Reallöhnen oder Arbeiter über den Inflationsausgleich. Es kommt zur <b>Umverteilung zwischen Gläubigern und Schuldnern</b>; Nominaleinkommensbezieher ohne Indexierung verlieren; <b>Besitzer realer Vermögenswerte profitieren</b> von der Verzerrung relativer Assetpreise.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 3.1","e":"e_y_verteilungsinflation","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":263,"d":"m10","t":"Inflationskosten","q":"Warum wirkt Inflation systematisch zugunsten der Vermögenden?","a":"Wer <b>Sachwerte</b> hält (Immobilien, Aktien), ist gegen Inflation geschützt; wer <b>Geldvermögen</b> hält, nicht. Die Verzerrung der relativen Assetpreise begünstigt also genau die Gruppe, die ohnehin Vermögen besitzt.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 3.1","e":"e_y_verteilungsinflation","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":264,"d":"m10","t":"Konjunktur","q":"Was macht ein HP-Filter — und warum ist das für dieses Kapitel wichtig?","a":"Er zerlegt eine Zeitreihe in einen <b>glatten Trend</b> und eine <b>zyklische Restkomponente</b> und balanciert dabei Datennähe gegen Glätte. Wichtig, weil die ganze Analyse mit der Outputlücke arbeitet — und <b>Ȳ ist nicht beobachtbar, sondern geschätzt</b>. Genau das verschärft die Unsicherheitsproblematik der Stabilisierungspolitik.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.3","e":"e_y_hpfilter","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":265,"d":"m10","t":"Konjunktur","q":"Wie groß ist die zyklische Komponente des deutschen BIP 1991–2023?","a":"Sie schwankt etwa zwischen <b>−0,10 und +0,04</b> (log-Abweichung vom Trend), mit deutlichen Einbrüchen <b>2009 und 2020</b>. Im Log gelesen sind das rund −10 % bis +4 % Abweichung vom Trendpfad.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.3","e":"e_y_hpfilter","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":266,"d":"m10","t":"Konjunktur","q":"Unter welcher Bedingung erzeugt die AR(2)-Gleichung überhaupt Zyklen?","a":"Nur wenn die charakteristischen Wurzeln <b>komplex</b> sind, also bei <b>a² &lt; 4b</b>. Beispiel a = 1,5, b = 0,7: a² = 2,25 &lt; 2,8 ✓. Der Dämpfungsfaktor ist √b = 0,84 (die Schwingung klingt ab), die Periode liegt bei rund 14 Perioden.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.4","e":"e_y_ar2","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":267,"d":"m10","t":"Konjunktur","q":"Warum stirbt der Zyklus im Frisch-Modell nicht aus?","a":"Weil der Dämpfungsfaktor √b &lt; 1 ist, würde die Schwingung ohne neue Impulse <b>auslaufen</b>. Erst die <b>fortlaufenden Zufallsschocks</b> ε halten sie am Leben. Genau das ist Frischs Punkt: Impuls und Propagation sind zwei verschiedene Dinge.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.4","e":"e_y_ar2","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":268,"d":"m10","t":"Konjunktur","q":"Welche Schocktypen nennt die Folie als Konjunkturauslöser?","a":"<b>Technologie, Produktivität, Innovation</b>, <b>fiskalische und monetäre</b> Schocks (über i und σ) sowie <b>geologische und klimatische</b> Ereignisse. Konjunkturzyklen entstehen daraus über <b>Impulse-Response</b>: zeitverzögerte Anpassung pflanzt den Schock fort.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 4.4","e":"e_y_schocktypen","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":269,"d":"m10","t":"Empirie","q":"Was verraten die Autokorrelationen des BIP über die Zykluslänge?","a":"Die AKF fällt von 0,85 (Lag 1) auf 0,19 (Lag 4) und wird bei Lag 6 negativ (−0,14). Der <b>Nulldurchgang liegt bei etwa Lag 5</b> — eine Vierteldrehung des Zyklus. Fünf Quartale mal vier ergibt rund <b>20 Quartale, also 5 Jahre</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.1","e":"e_y_autokorrelation","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":270,"d":"m10","t":"Empirie","q":"Was bedeutet die stark negative Autokorrelation bei Lag 8 (−0,41)?","a":"Was heute über Trend liegt, liegt zwei Jahre später typischerweise <b>darunter</b>. Das ist die Gegenphase des Zyklus — und zugleich der Grund, warum verzögert wirkende Politik prozyklisch werden kann.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.1","e":"e_y_autokorrelation","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":271,"d":"m10","t":"Empirie","q":"Wie liest man ein Kreuzkorrelogramm (Burns-Mitchell)?","a":"Das <b>Maximum</b> verrät die zeitliche Beziehung zum BIP: bei Lag 0 <b>gleichlaufend</b>, bei negativem Lag <b>vorlaufend</b> (Frühindikator), bei positivem Lag <b>nachlaufend</b>. Vorlaufende Indikatoren sind genau das, was Stabilisierungspolitik zur Verkürzung der Erkennungsverzögerung braucht.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.2","e":"e_y_kreuzkorrelogramm","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":272,"d":"m10","t":"Empirie","q":"Wie erzeugt das AS-AD-Modell den zyklischen Zeitpfad des BIP?","a":"Ein Schock verschiebt AD oder AS. Die Erwartungen passen sich <b>verzögert</b> an, wodurch AS nachwandert. Bis das abgeschlossen ist, hat der nächste Schock zugeschlagen. Das Ergebnis ist eine geschwungene Bahn um die LAS-Kurve — <b>die Wirtschaft ist ständig unterwegs zu einem Gleichgewicht, das sie nie erreicht</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.3","e":"e_y_schockfortpflanzung","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":273,"d":"m10","t":"RBC/DSGE","q":"Warum ist der prozyklische Verlauf der TFP das Hauptargument der RBC-Theorie?","a":"Weil die TFP das <b>Solow-Residuum</b> aus Teil 2 ist und einen substantiellen Anteil der BIP-Schwankungen erklärt. Schwankt sie prozyklisch, spricht das dafür, dass Konjunktur von <b>realen</b> Produktivitätsschocks getrieben wird — nicht von Nachfrage.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitte 5.4–5.5","e":"e_y_tfpprozyklisch","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":274,"d":"m10","t":"RBC/DSGE","q":"Warum wäre nach RBC ein Beschäftigungsrückgang keine Fehlentwicklung?","a":"Sinkt die Produktivität vorübergehend, ist es <b>rational</b>, weniger zu arbeiten und mehr Freizeit zu nehmen. Der Rückgang ist dann eine Optimalentscheidung, kein Marktversagen — und jeder staatliche Eingriff würde die Menschen von ihrem Optimum wegdrängen.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 5.4","e":"e_y_tfpprozyklisch","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":275,"d":"m10","t":"Kritik","q":"Welche Probleme nennt die Folie neben den Time-lags als Kritik?","a":"<b>Unsicherheit</b> — exogene und endogene — sowie <b>asymmetrische Information</b>. Zusammen mit den vier Verzögerungen ergibt das die Friedman-Kritik: Stabilitätspolitische Eingriffe können die zyklischen Schwankungen sogar noch verstärken.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 6.1","e":"e_y_unsicherheit","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":276,"d":"m10","t":"Kritik","q":"Was bedeutet „common knowledge“ im Zusammenhang mit der Lucas-Kritik?","a":"„Ich weiß, dass du weißt, dass ich weiß …“ — Wirtschaftssubjekte <b>antizipieren</b> wirtschaftspolitische Eingriffe und passen ihre heutigen Aktivitäten so an, dass die <b>Durchführung der Maßnahme gegebenenfalls überflüssig wird</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 6.2","e":"e_y_commonknowledge","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":277,"d":"m10","t":"Kritik","q":"Welche drei Schlussfolgerungen zieht die Folie aus Lucas-Kritik und Zeitinkonsistenz?","a":"1) <b>Kein wirtschaftspolitischer Aktionismus.</b> 2) <b>Regelgebundene</b> statt diskretionärer Politik. 3) Gegenwärtige Maßnahmen müssen mit <b>verbindlichen Verpflichtungen für die Zukunft</b> kombiniert werden. ⇒ Glaubwürdigkeit, Selbstbindung, Reputation.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 6.3","e":"e_y_schlussfolgerungen","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":278,"d":"m10","t":"Pro","q":"Was zeigt das AS-AD-Diagramm zur Stabilisierungspolitik?","a":"Zwei Pfade nach einem negativen Schock. <b>Ohne Politik:</b> Rückkehr zu Ȳ nur über die langsame Abwärtsanpassung der AS-Kurve, also über sinkende Löhne und Preise. <b>Mit expansiver Politik:</b> schnellere Rückkehr, aber bei höherer Inflation. Beide enden bei Ȳ — der Unterschied liegt in <b>Zeit und Preis</b>.","s":"Makro VL10 (Nachfragepolitik)","sec":"Abschnitt 7.3","e":"e_y_stabilisierungasad","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":279,"d":"m10","t":"Politische Ökonomie","q":"Was ist das Medianwähler-Theorem und welche Konsequenz hat es?","a":"Bei eindimensionaler Politikfrage und Mehrheitswahl setzt sich die Position durch, die dem <b>Medianwähler</b> am nächsten liegt. Konsequenz: Parteien haben einen starken Anreiz, <b>zur Mitte zu konvergieren</b> — das erklärt, warum sich Wahlprogramme oft ähneln.","s":"Makro VL10 (Nachfragepolitik)","sec":"Kapitel 8","e":"e_y_medianwaehler","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":280,"d":"m10","t":"Politische Ökonomie","q":"Warum sind politische Konjunkturzyklen ein Fall von Zeitinkonsistenz?","a":"Vor der Wahl ist Expansion optimal (für die Wiederwahl), nach der Wahl Konsolidierung. Die Lösung ist dieselbe wie bei der Geldpolitik: <b>Selbstbindung durch Institutionen</b> — unabhängige Zentralbank, Schuldenbremse, europäische Fiskalregeln.","s":"Makro VL10 (Nachfragepolitik)","sec":"Kapitel 8","e":"e_y_medianwaehler","f":"Makro_VL10_Nachfrageorientierte_Wirtschaftspolitik.pdf"},{"i":281,"d":"m11","t":"Staatsaufgaben","q":"Warum kommt bei öffentlichen Gütern kein privates Angebot zustande?","a":"Nichtrivalität ⇒ Grenzkosten C′ = 0. Unter p = C′ müsste das Gut <b>kostenlos abgegeben</b> werden — die Fixkosten wären nicht gedeckt. Das Marktversagen sitzt tiefer als das bloße Trittbrettfahrerproblem.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 2.1","e":"e_oeffGut11","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":282,"d":"m11","t":"Verteilung","q":"Primär- vs. Sekundärverteilung?","a":"Primär: Verteilung der <b>Markteinkommen</b>, vor jedem staatlichen Eingriff. Sekundär: Verteilung <b>nach</b> Steuern und Transfers. Die Differenz der Gini-Koeffizienten misst, was der Sozialstaat tatsächlich leistet.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 2.2","e":"e_verteilung","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":283,"d":"m11","t":"Verteilung","q":"equity-vs-efficiency-Trade-off — warum gibt es ihn?","a":"Ungleichheit trägt auch Anreizfunktion; wer sie vollständig beseitigt, beseitigt den Leistungsanreiz. Umverteilung verursacht Kosten (Zusatzlast, Anreizwirkungen). Bewertungsmaßstäbe: soziale Wohlfahrtsfunktionen nach Bergson und Rawls.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 2.2","e":"e_verteilung","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":284,"d":"m11","t":"Verschuldung","q":"Defizitgleichung und Stabilisierungsbedingung?","a":"ΔB = (G − T) + r·B — Primärdefizit plus Schuldendienst. Stabilisierung der absoluten Schuld: <b>T − G = r·B</b>, der Primärüberschuss muss den Schuldendienst decken.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.1","e":"e_defizit","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":285,"d":"m11","t":"Verschuldung","q":"Dynamik der Schuldenquote — die zentrale Formel?","a":"Δ(B/Y) = (G−T)/Y + (r − g_Y)·(B/Y). Erster Term: Primärdefizit. Zweiter Term: <b>Zins-Wachstums-Differenzial</b>.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.2","e":"e_schuldendynamik","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":286,"d":"m11","t":"Verschuldung","q":"Was bedeutet r ≷ g_Y für die Schuldenquote?","a":"r > g_Y: Die Quote steigt <b>von selbst</b>, auch ohne neues Defizit — Schneeballeffekt. r &lt; g_Y: Sie sinkt von selbst, sogar bei moderaten Defiziten.<br>Beispiel B/Y = 60 %, r−g = 2 pp: +1,2 Prozentpunkte pro Jahr.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.2","e":"e_schuldendynamik","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":287,"d":"m11","t":"Verschuldung","q":"Die fünf Wege zur Stabilisierung der Staatsschuld?","a":"1) Defizitreduktion (Ausgaben senken/Steuern erhöhen). 2) Wachstum sicherstellen, r &lt; g_Y. 3) <b>Monetisierung</b>/Seignorage. 4) Vermögensverkauf (nur einmaliger Effekt). 5) <b>Repudiation</b> — Staatsbankrott.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.3","e":"e_wege","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":288,"d":"m11","t":"Verschuldung","q":"Schuldendynamik mit Monetisierung — Zusatzterm und Größenordnung?","a":"− (π + g_Y)·M0/(P·Y). Bei M0 ≈ 27 % des BIP, π = 2 % und g_Y = 1 % ergibt das rund <b>0,8 % des BIP</b>; bei π = 10 % schon 3,0 % — daher Versuchung und Gefahr zugleich.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.3","e":"e_wege","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":289,"d":"m11","t":"Angebotspolitik","q":"Die Position der angebotsorientierten Wirtschaftspolitik?","a":"Da die Volkswirtschaft ohnehin zum Trend zurückkehrt, schadet Nachfragesteuerung mehr als sie nützt. Alternative: Verbesserung der <b>Produktionsbedingungen</b> ⇒ Erhöhung des Produktionspotentials. Vorteil: <b>kein langfristiger Output-Inflations-Trade-off</b>. Nachteil: wirkt erst nach Jahren.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 5.1","e":"e_angebotspolitik","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":290,"d":"m11","t":"Angebotspolitik","q":"Warum gibt es bei Angebotspolitik keinen Trade-off?","a":"Sie verschiebt die <b>LAS-Kurve selbst</b> nach rechts, statt AD entlang einer gegebenen AS-Kurve zu bewegen. Output steigt dauerhaft, und weil das Angebot wächst, entsteht kein Inflationsdruck.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 5.2","e":"e_angebotspolitik","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":291,"d":"m11","t":"Marktversagen","q":"Die fünf Merkmale des vollkommenen Marktes?","a":"Atomistische Konkurrenz, freie Preisbildung, vollständige Information, Abwesenheit von Externalitäten, ungehinderter Marktzugang. Nur wo eines verletzt ist, gibt es eine Rechtfertigung für staatliches Eingreifen.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 5.3","e":"e_marktversagen11","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":292,"d":"m11","t":"Marktversagen","q":"Die drei Formen von Marktunvollkommenheit und ihre Ursachen?","a":"1) <b>Unvollständige Konkurrenz</b> durch Lock-in-Effekte oder steigende Skalenerträge ⇒ Wettbewerbspolitik/Deregulierung. 2) <b>Asymmetrische Information/Moral Hazard</b> ⇒ unzureichende private Risikoabsicherung. 3) <b>Externe Effekte</b> aus unzureichenden Eigentumsrechten.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 5.3","e":"e_marktversagen11","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":293,"d":"m11","t":"Angebotspolitik","q":"Maßnahmen angebotsorientierter Wirtschaftspolitik — die vier Felder?","a":"1) Externe Effekte: Humankapital, Rechtssystem, kollektivierte Risikovorsorge, öffentliche Güter. 2) Steuersystem: Optimalsteuertheorie (Mirrlees). 3) Unvollkommene Konkurrenz: Deregulierung, Privatisierung. 4) Subventionen/Industriepolitik, Steuerwettbewerb.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 5.4","e":"e_massnahmen11","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":294,"d":"m11","t":"Laffer","q":"Laffer-Kurve — Logik und wichtigste Einschränkung?","a":"Bei τ = 0 % und τ = 100 % ist das Aufkommen null, dazwischen liegt ein Maximum. Rechts davon wäre eine Steuersenkung selbstfinanzierend. <b>Einschränkung:</b> Die Kurve sagt nichts darüber, <i>wo</i> das Maximum liegt — die meisten Länder operieren links davon.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 5.5","e":"e_laffer","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":295,"d":"m11","t":"Arbeitsmarktpolitik","q":"Ansatzpunkte angebotsorientierter Arbeitsmarktpolitik?","a":"Arbeitsmarktreformen und Deregulierung, Arbeitsmarktpartizipation von Frauen, Mobilitätsförderung, Änderung der Anreizstrukturen in der sozialen Sicherung, Verbesserung des Matchings. Alle fünf zielen auf <b>Ū</b>.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.1","e":"e_ampolitik","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":296,"d":"m11","t":"Arbeitsmarktpolitik","q":"Aktive vs. passive Arbeitsmarktmaßnahmen — Unterschied und Beispiel?","a":"Aktive verändern die <b>Beschäftigungsfähigkeit</b> (Umschulung, Vermittlung, Anreize) und zielen auf Ū. Passive sichern das Einkommen. Dänemark verteilt hälftig (1,96 aktiv / 1,09 passiv) und hat 1,2 % Langzeitarbeitslose; Frankreich fast nur passiv (0,87 / 1,97) und 3,9 %.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.3","e":"e_aktivpassiv","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":297,"d":"m11","t":"Soziale Sicherung","q":"Warum eliminiert ein Grenzsteuersatz von 100 % das Arbeitsangebot?","a":"Wird jeder verdiente Euro voll auf den Transfer angerechnet, bleibt netto nichts übrig ⇒ die Budgetgerade verläuft <b>waagerecht</b>. Da Freizeit Nutzen stiftet, wählt der Haushalt rational maximale Freizeit. Das ist kein Faulheitsproblem, sondern Optimalverhalten.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.4","e":"e_grenzsteuersatz","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":298,"d":"m11","t":"Soziale Sicherung","q":"Wie lösen Anrechnungsregelungen das Problem — und wo bleibt der Haken?","a":"Sie senken den Grenzsteuersatz unter 100 %, die Budgetgerade steigt wieder an, Arbeit lohnt sich. Haken: Je großzügiger die Anrechnung, desto teurer das System. <b>Zielgenau, anreizfreundlich und günstig geht nicht gleichzeitig.</b>","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.4","e":"e_grenzsteuersatz","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":299,"d":"m11","t":"Klima","q":"Allmende-Problem vs. öffentliches Gut — der Unterschied?","a":"Öffentliches Gut: <b>nichtrival</b> ⇒ wird <b>unterproduziert</b>. Allmendegut: <b>rival</b>, aber nicht ausschließbar ⇒ wird <b>überkonsumiert</b>. Beides sind Externalitäten, einmal positiv, einmal negativ.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 8","e":"e_allmende","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":300,"d":"m11","t":"Klima","q":"Die Konfliktlinien des Klimawandels laut Folie?","a":"1) Allmende-Problem. 2) Intergenerationeller Konflikt. 3) Intragenerationeller Konflikt. 4) Kurzfrist-Langfrist-Trade-off der Politik. 5) Internationaler Konflikt. 6) Kompensation der Verlierer. <b>Problem: international gibt es faktisch keine Sanktionsmechanismen.</b>","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 8","e":"e_klima","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":301,"d":"m11","t":"Zusammenfassung","q":"Die vier Punkte der Schlusszusammenfassung?","a":"1) Angebotspolitik kennt keinen kurzfristigen Arbeitslosigkeits-Inflations-Trade-off. 2) Eingriffe brauchen <b>Marktunvollkommenheiten</b> als Rechtfertigung (externe Effekte, steigende Skalenerträge, asymmetrische Information, Kreditrestriktionen). 3) Staatsausgaben nur für nicht marktfähige Güter. 4) Finanzierung mit möglichst wenig Verzerrungen.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 9","e":"e_zusammen11","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":302,"d":"m11","t":"Empirie","q":"Staatsausgaben 2019 im Vergleich — die Eckwerte?","a":"Summe der Staatsausgaben in % des BIP: <b>Euroraum 46,3</b>, UK 41,0, Japan 39,1, <b>USA 38,3</b>. Haushaltsüberschuss: Euroraum −0,8, USA <b>−7,2</b>. Schuldenstand: Euroraum 84,4, UK 85,4, USA 111,1, <b>Japan 236,5</b>.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 3.1","e":"e_y_staatsausgaben2019","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":303,"d":"m11","t":"Empirie","q":"Warum haben die USA trotz niedrigster Staatsquote das größte Defizit?","a":"Weil eine hohe Staatsquote und ein hohes Defizit <b>nicht dasselbe</b> sind — es kommt auf die <b>Einnahmenseite</b> an. Der Euroraum finanziert seine 46,3 % weitgehend durch Einnahmen, die USA ihre 38,3 % nicht.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 3.1","e":"e_y_staatsausgaben2019","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":304,"d":"m11","t":"Empirie","q":"Warum ist Japans Schuldenquote von 236,5 % kein sofortiger Krisenfall?","a":"Weil nicht die Höhe der Quote entscheidet, sondern die <b>Dynamik</b>: Δ(B/Y) = (G−T)/Y + (r − g_Y)(B/Y). Japan zahlt seit Jahrzehnten extrem <b>niedrige Zinsen</b> — bei kleinem r bleibt der Zins-Wachstums-Term beherrschbar.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitte 3.1 / 4.2","e":"e_y_staatsausgaben2019","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":305,"d":"m11","t":"Empirie","q":"Wie haben sich Transferzahlungen 1960–2010 entwickelt?","a":"Überall drastisch gestiegen: Spanien von 2,9 auf 20,4 % des BIP, Portugal 3,7 → 29,2, USA 6,0 → 30,9, Deutschland 14,1 → 29,9. Gemessen an den Staatsausgaben machen Transfers 2010 überall <b>über die Hälfte</b> aus, in Schweden und Dänemark rund zwei Drittel.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 3.2","e":"e_y_transfers","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":306,"d":"m11","t":"Empirie","q":"Was folgt aus der Transfertabelle für das Bild vom Staat?","a":"<b>Der moderne Staat ist in erster Linie eine Umverteilungsmaschine</b>, nicht ein Produzent öffentlicher Güter. Das passt zur deutschen Ressortverteilung (Arbeit und Soziales 37,5 % des Bundeshaushalts) und ist ein Beispiel für <b>Wagners Gesetz</b>.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 3.2","e":"e_y_transfers","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":307,"d":"m11","t":"Empirie","q":"Budgetsalden 1975–2021 — was ist der zentrale Befund?","a":"<b>Defizite sind der Normalfall.</b> Frankreich und Italien hatten in 46 Jahren <b>kein einziges</b> Überschussjahr (0 %), die USA eines von fünfzig (2 %). Nur Finnland (+0,9 Ø, 60 % positive Jahre), Estland (56 %) und Schweden (49 %) sind einigermaßen ausgeglichen.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 3.3","e":"e_y_defizitbias","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":308,"d":"m11","t":"Empirie","q":"Warum widerspricht der beobachtete Defizitbias der Theorie?","a":"Die Budgetglättung aus Teil 5 würde Defizite in Rezessionen und Überschüsse in Booms vorhersagen, im Mittel also ungefähr null. Beobachtet wird ein <b>systematischer Defizitbias</b>. Die Erklärung liefert Teil 10: politische Konjunkturzyklen, Sperrklinkeneffekte, Zeitinkonsistenz. Deshalb gibt es Schuldenbremsen als <b>Selbstbindung</b>.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 3.3","e":"e_y_defizitbias","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":309,"d":"m11","t":"Verschuldung","q":"Welches historische Muster zeigt die langfristige Verschuldung?","a":"Schuldenquoten steigen in <b>Kriegen und schweren Krisen</b> sprunghaft an und werden danach über Jahrzehnte abgebaut — meist nicht durch Tilgung, sondern über den <b>Nenner</b>: Wachstum und Inflation lassen die Quote sinken. Das ist Weg 2 in Reinform.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.4","e":"e_y_historischesmuster","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":310,"d":"m11","t":"Verschuldung","q":"Wie viel Primärüberschuss braucht ein Land zur Stabilisierung der Schuldenquote?","a":"Genau (r − g_Y)·(B/Y). Bei B/Y = 60 %, r = 3 % und g_Y = 1 % also <b>1,2 % des BIP</b> — bei B/Y = 150 % schon <b>3,0 %</b>. Die Last steigt proportional zur Quote; deshalb sind hoch verschuldete Länder so verwundbar gegenüber Zinsanstiegen.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.2","e":"e_y_primaerueberschuss","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":311,"d":"m11","t":"Verschuldung","q":"Warum ist der Vermögensverkauf nur ein Buchungstrick?","a":"Er bringt <b>keinen dauerhaften, sondern nur einen einmaligen</b> Einnahmeneffekt, und es entgehen künftige Erträge. Man tauscht ein Vermögen gegen eine Schuldenreduktion — die <b>Nettovermögensposition ändert sich nicht</b>.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.3","e":"e_y_vermoegensverkauf","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":312,"d":"m11","t":"Verschuldung","q":"Was ist Repudiation — und warum ist sie der letzte Ausweg?","a":"Die <b>Wertberichtigung staatlicher Schuldverschreibungen</b>, also der Staatsbankrott. Gemeinsam mit der Monetisierung eine Enteignung — nur offen statt verdeckt. Beide zerstören die Glaubwürdigkeit auf Jahrzehnte und damit den künftigen Kapitalmarktzugang.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 4.3","e":"e_y_vermoegensverkauf","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":313,"d":"m11","t":"Arbeitsmarktpolitik","q":"Welche vier Probleme nennt die Folie für den Arbeitsmarkt?","a":"<b>Heterogenität</b> der Arbeitskräfte, <b>unvollständige Information</b> über deren Qualität, <b>Anreizproblematik der sozialen Sicherung</b> und ein <b>unzureichender Matching-Prozess</b>. Jedes Problem hat einen eigenen Politikansatz.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.1","e":"e_y_ampolprobleme","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":314,"d":"m11","t":"Arbeitsmarktpolitik","q":"Wie hebt Arbeitsmarktpolitik das Produktionspotential — die Wirkungskette?","a":"Erfolgreiche Reformen erhöhen die gleichgewichtige Beschäftigung L̄ auf L̄′. Über die Produktionsfunktion Y = F(K, L) steigt damit das Trend-BIP von Ȳ auf Ȳ′ ⇒ <b>Rechtsverschiebung der LAS-Kurve</b>. Der Arbeitsmarkt ist der konkrete Kanal der Angebotspolitik.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.2","e":"e_y_lasverschiebung","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":315,"d":"m11","t":"Empirie","q":"Ausgaben für Arbeitsmarktprogramme 2017 — die Gesamtsummen?","a":"In % des BIP: Dänemark <b>3,05</b>, Frankreich 2,85, Finnland 2,57, Schweden 1,78, Deutschland <b>1,40</b>, Norwegen 0,96. Arbeitslosenquoten dazu: DK 6, FR 9, FI 9, SE 6, DE 4, NO 4.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.3","e":"e_y_ampausgaben","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":316,"d":"m11","t":"Empirie","q":"Warum ist der Vergleich Dänemark–Frankreich lehrreich?","a":"Beide geben rund 3 % des BIP aus. Dänemark verteilt hälftig auf aktiv (1,96) und passiv (1,09), Frankreich fast nur passiv (0,87 zu 1,97). Ergebnis: Langzeitarbeitslosigkeit <b>1,2 % gegenüber 3,9 %</b> bei ähnlicher Gesamtquote. Das ist das dänische <b>Flexicurity</b>-Modell.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Abschnitt 6.3","e":"e_y_ampausgaben","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":317,"d":"m11","t":"Verteilung","q":"Welche Verteilungsmaße zeigt die Vorlesung — und was misst jedes?","a":"<b>Perzentilsabstand 90/50</b>: Spreizung in der oberen Hälfte, robust gegen Ausreißer. <b>Top-1-%-Anteil</b>: Konzentration an der Spitze. <b>Gini</b>: Ungleichheit über die gesamte Verteilung in einer Zahl. Dazu <b>Gender-Pay-Gap</b> und die Einkommens- und Vermögensdezile.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 7","e":"e_y_verteilungsmasse","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":318,"d":"m11","t":"Verteilung","q":"Welche Grafik ist verteilungspolitisch die aufschlussreichste — und warum?","a":"Die Gegenüberstellung der <b>Gini-Koeffizienten von Primär- und Sekundärverteilung</b>. Die Differenz der beiden Werte misst exakt, wie viel Umverteilung das Steuer-Transfer-System tatsächlich leistet.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 7","e":"e_y_verteilungsmasse","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":319,"d":"m11","t":"Verteilung","q":"Warum ist Vermögen ungleicher verteilt als Einkommen?","a":"Weil Vermögen ein <b>Bestand</b> ist, der sich über die Zeit akkumuliert und verzinst, Einkommen dagegen ein <b>Strom</b>. Über den Zinseszinseffekt erzeugen kleine Einkommensunterschiede über Jahrzehnte große Vermögensunterschiede. In Deutschland zusätzlich verstärkt durch die niedrige Wohneigentumsquote.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 7","e":"e_y_vermoegensdezile","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":320,"d":"m11","t":"Klima","q":"Was ist das Allmende-Problem — und warum lässt es sich international nicht lösen?","a":"Ein Gut ist <b>rival</b>, aber <b>nicht ausschließbar</b> (die Atmosphäre als Emissionsdeponie) ⇒ Übernutzung. Die üblichen Lösungen — Eigentumsrechte (Coase), Steuern (Pigou), Kontingentierung (Emissionshandel) — setzen eine durchsetzungsfähige Instanz voraus. <b>International gibt es sie nicht: keine Sanktionsmechanismen.</b>","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 8","e":"e_y_allmende11","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":321,"d":"m11","t":"Klima","q":"Warum ist der intergenerationelle Klimakonflikt ein Diskontierungsproblem?","a":"Weil die Frage lautet, wie stark man künftige Schäden gegenüber heutigen Kosten gewichtet — das ist die <b>Zeitpräferenzrate ρ</b> aus Teil 5 auf gesellschaftlicher Ebene. Bei Zeiträumen von hundert Jahren führen kleine Unterschiede in ρ zu völlig verschiedenen Politikempfehlungen.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 8","e":"e_y_diskontierungklima","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":322,"d":"m11","t":"Klima","q":"Warum ist Klimaschutz auch ein Zeitinkonsistenzproblem?","a":"Weil die <b>Kosten sofort</b> anfallen und der <b>Nutzen erst nach Jahrzehnten</b> — jenseits jedes Wahlzyklus. Das ist genau der Kurzfrist-Langfrist-Trade-off der Politik und dieselbe Struktur wie bei den politischen Konjunkturzyklen aus Teil 10.","s":"Makro VL11 (Fiskal/Angebot)","sec":"Kapitel 8","e":"e_y_diskontierungklima","f":"Makro_VL11_Fiskalpolitik_Verschuldung_Angebotspolitik.pdf"},{"i":323,"d":"w01","t":"Grundbegriffe","q":"Die drei Perspektiven der Wirtschaftspolitik?","a":"<b>Positiv</b>: empirische Analyse kausaler Effekte („Der Mindestlohn senkte die Beschäftigung um 2 %“). <b>Normativ</b>: Empfehlung anhand eines Wohlfahrtskriteriums („80 €/t CO₂ sind optimal“). <b>Politische Ökonomie</b>: Erklärung, <i>warum</i> eine womöglich ineffiziente Politik zustande kommt (Lobbydruck).","s":"Wipo VL 01 — Einführung","sec":"Lernfrage 1 und 5","e":"w_perspektiven","f":"llms-full.txt"},{"i":324,"d":"w01","t":"Grundbegriffe","q":"Ordnungs- vs. Prozesspolitik — Unterschied und je ein Beispiel?","a":"<b>Ordnungspolitik</b> setzt allgemeine Rahmenbedingungen, ohne in einzelne Märkte einzugreifen — z. B. ein <b>Kartellgesetz</b>. <b>Prozesspolitik</b> greift direkt und kurzfristig in wirtschaftliche Abläufe ein — z. B. ein <b>Konjunkturpaket</b> in der Rezession.","s":"Wipo VL 01 — Einführung","sec":"Lernfragen 2 und 3","e":"w_ordnungprozess","f":"llms-full.txt"},{"i":325,"d":"w01","t":"Instrumente","q":"Vier wünschenswerte Eigenschaften wirtschaftspolitischer Instrumente?","a":"<b>Kontrollierbarkeit</b> (Steuersätze anpassbar), <b>Effektivität</b> (Ziel mit geringen Nebenwirkungen, z. B. CO₂-Steuer), <b>Unabhängigkeit</b> von externen Einflüssen (automatische Stabilisatoren), <b>praktische Anwendbarkeit</b> (rechtlich zulässig und verwaltbar).","s":"Wipo VL 01 — Einführung","sec":"Lernfrage 4","e":"w_instrumenteigenschaften","f":"llms-full.txt"},{"i":326,"d":"w01","t":"Institutionen","q":"Wirtschaftspolitik im Mehrebenensystem — Ebenen und Konfliktquelle?","a":"<b>Kommune</b>: Gewerbesteuer, lokale Infrastruktur. <b>Bund</b>: Arbeitsmarktpolitik, Sozialversicherung. <b>EU</b>: Handels- und Wettbewerbspolitik, Geldpolitik der EZB. Konflikte entstehen durch <b>überlappende Zuständigkeiten</b> — etwa nationale Fiskalpolitik gegen den EU-Stabilitätspakt.","s":"Wipo VL 01 — Einführung","sec":"Lernfrage 6","e":"w_mehrebenen","f":"llms-full.txt"},{"i":327,"d":"w02","t":"Instrumente","q":"Die vier Phasen des Lag-Problems?","a":"<b>Beobachtungslag</b> (Störung bis Wahrnehmung), <b>Entscheidungslag</b>, <b>Durchführungslag</b> — diese drei bilden den <b>Innenlag</b> — und der <b>Außenlag</b> (Durchführung bis Wirksamkeit). Beispiel für langen Außenlag: Bildungspolitik, wo es Jahre bis zu besser ausgebildeten Absolventen dauert.","s":"Wipo VL 02 — Instrumente & Kausalität","sec":"Lernfrage 2","e":"w_lags","f":"llms-full.txt"},{"i":328,"d":"w02","t":"Instrumente","q":"Goldene Regel der Wirtschaftspolitik?","a":"Die Anzahl <b>unabhängiger Instrumente</b> muss mindestens so groß sein wie die Anzahl der <b>Ziele</b> (Tinbergen). Gibt es weniger Instrumente als Ziele, können nicht alle Ziele gleichzeitig optimal erreicht werden — der Staat muss <b>Prioritäten setzen</b> und ein Optimierungsproblem unter Restriktionen lösen.","s":"Wipo VL 02 — Instrumente & Kausalität","sec":"Lernfrage 3","e":"w_goldeneregel","f":"llms-full.txt"},{"i":329,"d":"w02","t":"Instrumente","q":"Lucas-Kritik am Beispiel der Phillips-Kurve?","a":"Die Parameter ökonometrischer Modelle <b>ändern sich</b>, wenn sich die Politik ändert, weil die Wirtschaftssubjekte ihr Verhalten anpassen. In den 1960ern schien der Inflations-Arbeitslosigkeits-Trade-off stabil; als Regierungen ihn ausnutzten, passten sich die <b>Inflationserwartungen</b> an und die Beziehung brach in den 1970ern zusammen (Stagflation).","s":"Wipo VL 02 — Instrumente & Kausalität","sec":"Lernfrage 4","e":"w_lucas","f":"llms-full.txt"},{"i":330,"d":"w02","t":"Kausalität","q":"Drei Gründe, warum Korrelation keine Kausalität ist?","a":"1) <b>Drittvariablen / Confounder</b> — ein gemeinsamer Faktor treibt beides (Temperatur erklärt Eisverkauf und Ertrinkungsfälle). 2) <b>Umgekehrte Kausalität</b> — hohe Arbeitslosigkeit führt zu Arbeitsmarktprogrammen, nicht umgekehrt. 3) <b>Selektionseffekte</b>.","s":"Wipo VL 02 — Instrumente & Kausalität","sec":"Lernfrage 5","e":"w_kausalitaet","f":"llms-full.txt"},{"i":331,"d":"w02","t":"Kausalität","q":"Difference-in-Differences — Schätzer und zentrale Annahme?","a":"δ̂ = (Y_T,nach − Y_T,vor) − (Y_K,nach − Y_K,vor). Zentrale Annahme ist die <b>Parallel-Trends-Annahme</b>: Ohne die Maßnahme hätten sich Treatment- und Kontrollgruppe gleich entwickelt. <b>Niveauunterschiede</b> zwischen den Gruppen sind erlaubt, unterschiedliche <b>Entwicklungen</b> nicht.","s":"Wipo VL 02 — Instrumente & Kausalität","sec":"Lernfrage 6","e":"w_did","f":"llms-full.txt"},{"i":332,"d":"w02","t":"Kaus
